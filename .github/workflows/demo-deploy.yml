# 공개 데모 배포 (docs/23 2.1) — 수동 실행하면 main 의 check 를 통과한 jar 만 Oracle VM 으로 보낸다.
# 비밀은 SSH 정보뿐: secrets.DEMO_SSH_KEY(배포 전용 키, 비밀번호 없음)·secrets.DEMO_KNOWN_HOSTS, vars.DEMO_HOST·vars.DEMO_USER.
# DB 비밀번호·데모 비밀번호는 VM 의 /opt/yeonos/.env 에만 있다. vars.DEMO_HOST 가 없으면 배포는 건너뛰고 빌드·테스트만 한다.
name: demo-deploy

# 2026-11-02 사용자 결정: main push 자동 실행 끔(Actions 사용 시간) — 데모를 갱신할 때만 Actions 화면에서 Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LC_ALL: C.UTF-8   # 한글 테스트 이름 — 없으면 리포트 생성이 "Malformed input" 으로 실패
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: check (Testcontainers + 가드 테스트)
        run: bash ./gradlew --no-daemon check bootJar
      - name: jar 이름 고정
        run: cp "$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -1)" smarthappy.jar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smarthappy-jar
          path: smarthappy.jar
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 7

  deploy:
    needs: build
    if: vars.DEMO_HOST != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: smarthappy-jar
      - name: 배포 묶음
        run: |
          mkdir -p bundle
          cp -r deploy/demo/. bundle/
          cp deploy/install/init-roles.sql smarthappy.jar bundle/
          rm -f bundle/.gitignore bundle/.env.example
      - name: SSH 준비
        env:
          KEY: ${{ secrets.DEMO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEMO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/demo && chmod 600 ~/.ssh/demo
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: 올리기 + 배포
        env:
          TARGET: ${{ vars.DEMO_USER || 'ubuntu' }}@${{ vars.DEMO_HOST }}
        run: |
          rsync -rlptv -e "ssh -i ~/.ssh/demo" bundle/ "$TARGET:/opt/yeonos/"
          ssh -i ~/.ssh/demo "$TARGET" /opt/yeonos/deploy.sh
