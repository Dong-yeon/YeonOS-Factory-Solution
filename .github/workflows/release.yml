# 릴리스 (docs/05 #7, docs/52 Y10) — v* 태그를 push 하면 check 를 통과한 jar + SBOM + SHA-256 체크섬을 GitHub 릴리스에 올린다.
# 설치형 고객·운영자는 받은 jar 를 SHA256SUMS 로 대조한다(Windows: certutil -hashfile yeonos-<태그>.jar SHA256).
# 서명(cosign·GPG)은 다음 단계 — 체크섬은 "받는 길에 바뀌지 않았다"까지, 서명은 "누가 만들었다"까지.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write   # 릴리스 만들기·파일 올리기 — 이 작업에만
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: check + jar + SBOM
        run: bash ./gradlew --no-daemon check bootJar cyclonedxBom -Phb.requireNode=true
      - name: 산출물 + 체크섬
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp "$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -1)" "dist/yeonos-${TAG}.jar"
          cp build/reports/cyclonedx/application.cdx.json "dist/yeonos-${TAG}.sbom.cdx.json"
          cp deploy/install/init-roles.sql dist/
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: GitHub 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "YeonOS $TAG" --notes "jar · SBOM(CycloneDX) · SHA256SUMS — 받은 파일은 SHA256SUMS 로 대조"
