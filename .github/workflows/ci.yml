# PR 검사 (docs/05 #7, docs/52 Y10) — 수동 실행 시 전체 check(Testcontainers + 가드 시험 + JS 타입 검사·단위 시험)·SBOM·알려진 취약점 검사.
# demo-deploy 도 배포 전 같은 check 를 돌린다(배포 전 관문). 액션은 모두 커밋 SHA 로 고정 — 태그는 옮겨질 수 있다.
# 고정 SHA 갱신은 Dependabot(github-actions) PR 로 받는다(.github/dependabot.yml). 손으로 바꿀 때는 줄 끝 주석의 태그도 같이.
name: ci

# 2026-11-02 사용자 결정: 자동 실행 끔(비공개 저장소 Actions 사용 시간 소진) — 수동 실행(workflow_dispatch)만.
# 병합 전 검증은 상위 세션이 컨테이너에서 돌리는 ./gradlew check 로 한다(docs/29). 다시 켜려면 pull_request: 를 되살린다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 50   # 전체 check 24~30분(docs/29 7.9) — 짧게 걸면 마지막 시험·JS 검사가 빠진다
    env:
      LC_ALL: C.UTF-8   # 한글 테스트 이름 — 없으면 리포트 생성이 "Malformed input" 으로 실패
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: check + SBOM (Node 필수 — JS 검사를 건너뛰지 않는다)
        run: bash ./gradlew --no-daemon check cyclonedxBom -Phb.requireNode=true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: build/reports/cyclonedx/
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 7

  # 알려진 취약점(OSV.dev) — 잠금 파일 기준. 경고만(빌드를 막지 않는다): 고칠 버전이 없거나 영향이 없는 경우가 있어
  # 사람이 판단한다. 결과는 작업 요약(Summary)에 표로 남는다. 막는 것으로 바꿀 때는 continue-on-error 를 지운다.
  osv:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: OSV-Scanner (gradle.lockfile · package-lock.json)
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --lockfile=gradle.lockfile
            --lockfile=package-lock.json
            --lockfile=mobile/pda/package-lock.json
            --format=markdown
            --output=osv-results.md
      - name: 결과를 작업 요약에
        if: always()
        run: |
          if [ -s osv-results.md ]; then cat osv-results.md >> "$GITHUB_STEP_SUMMARY"; else echo "OSV: 결과 파일 없음" >> "$GITHUB_STEP_SUMMARY"; fi
