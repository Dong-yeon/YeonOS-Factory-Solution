<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  협력사 평가 (srm-eval) — SRM 1부 S6 (docs/31 4.6, D10·D11). 협력사 × 기간 × 템플릿(기간 끝 날에 유효한 확정 리비전)으로 평가를 만들고,
  항목 점수를 넣어 [확정](승인 권한) — 총점·등급·과락이 정해지고 그 뒤 바뀌지 않는다. 자동 항목은 계산값과 근거만 보인다.
  과락이거나 HOLD 제안 등급이면 "거래 보류 제안" — 거래 상태는 사람이 협력사 정보에서 바꾼다.
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">협력사 평가</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" autocomplete="off">
    <div id="period" data-hb="dateRange" th:data-label="#{srm.eval.period}" data-from-name="from" data-to-name="to"
         data-presets="thisMonth,lastMonth,last30" data-default="last30" data-max-days="731"></div>
    <label><span th:text="#{srm.eval.col.status}">상태</span>
        <select name="status" data-hb="select" data-code="EVAL_STATUS" data-blank="all"></select></label>
    <label><span th:text="#{srm.eval.keyword}">번호·협력사</span><input name="keyword" maxlength="100"></label>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <div class="hb-toolbar">
            <button type="button" id="newBtnList" class="hb-btn-secondary hb-drawer-only" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
        </div>
        <div id="evalGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{srm.eval.select}">왼쪽에서 평가를 고르거나 신규를 누르세요.</p>

        <div id="createBox" hidden>
            <form id="createForm" class="hb-form" autocomplete="off">
                <label><span th:text="#{srm.eval.col.supplier}">협력사</span><input data-field="custCd" list="supList" maxlength="30"></label>
                <label><span th:text="#{srm.eval.col.tmpl}">템플릿</span><select data-field="tmplCd" id="tmplSel"></select></label>
                <label><span th:text="#{srm.eval.col.periodFrom}">기간 시작</span><input data-field="periodFrom" type="date"></label>
                <label><span th:text="#{srm.eval.col.periodTo}">기간 끝</span><input data-field="periodTo" type="date" data-help-key="srm-eval.periodTo"></label>
                <label class="hb-wide"><span th:text="#{srm.eval.col.remark}">비고</span><input data-field="remark" maxlength="1000"></label>
            </form>
            <datalist id="supList"></datalist>
            <div class="hb-toolbar">
                <button type="button" id="createBtn" th:text="#{srm.eval.create}">평가 만들기</button>
            </div>
        </div>

        <div id="evalBox" hidden>
            <p id="stateLine" class="hb-wide" role="status"></p>
            <p id="resultLine" class="hb-wide" role="status"></p>
            <p id="holdLine" class="hb-wide hb-field-error" role="status" hidden></p>
            <div class="hb-toolbar" id="actionBar">
                <button type="button" id="saveBtn" data-need="SAVE" th:text="#{srm.eval.saveScores}">점수 저장</button>
                <button type="button" id="recalcBtn" class="hb-btn-secondary" data-need="SAVE" th:text="#{srm.eval.recalc}">자동 항목 다시 계산</button>
                <button type="button" id="confirmBtn" class="hb-btn-secondary" data-need="APPROVE" th:text="#{srm.eval.confirm}">확정</button>
            </div>
            <form id="evalForm" class="hb-form" autocomplete="off">
                <label class="hb-wide"><span th:text="#{srm.eval.col.remark}">비고</span><input data-field="remark" maxlength="1000"></label>
            </form>
            <section class="hb-sub">
                <h2 th:text="#{srm.eval.scores}">항목 점수</h2>
                <div id="scores"></div>
            </section>
            <section class="hb-sub">
                <h2 th:text="#{srm.eval.grades}">등급 구간</h2>
                <ul id="gradeList"></ul>
            </section>
            <!-- 되돌릴 수 없는 동작은 저장 줄과 떨어진 자리(docs/40 P1 ④). 사유는 누를 때 대화상자로 받는다 -->
            <div class="hb-toolbar">
                <button type="button" id="cancelBtn" class="hb-btn-danger-outline" data-need="SAVE" th:text="#{srm.eval.cancel}">평가 취소</button>
            </div>
        </div>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.calendar.js}"></script>
<script th:src="@{/js/common/hb.daterange.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/srm/srm-ui.js}"></script>
<script th:src="@{/js/views/srm/eval-mgt.js}"></script>
</body>
</html>
