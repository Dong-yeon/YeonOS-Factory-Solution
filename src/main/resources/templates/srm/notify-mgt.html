<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  발주 통지 이력 (srm-notify) — SRM 1부 S4 (docs/31 D8). 발행·취소 때 아웃박스로 나간 협력사 통지와 결과.
  1부 채널은 로그 + 가짜 메일함(아래 표) — 실제 메일 발송은 메일 공통 채널이 정해지면. 받는 주소는 가려서 보인다.
  실패한 통지는 [다시 보내기] — 지금 발주 상태·주소로 새로 보낸다(주소를 고친 뒤가 보통).
-->
<body class="hb-page hb-page-scroll" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<link rel="stylesheet" th:href="@{/css/views/srm.css}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">통지 이력</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" autocomplete="off">
    <div id="period" data-hb="dateRange" th:data-label="#{srm.notify.period}" data-from-name="from" data-to-name="to"
         data-presets="today,thisWeek,last7,last30,thisMonth" data-default="last7" data-max-days="366"></div>
    <fieldset class="hb-seg">
        <legend th:text="#{srm.notify.col.status}">상태</legend>
        <label><input type="radio" name="status" value="" checked><span th:text="#{common.all}">전체</span></label>
        <label><input type="radio" name="status" value="SENT"><span th:text="#{srm.notify.sent}">보냄</span></label>
        <label><input type="radio" name="status" value="FAIL"><span th:text="#{srm.notify.fail}">실패</span></label>
    </fieldset>
    <div class="hb-sp-actions">
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-toolbar">
    <!-- 실패한 통지만 다시 보낸다 — 표에서 실패 행을 고르면 켜진다 -->
    <button type="button" id="resendBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" disabled th:text="#{srm.notify.resendBtn}">다시 보내기</button>
</div>
<div id="noticeGrid" class="hb-grid-host srm-grid-page"></div>

<h2 th:text="#{srm.notify.mailbox}">가짜 메일함(1부 통지 채널)</h2>
<ul id="mailbox"></ul>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.calendar.js}"></script>
<script th:src="@{/js/common/hb.daterange.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/srm/srm-ui.js}"></script>
<script th:src="@{/js/views/srm/notify-mgt.js}"></script>
</body>
</html>
