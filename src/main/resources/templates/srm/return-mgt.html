<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  반품 지시 (srm-return) — SRM 2부 R4c (docs/31 4.12.4). 협력사 → 반품 대상 가져오기(QMS 닫힌 NCR 의 반품 처리 줄, 공개 계약) →
  한 줄 골라 수량·교체 요구(발주 행)·공장 → 저장(작성 중) → 확정(APPROVE). 출고는 WMS(나중, 출고되면 여기서 보기만).
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">반품 지시</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" autocomplete="off">
    <div id="period" data-hb="dateRange" th:data-label="#{srm.return.period}" data-from-name="from" data-to-name="to"
         data-presets="today,thisWeek,last7,last30,thisMonth,lastMonth" data-default="thisMonth" data-max-days="366"></div>
    <label><span th:text="#{srm.return.col.status}">상태</span>
        <select name="status" data-hb="select" data-code="RETURN_STATUS" data-blank="all"></select></label>
    <label><span th:text="#{srm.return.keyword}">번호·NCR·LOT·품목·협력사</span><input name="keyword" maxlength="100"></label>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <div class="hb-toolbar">
            <button type="button" id="newBtnList" class="hb-btn-secondary hb-drawer-only" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
        </div>
        <div id="retGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
            <button type="button" id="saveBtn" th:if="${actions.contains('SAVE')}" th:text="#{common.save}">저장</button>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{srm.return.selectOrNew}">왼쪽에서 반품을 고르거나 신규를 누르세요.</p>
        <p id="stateLine" class="hb-wide" role="status"></p>
        <div class="hb-toolbar" id="actionBar">
            <button type="button" class="hb-btn-secondary" data-act="confirm" hidden th:if="${actions.contains('APPROVE')}" th:text="#{srm.return.act.confirm}">확정</button>
        </div>
        <!-- 되돌릴 수 없는 동작은 저장·진행 줄과 떨어진 자리(docs/40 P1 ④). 사유는 누를 때 대화상자로 받는다 -->
        <div class="hb-toolbar" id="dangerBar">
            <button type="button" class="hb-btn-danger-outline" data-act="cancel" data-reason="true" hidden th:text="#{srm.return.act.cancel}">취소</button>
        </div>
        <form id="retForm" class="hb-form" autocomplete="off">
            <label><span th:text="#{srm.return.col.supplier}">협력사</span><select data-field="custCd" id="custSel"></select></label>
            <label><span th:text="#{srm.return.col.plant}">공장</span><select data-field="plantCd" id="plantSel"></select></label>
        </form>

        <section class="hb-sub" id="basisBox">
            <h2 th:text="#{srm.return.basis}">근거(반품 처리 줄)</h2>
            <p id="basisLine" class="hb-wide"></p>
            <div id="basisErrorBox" hidden><p id="basisError" class="hb-field-error"></p></div>
            <div class="hb-form" id="pickHead">
                <label><span th:text="#{srm.return.pickFrom}">종결일 시작</span><input type="date" id="pickFrom"></label>
                <label><span th:text="#{srm.return.pickTo}">종결일 끝</span><input type="date" id="pickTo"></label>
                <div class="hb-toolbar hb-wide">
                    <button type="button" id="pickBtn" class="hb-btn-secondary" th:text="#{srm.return.pick}">반품 대상 가져오기</button>
                </div>
            </div>
            <div id="pickTrunc" hidden><p class="hb-field-error" th:text="#{srm.return.truncated}">목록이 잘렸습니다 — 기간을 줄여 다시 가져오세요.</p></div>
            <div id="pickList"></div>
        </section>

        <!-- 같은 근거 NCR 의 클레임(취소 제외) — 누르면 클레임 화면을 그 번호로 연다 -->
        <section class="hb-sub" id="linkBox" hidden>
            <h2 th:text="#{srm.return.claims}">관련 클레임</h2>
            <ul id="linkList" class="hb-plain-list"></ul>
        </section>

        <form id="qtyForm" class="hb-form" autocomplete="off">
            <label><span id="qtyLabel" th:text="#{srm.return.col.qty}">수량</span>
                <input data-field="qty" inputmode="decimal" maxlength="24"></label>
            <label class="hb-check"><input type="checkbox" data-field="replaceYn" value="Y">
                <span th:text="#{srm.return.col.replaceLong}">교체품 요구(입고를 되돌려 다시 받음)</span></label>
            <label class="hb-wide"><span th:text="#{srm.return.col.poLine}">교체품 받을 발주 행</span>
                <select data-field="poLineId" id="poLineSel"></select></label>
            <label class="hb-wide"><span th:text="#{srm.return.col.remark}">비고</span><input data-field="remark" maxlength="1000"></label>
        </form>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.calendar.js}"></script>
<script th:src="@{/js/common/hb.daterange.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/srm/srm-ui.js}"></script>
<script th:src="@{/js/views/srm/return-mgt.js}"></script>
</body>
</html>
