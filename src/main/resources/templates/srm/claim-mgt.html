<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  협력사 클레임 (srm-claim) — SRM 2부 R4d (docs/31 4.12.4, R4-6). 협력사 → 근거 NCR 가져오기(QMS 계약) → 요구 조치·금액(표기용) →
  저장(작성 중) → 보내기(통지) → 회신 입력(협력사 대신) → 반려(다시 요구) / 종결(APPROVE). 청구·전표는 ERP.
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">협력사 클레임</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" autocomplete="off">
    <div id="period" data-hb="dateRange" th:data-label="#{srm.claim.period}" data-from-name="from" data-to-name="to"
         data-presets="today,thisWeek,last7,last30,thisMonth,lastMonth" data-default="thisMonth" data-max-days="366"></div>
    <label><span th:text="#{srm.claim.col.status}">상태</span>
        <select name="status" data-hb="select" data-code="CLAIM_STATUS" data-blank="all"></select></label>
    <label><span th:text="#{srm.claim.keyword}">번호·제목·협력사·NCR</span><input name="keyword" maxlength="100"></label>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <div class="hb-toolbar">
            <button type="button" id="newBtnList" class="hb-btn-secondary hb-drawer-only" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
        </div>
        <div id="clmGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
            <button type="button" id="saveBtn" th:if="${actions.contains('SAVE')}" th:text="#{common.save}">저장</button>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{srm.claim.selectOrNew}">왼쪽에서 클레임을 고르거나 신규를 누르세요.</p>
        <p id="stateLine" class="hb-wide" role="status"></p>
        <div class="hb-toolbar" id="actionBar">
            <button type="button" class="hb-btn-secondary" data-act="send" hidden th:text="#{srm.claim.act.send}">보내기</button>
            <button type="button" class="hb-btn-secondary" data-act="reject" hidden th:text="#{srm.claim.act.reject}">회신 반려</button>
            <button type="button" class="hb-btn-secondary" data-act="close" hidden th:text="#{srm.claim.act.close}">종결</button>
        </div>
        <!-- 되돌릴 수 없는 동작은 저장·진행 줄과 떨어진 자리(docs/40 P1 ④). 사유는 누를 때 대화상자로 받는다 -->
        <div class="hb-toolbar" id="dangerBar">
            <button type="button" class="hb-btn-danger-outline" data-act="cancel" data-reason="true" hidden th:text="#{srm.claim.act.cancel}">취소</button>
        </div>
        <form id="clmForm" class="hb-form" autocomplete="off">
            <label><span th:text="#{srm.claim.col.supplier}">협력사</span><select data-field="custCd" id="custSel"></select></label>
            <label><span th:text="#{srm.claim.col.action}">요구 조치</span>
                <select data-field="actionCd" data-hb="select" data-code="CLAIM_ACTION" data-blank="select"></select></label>
            <label class="hb-wide"><span th:text="#{srm.claim.col.title}">제목</span><input data-field="title" maxlength="200"></label>
            <label class="hb-wide"><span th:text="#{srm.claim.col.requestText}">요구 내용</span>
                <textarea data-field="requestText" rows="4" maxlength="2000"></textarea></label>
            <label><span th:text="#{srm.claim.col.replyDue}">회신 기한</span><input type="date" data-field="replyDue"></label>
            <label><span th:text="#{srm.claim.col.chargeAmt}">청구 금액(표기)</span>
                <input data-field="chargeAmt" inputmode="decimal" maxlength="24" data-help-key="srm-claim.chargeAmt"></label>
            <label><span th:text="#{srm.claim.col.currency}">통화</span>
                <select data-field="currencyCd" data-hb="select" data-code="CURRENCY" data-blank="select"></select></label>
        </form>

        <section class="hb-sub">
            <h2 th:text="#{srm.claim.ncrs}">근거 부적합(NCR)</h2>
            <div id="ncrsErrorBox" hidden><p id="ncrsError" class="hb-field-error"></p></div>
            <div id="ncrs"></div>
            <div class="hb-form" id="pickHead">
                <label><span th:text="#{srm.claim.pickFrom}">NCR 발견일 시작</span><input type="date" id="pickFrom"></label>
                <label><span th:text="#{srm.claim.pickTo}">NCR 발견일 끝</span><input type="date" id="pickTo"></label>
                <p class="hb-muted hb-wide" th:text="#{srm.claim.pickHint}">이 협력사 LOT 의 부적합(취소 제외, 처리 중 포함)에서 고릅니다.</p>
                <div class="hb-toolbar hb-wide">
                    <button type="button" id="pickBtn" class="hb-btn-secondary" th:text="#{srm.claim.pick}">근거 NCR 가져오기</button>
                    <button type="button" id="pickAddBtn" class="hb-btn-secondary" hidden th:text="#{srm.claim.pickAdd}">고른 NCR 추가</button>
                </div>
            </div>
            <div id="pickTrunc" hidden><p class="hb-field-error" th:text="#{srm.return.truncated}">목록이 잘렸습니다 — 기간을 줄여 다시 가져오세요.</p></div>
            <div id="pickList"></div>
        </section>

        <!-- 같은 근거 NCR 의 반품 지시(취소 제외) — 누르면 반품 화면을 그 번호로 연다 -->
        <section class="hb-sub" id="linkBox" hidden>
            <h2 th:text="#{srm.claim.returns}">관련 반품 지시</h2>
            <ul id="linkList" class="hb-plain-list"></ul>
        </section>

        <section class="hb-sub" id="answerBox" hidden>
            <h2 th:text="#{srm.claim.answer}">협력사 회신</h2>
            <p id="answerSource" class="hb-muted" hidden></p>
            <form id="ansForm" class="hb-form" autocomplete="off">
                <label class="hb-wide"><span th:text="#{srm.claim.col.answerCause}">원인</span>
                    <textarea data-field="answerCause" rows="3" maxlength="2000"></textarea></label>
                <label class="hb-wide"><span th:text="#{srm.claim.col.answerAction}">대책</span>
                    <textarea data-field="answerAction" rows="3" maxlength="2000"></textarea></label>
                <label><span th:text="#{srm.claim.col.answeredOn}">회신일</span><input type="date" data-field="answeredOn"></label>
                <div class="hb-toolbar hb-wide">
                    <button type="button" id="answerBtn" class="hb-btn-secondary" hidden th:text="#{srm.claim.act.answer}">회신 저장</button>
                </div>
            </form>
        </section>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.calendar.js}"></script>
<script th:src="@{/js/common/hb.daterange.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/srm/srm-ui.js}"></script>
<script th:src="@{/js/views/srm/claim-mgt.js}"></script>
</body>
</html>
