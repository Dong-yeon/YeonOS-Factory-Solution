<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  구매요청 (srm-pr) — SRM 1부 S2 (docs/31 D5). 머리 + 품목 행을 한 벌로 저장하고(작성 중만),
  요청 → 승인(APPROVE 권한) / 반려 → 다시 작성, 승인 뒤 마감·취소. 요청자 본인 승인은 회사 정책.
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">구매요청</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" autocomplete="off">
    <div id="period" data-hb="dateRange" th:data-label="#{srm.pr.period}" data-from-name="from" data-to-name="to"
         data-presets="today,thisWeek,last7,last30,thisMonth,lastMonth" data-default="last30" data-max-days="366"></div>
    <label><span th:text="#{srm.pr.col.status}">상태</span>
        <select name="status" data-hb="select" data-code="PR_STATUS" data-blank="all"></select></label>
    <label><span th:text="#{srm.pr.keyword}">번호·품목·사유</span><input name="keyword" maxlength="100"></label>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <div class="hb-toolbar">
            <button type="button" id="newBtnList" class="hb-btn-secondary hb-drawer-only" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
        </div>
        <div id="prGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
            <button type="button" id="saveBtn" th:if="${actions.contains('SAVE')}" th:text="#{common.save}">저장</button>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{srm.pr.selectOrNew}">왼쪽에서 요청을 고르거나 신규를 누르세요.</p>
        <p id="stateLine" class="hb-wide" role="status"></p>
        <div class="hb-toolbar" id="actionBar">
            <button type="button" class="hb-btn-secondary" data-act="request" data-need="SAVE" hidden th:text="#{srm.pr.act.request}">요청</button>
            <button type="button" class="hb-btn-secondary" data-act="withdraw" data-need="SAVE" hidden th:text="#{srm.pr.act.withdraw}">회수</button>
            <button type="button" class="hb-btn-secondary" data-act="approve" data-need="APPROVE" hidden th:text="#{srm.pr.act.approve}">승인</button>
            <button type="button" class="hb-btn-secondary" data-act="reject" data-need="APPROVE" data-reason="true" hidden th:text="#{srm.pr.act.reject}">반려</button>
            <button type="button" class="hb-btn-secondary" data-act="reopen" data-need="SAVE" hidden th:text="#{srm.pr.act.reopen}">다시 작성</button>
            <button type="button" class="hb-btn-secondary" data-act="close" data-need="APPROVE" hidden th:text="#{srm.pr.act.close}">마감</button>
        </div>
        <!-- 되돌릴 수 없는 동작은 저장·진행 줄과 떨어진 자리(docs/40 P1 ④). 사유는 누를 때 대화상자로 받는다 -->
        <div class="hb-toolbar" id="dangerBar">
            <button type="button" class="hb-btn-danger-outline" data-act="cancel" data-need="SAVE" data-reason="true" hidden th:text="#{srm.pr.act.cancel}">취소</button>
        </div>
        <form id="prForm" class="hb-form" autocomplete="off">
            <label><span th:text="#{srm.pr.col.plant}">공장</span>
                <select data-field="plantCd" id="plantSel"></select></label>
            <label><span th:text="#{srm.pr.col.dept}">부서</span><input data-field="deptNm" maxlength="50"></label>
            <label><span th:text="#{srm.pr.col.needDate}">필요일</span>
                <input type="date" data-field="needDate" data-help-key="srm-pr.needDate"></label>
            <label class="hb-wide"><span th:text="#{srm.pr.col.reason}">사유</span><input data-field="reason" maxlength="500"></label>
        </form>

        <section class="hb-sub">
            <h2 th:text="#{srm.pr.lines}">품목</h2>
            <div id="linesErrorBox" hidden><p id="linesError" class="hb-field-error"></p></div>
            <div id="lines"></div>
            <div class="hb-toolbar" th:if="${actions.contains('SAVE')}">
                <button type="button" id="addLineBtn" class="hb-btn-secondary" th:text="#{srm.pr.addLine}">행 추가</button>
            </div>
            <datalist id="itemList"></datalist>
            <datalist id="supList"></datalist>
        </section>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.calendar.js}"></script>
<script th:src="@{/js/common/hb.daterange.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/srm/srm-ui.js}"></script>
<script th:src="@{/js/views/srm/pr-mgt.js}"></script>
</body>
</html>
