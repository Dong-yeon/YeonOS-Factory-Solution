<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  품질 정합 점검 (qms-consistency, 읽기 전용) — P3 QMS Q3 (docs/29, 26 9번 문서 간 정합).
  사용성 체크(docs/11 4.3): 주 사용자 = 품질 책임자(WEB). 심사 전·문서 개정 뒤 가끔 돌린다. 직접 치는 값 없음(점검 종류만 고름).
  서버가 채우는 값 = 오늘 유효한 확정 검사계획 기준 점검 결과 3종. 예외 = 점검마다 2,000건 상한(넘으면 알림).
-->
<body data-table-menu="exportBtn" class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<link rel="stylesheet" th:href="@{/css/qms.css}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">품질 정합 점검</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" autocomplete="off">
    <label><span th:text="#{qms.cons.check}">점검</span>
        <select name="checkCd" data-hb="select" data-code="QMS_CHECK" data-blank="all"></select></label>
    <div class="hb-sp-actions">
        <button type="button" id="exportBtn" class="hb-btn-secondary" th:if="${actions.contains('EXCEL')}" th:text="#{qms.cons.excel}">엑셀</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{qms.cons.run}">점검</button>
    </div>
</form>
<p class="hb-muted" th:text="#{qms.cons.hint}">오늘 유효한 확정 검사계획 기준으로 찾습니다(읽기 전용).</p>
<p id="summary" class="hb-qms-status" role="status" hidden></p>

<section class="hb-qms-cons">
    <table class="hb-cmp-table" id="resultTable">
        <thead><tr>
            <th th:text="#{qms.cons.col.checkCd}">점검</th>
            <th th:text="#{qms.cons.col.targetCd}">대상</th>
            <th th:text="#{qms.cons.col.targetNm}">대상명</th>
            <th th:text="#{qms.cons.col.detail}">내용</th>
            <th th:text="#{qms.cons.col.link}">바로가기</th>
        </tr></thead>
        <tbody></tbody>
    </table>
</section>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/qms/qms-ui.js}"></script>
<script th:src="@{/js/views/qms/consistency.js}"></script>
</body>
</html>
