<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  관리문서 (qms-doc) — P3 QMS Q3 (docs/29 D7, PLM D8). 작업표준서·검사기준서·관리계획서·PFMEA·도면·기타.
  사용성 체크(docs/11 4.3): 주 사용자 = 품질 문서 담당(WEB). 문서 수백 개, 개정은 문서마다 1년에 몇 번.
  직접 치는 값 = 문서명·유형·적용 대상(품목·클래스·공정 코드)·변경 내용, 파일(첨부).
  서버가 채우는 값 = 문서 번호(비우면 채번), 리비전(A0 → A1 …), 상태·배포일, 새 리비전의 첨부(이전 리비전에서 복사).
  예외 = 결재 중·배포본은 내용·첨부를 고칠 수 없음(새 리비전으로), 회사 정책이 결재(Y)면 바로 배포 없음, 반려·회수되면 작성 중으로.
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<link rel="stylesheet" th:href="@{/css/qms.css}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">관리문서</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
    <label><span th:text="#{qms.doc.keyword}">문서 번호·이름</span><input name="keyword" maxlength="100"></label>
    <label><span th:text="#{qms.doc.col.docType}">유형</span>
        <select name="docType" data-hb="select" data-code="DOC_TYPE" data-blank="all"></select></label>
    <label class="hb-check"><input type="checkbox" name="withUnused" value="true"><span th:text="#{qms.doc.withUnused}">사용 중지 포함</span></label>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split hb-split-wide">
    <section class="hb-split-main">
        <div class="hb-toolbar" th:if="${actions.contains('SAVE')}">
            <button type="button" id="newBtnList" class="hb-btn-secondary hb-drawer-only" th:text="#{common.new}">신규</button>
        </div>
        <div id="docGrid" class="hb-grid-host"></div>
    </section>

    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
            <button type="button" id="saveBtn" th:if="${actions.contains('SAVE')}" th:text="#{common.save}">저장</button>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{qms.doc.select}">왼쪽에서 문서를 고르거나 신규를 누르세요.</p>

        <form id="docForm" class="hb-form" autocomplete="off">
            <label><span th:text="#{qms.doc.col.docNo}">문서 번호</span><input data-field="docNo" maxlength="30" data-help-key="qms-doc.docNo"></label>
            <label><span th:text="#{qms.doc.col.docType}">유형</span>
                <select data-field="docType" data-hb="select" data-code="DOC_TYPE" data-blank="select" required data-help-key="qms-doc.docType"></select></label>
            <label class="hb-wide"><span th:text="#{qms.doc.col.docNm}">문서명</span><input data-field="docNm" maxlength="200" required></label>
            <label><span th:text="#{qms.doc.col.useYn}">사용</span>
                <select data-field="useYn"><option value="Y" th:text="#{yn.Y}">사용</option><option value="N" th:text="#{yn.N}">미사용</option></select></label>
            <label class="hb-wide"><span th:text="#{qms.doc.col.remark}">비고</span><input data-field="remark" maxlength="500"></label>
        </form>

        <section class="hb-sub">
            <h2 data-help-key="qms-doc.targets" th:text="#{qms.doc.targets}">적용 대상</h2>
            <div class="hb-qms-table-wrap">
                <table class="hb-cmp-table" id="targetTable"><tbody></tbody></table>
            </div>
            <div class="hb-toolbar" th:if="${actions.contains('SAVE')}">
                <button type="button" id="addTargetBtn" class="hb-btn-secondary" th:text="#{qms.doc.addTarget}">대상 추가</button>
            </div>
        </section>

        <section class="hb-sub" id="revSection" hidden>
            <h2 th:text="#{qms.doc.revs}">리비전</h2>
            <div class="hb-toolbar" th:if="${actions.contains('SAVE')}">
                <button type="button" id="newRevBtn" class="hb-btn-secondary" th:text="#{qms.doc.newRev}">새 리비전</button>
            </div>
            <div class="hb-qms-table-wrap">
                <table class="hb-cmp-table" id="revTable">
                    <thead><tr>
                        <th th:text="#{qms.doc.rev.col.rev}">리비전</th>
                        <th th:text="#{qms.doc.rev.col.status}">상태</th>
                        <th th:text="#{qms.doc.rev.col.summary}">변경 내용</th>
                        <th th:text="#{qms.doc.rev.col.released}">배포</th>
                        <th th:text="#{qms.doc.rev.col.files}">첨부</th>
                    </tr></thead>
                    <tbody></tbody>
                </table>
            </div>

            <h2 th:text="#{qms.doc.revDetail}">선택한 리비전</h2>
            <p id="revMode" class="hb-muted"></p>
            <form id="revForm" class="hb-form" autocomplete="off" hidden>
                <label><span th:text="#{qms.doc.rev.col.rev}">리비전</span><input data-field="rev" maxlength="4"></label>
                <label class="hb-wide"><span th:text="#{qms.doc.rev.col.summary}">변경 내용</span>
                    <textarea data-field="changeSummary" maxlength="1000" rows="2"></textarea></label>
            </form>
            <div class="hb-toolbar" id="revTools">
                <button type="button" id="saveRevBtn" th:if="${actions.contains('SAVE')}" th:text="#{qms.doc.saveRev}">리비전 저장</button>
                <button type="button" id="releaseBtn" class="hb-btn-secondary" th:if="${actions.contains('APPROVE')}" th:text="#{qms.doc.release}">바로 배포</button>
                <!-- 되돌릴 수 없는 동작은 저장과 떨어진 오른쪽 끝(docs/40 P1 ④) -->
                <div class="hb-qms-danger-zone">
                    <button type="button" id="obsoleteBtn" class="hb-btn-danger-outline" th:if="${actions.contains('DELETE')}" th:text="#{qms.doc.obsolete}">폐기</button>
                </div>
            </div>

            <div id="approvalBox" hidden>
                <h3 th:text="#{qms.doc.approval}">결재</h3>
                <div class="hb-qms-inline" id="lineTools" th:if="${actions.contains('SAVE')}">
                    <label><span th:text="#{qms.doc.lineUser}">결재자</span><select id="lineUser"></select></label>
                    <label><span th:text="#{qms.doc.lineType}">종류</span>
                        <select id="lineType">
                            <option value="APPROVE" th:text="#{js.qms.doc.line.APPROVE}">결재</option>
                            <option value="AGREE" th:text="#{js.qms.doc.line.AGREE}">합의</option>
                            <option value="REF" th:text="#{js.qms.doc.line.REF}">참조</option>
                        </select></label>
                    <button type="button" id="addLineBtn" class="hb-btn-secondary" th:text="#{qms.doc.addLine}">결재선 추가</button>
                    <button type="button" id="submitBtn" th:text="#{qms.doc.submit}">결재 올리기</button>
                </div>
                <table class="hb-cmp-table" id="lineTable"><tbody></tbody></table>
                <div class="hb-qms-inline" id="actTools" hidden>
                    <label class="hb-qms-grow"><span th:text="#{qms.doc.aprComment}">의견</span><input id="aprComment" maxlength="500"></label>
                    <button type="button" id="approveBtn" th:text="#{qms.doc.approve}">승인</button>
                    <button type="button" id="rejectBtn" class="hb-btn-danger-outline" th:text="#{qms.doc.reject}">반려</button>
                    <button type="button" id="withdrawBtn" class="hb-btn-secondary" th:text="#{qms.doc.withdraw}">회수</button>
                </div>
            </div>

            <div id="fileBox" hidden>
                <h3 th:text="#{qms.doc.files}">첨부</h3>
                <ul id="files" class="hb-files"></ul>
                <label id="uploadBox" th:if="${actions.contains('SAVE')}"><span th:text="#{qms.doc.attach}">파일 올리기</span>
                    <input type="file" id="fileInput"></label>
            </div>
        </section>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/qms/qms-ui.js}"></script>
<script th:src="@{/js/views/qms/doc-mgt.js}"></script>
</body>
</html>
