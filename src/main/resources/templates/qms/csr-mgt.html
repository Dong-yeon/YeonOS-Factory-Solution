<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  고객 요구사항 CSR (qms-csr) — P3 QMS Q4 (docs/29 D8). 고객별 요구 문서(번호·리비전·시작일)와 기본 정책을 이기는 값(override).
  사용성 체크(docs/11 4.3): 주 사용자 = 품질 책임자(WEB). 고객마다 몇 건, 개정은 1년에 몇 번 — 목록은 표 한 장(상한 500건).
  직접 치는 값 = 고객·문서 번호·리비전·제목·시작일·override(봉쇄 일수·종결 일수·통보 시간·보존 연수)·적용 품목/품목 클래스, 파일(첨부).
  서버가 채우는 값 = 없음(시정조치가 만들 때 읽어 기한을 고정 — CSR 을 고쳐도 지난 8D 기한은 그대로).
  예외 = 고객은 만든 뒤 못 바꿈, 같은 고객·번호·리비전 중복 불가, override 는 정해진 키만 양의 정수.
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<link rel="stylesheet" th:href="@{/css/qms.css}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">고객 요구사항(CSR)</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
    <label><span th:text="#{qms.csr.keyword}">고객·문서 번호·제목</span><input name="keyword" maxlength="100"></label>
    <label class="hb-check"><input type="checkbox" name="withUnused" value="true"><span th:text="#{qms.doc.withUnused}">사용 중지 포함</span></label>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split hb-split-wide">
    <section class="hb-split-main hb-qms-scroll">
        <div class="hb-toolbar" th:if="${actions.contains('SAVE')}">
            <button type="button" id="newBtnList" class="hb-btn-secondary hb-drawer-only" th:text="#{common.new}">신규</button>
        </div>
        <div id="csrGrid" class="hb-grid-host"></div>
    </section>

    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
            <button type="button" id="saveBtn" th:if="${actions.contains('SAVE')}" th:text="#{common.save}">저장</button>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{qms.csr.select}">왼쪽에서 CSR 을 고르거나 신규를 누르세요.</p>

        <form id="csrForm" class="hb-form" autocomplete="off">
            <label><span th:text="#{qms.csr.col.custCd}">고객</span><input data-field="custCd" maxlength="30" required data-help-key="qms-csr.custCd"></label>
            <label><span th:text="#{qms.csr.col.csrNo}">문서 번호</span><input data-field="csrNo" maxlength="50" required></label>
            <label><span th:text="#{qms.csr.col.csrRev}">리비전</span><input data-field="csrRev" maxlength="20" required></label>
            <label><span th:text="#{qms.csr.col.effectiveFrom}">시작일</span><input data-field="effectiveFrom" type="date" required data-help-key="qms-csr.effectiveFrom"></label>
            <label class="hb-wide"><span th:text="#{qms.csr.col.title}">제목</span><input data-field="title" maxlength="200" required></label>
            <label><span th:text="#{qms.doc.col.useYn}">사용</span>
                <select data-field="useYn"><option value="Y" th:text="#{yn.Y}">사용</option><option value="N" th:text="#{yn.N}">미사용</option></select></label>
            <label class="hb-wide"><span th:text="#{qms.doc.col.remark}">비고</span><input data-field="remark" maxlength="500"></label>
        </form>

        <section class="hb-sub">
            <h2 data-help-key="qms-csr.overrides" th:text="#{qms.csr.overrides}">기본 정책을 이기는 값</h2>
            <form id="ovForm" class="hb-form" autocomplete="off">
                <label><span th:text="#{qms.csr.ov.CONTAIN_DAYS}">봉쇄 기한(일)</span><input data-field="overrides.CONTAIN_DAYS" inputmode="numeric" maxlength="3"></label>
                <label><span th:text="#{qms.csr.ov.CLOSE_DAYS}">종결 기한(일)</span><input data-field="overrides.CLOSE_DAYS" inputmode="numeric" maxlength="4"></label>
                <label><span th:text="#{qms.csr.ov.NOTIFY_HOURS}">고객 통보(시간)</span><input data-field="overrides.NOTIFY_HOURS" inputmode="numeric" maxlength="3"></label>
                <label><span th:text="#{qms.csr.ov.RETENTION_YEARS}">기록 보존(년)</span><input data-field="overrides.RETENTION_YEARS" inputmode="numeric" maxlength="3"></label>
            </form>
        </section>

        <!-- 4M 변경 고객 통지 요구 (docs/29_P3 52장 CN-1) — 선택지는 공통코드 QMS_4M_NOTIFY(시스템 고정), CSR 저장에 같이 -->
        <section class="hb-sub">
            <h2 data-help-key="qms-csr.notifyReq" th:text="#{qms.csr.notifyReq}">4M 변경 고객 통지 요구</h2>
            <form id="notifyForm" class="hb-form" autocomplete="off">
                <label th:each="t : ${ {'MAN','MACHINE','MATERIAL','METHOD','MEASURE','ENV','SUPPLIER','SITE'} }"><span th:text="#{'code.QMS_4M_TYPE.' + ${t}}">유형</span>
                    <select th:attr="data-field='notifyReq.' + ${t}" data-hb="select" data-code="QMS_4M_NOTIFY"></select></label>
            </form>
        </section>

        <section class="hb-sub">
            <h2 data-help-key="qms-csr.targets" th:text="#{qms.doc.targets}">적용 대상</h2>
            <div class="hb-qms-table-wrap">
                <table class="hb-cmp-table" id="targetTable"><tbody></tbody></table>
            </div>
            <div class="hb-toolbar" th:if="${actions.contains('SAVE')}">
                <button type="button" id="addTargetBtn" class="hb-btn-secondary" th:text="#{qms.doc.addTarget}">대상 추가</button>
            </div>
        </section>

        <section class="hb-sub" id="fileBox" hidden>
            <h2 th:text="#{qms.doc.files}">첨부</h2>
            <ul id="files" class="hb-files"></ul>
            <label id="uploadBox" th:if="${actions.contains('SAVE')}"><span th:text="#{qms.doc.attach}">파일 올리기</span>
                <input type="file" id="fileInput"></label>
        </section>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/qms/qms-ui.js}"></script>
<script th:src="@{/js/views/qms/csr-mgt.js}"></script>
</body>
</html>
