<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  검사계획 관리 (qms-insp-plan) — P3 QMS Q1 (docs/29 D1·D2). 구조는 BOM·라우팅 관리와 같다: 목록 = 계획 머리, 상세 = 머리 폼 + 검사 항목(행) 목록.
  사용성 체크(docs/11 4.3): 주 사용자 = 품질 기획 담당(WEB, 마우스·키보드). 일상 변경은 "새 리비전 → 고치기 → 확정".
  직접 치는 값 = 검사 유형·대상(품목 또는 품목 클래스)·공정·항목(특성·샘플링·계측기·주기·방법·이탈 시 조치) — 회사 품질 기준이라 서버가 채울 수 없음.
  서버가 채우는 값 = 리비전(비우면 A0, A1 …), 시작일(비우면 오늘), 주기(비우면 LOT 마다), 규격(특성에서 — 확정 때 행에 고정).
  특성 고르기는 계획 대상에 맞는 것만(품목의 제품 특성 + 계획 공정의 공정 특성). 확정 뒤 특성 규격이 바뀌면 "특성 규격과 다름 — 새 리비전 필요".
  예외 = 확정본 수정(새 리비전으로), 사용 중지 특성·샘플링(확정 거부), 같은 날 겹치는 확정본(오류). 버튼 노출은 편의, 판정은 API 의 @ProgAuth.
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<link rel="stylesheet" th:href="@{/css/qms.css}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">검사계획 관리</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
    <label><span th:text="#{qms.plan.col.inspType}">검사 유형</span>
        <select name="inspType" data-hb="select" data-code="INSP_TYPE" data-blank="all"></select></label>
    <label><span th:text="#{qms.plan.target}">품목·클래스</span>
        <input name="target" maxlength="200"></label>
    <label><span th:text="#{qms.plan.col.procCd}">공정</span>
        <select name="procCd" id="searchProc"></select></label>
    <label><span th:text="#{qms.plan.col.status}">상태</span>
        <select name="status" data-hb="select" data-code="BOM_STATUS" data-blank="all"></select></label>
    <label class="hb-check"><input type="checkbox" name="withObsolete" value="true">
        <span th:text="#{qms.plan.withObsolete}">폐기 포함</span></label>
    <label class="hb-check"><input type="checkbox" name="specChangedOnly" value="true">
        <span th:text="#{qms.plan.specChangedOnly}">규격 바뀐 확정본만</span></label>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split hb-split-wide">
    <section class="hb-split-main">
        <div class="hb-toolbar" th:if="${actions.contains('SAVE')}">
            <button type="button" id="newBtnList" class="hb-btn-secondary hb-drawer-only" th:text="#{common.new}">신규</button>
        </div>
        <div id="planGrid" class="hb-grid-host"></div>
    </section>

    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
            <button type="button" id="saveBtn" th:if="${actions.contains('SAVE')}" th:text="#{common.save}">저장</button>
            <button type="button" id="releaseBtn" th:if="${actions.contains('APPROVE')}" th:text="#{qms.plan.release}">확정</button>
            <button type="button" id="newRevBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{qms.plan.newRev}">새 리비전</button>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
            <!-- 되돌릴 수 없는 동작은 저장과 떨어진 오른쪽 끝(docs/40 P1 ④) -->
            <div class="hb-qms-danger-zone">
                <button type="button" id="obsoleteBtn" class="hb-btn-danger-outline" th:if="${actions.contains('DELETE')}" th:text="#{qms.plan.obsolete}">폐기</button>
            </div>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{qms.plan.selectOrNew}">왼쪽에서 검사계획을 고르거나 신규를 누르세요.</p>
        <p id="specNote" class="hb-notice" hidden></p>

        <form id="planForm" class="hb-form" autocomplete="off">
            <label><span th:text="#{qms.plan.col.inspType}">검사 유형</span>
                <select data-field="inspType" data-hb="select" data-code="INSP_TYPE" data-blank="select" required
                        data-help-key="qms-insp-plan.inspType"></select></label>
            <fieldset class="hb-seg hb-wide-2" id="targetKind">
                <legend th:text="#{qms.plan.targetKind}">대상</legend>
                <label><input type="radio" name="targetKind" value="ITEM" checked><span th:text="#{qms.plan.kindItem}">품목</span></label>
                <label><input type="radio" name="targetKind" value="CLASS"><span th:text="#{qms.plan.kindClass}">품목 클래스</span></label>
            </fieldset>
            <label class="hb-qms-m" data-kind="ITEM"><span th:text="#{qms.plan.col.itemCd}">품목 코드</span>
                <input data-field="itemCd" maxlength="40" data-help-key="qms-insp-plan.itemCd"></label>
            <label class="hb-qms-m hb-wide-2" data-kind="ITEM"><span th:text="#{qms.plan.col.targetNm}">이름</span>
                <output id="itemNm" class="hb-output"></output></label>
            <label class="hb-qms-m" data-kind="CLASS"><span th:text="#{qms.plan.col.classCd}">품목 클래스</span>
                <select data-field="classCd" data-help-key="qms-insp-plan.classCd"></select></label>
            <label><span th:text="#{qms.plan.col.procCd}">공정</span>
                <select data-field="procCd" data-help-key="qms-insp-plan.procCd"></select></label>
            <label><span th:text="#{qms.plan.col.rev}">리비전</span>
                <input data-field="rev" maxlength="4"></label>
            <label><span th:text="#{qms.plan.col.status}">상태</span>
                <output id="status" class="hb-output"></output></label>
            <label><span th:text="#{qms.plan.col.validFrom}">시작일</span>
                <input data-field="validFrom" type="date"></label>
            <label><span th:text="#{qms.plan.col.validTo}">종료일</span>
                <output id="validTo" class="hb-output"></output></label>
            <label><span th:text="#{qms.plan.col.changeNo}">변경 번호</span>
                <input data-field="changeNo" maxlength="30"></label>
            <label class="hb-wide"><span th:text="#{qms.plan.col.changeReason}">변경 사유</span>
                <input data-field="changeReason" maxlength="500"></label>
            <label class="hb-wide"><span th:text="#{qms.plan.col.remark}">비고</span>
                <textarea data-field="remark" maxlength="1000" rows="2"></textarea></label>
        </form>

        <!-- 검사기준서 연결 (Q3 관리문서) — 작성 중 계획만, 확정 뒤 고정 -->
        <section class="hb-sub" id="docSection" hidden>
            <h2 th:text="#{js.qms.plan.doc}">검사기준서</h2>
            <div class="hb-qms-inline">
                <label class="hb-qms-grow"><span th:text="#{js.qms.plan.doc}">검사기준서</span><select id="docSel"></select></label>
                <button type="button" id="docLinkBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}"
                        th:text="#{js.qms.plan.docLink}">연결</button>
            </div>
            <p id="docNote" class="hb-muted"></p>
        </section>

        <section class="hb-sub" id="lineSection" hidden>
            <h2 th:text="#{qms.plan.lines}">검사 항목</h2>
            <p class="hb-muted" th:text="#{qms.plan.linesHint}">특성은 이 계획의 품목·공정에 맞는 것만 고를 수 있습니다. 규격은 특성 마스터에서 오고, 확정하는 순간 이 계획에 고정됩니다.</p>
            <div id="lines" class="hb-rows" role="list"></div>
            <div class="hb-toolbar" id="lineTools" th:if="${actions.contains('SAVE')}">
                <button type="button" id="addLineBtn" class="hb-btn-secondary" th:text="#{qms.plan.addLine}">항목 추가</button>
                <button type="button" id="saveLinesBtn" th:text="#{qms.plan.saveLines}">항목 저장</button>
            </div>
        </section>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/qms/qms-ui.js}"></script>
<script th:src="@{/js/views/qms/insp-plan-mgt.js}"></script>
</body>
</html>
