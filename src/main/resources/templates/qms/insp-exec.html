<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  검사 실행 (qms-insp) — P3 QMS 2부 Q6 (docs/29_P3 12.2). 수입·공정·출하·초품·종품·순회 검사의 측정값 원장과 판정.
  사용성 체크(docs/11 4.3): 주 사용자 = 검사원(WEB, 검사대 PC). 하루 수십 건, 한 건에 행 몇 개 × 샘플 수십 개.
  직접 치는 값 = LOT 번호·검사 유형·공정·로트 수량(기본 LOT 수량), 측정값(붙여넣기 — 다음 빈 샘플 번호부터), 게이지.
  서버가 채우는 값 = 검사 번호, 적용 검사계획(오늘 유효한 확정본), 행마다 샘플 수·Ac·Re·규격 스냅샷, 판정 미리보기.
  예외 = 계획 없음, 막힌 게이지(교정 NG·기한 초과·기록 없음·사용 중지), 같은 샘플 두 번(정정은 무효 뒤 다시), 확정·무효 뒤 측정 고정.
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<link rel="stylesheet" th:href="@{/css/qms.css}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">검사 실행</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
    <label><span th:text="#{qms.insp.keyword}">검사 번호·LOT·품목</span><input name="keyword" maxlength="100"></label>
    <label><span th:text="#{qms.insp.col.inspType}">유형</span>
        <select name="inspType" data-hb="select" data-code="INSP_TYPE" data-blank="all"></select></label>
    <label><span th:text="#{qms.insp.col.status}">상태</span>
        <select name="status" data-hb="select" data-code="QMS_INSP_STATUS" data-blank="all"></select></label>
    <label><span th:text="#{qms.insp.col.result}">결과</span>
        <select name="result" data-hb="select" data-code="QMS_INSP_RESULT" data-blank="all"></select></label>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split hb-split-wide">
    <section class="hb-split-main hb-qms-scroll">
        <!-- 측정값 엑셀 올리기(docs/29_P3 25장) — 판정은 상세에서 -->
        <div class="hb-toolbar" th:if="${actions.contains('SAVE')}">
            <button type="button" id="importBtn" class="hb-btn-secondary" th:text="#{import.button}">엑셀 올리기</button>
        </div>
        <form id="newForm" class="hb-qms-inline" autocomplete="off" th:if="${actions.contains('SAVE')}">
            <label><span th:text="#{qms.insp.col.lotNo}">LOT</span><input data-field="lotNo" maxlength="60" required data-help-key="qms-insp.lotNo"></label>
            <label><span th:text="#{qms.insp.col.inspType}">유형</span>
                <select data-field="inspType" data-hb="select" data-code="INSP_TYPE" data-blank="select" required></select></label>
            <label><span th:text="#{qms.insp.col.procCd}">공정</span><input data-field="procCd" maxlength="20"></label>
            <label><span th:text="#{qms.insp.col.lotQty}">로트 수량</span><input data-field="lotQty" inputmode="numeric" maxlength="10" data-help-key="qms-insp.lotQty"></label>
            <button type="submit" th:text="#{qms.insp.create}">검사 시작</button>
        </form>
        <div id="inspGrid" class="hb-grid-host"></div>
    </section>

    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="judgeBtn" th:if="${actions.contains('SAVE')}" th:text="#{qms.insp.judge}">판정 확정</button>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
            <!-- 되돌릴 수 없는 동작은 저장과 떨어진 오른쪽 끝(docs/40 P1 ④) -->
            <div class="hb-qms-danger-zone">
                <button type="button" id="voidBtn" class="hb-btn-danger-outline" th:if="${actions.contains('DELETE')}" th:text="#{qms.insp.void}">검사 무효</button>
            </div>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{qms.insp.select}">왼쪽에서 검사를 고르거나 새로 시작하세요.</p>
        <p id="headLine" class="hb-qms-status" role="status" hidden></p>
        <p><a id="ncrLink" class="hb-btn-secondary hb-link-btn" hidden th:text="#{js.qms.ncr.open}">부적합 등록</a></p>
        <div id="lines"></div>
        <section id="offPair" class="hb-qms-offpair-box" hidden>
            <h3 th:text="#{js.qms.insp.offTitle}">같은 지시·공정의 초품·종품</h3>
            <p id="offNote" class="hb-muted" hidden></p>
            <div id="offCols" class="hb-qms-offpair"></div>
        </section>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/common/hb.import.js}"></script>
<script th:src="@{/js/views/qms/qms-ui.js}"></script>
<script th:src="@{/js/views/qms/insp-exec.js}"></script>
</body>
</html>
