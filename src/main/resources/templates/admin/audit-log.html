<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  변경 이력 (sys-audit-log) — 시스템관리 3단계 (docs/36 12장). 자기 회사 감사 로그(RLS) 중 **볼 수 있는 화면의 표만**(Q17).
  사용성 체크(docs/11 4.3): 주 사용자 = 회사 관리자·감사 대응(WEB). "누가 권한을 바꿨나"·"이 값이 언제 바뀌었나".
  행을 고르면 오른쪽에 바뀐 칸(전 → 후). 가린 칸(비밀번호)은 (changed). 행위자: u{id}:{아이디} / SYSTEM / ops:{운영자} / t{단말}.
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<link rel="stylesheet" th:href="@{/css/notify.css}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">변경 이력</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" autocomplete="off">
    <div data-hb="dateRange" th:data-label="#{sysLog.period}" data-from-name="from" data-to-name="to"
         data-presets="today,yesterday,last7,last30,thisMonth" data-default="last7" data-max="today" data-max-days="92"></div>
    <label><span th:text="#{sysAudit.col.screen}">화면(표)</span>
        <select name="tableNm" id="tableSel"><option value="" th:text="#{common.all}">전체</option></select></label>
    <label><span th:text="#{sysAudit.col.action}">동작</span>
        <select name="action" data-hb="select" data-code="AUDIT_ACTION" data-blank="all"></select></label>
    <label><span th:text="#{sysAudit.col.actor}">행위자</span>
        <input name="actor" maxlength="80" spellcheck="false" data-help-key="sys-audit-log.actor"></label>
    <label class="hb-switch"><input type="checkbox" role="switch" name="grantOnly" value="true"><span th:text="#{sysLog.grantOnly}">권한 변경만</span></label>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <div id="auditGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="detailHead" class="hb-muted" th:text="#{sysAudit.pick}">왼쪽에서 행을 고르세요.</p>
        <table class="hb-audit-diff" id="diff" hidden>
            <thead><tr><th th:text="#{sysAudit.col.column}">칸</th><th th:text="#{sysAudit.col.before}">전</th><th th:text="#{sysAudit.col.after}">후</th></tr></thead>
            <tbody></tbody>
        </table>
    </aside>
</div>
<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.calendar.js}"></script>
<script th:src="@{/js/common/hb.daterange.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/admin/audit-log.js}"></script>
</body>
</html>
