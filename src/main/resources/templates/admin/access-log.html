<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  접속·보안 로그 (sys-access-log) — 시스템관리 3단계 (docs/36 12장). 회사 관리자가 **자기 회사** 로그만(RLS).
  사용성 체크(docs/11 4.3): 주 사용자 = 회사 관리자·정보보안 담당(WEB). 보안 경고 알림을 받았을 때·월 점검 때.
  직접 치는 값 = 아이디·IP 앞부분. 경고(ALERT)는 심각도 열에 ▲. 기간 상한 = min(92일, 정책). 엑셀 없음(Q18).
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">접속·보안 로그</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" autocomplete="off">
    <div data-hb="dateRange" th:data-label="#{sysLog.period}" data-from-name="from" data-to-name="to"
         data-presets="today,yesterday,last7,last30,thisMonth" data-default="last7" data-max="today" data-max-days="92"></div>
    <label><span th:text="#{sysLog.col.eventCd}">이벤트</span>
        <select name="eventCd" data-hb="select" data-code="ACCESS_EVENT" data-blank="all"></select></label>
    <label><span th:text="#{sysLog.col.severity}">심각도</span>
        <select name="severity" data-hb="select" data-code="LOG_SEVERITY" data-blank="all"></select></label>
    <label><span th:text="#{sysLog.col.resultCd}">결과</span>
        <select name="resultCd" data-hb="select" data-code="LOG_RESULT" data-blank="all"></select></label>
    <label><span th:text="#{sysLog.col.loginId}">아이디</span>
        <input name="loginId" maxlength="50" spellcheck="false"></label>
    <label><span th:text="#{sysLog.col.ip}">IP</span>
        <input name="ip" maxlength="45" spellcheck="false" data-help-key="sys-access-log.ip"></label>
    <label><span th:text="#{sysUser.col.userType}">사용자 유형</span>
        <select name="userType" data-hb="select" data-code="USER_TYPE" data-blank="all" data-help-key="sys-access-log.userType"></select></label>
    <label><span th:text="#{sysLog.col.clientType}">단말</span>
        <select name="clientType" data-help-key="sys-access-log.clientType">
            <option value="" th:text="#{common.all}">전체</option>
            <option value="WEB" th:text="#{clientType.WEB}">웹</option>
            <option value="POP" th:text="#{clientType.POP}">POP 단말</option>
            <option value="PDA" th:text="#{clientType.PDA}">창고 PDA</option>
            <option value="API" th:text="#{clientType.API}">외부 연계</option>
            <option value="SYSTEM" th:text="#{clientType.SYSTEM}">시스템</option>
        </select></label>
    <label class="hb-switch"><input type="checkbox" role="switch" name="grantOnly" value="true"><span th:text="#{sysLog.grantOnly}">권한 변경만</span></label>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div id="logGrid" class="hb-grid-host"></div>
<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.calendar.js}"></script>
<script th:src="@{/js/common/hb.daterange.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/admin/sys-ui.js}"></script>
<script th:src="@{/js/views/admin/access-log.js}"></script>
</body>
</html>
