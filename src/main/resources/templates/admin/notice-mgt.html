<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  공지 관리 (sys-notice) — 시스템관리 2b (docs/36 11.4). 공지·자료실 글 + 첨부. 읽는 쪽은 "내 알림" 화면(모든 사용자).
  사용성 체크(docs/11 4.3): 주 사용자 = 회사 관리자·총무(WEB). 행사·점검·규정 변경 때 가끔.
  직접 치는 값 = 제목·본문·게시 기간. 본문은 글자만(서식 없음 — Q16). 예외 = 지난 날짜 게시 시작(새 공지)·끝 < 시작 → 칸 오류.
  첨부는 저장한 뒤(번호가 생긴 뒤) 올린다.
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">공지 관리</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
    <label><span th:text="#{sysNotice.col.title}">제목</span>
        <input name="keyword" maxlength="100"></label>
    <label><span th:text="#{sysNotice.col.catCd}">분류</span>
        <select name="catCd" data-hb="select" data-code="NOTICE_CAT" data-blank="all"></select></label>
    <label><span th:text="#{sysNotice.col.stateCd}">게시</span>
        <select name="stateCd" data-hb="select" data-code="NOTICE_STATE" data-blank="all"></select></label>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <div class="hb-toolbar" th:if="${actions.contains('SAVE')}">
            <button type="button" id="newBtnList" class="hb-btn-secondary hb-drawer-only" th:text="#{common.new}">신규</button>
        </div>
        <div id="noticeGrid" class="hb-grid-host"></div>
    </section>

    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
            <button type="button" id="saveBtn" th:if="${actions.contains('SAVE')}" th:text="#{common.save}">저장</button>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{sysNotice.selectOrNew}">왼쪽에서 공지를 고르거나 신규를 누르세요.</p>
        <form id="noticeForm" class="hb-form" autocomplete="off">
            <label class="hb-wide"><span th:text="#{sysNotice.col.title}">제목</span>
                <input data-field="title" maxlength="200" required></label>
            <label><span th:text="#{sysNotice.col.catCd}">분류</span>
                <select data-field="catCd" data-hb="select" data-code="NOTICE_CAT" data-help-key="sys-notice.catCd"></select></label>
            <label><span th:text="#{sysNotice.col.pinYn}">위에 고정</span>
                <select data-field="pinYn">
                    <option value="N" th:text="#{sysNotice.pin.N}">아니오</option>
                    <option value="Y" th:text="#{sysNotice.pin.Y}">고정</option>
                </select></label>
            <label><span th:text="#{sysNotice.col.postFrom}">게시 시작</span>
                <input data-field="postFrom" type="date" required data-help-key="sys-notice.postFrom"></label>
            <label><span th:text="#{sysNotice.col.postTo}">게시 끝</span>
                <input data-field="postTo" type="date" data-help-key="sys-notice.postTo"></label>
            <label><span th:text="#{sysNotice.col.useYn}">사용</span>
                <select data-field="useYn">
                    <option value="Y" th:text="#{yn.Y}">사용</option>
                    <option value="N" th:text="#{yn.N}">미사용</option>
                </select></label>
            <label class="hb-wide"><span th:text="#{sysNotice.col.body}">본문</span>
                <textarea data-field="body" rows="12" maxlength="20000" data-help-key="sys-notice.body"></textarea></label>
        </form>
        <section class="hb-sub" id="fileSection" hidden>
            <h2 th:text="#{sysNotice.files}">첨부</h2>
            <ul id="files" class="hb-files"></ul>
            <input type="file" id="fileInput" th:if="${actions.contains('SAVE')}" th:aria-label="#{sysNotice.files}">
        </section>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/admin/sys-ui.js}"></script>
<script th:src="@{/js/views/admin/notice-mgt.js}"></script>
</body>
</html>
