<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  기록 무결성 점검 (sys-integrity) — docs/52 Y1, ALCOA+ 대응표 docs/54.
  사용성 체크(docs/11 4.3): 주 사용자 = 회사 관리자·품질 책임자(WEB). 고객 감사·인증 심사 전, 월 1회, 백업 복원 뒤.
  직접 치는 칸 없음 — [점검 실행] 하나. 서버가 다이제스트 체인·원장 보호·전자서명 해시·감사 트리거를 다시 계산해 결과를 남긴다(추가만).
  확정 후 돌려주는 정보: 점검별 상태(정상·주의·이상)와 문제 줄, 이력에 남은 번호. 엑셀로 감사 자료를 낸다.
-->
<body data-table-menu="excelBtn" class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">기록 무결성 점검</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<div class="hb-toolbar">
    <button type="button" id="runBtn" th:if="${actions.contains('FN1')}" data-help-key="sys-integrity.run"
            th:text="#{sysIntegrity.run}">점검 실행</button>
    <button type="button" id="excelBtn" class="hb-btn-secondary" hidden th:if="${actions.contains('EXCEL')}"
            th:text="#{sysIntegrity.excel}">엑셀</button>
    <span id="state" class="hb-msg" role="status"></span>
</div>

<div class="hb-split">
    <section class="hb-split-main">
        <h2 id="resultTitle" th:text="#{sysIntegrity.result}">결과</h2>
        <p id="empty" class="hb-msg" th:text="#{sysIntegrity.empty}">아직 점검한 기록이 없습니다. [점검 실행]을 누르세요.</p>
        <div id="checks"></div>
    </section>
    <aside class="hb-split-side" id="historySide">
        <h2 th:text="#{sysIntegrity.history}">이력</h2>
        <table class="hb-cmp-table" id="history" data-help-key="sys-integrity.history">
            <thead><tr>
                <th th:text="#{sysIntegrity.col.runAt}">점검 시각</th>
                <th th:text="#{sysIntegrity.col.status}">상태</th>
                <th th:text="#{sysIntegrity.col.problems}">문제</th>
                <th th:text="#{sysIntegrity.col.runBy}">실행자</th>
            </tr></thead>
            <tbody></tbody>
        </table>
    </aside>
</div>

<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/admin/integrity-check.js}"></script>
</body>
</html>
