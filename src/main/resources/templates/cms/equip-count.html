<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  수집 카운트 조회·정정 (cms-equip-count) — docs/25 4.36. 수집 장치가 보낸 COUNT 증가분(원장 cms_equip_count)을 공장·기간·설비로 보고,
  잘못 센 행은 [정정] 으로 역분개 행 하나를 남긴다(사유 필수, 원 행은 그대로, 한 행에 한 번). POP 실적 제안·설비 KPI 는 역분개를 더해 읽는다.
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">수집 카운트</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
    <div id="period" data-hb="dateRange" th:data-label="#{cmsCount.period}" data-from-name="from" data-to-name="to"
         data-presets="today,yesterday,thisWeek,last7,thisMonth,lastMonth" data-default="last7"
         data-max="today" data-max-days="92" data-help-key="cms-equip-count.period"></div>
    <label><span th:text="#{cmsCount.col.plant}">공장</span><select name="plantCd" id="plantSel"></select></label>
    <label><span th:text="#{cmsCount.col.equipCd}">설비</span><select name="equipId" id="equipSel"></select></label>
    <fieldset class="hb-seg">
        <legend th:text="#{cmsCount.col.metric}">구분</legend>
        <label><input type="radio" name="metricCd" value="" checked><span th:text="#{common.all}">전체</span></label>
        <label><input type="radio" name="metricCd" value="GOOD"><span th:text="#{cmsCount.metric.GOOD}">양품</span></label>
        <label><input type="radio" name="metricCd" value="SCRAP"><span th:text="#{cmsCount.metric.SCRAP}">불량</span></label>
    </fieldset>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <div id="countGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <!-- 되돌릴 수 없는 동작(역분개)은 닫기 줄과 떨어진 자리(docs/40 P1 ④) -->
        <div class="hb-toolbar" th:if="${actions.contains('SAVE')}">
            <button type="button" id="correctBtn" class="hb-btn-danger-outline" hidden th:text="#{cmsCount.correct}">정정</button>
        </div>
        <p id="detailGuide" class="hb-muted" th:text="#{cmsCount.pick}">행을 고르면 내용이 보입니다.</p>
        <dl class="hb-info" id="facts" hidden></dl>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.calendar.js}"></script>
<script th:src="@{/js/common/hb.daterange.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/cms/equip-count.js}"></script>
</body>
</html>
