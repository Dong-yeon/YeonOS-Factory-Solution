<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  점검 실행 (cms-chk-run) — CMS 1부 C2 (docs/33 4.3, D7). 예방점검 계획이 만든 예정을 예정일 기간으로 보고 결과를 넣는다.
  일상점검(CHECK 방식)은 여기서 완료·건너뛰기, 작업지시로 하는 점검(WO 방식)은 결과만 넣고 완료·취소는 보전 작업지시 화면에서.
  수치 판정은 서버가 한다(하한 ≤ 값 ≤ 상한이면 OK). NG 항목에서 후속 고장 수리 작업지시를 만든다.
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">점검 실행</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" autocomplete="off">
    <div id="period" data-hb="dateRange" th:data-label="#{cms.run.period}" data-from-name="from" data-to-name="to"
         data-presets="today,thisWeek,last7,thisMonth,lastMonth" data-default="thisWeek" data-max-days="366"></div>
    <label><span th:text="#{cms.mwo.col.status}">상태</span>
        <select name="status" data-hb="select" data-code="CMS_RUN_STATUS" data-blank="all"></select></label>
    <label><span th:text="#{cms.plan.col.execMode}">실행 방식</span>
        <select name="execMode" data-hb="select" data-code="CMS_EXEC_MODE" data-blank="all"></select></label>
    <label><span th:text="#{cms.col.plant}">공장</span><select name="plantCd" id="plantSearch"></select></label>
    <label><span th:text="#{cms.plan.keyword}">계획·대상</span><input name="keyword" maxlength="100"></label>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <div id="runGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="saveBtn" th:if="${actions.contains('SAVE')}" hidden th:text="#{cms.run.saveResults}">결과 저장</button>
            <button type="button" id="completeBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" hidden th:text="#{cms.mwo.finish}">완료</button>
            <button type="button" id="skipBtn" class="hb-btn-secondary" th:if="${actions.contains('DELETE')}" hidden th:text="#{cms.run.skip}">건너뛰기</button>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{cms.run.select}">왼쪽에서 점검을 고르세요.</p>
        <p id="stateLine" class="hb-muted"></p>
        <table class="hb-cmp-table hb-plant-table" id="results">
            <thead><tr>
                <th th:text="#{cms.run.col.item}">항목</th>
                <th th:text="#{cms.run.col.spec}">기준</th>
                <th th:text="#{cms.run.col.value}">값</th>
                <th th:text="#{cms.run.col.judge}">판정</th>
                <th></th>
            </tr></thead>
            <tbody></tbody>
        </table>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.calendar.js}"></script>
<script th:src="@{/js/common/hb.daterange.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/cms/cms-results.js}"></script>
<script th:src="@{/js/views/cms/cms-ui.js}"></script>
<script th:src="@{/js/views/cms/chk-run.js}"></script>
</body>
</html>
