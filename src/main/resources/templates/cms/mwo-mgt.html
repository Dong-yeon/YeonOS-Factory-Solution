<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  보전 작업지시 (cms-mwo) — CMS 1부 C1 (docs/33 4.1, D2). 고장(BM)·개선(CM). 예방(PM)은 C2 계획이 만든다.
  상태 REQ(신고) → OPEN(접수) → WIP(착수) → DONE(완료) → CLOSED(확인), 신고·접수 상태는 취소 가능(사유 필수).
  완료 때만 고장 현상·원인·조치 코드와 작업 내용을 강제한다(입력 도중엔 막지 않음). 완료 뒤에는 고칠 수 없다(재작업 = 새 작업지시).
  시각은 대상 설비 공장의 현지 시각으로 입력·표시한다.
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">보전 작업지시</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" autocomplete="off">
    <div id="period" data-hb="dateRange" th:data-label="#{cms.mwo.period}" data-from-name="from" data-to-name="to"
         data-presets="today,thisWeek,last7,last30,thisMonth,lastMonth" data-default="last30" data-max-days="366"></div>
    <label><span th:text="#{cms.mwo.col.status}">상태</span>
        <select name="status">
            <option value="" th:text="#{common.all}">전체</option>
            <option value="REQ,OPEN,WIP" th:text="#{cms.mwo.active}">진행 중</option>
            <option value="REQ" th:text="#{code.CMS_MWO_STATUS.REQ}">신고</option>
            <option value="OPEN" th:text="#{code.CMS_MWO_STATUS.OPEN}">접수</option>
            <option value="WIP" th:text="#{code.CMS_MWO_STATUS.WIP}">작업 중</option>
            <option value="DONE" th:text="#{code.CMS_MWO_STATUS.DONE}">완료</option>
            <option value="CLOSED" th:text="#{code.CMS_MWO_STATUS.CLOSED}">확인</option>
            <option value="CANCELLED" th:text="#{code.CMS_MWO_STATUS.CANCELLED}">취소</option>
        </select></label>
    <label><span th:text="#{cms.mwo.col.type}">유형</span>
        <select name="mwoType" data-hb="select" data-code="CMS_MWO_TYPE" data-blank="all"></select></label>
    <label><span th:text="#{cms.col.plant}">공장</span><select name="plantCd" id="plantSearch"></select></label>
    <label><span th:text="#{cms.mwo.keyword}">번호·제목·대상</span><input name="keyword" maxlength="100"></label>
    <fieldset class="hb-seg">
        <legend th:text="#{cms.mwo.scope}">범위</legend>
        <label><input type="radio" name="scope" value="ALL" checked><span th:text="#{common.all}">전체</span></label>
        <label><input type="radio" name="scope" value="MINE"><span th:text="#{cms.mwo.mine}">내 담당</span></label>
    </fieldset>
    <fieldset class="hb-seg">
        <legend th:text="#{cms.mwo.source}">신고 경로</legend>
        <label><input type="radio" name="source" value="" checked><span th:text="#{common.all}">전체</span></label>
        <label><input type="radio" name="source" value="POP"><span th:text="#{cms.mwo.popOnly}">POP 신고</span></label>
    </fieldset>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <div class="hb-toolbar">
            <button type="button" id="newBtnList" class="hb-btn-secondary hb-drawer-only" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
            <button type="button" id="excelBtn" class="hb-btn-secondary" th:if="${actions.contains('EXCEL')}" th:text="#{cms.sec.excel}">엑셀 내려받기</button>
        </div>
        <div id="mwoGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
            <button type="button" id="saveBtn" th:if="${actions.contains('SAVE')}" th:text="#{common.save}">저장</button>
            <button type="button" id="acceptBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" hidden th:text="#{cms.mwo.accept}">접수</button>
            <button type="button" id="startBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" hidden th:text="#{cms.mwo.start}">착수</button>
            <button type="button" id="finishBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" hidden th:text="#{cms.mwo.finish}">완료</button>
            <button type="button" id="closeBtn" class="hb-btn-secondary" th:if="${actions.contains('APPROVE')}" hidden th:text="#{cms.mwo.close}">확인</button>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <!-- 되돌릴 수 없는 동작은 저장 줄과 떨어진 자리(docs/40 P1 ④) -->
        <div class="hb-toolbar" th:if="${actions.contains('DELETE')}">
            <button type="button" id="cancelBtn" class="hb-btn-danger-outline" hidden th:text="#{cms.mwo.cancel}">취소</button>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{cms.mwo.selectOrNew}">왼쪽에서 작업지시를 고르거나 신규를 누르세요.</p>
        <p id="stateLine" class="hb-muted"></p>
        <form id="mwoForm" class="hb-form" autocomplete="off">
            <label><span th:text="#{cms.mwo.col.type}">유형</span>
                <select data-field="mwoType" data-help-key="cms-mwo.mwoType">
                    <option value="BM" th:text="#{code.CMS_MWO_TYPE.BM}">고장 수리</option>
                    <option value="CM" th:text="#{code.CMS_MWO_TYPE.CM}">개선</option>
                </select></label>
            <label><span th:text="#{cms.mwo.col.targetType}">대상 종류</span>
                <select data-field="targetType">
                    <option value="EQUIP" th:text="#{cms.mwo.equip}">설비</option>
                    <option value="ASSET" th:text="#{cms.mwo.asset}">금형·지그</option>
                </select></label>
            <label><span th:text="#{cms.mwo.col.target}">대상</span>
                <input data-field="targetCd" maxlength="30" list="targetList" data-help-key="cms-mwo.targetCd"></label>
            <datalist id="targetList"></datalist>
            <label class="hb-wide-2"><span th:text="#{cms.mwo.titleHint}">제목(비우면 현상)</span>
                <input data-field="title" maxlength="200"></label>
            <label><span th:text="#{cms.mwo.col.priority}">우선순위</span>
                <select data-field="priority">
                    <option value="1" th:text="#{cms.prio.1}">긴급</option>
                    <option value="2" th:text="#{cms.prio.2}">보통</option>
                    <option value="3" th:text="#{cms.prio.3}">낮음</option>
                </select></label>
            <label><span th:text="#{cms.mwo.col.symptom}">현상</span><select data-field="symptomCd"></select></label>
            <label class="hb-wide"><span th:text="#{cms.mwo.col.symptomText}">현상 설명</span>
                <textarea data-field="symptomText" maxlength="1000" rows="2"></textarea></label>
            <label class="hb-wide"><span th:text="#{cms.mwo.col.reportedAt}">신고 시각(비우면 지금)</span>
                <input type="datetime-local" data-field="reportedAt"></label>
            <label><span th:text="#{cms.mwo.col.assignee}">담당</span>
                <select data-field="assigneeLoginId" data-help-key="cms-mwo.assignee"></select></label>
            <label><span th:text="#{cms.mwo.col.dueDate}">기한</span><input type="date" data-field="dueDate"></label>
            <label><span th:text="#{cms.mwo.col.down}">설비 정지</span>
                <select data-field="downYn">
                    <option value="N" th:text="#{yn.N}">아니오</option>
                    <option value="Y" th:text="#{cms.bd.stopped}">멈춤</option>
                </select></label>
            <label class="hb-wide"><span th:text="#{cms.mwo.col.downStartAt}">정지 시작</span>
                <input type="datetime-local" data-field="downStartAt"></label>
            <label class="hb-wide"><span th:text="#{cms.mwo.col.downEndAt}">정지 끝</span>
                <input type="datetime-local" data-field="downEndAt" data-help-key="cms-mwo.downEndAt"></label>
            <label class="hb-wide"><span th:text="#{cms.mwo.col.startedAt}">착수</span>
                <input type="datetime-local" data-field="startedAt"></label>
            <label class="hb-wide"><span th:text="#{cms.mwo.col.finishedAt}">완료(비우면 지금)</span>
                <input type="datetime-local" data-field="finishedAt"></label>
            <label><span th:text="#{cms.mwo.col.cause}">원인</span>
                <select data-field="causeCd" data-help-key="cms-mwo.cause"></select></label>
            <label><span th:text="#{cms.mwo.col.action}">조치</span><select data-field="actionCd"></select></label>
            <!-- ISO 14224 칸(docs/33 16.6 G3) — 고장 수리만, 선택 입력 -->
            <label><span th:text="#{cms.mwo.col.failMech}">메커니즘</span>
                <select data-field="failMechCd" data-help-key="cms-mwo.failMech"></select></label>
            <label><span th:text="#{cms.mwo.col.failDetect}">탐지 방법</span>
                <select data-field="failDetectCd" data-help-key="cms-mwo.failDetect"></select></label>
            <label><span th:text="#{cms.mwo.col.failImpact}">영향</span>
                <select data-field="failImpactCd" data-help-key="cms-mwo.failImpact"></select></label>
            <label class="hb-wide"><span th:text="#{cms.mwo.col.workText}">작업 내용</span>
                <textarea data-field="workText" maxlength="2000" rows="4" data-help-key="cms-mwo.workText"></textarea></label>
        </form>

        <section class="hb-sub" id="runSection" hidden>
            <h2 th:text="#{cms.mwo.runResults}">점검 결과(예방점검)</h2>
            <p id="runLine" class="hb-muted"></p>
            <table class="hb-cmp-table hb-plant-table" id="runResults">
                <thead><tr>
                    <th th:text="#{cms.run.col.item}">항목</th>
                    <th th:text="#{cms.run.col.spec}">기준</th>
                    <th th:text="#{cms.run.col.value}">값</th>
                    <th th:text="#{cms.run.col.judge}">판정</th>
                    <th></th>
                </tr></thead>
                <tbody></tbody>
            </table>
            <div class="hb-toolbar" th:if="${actions.contains('SAVE')}">
                <button type="button" id="runSaveBtn" class="hb-btn-secondary" th:text="#{cms.run.saveResults}">결과 저장</button>
            </div>
        </section>

        <section class="hb-sub" id="laborSection" hidden>
            <h2 th:text="#{cms.mwo.labor}">공수</h2>
            <table class="hb-cmp-table hb-plant-table" id="labor">
                <thead><tr>
                    <th th:text="#{cms.mwo.col.worker}">작업자</th>
                    <th th:text="#{cms.mwo.col.workDate}">날짜</th>
                    <th th:text="#{cms.mwo.col.minutes}">분</th>
                    <th th:text="#{cms.col.remark}">비고</th>
                    <th></th>
                </tr></thead>
                <tbody></tbody>
            </table>
            <div id="laborBox" th:if="${actions.contains('SAVE')}">
            <form id="laborForm" class="hb-form" autocomplete="off">
                <label><span th:text="#{cms.mwo.col.worker}">작업자</span><select data-field="loginId" id="laborUser"></select></label>
                <label><span th:text="#{cms.mwo.col.workDate}">날짜</span><input type="date" data-field="workDate"></label>
                <label><span th:text="#{cms.mwo.col.minutes}">분</span>
                    <input data-field="minutes" data-hb="number" data-scale="0" data-min="1" data-max="1440" data-pad="false"></label>
                <label><span th:text="#{cms.col.remark}">비고</span><input data-field="remark" maxlength="500"></label>
                <div class="hb-toolbar">
                    <button type="button" id="addLaborBtn" class="hb-btn-secondary" th:text="#{cms.mwo.addLabor}">공수 추가</button>
                </div>
            </form>
            </div>
        </section>

        <section class="hb-sub" id="partSection" hidden>
            <h2 th:text="#{cms.mwo.parts}">사용 예비품</h2>
            <table class="hb-cmp-table hb-plant-table" id="parts">
                <thead><tr>
                    <th th:text="#{cms.spare.col.item}">품목</th>
                    <th th:text="#{cms.spare.col.qty}">수량</th>
                    <th th:text="#{cms.spare.col.returned}" data-help-key="cms-mwo.returned">반납</th>
                    <th th:text="#{cms.col.remark}">비고</th>
                    <th></th>
                </tr></thead>
                <tbody></tbody>
            </table>
            <div id="partBox" th:if="${actions.contains('SAVE')}">
            <form id="partForm" class="hb-form" autocomplete="off">
                <label class="hb-wide"><span th:text="#{cms.spare.col.item}">품목</span>
                    <input data-field="itemCd" maxlength="40" list="partOptions" data-help-key="cms-mwo.itemCd"></label>
                <datalist id="partOptions"></datalist>
                <label><span th:text="#{cms.spare.col.qty}">수량</span><input data-field="qty" inputmode="decimal" maxlength="24"></label>
                <label><span th:text="#{cms.col.remark}">비고</span><input data-field="remark" maxlength="500"></label>
                <div class="hb-toolbar">
                    <button type="button" id="addPartBtn" class="hb-btn-secondary" th:text="#{cms.mwo.addPart}">예비품 추가</button>
                </div>
            </form>
            </div>
            <div id="returnBox" th:if="${actions.contains('SAVE')}" hidden>
            <h3 class="hb-muted" th:text="#{cms.mwo.returnTitle}">덜 쓴 예비품 반납</h3>
            <form id="returnForm" class="hb-form" autocomplete="off">
                <label class="hb-wide"><span th:text="#{cms.spare.col.item}">품목</span><select data-field="partId" id="returnPart"></select></label>
                <label><span th:text="#{cms.spare.col.qty}">수량</span><input data-field="qty" inputmode="decimal" maxlength="24"></label>
                <label class="hb-wide"><span th:text="#{cms.mwo.returnReason}">반납 사유</span>
                    <input data-field="reason" maxlength="500" data-help-key="cms-mwo.returnReason"></label>
                <div class="hb-toolbar">
                    <button type="button" id="returnBtn" class="hb-btn-secondary" th:text="#{cms.mwo.returnPart}">반납</button>
                </div>
            </form>
            </div>
        </section>

        <section class="hb-sub" id="downSection" hidden>
            <h2 th:text="#{cms.mwo.downtime}">수집 정지 구간·알람</h2>
            <p id="downSum" class="hb-muted"></p>
            <table class="hb-cmp-table" id="downs">
                <thead><tr>
                    <th th:text="#{cms.stateReview.col.start}">시작</th>
                    <th th:text="#{cms.stateReview.col.end}">끝</th>
                    <th class="hb-num" th:text="#{cms.stateReview.col.minutes}">분</th>
                    <th th:text="#{cms.stateReview.col.reason}">사유</th>
                </tr></thead>
                <tbody></tbody>
            </table>
            <ul id="mwoAlarms" class="hb-files"></ul>
        </section>

        <section class="hb-sub" id="fileSection" hidden>
            <h2 th:text="#{cms.mwo.files}">첨부(사진·보고서)</h2>
            <ul id="files" class="hb-files"></ul>
            <input type="file" id="fileInput" th:if="${actions.contains('SAVE')}" th:aria-label="#{cms.mwo.files}">
            <h2 th:text="#{cms.mwo.reportFiles}">신고 사진</h2>
            <ul id="reportFiles" class="hb-files"></ul>
        </section>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.calendar.js}"></script>
<script th:src="@{/js/common/hb.daterange.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/cms/cms-results.js}"></script>
<script th:src="@{/js/views/cms/cms-ui.js}"></script>
<script th:src="@{/js/views/cms/mwo-mgt.js}"></script>
</body>
</html>
