<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  설비 예비품 (cms-spare) — CMS 1부 C4 (docs/33 4.5, D9). 설비(또는 설비 클래스) × 품목 연결과 작업지시 사용 이력.
  예비품은 품목 마스터 그대로(소모품 CON 우선 표시) — 수량·안전재고·차감은 WMS. 검색어에 품목을 넣으면 그 품목을 쓰는 설비(역방향).
  사용 기록은 보전 작업지시 화면에서 넣는다(작업지시가 끝나면 고칠 수 없다).
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">설비 예비품</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
    <label><span th:text="#{cms.spare.keyword}">설비·클래스·품목</span><input name="keyword" maxlength="100"></label>
    <label><span th:text="#{cms.spare.col.targetKind}">연결 단위</span>
        <select name="targetKind">
            <option value="" th:text="#{common.all}">전체</option>
            <option value="EQUIP" th:text="#{cms.spare.kind.EQUIP}">설비</option>
            <option value="CLASS" th:text="#{cms.spare.kind.CLASS}">설비 클래스</option>
        </select></label>
    <fieldset class="hb-seg">
        <legend th:text="#{cms.col.useYn}">사용</legend>
        <label><input type="radio" name="useYn" value=""><span th:text="#{common.all}">전체</span></label>
        <label><input type="radio" name="useYn" value="Y" checked><span th:text="#{yn.Y}">사용</span></label>
        <label><input type="radio" name="useYn" value="N"><span th:text="#{yn.N}">미사용</span></label>
    </fieldset>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <div class="hb-toolbar">
            <button type="button" id="newBtnList" class="hb-btn-secondary hb-drawer-only" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
            <button type="button" id="excelBtn" class="hb-btn-secondary" th:if="${actions.contains('EXCEL')}" th:text="#{cms.sec.excel}">엑셀 내려받기</button>
        </div>
        <div id="spareGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
            <button type="button" id="saveBtn" th:if="${actions.contains('SAVE')}" th:text="#{common.save}">저장</button>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{cms.spare.selectOrNew}">왼쪽에서 연결을 고르거나 신규를 누르세요.</p>
        <form id="spareForm" class="hb-form" autocomplete="off">
            <label><span th:text="#{cms.spare.col.targetKind}">연결 단위</span>
                <select data-field="targetKind">
                    <option value="EQUIP" th:text="#{cms.spare.kind.EQUIP}">설비</option>
                    <option value="CLASS" th:text="#{cms.spare.kind.CLASS}">설비 클래스</option>
                </select></label>
            <label><span th:text="#{cms.spare.col.target}">설비·클래스</span>
                <input data-field="targetCd" maxlength="30" list="targetList" data-help-key="cms-spare.targetCd"></label>
            <datalist id="targetList"></datalist>
            <label class="hb-wide"><span th:text="#{cms.spare.col.item}">품목</span>
                <input data-field="itemCd" maxlength="40" list="itemList" data-help-key="cms-spare.itemCd"></label>
            <datalist id="itemList"></datalist>
            <label><span id="qtyLabel" th:text="#{cms.spare.col.installQty}">설치 수량</span>
                <input data-field="installQty" inputmode="decimal" maxlength="24"></label>
            <label><span th:text="#{cms.spare.col.keySpare}">핵심 예비품</span>
                <select data-field="keySpareYn">
                    <option value="N" th:text="#{cms.spare.key.N}">일반</option>
                    <option value="Y" th:text="#{cms.spare.key.Y}">핵심</option>
                </select></label>
            <label><span th:text="#{cms.col.useYn}">사용</span>
                <select data-field="useYn">
                    <option value="Y" th:text="#{yn.Y}">사용</option>
                    <option value="N" th:text="#{yn.N}">미사용</option>
                </select></label>
            <label class="hb-wide"><span th:text="#{cms.col.remark}">비고</span><input data-field="remark" maxlength="500"></label>
        </form>
        <section class="hb-sub" id="usageSection" hidden>
            <h2 th:text="#{cms.spare.usage}">사용 이력</h2>
            <form id="usageForm" class="hb-form" autocomplete="off">
                <label><span th:text="#{cms.spare.usageFrom}">사용일부터</span><input type="date" data-field="from"></label>
                <label><span th:text="#{cms.spare.usageTo}">까지</span><input type="date" data-field="to"></label>
            </form>
            <div class="hb-toolbar">
                <button type="button" id="usageBtn" class="hb-btn-secondary" th:text="#{common.search}">조회</button>
                <span id="usageSum" class="hb-muted"></span>
                <button type="button" id="usageExcelBtn" class="hb-btn-secondary" th:if="${actions.contains('EXCEL')}" th:text="#{cms.sec.excel}">엑셀 내려받기</button>
            </div>
            <div class="hb-replace-host">
                <table class="hb-cmp-table hb-plant-table" id="usage">
                    <thead><tr>
                        <th th:text="#{cms.spare.col.usedAt}">사용일</th>
                        <th th:text="#{cms.mwo.col.mwoNo}">작업지시</th>
                        <th th:text="#{cms.mwo.col.target}">대상</th>
                        <th th:text="#{cms.spare.col.qty}">수량</th>
                    </tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/cms/cms-ui.js}"></script>
<script th:src="@{/js/views/cms/spare-mgt.js}"></script>
</body>
</html>
