<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  설비 알람 정의 (cms-alarm-def) — CMS 2부 C8 (docs/33 11.6, D22). 장치 알람 코드 × 설비 클래스(비우면 전체) → 이름·심각도·현상·자동 고장 신고.
  코드·클래스는 만든 뒤 고정, 삭제 없음(사용 중지). 자동 고장 신고는 심각도 CRITICAL 만.
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">설비 알람 정의</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
    <label><span th:text="#{cms.alarmDef.keyword}">코드·이름</span><input name="keyword" maxlength="100"></label>
    <label><span th:text="#{cms.alarmDef.class}">설비 클래스</span>
        <select name="classCd" id="classSearch"><option value="" th:text="#{common.all}">전체</option></select></label>
    <fieldset class="hb-seg">
        <legend th:text="#{cms.col.useYn}">사용</legend>
        <label><input type="radio" name="useYn" value=""><span th:text="#{common.all}">전체</span></label>
        <label><input type="radio" name="useYn" value="Y" checked><span th:text="#{yn.Y}">사용</span></label>
        <label><input type="radio" name="useYn" value="N"><span th:text="#{yn.N}">미사용</span></label>
    </fieldset>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <div class="hb-toolbar">
            <button type="button" id="newBtnList" class="hb-btn-secondary hb-drawer-only" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
        </div>
        <div id="defGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
            <button type="button" id="saveBtn" th:if="${actions.contains('SAVE')}" th:text="#{common.save}">저장</button>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{cms.alarmDef.selectOrNew}">왼쪽에서 정의를 고르거나 신규를 누르세요.</p>
        <form id="defForm" class="hb-form" autocomplete="off">
            <label><span th:text="#{cms.alarmDef.col.code}">알람 코드</span>
                <input data-field="alarmCd" maxlength="50" data-help-key="cms-alarm-def.alarmCd"></label>
            <label><span th:text="#{cms.alarmDef.col.class}">설비 클래스</span>
                <select data-field="classCd" id="classForm"><option value="" th:text="#{cms.alarmDef.allClasses}">모든 클래스</option></select></label>
            <label class="hb-wide"><span th:text="#{cms.alarmDef.col.name}">이름</span><input data-field="alarmNm" maxlength="100"></label>
            <label><span th:text="#{cms.alarmDef.col.severity}">심각도</span><select data-field="severity" id="sevForm"></select></label>
            <label><span th:text="#{cms.alarmDef.col.symptom}">현상 코드</span>
                <input data-field="symptomCd" maxlength="20" list="symptomList"></label>
            <datalist id="symptomList"></datalist>
            <label><span th:text="#{cms.alarmDef.col.autoBm}">자동 고장 신고</span>
                <select data-field="autoBmYn" data-help-key="cms-alarm-def.autoBmYn">
                    <option value="N" th:text="#{yn.N}">아니오</option>
                    <option value="Y" th:text="#{yn.Y}">예</option>
                </select></label>
            <label><span th:text="#{cms.col.useYn}">사용</span>
                <select data-field="useYn">
                    <option value="Y" th:text="#{yn.Y}">사용</option>
                    <option value="N" th:text="#{yn.N}">미사용</option>
                </select></label>
            <label class="hb-wide"><span th:text="#{cms.col.remark}">비고</span><input data-field="remark" maxlength="500"></label>
        </form>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/cms/cms-ui.js}"></script>
<script th:src="@{/js/views/cms/alarm-def.js}"></script>
</body>
</html>
