<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  시리얼 구성 (prd-serial) — docs/77. 장비 시리얼 목록(hb.grid + 엑셀) → 상세: 장착 중 부품([탈거]·[교체]) · 장착 등록 · BOM 대비 · 이력.
  장착 = 장착 원장 + 부품 LOT 계보 투입, 탈거 = 반대 행(지우지 않음). 저장은 머리 rowVer 로(남이 먼저 저장하면 409).
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<link rel="stylesheet" th:href="@{/css/prd-serial.css}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">시리얼 구성</h1>
    <div class="hb-page-tools">
        <span class="hb-prog-links" role="group" th:aria-label="#{page.related}" data-prog-links="prd-serial-trace" hidden></span>
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
    <div id="period" data-hb="dateRange" th:data-label="#{prdSerial.period}" data-from-name="from" data-to-name="to"
         data-presets="today,last7,last30,thisMonth" data-default="last30" data-max-days="366" data-required="false"></div>
    <label><span th:text="#{prdSerial.keyword}">시리얼·지시 번호</span>
        <input name="keyword" maxlength="60" data-help-key="prd-serial.keyword"></label>
    <label><span th:text="#{prdSerial.col.itemCd}">장비 품목 코드</span><input name="itemCd" maxlength="40"></label>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split hb-split-wide">
    <section class="hb-split-main">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{prdSerial.new}">시리얼 만들기</button>
        </div>
        <div id="serialGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <a id="lotLink" class="hb-btn-secondary hb-link-btn" hidden th:text="#{prdSerial.lotLink}">장비 LOT 추적</a>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="info" class="hb-muted" th:text="#{prdSerial.select}">왼쪽에서 시리얼을 고르세요.</p>
        <dl class="hb-info" id="facts" hidden></dl>

        <!-- 시리얼 만들기: 지시를 찾아 고른 뒤 대수 -->
        <form id="createForm" class="hb-form" autocomplete="off" hidden th:if="${actions.contains('SAVE')}">
            <h2 class="hb-wide" th:text="#{prdSerial.new}">시리얼 만들기</h2>
            <label><span th:text="#{prdSerial.col.woNo}">지시 번호</span>
                <input id="woNoInput" maxlength="50" data-help-key="prd-serial.woNo"></label>
            <div class="hb-toolbar">
                <button type="button" id="woFindBtn" class="hb-btn-secondary" th:text="#{prdSerial.woFind}">지시 찾기</button>
            </div>
            <label class="hb-wide"><span th:text="#{prdSerial.wo}">지시</span>
                <select data-field="woId" id="woSel"></select></label>
            <label><span th:text="#{prdSerial.count}">대수</span>
                <input data-field="count" id="countInput" inputmode="numeric" maxlength="3" value="1" data-help-key="prd-serial.count"></label>
            <label class="hb-wide"><span th:text="#{prdSerial.col.remark}">비고</span>
                <input data-field="remark" maxlength="1000"></label>
            <div class="hb-toolbar hb-wide">
                <button type="button" id="createBtn" th:text="#{prdSerial.create}">만들기</button>
            </div>
        </form>

        <section class="hb-sub" id="activeSection" hidden>
            <h2 th:text="#{prdSerial.active}">장착 중 부품</h2>
            <table class="hb-cmp-table" id="activeTable">
                <thead><tr>
                    <th th:text="#{prdSerial.col.partItemCd}">부품 품목</th>
                    <th th:text="#{prdSerial.col.partLotNo}">부품 LOT</th>
                    <th th:text="#{prdSerial.col.partSerialNo}">부품 시리얼</th>
                    <th class="hb-num" th:text="#{prdSerial.col.qty}">수량</th>
                    <th th:text="#{prdSerial.col.opSeq}">공정</th>
                    <th th:text="#{prdSerial.col.installedAt}">장착 시각</th>
                    <th th:text="#{prdSerial.col.act}">작업</th>
                </tr></thead>
                <tbody></tbody>
            </table>
        </section>

        <form id="installForm" class="hb-form" autocomplete="off" hidden th:if="${actions.contains('SAVE')}">
            <h2 class="hb-wide" id="installTitle" th:text="#{prdSerial.install}">부품 장착</h2>
            <label><span th:text="#{prdSerial.col.partItemCd}">부품 품목 코드</span>
                <input data-field="itemCd" maxlength="40" data-help-key="prd-serial.itemCd"></label>
            <label><span th:text="#{prdSerial.col.partLotNo}">부품 LOT 번호</span>
                <input data-field="lotNo" maxlength="60" data-help-key="prd-serial.lotNo"></label>
            <label><span th:text="#{prdSerial.col.partSerialNo}">부품 시리얼</span>
                <input data-field="partSerialNo" maxlength="60" data-help-key="prd-serial.partSerialNo"></label>
            <label><span th:text="#{prdSerial.col.qty}">수량</span>
                <input data-field="qty" inputmode="decimal" maxlength="30" value="1"></label>
            <label><span th:text="#{prdSerial.col.opSeq}">장착 공정 순번</span>
                <input data-field="opSeq" inputmode="numeric" maxlength="6" data-help-key="prd-serial.opSeq"></label>
            <label><span th:text="#{prdSerial.col.workerCd}">작업자 코드</span>
                <input data-field="workerCd" maxlength="20"></label>
            <label><span th:text="#{prdSerial.col.installedAt}">장착 시각</span>
                <input data-field="occurredAt" maxlength="16" placeholder="yyyy-MM-ddTHH:mm" data-help-key="prd-serial.occurredAt"></label>
            <div class="hb-toolbar hb-wide">
                <button type="button" id="installBtn" th:text="#{prdSerial.installSave}">장착</button>
                <button type="button" id="installCancelBtn" class="hb-btn-ghost" hidden th:text="#{prdSerial.replaceCancel}">교체 취소</button>
            </div>
        </form>

        <section class="hb-sub" id="compareSection" hidden>
            <h2 th:text="#{prdSerial.compare}">BOM 대비</h2>
            <p id="compareInfo" class="hb-muted"></p>
            <table class="hb-cmp-table" id="compareTable">
                <thead><tr>
                    <th th:text="#{prdSerial.col.state}">판정</th>
                    <th th:text="#{prdSerial.col.bomItem}">BOM 품목</th>
                    <th th:text="#{prdSerial.col.opSeq}">공정</th>
                    <th class="hb-num" th:text="#{prdSerial.col.reqQty}">1대 소요</th>
                    <th class="hb-num" th:text="#{prdSerial.col.installedQty}">장착</th>
                    <th th:text="#{prdSerial.col.installedItems}">들어간 품목</th>
                </tr></thead>
                <tbody></tbody>
            </table>
        </section>

        <section class="hb-sub" id="historySection" hidden>
            <h2 th:text="#{prdSerial.history}">장착 이력</h2>
            <table class="hb-cmp-table" id="historyTable">
                <thead><tr>
                    <th th:text="#{prdSerial.col.ev}">구분</th>
                    <th th:text="#{prdSerial.col.partItemCd}">부품 품목</th>
                    <th th:text="#{prdSerial.col.partLotNo}">부품 LOT</th>
                    <th th:text="#{prdSerial.col.partSerialNo}">부품 시리얼</th>
                    <th class="hb-num" th:text="#{prdSerial.col.qty}">수량</th>
                    <th th:text="#{prdSerial.col.occurredAt}">발생 시각</th>
                    <th th:text="#{prdSerial.col.by}">기록</th>
                    <th th:text="#{prdSerial.col.reason}">사유</th>
                </tr></thead>
                <tbody></tbody>
            </table>
        </section>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.calendar.js}"></script>
<script th:src="@{/js/common/hb.daterange.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/production/serial-mgt.js}"></script>
</body>
</html>
