<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  POP 단말 관리 (sys-terminal) — P2 5a (docs/25 4.6). 단말 등록 → 등록 코드(한 번만 보임, 24시간) → 태블릿에서 /pop/activate.
  등록 코드 다시 발급 = 기존 단말 키 무효. 폐기는 되돌리지 않는다(사유 필수).
  유형 COLLECTOR(수집 장치, P2 6단계 docs/25 4.8)는 등록 코드 대신 API 키(Bearer)를 한 번만 보여 준다. 수집 장치 ↔ POP·PDA 는 바꿀 수 없다.
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">POP 단말 관리</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<div class="hb-split">
    <section class="hb-split-main">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
        </div>
        <div id="terminalGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <!-- 되돌릴 수 없는 동작(지금 단말이 바로 끊김·폐기)은 닫기 줄과 떨어진 자리(docs/40 P1 ④) -->
        <div class="hb-toolbar" th:if="${actions.contains('SAVE')}" hidden>
            <button type="button" id="reissueBtn" class="hb-btn-danger-outline" hidden th:text="#{terminal.reissue}">등록 코드 다시 발급</button>
            <button type="button" id="revokeBtn" class="hb-btn-danger-outline" hidden th:text="#{terminal.revoke}">폐기</button>
        </div>
        <p id="formMode" class="hb-muted"></p>

        <section id="codeBox" class="hb-code-box" hidden aria-live="polite">
            <h2 id="codeTitle" th:text="#{terminal.codeTitle}">등록 코드</h2>
            <p><code id="actCode" class="hb-code hb-code-big"></code></p>
            <p id="actGuide" class="hb-muted"></p>
        </section>

        <form id="form" class="hb-form" autocomplete="off">
            <label><span th:text="#{terminal.col.terminalCd}">단말 코드</span>
                <input data-field="terminalCd" maxlength="20" data-help-key="sys-terminal.terminalCd"></label>
            <label><span th:text="#{terminal.col.terminalNm}">단말 이름</span>
                <input data-field="terminalNm" maxlength="100"></label>
            <label><span th:text="#{terminal.col.plantCd}">공장</span>
                <select data-field="plantCd" id="plantSel"></select></label>
            <label><span th:text="#{terminal.col.node}">작업장</span>
                <select data-field="nodeId" id="nodeSel" data-help-key="sys-terminal.node"></select></label>
            <label><span th:text="#{terminal.col.terminalType}">유형</span>
                <select data-field="terminalType" data-help-key="sys-terminal.terminalType">
                    <option value="POP" th:text="#{code.TERMINAL_TYPE.POP}">POP(작업장 태블릿)</option>
                    <option value="PDA" th:text="#{code.TERMINAL_TYPE.PDA}">PDA(휴대 단말)</option>
                    <option value="COLLECTOR" th:text="#{code.TERMINAL_TYPE.COLLECTOR}">수집 장치(설비 이벤트 API)</option>
                </select></label>
            <label class="hb-wide"><span th:text="#{terminal.col.remark}">비고</span>
                <input data-field="remark" maxlength="500"></label>
            <dl class="hb-info hb-wide" id="facts" hidden></dl>
            <div class="hb-toolbar hb-wide" th:if="${actions.contains('SAVE')}">
                <button type="button" id="saveBtn" th:text="#{common.save}">저장</button>
            </div>
        </form>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/mes/mes-ui.js}"></script>
<script th:src="@{/js/views/production/terminal-mgt.js}"></script>
</body>
</html>
