<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  계획 기준정보 (aps-item-param) — APS 8단계 (docs/38 17장, docs/63 G1). 공장 × 품목 한 행: 안전재고·로트 규칙·배수·자체 생산 리드타임·확정 구간.
  구매 리드타임·MOQ·발주 배수는 SRM 공급 품목 값을 그대로 쓴다(여기서 다시 적지 않는다). 공장·품목은 등록 때만, 삭제 없음(사용 중지).
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">계획 기준정보</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
    <label><span th:text="#{apsParam.col.plant}">공장</span><select name="plantCd" id="plantSel"></select></label>
    <label><span th:text="#{apsParam.keyword}">품목 코드·이름</span>
        <input name="keyword" maxlength="100" data-help-key="aps-item-param.keyword"></label>
    <label class="hb-check"><input type="checkbox" name="withUnused" value="true">
        <span th:text="#{apsParam.withUnused}">사용 중지 포함</span></label>
    <div class="hb-sp-actions">
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <div class="hb-toolbar">
            <button type="button" id="newBtnList" class="hb-btn-secondary hb-drawer-only" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
        </div>
        <div id="paramGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
            <button type="button" id="saveBtn" th:if="${actions.contains('SAVE')}" th:text="#{common.save}">저장</button>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{apsParam.selectOrNew}">왼쪽에서 품목을 고르거나 신규를 누르세요.</p>
        <form id="paramForm" class="hb-form" autocomplete="off">
            <label><span th:text="#{apsParam.col.plant}">공장</span>
                <select data-field="plantCd" id="formPlant" required></select></label>
            <label><span th:text="#{apsParam.col.itemCd}">품목 코드</span>
                <input data-field="itemCd" maxlength="100" required data-help-key="aps-item-param.itemCd"></label>
            <p class="hb-wide hb-muted" id="itemInfo"></p>
            <label><span th:text="#{apsParam.col.safetyQty}">안전재고</span>
                <input data-field="safetyQty" inputmode="decimal" maxlength="40" data-help-key="aps-item-param.safetyQty"></label>
            <label><span th:text="#{apsParam.col.lotRule}">로트 규칙</span>
                <select data-field="lotRule" data-help-key="aps-item-param.lotRule">
                    <option value="EX" th:text="#{apsMps.lot.EX}">그대로(부족만큼)</option>
                    <option value="FX" th:text="#{apsMps.lot.FX}">고정 수량의 배수</option>
                    <option value="MIN" th:text="#{apsMps.lot.MIN}">최소 수량 이상</option>
                </select></label>
            <label><span th:text="#{apsParam.col.lotQty}">로트 수량</span>
                <input data-field="lotQty" inputmode="decimal" maxlength="40"></label>
            <label><span th:text="#{apsParam.col.lotMult}">배수</span>
                <input data-field="lotMult" inputmode="decimal" maxlength="40" data-help-key="aps-item-param.lotMult"></label>
            <label><span th:text="#{apsParam.col.makeLeadDays}">자체 생산 리드타임(일)</span>
                <input data-field="makeLeadDays" data-hb="number" data-scale="0" data-min="0" data-max="365" data-pad="false"
                       data-help-key="aps-item-param.makeLeadDays"></label>
            <label><span th:text="#{apsParam.col.fenceDays}">확정 구간(일)</span>
                <input data-field="fenceDays" data-hb="number" data-scale="0" data-min="0" data-max="60" data-pad="false"
                       data-help-key="aps-item-param.fenceDays"></label>
            <label><span th:text="#{apsParam.col.useYn}">사용</span>
                <select data-field="useYn">
                    <option value="Y" th:text="#{yn.Y}">사용</option>
                    <option value="N" th:text="#{yn.N}">미사용</option>
                </select></label>
            <label class="hb-wide"><span th:text="#{apsParam.col.remark}">비고</span>
                <input data-field="remark" maxlength="500"></label>
            <p class="hb-wide hb-muted" th:text="#{apsParam.srcNote}">구매 리드타임·최소 발주·발주 배수는 SRM 공급 품목 값을 씁니다.</p>
        </form>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/aps/item-param.js}"></script>
</body>
</html>
