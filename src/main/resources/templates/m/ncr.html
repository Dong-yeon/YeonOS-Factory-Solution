<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{m/layout :: head(#{m.ncr.title})}"></head>
<!--
  모바일 부적합 사진 등록 (docs/74 화면 4, M8). 현장에서 본 부적합을 바로 등록(OPEN)하고 사진을 붙인다 — 처분·종결은 사무 화면(qms-ncr).
  기존 API 그대로: ① POST /api/qms/ncrs (멱등 키) ② 사진마다 POST /api/platform/files (targetType qms-ncr). 권한 = qms-ncr SAVE(서버 판정).
  ①이 끝나면 폼을 잠근다(같은 부적합을 두 번 만들지 않게). 사진만 실패하면 실패한 사진만 다시 올린다.
  사진은 OS 가 카메라·사진첩을 연다(input file) — 페이지가 카메라를 직접 쓰지 않는다.
-->
<body class="hb-m" th:data-today="${today}">
<header th:replace="~{m/layout :: header(#{m.ncr.title})}"></header>
<main class="m-main">
    <p class="m-note" th:text="#{m.ncr.holdNote}">회사 정책에 따라 등록과 함께 그 LOT 이 보류될 수 있습니다.</p>
    <form id="ncrForm" autocomplete="off" novalidate>
        <label class="m-field"><span th:text="#{m.ncr.lotNo}">LOT 번호</span>
            <input data-field="lotNo" id="lotNo" maxlength="60" spellcheck="false" autocapitalize="characters" required></label>
        <label class="m-field"><span th:text="#{qms.ncr.col.source}">출처</span>
            <select data-field="source" id="source" required></select></label>
        <label class="m-field"><span th:text="#{m.ncr.defect}">불량 유형</span>
            <select data-field="defectId" id="defectId" required></select></label>
        <label class="m-field"><span th:text="#{m.ncr.qty}">부적합 수량</span>
            <input data-field="ncQty" id="ncQty" inputmode="decimal" maxlength="20" required></label>
        <label class="m-field"><span th:text="#{m.ncr.desc}">내용</span>
            <textarea data-field="description" id="description" rows="3" maxlength="2000" required></textarea></label>
        <label class="m-field"><span th:text="#{m.ncr.photos}">사진 (여러 장 가능)</span>
            <input type="file" id="photos" accept="image/*" capture="environment" multiple></label>
        <ul id="photoList" class="m-list"></ul>
        <p id="msg" class="m-msg" role="status" aria-live="polite"></p>
        <div class="m-btn-row">
            <button type="submit" id="saveBtn" class="m-primary" th:text="#{m.ncr.save}">등록</button>
        </div>
    </form>

    <section id="doneBox" hidden>
        <h2 th:text="#{m.ncr.done}">등록했습니다</h2>
        <div id="doneInfo"></div>
        <ul id="uploadList" class="m-list"></ul>
        <div class="m-btn-row">
            <button type="button" id="retryBtn" hidden th:text="#{m.ncr.retry}">실패한 사진 다시 올리기</button>
            <button type="button" id="newBtn" class="m-primary" th:text="#{m.ncr.another}">하나 더 등록</button>
        </div>
    </section>
</main>
<nav th:replace="~{m/layout :: tabs}"></nav>
<th:block th:replace="~{m/layout :: scripts}"></th:block>
<script th:src="@{/js/common/hb.scan.js}"></script>
<script th:src="@{/js/views/m/m-ncr.js}"></script>
</body>
</html>
