<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  인쇄 이력 (wms-print-job) — P4 1부 W2 (docs/30). 라벨 인쇄 작업 + 아웃박스 상태(대기·보내는 중·완료·실패).
  사용성 체크(docs/11 4.3): 주 사용자 = 창고 담당·반장(WEB). 라벨이 안 나왔을 때 이유를 보고 다시 찍는다.
  직접 치는 값 = 재발행 사유뿐. LOT·파렛트·출하 라벨 재발행은 승인 권한(중복 라벨 = 중복 재고 위험).
  예외 = 프린터 꺼짐(재시도 중 — 실패 사유 표시), 주소가 공인으로 바뀜(실패), 사유 없음·권한 없음(칸 오류·403).
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">인쇄 이력</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" autocomplete="off">
    <div id="period" data-hb="dateRange" th:data-label="#{wmsJob.period}" data-from-name="from" data-to-name="to"
         data-presets="today,yesterday,last7,thisMonth" data-default="today" data-max="today" data-max-days="92"></div>
    <label><span th:text="#{wmsJob.col.labelType}">라벨 유형</span>
        <select name="labelType" data-hb="select" data-code="WMS_LABEL_TYPE" data-blank="all"></select></label>
    <label><span th:text="#{wmsJob.col.printState}">인쇄 상태</span>
        <select name="printState" data-hb="select" data-code="WMS_PRINT_STATE" data-blank="all"></select></label>
    <label><span th:text="#{wmsJob.col.status}">상태</span>
        <select name="status" data-hb="select" data-code="WMS_PRINT_STATUS" data-blank="all"></select></label>
    <label><span th:text="#{wmsJob.col.bizKey}">대상</span><input name="bizKey" maxlength="100"></label>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <div id="jobGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="jobMode" class="hb-muted" th:text="#{wmsJob.selectFirst}">왼쪽에서 작업을 고르세요.</p>
        <dl id="jobInfo" class="hb-form"></dl>
        <form id="reprintForm" class="hb-form" autocomplete="off" th:if="${actions.contains('PRINT')}">
            <label class="hb-wide"><span th:text="#{wmsJob.reason}">재발행 사유</span>
                <input data-field="reason" maxlength="200" data-help-key="wms-print-job.reason"></label>
            <label class="hb-wide"><span th:text="#{wmsJob.printer}">프린터</span>
                <select data-field="printerId"></select></label>
            <div class="hb-wide hb-toolbar">
                <button type="button" id="reprintBtn" th:text="#{wmsJob.reprint}">재발행</button>
                <button type="button" id="moveBtn" class="hb-btn-secondary" th:text="#{wmsJob.move}" data-help-key="wms-print-job.move">다른 프린터로 넘기기</button>
            </div>
        </form>
        <!-- 인쇄 상태 3단(docs/65 18.1): 검증 스캔 · 결과 불명·프린터 오류 사람 확정 · 사건 -->
        <form id="verifyForm" class="hb-form" autocomplete="off" th:if="${actions.contains('PRINT')}">
            <label class="hb-wide"><span th:text="#{wmsJob.verify}">검증 스캔</span>
                <input data-field="scanned" maxlength="512" data-help-key="wms-print-job.verify"></label>
            <div class="hb-wide hb-toolbar">
                <button type="button" id="verifyBtn" class="hb-btn-secondary" th:text="#{wmsJob.verifyBtn}">대조</button>
            </div>
        </form>
        <form id="resolveForm" class="hb-form" autocomplete="off" th:if="${actions.contains('PRINT')}">
            <p class="hb-wide hb-muted" th:text="#{wmsJob.resolveHint}">결과를 모르는 작업입니다. 프린터에서 확인한 뒤 닫으세요 — 자동으로 다시 찍지 않습니다.</p>
            <label class="hb-wide"><span th:text="#{wmsJob.resolveReason}">확인 내용</span>
                <input data-field="reason" maxlength="200" data-help-key="wms-print-job.resolve"></label>
            <div class="hb-wide hb-toolbar">
                <button type="button" id="resolvePrintedBtn" class="hb-btn-secondary" th:text="#{wmsJob.resolvePrinted}">찍힘으로 확정</button>
                <button type="button" id="resolveCancelBtn" class="hb-btn-danger-outline" th:text="#{wmsJob.resolveCancel}">안 찍힘으로 닫기</button>
            </div>
        </form>
        <details id="eventBox">
            <summary th:text="#{wmsJob.events}">인쇄 사건</summary>
            <div class="hb-replace-host">
                <table class="hb-cmp-table">
                    <thead><tr>
                        <th th:text="#{wmsJob.ev.at}">시각</th>
                        <th th:text="#{wmsJob.ev.event}">사건</th>
                        <th th:text="#{wmsJob.ev.reason}">사유</th>
                        <th th:text="#{wmsJob.ev.by}">누가</th>
                    </tr></thead>
                    <tbody id="eventRows"></tbody>
                </table>
            </div>
        </details>
        <details>
            <summary th:text="#{wmsJob.zpl}">보낸 ZPL</summary>
            <pre id="zpl" class="hb-muted"></pre>
        </details>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.calendar.js}"></script>
<script th:src="@{/js/common/hb.daterange.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/views/wms/print-job.js}"></script>
</body>
</html>
