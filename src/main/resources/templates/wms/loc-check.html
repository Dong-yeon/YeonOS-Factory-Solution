<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  정위치 점검 (wms-loc-check) — docs/55, docs/49 W-3. PDA 에서 위치 → 물건 스캔 → 판정(정상·다른 위치·미등록) → 전수 확인 완료(없음).
  이 화면은 사무 확인: 목록(공장·기간·상태·미처리만) → 상세 줄(판정·판정 당시 장부 칸) → 다른 위치 줄은 [보정 이동](장부 칸 → 점검한 칸, 사유 LOC_CORRECT),
  나머지 불일치는 [확인만](사유). 자동 보정 없음(결정), 수량 맞추기는 실사 화면.
  사용성 체크(docs/11 4.3): 주 사용자 = 창고 반장(WEB). 직접 치는 값 = 보정 수량(기본 = 장부 수량)·확인 사유. 서버가 아는 값(칸·LOT·상태)은 묻지 않는다.
  예외 = 그새 출발 칸이 줄어듦(409 — 다시 조회), 이미 처리됨(409), 출하 대기 칸(400 — 출하 화면에서 피킹 취소), 마감된 달(409).
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">정위치 점검</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
    <label><span th:text="#{wmsLocCheck.plant}">공장</span><select name="plantCd" id="plantSel" required></select></label>
    <div id="period" data-hb="dateRange" th:data-label="#{wmsLocCheck.period}" data-from-name="from" data-to-name="to"
         data-presets="today,last7,thisMonth" data-default="last7" data-max="today" data-max-days="366"></div>
    <label><span th:text="#{wmsLocCheck.col.status}">상태</span>
        <select name="status" data-hb="select" data-code="WMS_LOC_CHECK_STATUS" data-blank="all"></select></label>
    <fieldset class="hb-seg">
        <legend th:text="#{wmsLocCheck.openOnly}">미처리만</legend>
        <label><input type="radio" name="openOnly" value="false" checked><span th:text="#{wmsLoc.no}">아니오</span></label>
        <label><input type="radio" name="openOnly" value="true"><span th:text="#{wmsLoc.yes}">예</span></label>
    </fieldset>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split hb-split-wide">
    <section class="hb-split-main">
        <div id="checkGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="checkInfo" class="hb-muted" th:text="#{wmsLocCheck.selectFirst}">왼쪽에서 점검을 고르세요.</p>
        <div class="hb-table-wrap" id="lineHost" hidden>
            <table class="hb-cmp-table" id="lines">
                <thead><tr>
                    <th th:text="#{wmsLocCheck.result}">판정</th>
                    <th th:text="#{wmsLocCheck.what}">품목·LOT</th>
                    <th th:text="#{wmsLocCheck.book}">판정 때 장부</th>
                    <th th:text="#{wmsLocCheck.action}">처리</th>
                </tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.calendar.js}"></script>
<script th:src="@{/js/common/hb.daterange.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.text.js}"></script>
<script th:src="@{/js/common/hb.dialog.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/views/wms/loc-check.js}"></script>
</body>
</html>
