<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  기간 마감 (wms-period) — P4 1부 W5 (docs/30 4.5, D10). 공장 × 월: 마감하면 그 달 발생 시각의 재고 원장이 들어가지 않는다(역분개 포함).
  사용성 체크(docs/11 4.3): 주 사용자 = 관리자(월 1회). 마감 전 점검(미확정 실사·대사 불일치)은 경고만 — 마감은 막지 않는다.
  직접 치는 값 = 재개 사유뿐. 마감은 지난 달까지만(공장 시간대), 재개·마감 모두 승인 권한 + 변경 이력.
-->
<body data-table-menu="" class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">기간 마감</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
    <label><span th:text="#{wmsPeriod.plant}">공장</span><select name="plantCd" id="plantSel" required></select></label>
    <label><span th:text="#{wmsPeriod.year}">연도</span>
        <input name="year" id="yearInp" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" required></label>
    <div class="hb-sp-actions">
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <!-- 월 목록 = hb.grid(docs/40 §10.2 D1) — 열은 서버 /api/wms/periods/columns, 상태 칸은 배지 -->
        <div id="periodGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="periodInfo" class="hb-muted" th:text="#{wmsPeriod.selectFirst}">왼쪽에서 월을 고르세요.</p>
        <ul id="checkList" class="hb-muted"></ul>
        <div id="closeBox" class="hb-toolbar" th:if="${actions.contains('APPROVE')}" hidden>
            <button type="button" id="closeBtn" th:text="#{wmsPeriod.close}" data-help-key="wms-period.close">마감</button>
        </div>
        <div id="reopenBox" th:if="${actions.contains('APPROVE')}" hidden>
            <form id="reopenForm" class="hb-form" autocomplete="off">
                <label class="hb-wide"><span th:text="#{wmsPeriod.reason}">재개 사유</span>
                    <input data-field="reason" maxlength="500" data-help-key="wms-period.reason"></label>
                <div class="hb-wide hb-toolbar">
                    <button type="button" id="reopenBtn" class="hb-btn-danger-outline" th:text="#{wmsPeriod.reopen}">재개</button>
                </div>
            </form>
        </div>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/views/wms/period.js}"></script>
</body>
</html>
