<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  재고 이동·조정 (wms-move) — P4 1부 W3 (docs/30 4.3). 이동(위치·상태) / 조정(증감 + 사유) → 원장 행 미리보기 → 확정 1회.
  사용성 체크(docs/11 4.3): 주 사용자 = 창고 담당(WEB, 키보드 웨지 스캐너). 스캔 칸이 먼저 — 위치 라벨이면 위치, 품목 라벨이면 품번을 채운다.
  직접 치는 값 = 품번·수량·사유·비고·발생 시각(늦게 입력할 때만). 확정은 누른 순간 만든 요청 id 로 한 번만(다시 눌러도 두 번 안 들어감).
  예외 = 재고 부족(409 — 그 사이 다른 사람이 꺼냄), 혼적 금지 위치, LOT 관리 품목(2부), 미래 시각, 같은 위치·상태로 이동.
  LOT 관리 품목·생산/구매 입고·출하는 이 화면이 아니다(2부).
-->
<body data-table-menu="" class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">재고 이동·조정</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="scanForm" class="hb-search" autocomplete="off">
    <label><span th:text="#{wmsMove.plant}">공장</span><select id="plantSel"></select></label>
    <label class="hb-wide"><span th:text="#{wmsMove.scan}">스캔</span>
        <input id="scanText" maxlength="512" th:placeholder="#{wmsMove.scanPlaceholder}" data-help-key="wms-move.scan"></label>
    <div class="hb-sp-actions">
        <button type="submit" id="scanBtn" class="hb-btn-secondary" th:text="#{wmsMove.scanApply}">채우기</button>
    </div>
    <output id="scanResult" class="hb-msg" aria-live="polite"></output>
</form>

<div class="hb-split hb-split-wide">
    <section class="hb-split-main" id="entry">
        <fieldset class="hb-seg" id="kindSeg">
            <legend th:text="#{wmsMove.kind}">작업</legend>
            <label><input type="radio" name="kind" value="MOVE" checked><span th:text="#{wmsMove.kindMove}">이동·상태 변경</span></label>
            <label><input type="radio" name="kind" value="ADJUST"><span th:text="#{wmsMove.kindAdjust}">조정</span></label>
        </fieldset>
        <form id="commonForm" class="hb-form" autocomplete="off">
            <label><span th:text="#{wmsMove.itemCd}">품번</span>
                <input data-field="itemId" id="itemCd" maxlength="40" data-help-key="wms-move.itemCd"></label>
            <label><span th:text="#{wmsMove.itemNm}">품명·단위</span><input id="itemNm" readonly tabindex="-1"></label>
            <label><span th:text="#{wmsMove.lotNo}">LOT 번호</span>
                <input data-field="lotNo" id="lotNo" maxlength="60" data-help-key="wms-move.lotNo"></label>
            <label><span th:text="#{wmsMove.occurredAt}">발생 시각</span>
                <input data-field="occurredAt" type="datetime-local" data-help-key="wms-move.occurredAt"></label>
            <label><span th:text="#{wmsMove.remark}">비고</span><input data-field="remark" maxlength="500"></label>
        </form>
        <div id="moveBox">
            <form id="moveForm" class="hb-form" autocomplete="off">
                <label><span th:text="#{wmsMove.from}">출발 위치</span><select data-field="fromNodeId" class="hb-node-sel"></select></label>
                <label><span th:text="#{wmsMove.fromStatus}">출발 상태</span>
                    <select data-field="fromStatus" data-code="STOCK_STATUS"></select></label>
                <label><span th:text="#{wmsMove.to}">도착 위치</span><select data-field="toNodeId" class="hb-node-sel"></select></label>
                <label><span th:text="#{wmsMove.toStatus}">도착 상태</span>
                    <select data-field="toStatus" data-code="STOCK_STATUS"></select></label>
                <label><span th:text="#{wmsMove.qty}">수량</span>
                    <input data-field="qty" data-hb="number" data-scale="6" data-pad="false" data-min="0.000001" data-max="999999999999.999999"
                           inputmode="decimal"></label>
            </form>
        </div>
        <div id="adjBox" hidden>
            <form id="adjForm" class="hb-form" autocomplete="off">
                <label><span th:text="#{wmsMove.node}">위치</span><select data-field="nodeId" class="hb-node-sel"></select></label>
                <label><span th:text="#{wmsMove.stockStatus}">재고 상태</span>
                    <select data-field="stockStatus" data-code="STOCK_STATUS"></select></label>
                <label><span th:text="#{wmsMove.delta}">증감(+ 입고 / − 출고)</span>
                    <input data-field="delta" data-hb="number" data-scale="6" data-pad="false" data-negative="true"
                           data-min="-999999999999.999999" data-max="999999999999.999999" inputmode="decimal" data-help-key="wms-move.delta"></label>
                <label><span th:text="#{wmsMove.reasonCd}">사유</span>
                    <select data-field="reasonCd" data-code="WMS_ADJ_REASON"></select></label>
            </form>
        </div>
        <div class="hb-toolbar" th:if="${actions.contains('SAVE')}">
            <button type="button" id="saveBtn" th:text="#{wmsMove.save}">확정</button>
            <button type="button" id="clearBtn" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        </div>
        <div class="hb-toolbar hb-drawer-only">
            <button type="button" id="recentBtn" class="hb-btn-secondary" th:text="#{wmsMove.recent}">오늘 입력</button>
        </div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <h2 th:text="#{wmsMove.recent}">오늘 입력</h2>
        <div class="hb-replace-host">
            <table class="hb-cmp-table" id="recent">
                <thead><tr>
                    <th th:text="#{wmsTrx.col.occurredAt}">발생 시각</th>
                    <th th:text="#{wmsTrx.col.trxType}">유형</th>
                    <th th:text="#{wmsTrx.col.itemCd}">품번</th>
                    <th th:text="#{wmsTrx.col.path}">위치</th>
                    <th class="hb-num" th:text="#{wmsTrx.col.qty}">수량</th>
                </tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/wms/stock-move.js}"></script>
</body>
</html>
