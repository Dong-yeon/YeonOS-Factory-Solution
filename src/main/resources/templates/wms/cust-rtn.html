<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  고객 반품 입고 (wms-cust-rtn) — docs/59 (사용자 결정 R-1~R-8). 출하 번호·LOT·고객으로 근거(출하 행 × LOT) 찾기 → 수량·사유·받는 칸 → 반품 입고.
  사용성 체크(docs/11 4.3): 주 사용자 = 창고 담당(WEB). 직접 치는 값 = 반품 수량(받을 수 있는 양 이하)·사유·고객 클레임 번호(선택)·비고.
  품목·LOT·고객·공장은 근거에서. 받은 재고는 BLOCKED(판정 전 출하 안 됨) — LOT 관리 품목은 QMS 부적합(NCR, 출처 클레임)이 함께 생겨 처분이 푼다.
  예외 = 받을 수 있는 양 초과(409), 근거 없음(404), 출하 대기·폐기 칸(400). 취소 = 승인 권한, NCR 이 열림(OPEN)일 때만(R-6).
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">고객 반품 입고</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="findForm" class="hb-search" autocomplete="off">
    <label><span th:text="#{wmsCustRtn.plant}">공장</span><select id="plantSel" required></select></label>
    <label><span th:text="#{wmsCustRtn.shipNo}">출하 번호</span><input id="shipNo" maxlength="40"></label>
    <label><span th:text="#{wmsCustRtn.lotNo}">LOT 번호</span>
        <input id="lotNo" maxlength="60" data-help-key="wms-cust-rtn.lotNo"></label>
    <label><span th:text="#{wmsCustRtn.custCd}">고객 코드</span><input id="custCd" maxlength="40"></label>
    <label><span th:text="#{wmsCustRtn.from}">출하일 부터</span><input id="fromDate" type="date"></label>
    <label><span th:text="#{wmsCustRtn.to}">까지</span><input id="toDate" type="date"></label>
    <div class="hb-sp-actions">
        <button type="submit" id="findBtn" class="hb-btn-secondary hb-btn-search" th:text="#{wmsCustRtn.find}">근거 찾기</button>
    </div>
</form>

<section id="srcBox" hidden>
    <h2 th:text="#{wmsCustRtn.sources}">반품할 수 있는 출하</h2>
    <div class="hb-replace-host">
        <table class="hb-cmp-table" id="srcTbl">
            <thead><tr>
                <th th:text="#{wmsCustRtn.col.ship}">출하</th>
                <th th:text="#{wmsCustRtn.col.cust}">고객</th>
                <th th:text="#{wmsCustRtn.col.item}">품목</th>
                <th th:text="#{wmsCustRtn.lotNo}">LOT 번호</th>
                <th class="hb-num" th:text="#{wmsCustRtn.col.shipped}">출하</th>
                <th class="hb-num" th:text="#{wmsCustRtn.col.returned}">반품</th>
                <th class="hb-num" th:text="#{wmsCustRtn.col.open}">받을 수 있음</th>
                <th></th>
            </tr></thead>
            <tbody></tbody>
        </table>
    </div>
</section>

<section id="entryBox" hidden>
    <h2 th:text="#{wmsCustRtn.entry}">반품 입고</h2>
    <p id="entryInfo" class="hb-muted"></p>
    <form id="entryForm" class="hb-form" autocomplete="off">
        <label><span th:text="#{wmsCustRtn.qty}">반품 수량</span>
            <input data-field="qty" inputmode="decimal" data-help-key="wms-cust-rtn.qty"></label>
        <label><span th:text="#{wmsCustRtn.reason}">사유</span>
            <select data-field="reasonCd" data-hb="select" data-code="WMS_CUST_RTN_REASON" data-blank="select"></select></label>
        <label><span th:text="#{wmsCustRtn.node}">받는 칸</span><select data-field="nodeId" data-help-key="wms-cust-rtn.node"></select></label>
        <label><span th:text="#{wmsCustRtn.capaNo}">고객 클레임 번호</span><input data-field="capaNo" maxlength="40"></label>
        <label class="hb-wide"><span th:text="#{wmsCustRtn.remark}">비고</span><input data-field="remark" maxlength="500"></label>
        <div class="hb-wide hb-toolbar" th:if="${actions.contains('SAVE')}">
            <button type="submit" id="saveBtn" th:text="#{wmsCustRtn.save}">반품 입고</button>
            <button type="button" id="entryClose" class="hb-btn-ghost" th:text="#{common.close}">닫기</button>
        </div>
    </form>
</section>

<section>
    <h2 th:text="#{wmsCustRtn.list}">받은 반품</h2>
    <form id="listForm" class="hb-search" autocomplete="off">
        <label><span th:text="#{wmsCustRtn.status}">상태</span>
            <select id="statusSel" data-hb="select" data-code="WMS_CUST_RTN_STATUS" data-blank="all"></select></label>
        <div class="hb-sp-actions">
            <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
        </div>
    </form>
    <div class="hb-replace-host">
        <table class="hb-cmp-table" id="rtnTbl">
            <thead><tr>
                <th th:text="#{wmsCustRtn.col.rtnNo}">반품 번호</th>
                <th th:text="#{wmsCustRtn.status}">상태</th>
                <th th:text="#{wmsCustRtn.col.cust}">고객</th>
                <th th:text="#{wmsCustRtn.col.ship}">출하</th>
                <th th:text="#{wmsCustRtn.col.item}">품목</th>
                <th class="hb-num" th:text="#{wmsCustRtn.qty}">반품 수량</th>
                <th th:text="#{wmsCustRtn.col.ncr}">부적합(NCR)</th>
                <th th:text="#{wmsCustRtn.col.received}">받은 때</th>
                <th></th>
            </tr></thead>
            <tbody></tbody>
        </table>
    </div>
</section>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/wms/cust-rtn.js}"></script>
</body>
</html>
