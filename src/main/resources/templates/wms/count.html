<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  재고 실사 (wms-count) — P4 1부 W5 (docs/30 4.5). 만들기(범위) → 시작(현재고 칸마다 줄) → 센 수량 → 검토(차이·재실사) → 확정(원장).
  사용성 체크(docs/11 4.3): 주 사용자 = 창고 담당(세기)·관리자(확정). 블라인드면 세는 동안 장부·차이가 안 보인다(서버가 안 보냄).
  직접 치는 값 = 센 수량(+ 늦게 넣을 때 센 시각), 장부에 없던 칸(줄 추가), 취소 사유.
  예외 = 다른 사람이 먼저 바꿈(409 — 다시 조회), 한도 넘는 차이(승인 권한), 확정 사이 재고가 나감(409, 전부 롤백), 마감 월(409).
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">재고 실사</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
    <label><span th:text="#{wmsCount.plant}">공장</span><select name="plantCd" id="plantSel" required></select></label>
    <label><span th:text="#{wmsCount.status}">상태</span>
        <select name="status" data-hb="select" data-code="WMS_COUNT_STATUS" data-blank="all"></select></label>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split hb-split-wide">
    <section class="hb-split-main">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
        </div>
        <div id="countGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="countInfo" class="hb-muted" th:text="#{wmsCount.selectFirst}">왼쪽에서 실사를 고르거나 신규를 누르세요.</p>

        <div id="newBox" hidden>
            <form id="newForm" class="hb-form" autocomplete="off">
                <label><span th:text="#{wmsCount.col.type}">유형</span>
                    <select data-field="countType" data-hb="select" data-code="WMS_COUNT_TYPE" data-blank="select"
                            data-help-key="wms-count.countType"></select></label>
                <label><span th:text="#{wmsCount.col.scope}">범위</span><select data-field="scopeNodeId" id="scopeSel"></select></label>
                <label><span th:text="#{wmsCount.itemCd}">품번(선택)</span><input data-field="itemCd" maxlength="40"></label>
                <label><span th:text="#{wmsCount.blind}">블라인드</span>
                    <select data-field="blindYn" data-help-key="wms-count.blindYn">
                        <option value="Y" th:text="#{wmsLoc.yes}">예</option>
                        <option value="N" th:text="#{wmsLoc.no}">아니오</option>
                    </select></label>
                <label class="hb-wide"><span th:text="#{wmsCount.remark}">비고</span><input data-field="remark" maxlength="500"></label>
                <div class="hb-wide hb-toolbar">
                    <button type="button" id="createBtn" th:text="#{common.save}">저장</button>
                </div>
            </form>
        </div>

        <div id="actBox" class="hb-toolbar" hidden>
            <button type="button" id="startBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{wmsCount.start}">시작</button>
            <button type="button" id="saveCountsBtn" th:if="${actions.contains('SAVE')}" th:text="#{wmsCount.saveCounts}">센 수량 저장</button>
            <button type="button" id="submitBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{wmsCount.submit}">검토로</button>
            <button type="button" id="recountBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{wmsCount.recount}">고른 줄 재실사</button>
            <button type="button" id="postBtn" th:if="${actions.contains('SAVE')}" th:text="#{wmsCount.post}" data-help-key="wms-count.post">확정</button>
            <div class="hb-danger-zone">
                <button type="button" id="cancelBtn" class="hb-btn-danger-outline" th:if="${actions.contains('SAVE')}" th:text="#{wmsCount.cancel}">취소</button>
            </div>
        </div>

        <div class="hb-toolbar" id="lineTools" hidden>
            <button type="button" id="exportBtn" class="hb-btn-secondary" th:if="${actions.contains('EXCEL')}" th:text="#{wmsCount.export}">엑셀 내보내기</button>
            <span class="hb-msg" id="pasteHint" hidden th:text="#{wmsCount.pasteHint}" data-help-key="wms-count.paste">센 수량 칸에 엑셀에서 복사한 값을 붙여넣을 수 있습니다.</span>
        </div>

        <div class="hb-replace-host" id="lineHost" hidden>
            <table class="hb-cmp-table" id="lines">
                <thead><tr>
                    <th></th>
                    <th th:text="#{wmsCount.col.loc}">위치·품목</th>
                    <th class="hb-num" th:text="#{wmsCount.col.book}">장부</th>
                    <th th:text="#{wmsCount.col.counted}">센 수량</th>
                    <th class="hb-num" th:text="#{wmsCount.col.diff}">차이</th>
                    <th th:text="#{wmsCount.col.countedBy}">센 사람</th>
                </tr></thead>
                <tbody></tbody>
            </table>
        </div>

        <div id="addBox" hidden>
            <form id="addForm" class="hb-form" autocomplete="off">
                <label><span th:text="#{wmsCount.col.loc}">위치</span><select data-field="nodeId" id="addNodeSel"></select></label>
                <label><span th:text="#{wmsCount.itemCd}">품번</span><input data-field="itemCd" maxlength="40"></label>
                <label><span th:text="#{wmsCount.lotNo}">LOT 번호</span><input data-field="lotNo" maxlength="60"></label>
                <label><span th:text="#{wmsCount.stockStatus}">재고 상태</span>
                    <select data-field="stockStatus" data-hb="select" data-code="STOCK_STATUS"></select></label>
                <div class="hb-toolbar">
                    <button type="button" id="addBtn" class="hb-btn-secondary" th:text="#{wmsCount.addLine}">줄 추가</button>
                </div>
            </form>
        </div>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/views/wms/count.js}"></script>
</body>
</html>
