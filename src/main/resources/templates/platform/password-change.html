<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|#{pwdChange.title} - #{app.name}|">비밀번호 변경</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/yeonos-mark.svg}">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<!--
  다음 로그인 때 비밀번호 변경 (docs/36 D1) — 관리자 초기화·초기 계정의 임시 비밀번호로 로그인하면 여기만 열린다.
  셸(메뉴·탭) 밖 단독 화면: 변경 전에는 다른 화면·API 가 403 이라 셸을 그릴 수 없다. 로그인 화면 배치를 그대로 쓴다.
-->
<body class="login-page login-single">
<main class="login-main">
    <div class="login-box">
        <div class="login-logo">
            <img th:src="@{/images/yeonos-mark.svg}" alt="" width="32" height="32">
            <span th:text="#{app.name}">YeonOS</span>
        </div>
        <h1 th:text="#{pwdChange.title}">비밀번호 변경</h1>
        <p class="login-sub" th:text="#{pwdChange.sub(${user.loginId})}">임시 비밀번호를 새 비밀번호로 바꿔야 계속할 수 있습니다.</p>

        <form id="pwdForm" autocomplete="off">
            <label>
                <span th:text="#{pwdChange.current}">임시(현재) 비밀번호</span>
                <input type="password" id="currentPassword" maxlength="72" required autocomplete="current-password">
            </label>
            <label>
                <span th:text="#{myInfo.password.new}">새 비밀번호</span>
                <input type="password" id="newPassword" maxlength="72" required autocomplete="new-password">
            </label>
            <label>
                <span th:text="#{myInfo.password.confirm}">새 비밀번호 확인</span>
                <input type="password" id="confirmPassword" maxlength="72" required autocomplete="new-password">
            </label>
            <ul id="pwdMsg" class="msg error" role="alert" hidden></ul>
            <button type="submit" id="pwdBtn" th:text="#{myInfo.password.submit}">비밀번호 변경</button>
        </form>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="login-link" th:text="#{pwdChange.logout}">로그아웃</button>
        </form>
    </div>
    <footer class="login-foot" th:text="#{login.footer}">YeonOS · 개인 포트폴리오 프로젝트</footer>
</main>
<script th:src="@{/js/common/hb.js}"></script>
<script th:src="@{/js/views/platform/password-change.js}"></script>
</body>
</html>
