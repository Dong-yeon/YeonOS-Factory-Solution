<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  장비 계층·창고 (mst-equip-hier) — P1 4a (docs/19). 공장 아래 한 그루 트리: 구역 › 라인 › 셀, 창고 › 로케이션(중첩).
  사용성 체크(docs/11 4.3): 주 사용자 = 생산기술·물류 담당(WEB). 처음 한 번 구성하고 가끔 고친다.
  직접 치는 값 = 코드·이름·순서. 유형은 상위에 맞는 것만 고를 수 있다(부모 규칙은 DB 가 최종 판정).
  예외 = 자기 하위 아래로 이동(순환), 사용 중인 하위가 있는 노드 사용 중지, 10단 초과 → 칸 오류.
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">장비 계층·창고</h1>
    <div class="hb-page-tools">
        <span class="hb-prog-links" role="group" th:aria-label="#{page.related}" data-prog-links="mst-plant" hidden></span>
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" autocomplete="off">
    <label><span th:text="#{equipHier.plant}">공장</span>
        <select name="plantCd" id="plantSel" data-help-key="mst-equip-hier.plantCd"></select></label>
    <label class="hb-check"><input type="checkbox" name="withUnused" value="true">
        <span th:text="#{equipHier.withUnused}">사용 중지 포함</span></label>
    <div class="hb-sp-actions">
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <div class="hb-toolbar hb-tree-tools">
            <span id="summary" class="hb-muted hb-tree-summary"></span>
            <button type="button" id="expandBtn" class="hb-btn-secondary" th:text="#{bomTree.expandAll}">모두 펼치기</button>
            <button type="button" id="collapseBtn" class="hb-btn-secondary" th:text="#{bomTree.collapse}">1레벨만</button>
            <button type="button" id="excelBtn" class="hb-btn-secondary" th:if="${actions.contains('EXCEL')}" th:text="#{bomTree.excel}">엑셀</button>
        </div>
        <div id="tree" class="hb-grid-host"></div>
    </section>

    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="addRootBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{equipHier.addRoot}">최상위 추가</button>
            <button type="button" id="addChildBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{equipHier.addChild}">하위 추가</button>
            <button type="button" id="saveBtn" th:if="${actions.contains('SAVE')}" th:text="#{common.save}">저장</button>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{equipHier.selectOrNew}">왼쪽에서 노드를 고르거나 추가를 누르세요.</p>
        <form id="nodeForm" class="hb-form" autocomplete="off">
            <label class="hb-wide"><span th:text="#{equipHier.parent}">상위</span>
                <select data-field="parentId" data-help-key="mst-equip-hier.parentId"></select></label>
            <label><span th:text="#{equipHier.col.nodeType}">유형</span>
                <select data-field="nodeType" data-help-key="mst-equip-hier.nodeType"></select></label>
            <label><span th:text="#{equipHier.col.nodeCd}">코드</span>
                <input data-field="nodeCd" maxlength="30" required data-help-key="mst-equip-hier.nodeCd"></label>
            <label><span th:text="#{equipHier.col.nodeNm}">이름</span>
                <input data-field="nodeNm" maxlength="100" required></label>
            <label><span th:text="#{equipHier.col.sortNo}">순서</span>
                <input data-field="sortNo" data-hb="number" data-scale="0" data-min="0" data-max="99999" data-pad="false"></label>
            <label><span th:text="#{equipHier.col.useYn}">사용</span>
                <select data-field="useYn">
                    <option value="Y" th:text="#{yn.Y}">사용</option>
                    <option value="N" th:text="#{yn.N}">미사용</option>
                </select></label>
            <label class="hb-wide"><span th:text="#{equipHier.col.path}">경로</span>
                <output id="path" class="hb-output"></output></label>
            <label class="hb-wide"><span th:text="#{equipHier.col.remark}">비고</span>
                <textarea data-field="remark" maxlength="500" rows="2"></textarea></label>
        </form>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/common/hb.tree.js}"></script>
<script th:src="@{/js/views/master/equip-hier-mgt.js}"></script>
</body>
</html>
