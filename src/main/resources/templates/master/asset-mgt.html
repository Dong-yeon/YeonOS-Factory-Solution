<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  금형·지그·게이지 (mst-asset) — P1 4b (docs/19). 물리 자산 실물 + 설비 설치 이력(원장: 설치·해체·무효).
  직접 치는 값 = 자산 코드·유형·이름·시리얼·대상 품목·수명 타수·교정 주기·최근 교정일, 설치할 설비·시각.
  예외 = 설치 중인 자산을 다른 설비에(해체 먼저), 과거 기간과 겹치는 설치(OVERLAP), 미래 시각, 잘못 넣은 이력(무효 — 삭제 없음).
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">금형·지그·게이지</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
    <label><span th:text="#{asset.col.assetType}">유형</span>
        <select name="assetType" data-hb="select" data-code="PHYS_ASSET_TYPE" data-blank="all"></select></label>
    <label><span th:text="#{asset.col.assetCd}">자산 코드</span><input name="assetCd" maxlength="30"></label>
    <label><span th:text="#{asset.col.assetNm}">자산명</span><input name="assetNm" maxlength="100"></label>
    <fieldset class="hb-seg">
        <legend th:text="#{asset.col.useYn}">사용</legend>
        <label><input type="radio" name="useYn" value=""><span th:text="#{common.all}">전체</span></label>
        <label><input type="radio" name="useYn" value="Y" checked><span th:text="#{yn.Y}">사용</span></label>
        <label><input type="radio" name="useYn" value="N"><span th:text="#{yn.N}">미사용</span></label>
    </fieldset>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <div class="hb-toolbar" th:if="${actions.contains('SAVE')}">
            <button type="button" id="newBtnList" class="hb-btn-secondary hb-drawer-only" th:text="#{common.new}">신규</button>
        </div>
        <div id="assetGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
            <button type="button" id="saveBtn" th:if="${actions.contains('SAVE')}" th:text="#{common.save}">저장</button>
            <div class="hb-danger-zone">
                <button type="button" id="disableBtn" class="hb-btn-danger-outline" th:if="${actions.contains('DELETE')}" th:text="#{equip.disable}">사용 중지</button>
            </div>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{asset.selectOrNew}">왼쪽에서 자산을 고르거나 신규를 누르세요.</p>
        <form id="assetForm" class="hb-form" autocomplete="off">
            <label><span th:text="#{asset.col.assetCd}">자산 코드</span><input data-field="assetCd" maxlength="30" required></label>
            <label><span th:text="#{asset.col.assetType}">유형</span>
                <select data-field="assetType" data-hb="select" data-code="PHYS_ASSET_TYPE" data-blank="select"></select></label>
            <label><span th:text="#{asset.col.assetNm}">자산명</span><input data-field="assetNm" maxlength="100" required></label>
            <label><span th:text="#{equip.serialNo}">시리얼</span><input data-field="serialNo" maxlength="100"></label>
            <label><span th:text="#{asset.col.itemCd}">대상 품목</span><input data-field="itemCd" maxlength="40" data-help-key="mst-asset.itemCd"></label>
            <label><span th:text="#{asset.lifeShots}">수명 타수</span>
                <input data-field="lifeShots" data-hb="number" data-scale="0" data-min="1" data-max="999999999999" data-help-key="mst-asset.lifeShots"></label>
            <label><span th:text="#{asset.calibCycleDays}">교정 주기(일)</span>
                <input data-field="calibCycleDays" data-hb="number" data-scale="0" data-min="1" data-max="3650" data-pad="false"></label>
            <label><span th:text="#{asset.lastCalibDate}">최근 교정일</span><input data-field="lastCalibDate" type="date"></label>
            <label><span th:text="#{asset.col.useYn}">사용</span>
                <select data-field="useYn"><option value="Y" th:text="#{yn.Y}">사용</option><option value="N" th:text="#{yn.N}">미사용</option></select></label>
            <label class="hb-wide"><span th:text="#{equipHier.col.remark}">비고</span><textarea data-field="remark" maxlength="1000" rows="2"></textarea></label>
        </form>

        <section class="hb-sub" id="installSection" hidden>
            <h2 th:text="#{asset.installs}">설치 이력</h2>
            <div class="hb-install-form" th:if="${actions.contains('SAVE')}">
                <label><span th:text="#{asset.installEquip}">설치할 설비</span><select id="installEquip"></select></label>
                <label><span th:text="#{asset.installAt}">설치 시각(비우면 지금)</span><input id="installAt" type="datetime-local"></label>
                <button type="button" id="installBtn" th:text="#{asset.install}">설치</button>
            </div>
            <table class="hb-cmp-table" id="installs">
                <thead><tr>
                    <th th:text="#{asset.col.curEquip}">설비</th>
                    <th th:text="#{equip.col.nodePath}">위치</th>
                    <th th:text="#{asset.installedAt}">설치</th>
                    <th th:text="#{asset.removedAt}">해체</th>
                    <th th:text="#{asset.state}">상태</th>
                    <th></th>
                </tr></thead>
                <tbody></tbody>
            </table>
        </section>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/master/asset-mgt.js}"></script>
</body>
</html>
