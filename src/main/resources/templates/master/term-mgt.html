<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  용어 사전 (mst-term) — P1 6단계 (docs/21, docs/03). 전역 용어(지표·용어 정의, 제품이 정함 — 읽기 전용) + 회사 동의어(현장 말).
  직접 치는 값 = 동의어·언어. 한 말이 두 용어를 가리키면 거부(대소문자·공백 무시). 삭제 없음 = 사용 중지.
  P5 에서 자연어 조회·번역 용어집이 이 표를 쓴다.
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">용어 사전</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
    <label><span th:text="#{term.keyword}">용어·동의어</span>
        <input name="keyword" maxlength="100" data-help-key="mst-term.keyword"></label>
    <div class="hb-sp-actions">
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <div id="termGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{term.selectHint}">왼쪽에서 용어를 고르세요.</p>
        <section id="termBox" hidden>
            <h2 id="termTitle"></h2>
            <p id="termDef"></p>
            <p id="termDefEn" class="hb-muted"></p>
            <h3 th:text="#{term.aliases}">이 회사의 동의어</h3>
            <table class="hb-cmp-table" id="aliases">
                <thead><tr>
                    <th th:text="#{term.col.alias}">동의어</th>
                    <th th:text="#{term.col.lang}">언어</th>
                    <th th:text="#{term.col.useYn}">사용</th>
                    <th></th>
                </tr></thead>
                <tbody></tbody>
            </table>
            <form id="aliasForm" class="hb-form" autocomplete="off" th:if="${actions.contains('SAVE')}">
                <label class="hb-wide-2"><span th:text="#{term.col.alias}">동의어</span>
                    <input data-field="alias" maxlength="100" data-help-key="mst-term.alias"></label>
                <label><span th:text="#{term.col.lang}">언어</span>
                    <select data-field="lang">
                        <option value="ko" th:text="#{term.lang.ko}">한국어</option>
                        <option value="en" th:text="#{term.lang.en}">영어</option>
                        <option value="vi" th:text="#{term.lang.vi}">베트남어</option>
                    </select></label>
                <div class="hb-toolbar"><button type="submit" id="addAliasBtn" th:text="#{term.addAlias}">동의어 추가</button></div>
            </form>
        </section>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/master/term-mgt.js}"></script>
</body>
</html>
