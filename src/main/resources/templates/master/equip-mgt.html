<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  설비 관리 (mst-equip) — P1 4b (docs/19). 설비 = 장비 계층 LINE·CELL 에 설치된 기계 한 대(비우면 보관).
  직접 치는 값 = 코드·이름·클래스·위치·제조사·모델·시리얼·자산 번호·설치일. 클래스는 "클래스 관리" 대화상자에서.
  예외 = 구역·창고에 설치(칸 오류), 금형·지그가 설치된 설비 사용 중지(해체 먼저).
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">설비 관리</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
    <label><span th:text="#{equip.col.plantCd}">공장</span><select name="plantCd" id="plantSel"></select></label>
    <label><span th:text="#{equip.col.classNm}">클래스</span><select name="classId" id="classSel"></select></label>
    <label><span th:text="#{equip.col.equipCd}">설비 코드</span><input name="equipCd" maxlength="30"></label>
    <label><span th:text="#{equip.col.equipNm}">설비명</span><input name="equipNm" maxlength="100"></label>
    <fieldset class="hb-seg">
        <legend th:text="#{equip.col.useYn}">사용</legend>
        <label><input type="radio" name="useYn" value=""><span th:text="#{common.all}">전체</span></label>
        <label><input type="radio" name="useYn" value="Y" checked><span th:text="#{yn.Y}">사용</span></label>
        <label><input type="radio" name="useYn" value="N"><span th:text="#{yn.N}">미사용</span></label>
    </fieldset>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <div class="hb-toolbar">
            <button type="button" id="newBtnList" class="hb-btn-secondary hb-drawer-only" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
            <button type="button" id="classBtn" class="hb-btn-secondary" th:text="#{equip.classMgt}">클래스 관리</button>
        </div>
        <div id="equipGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
            <button type="button" id="saveBtn" th:if="${actions.contains('SAVE')}" th:text="#{common.save}">저장</button>
            <div class="hb-danger-zone">
                <button type="button" id="disableBtn" class="hb-btn-danger-outline" th:if="${actions.contains('DELETE')}" th:text="#{equip.disable}">사용 중지</button>
            </div>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{equip.selectOrNew}">왼쪽에서 설비를 고르거나 신규를 누르세요.</p>
        <form id="equipForm" class="hb-form" autocomplete="off">
            <label><span th:text="#{equip.col.plantCd}">공장</span><select data-field="plantCd"></select></label>
            <label><span th:text="#{equip.col.equipCd}">설비 코드</span>
                <input data-field="equipCd" maxlength="30" required data-help-key="mst-equip.equipCd"></label>
            <label><span th:text="#{equip.col.equipNm}">설비명</span><input data-field="equipNm" maxlength="100" required></label>
            <label><span th:text="#{equip.col.classNm}">클래스</span><select data-field="classId"></select></label>
            <label class="hb-wide-2"><span th:text="#{equip.col.nodePath}">설치 위치</span>
                <select data-field="nodeId" data-help-key="mst-equip.nodeId"></select></label>
            <label><span th:text="#{equip.col.maker}">제조사</span><input data-field="maker" maxlength="100"></label>
            <label><span th:text="#{equip.col.model}">모델</span><input data-field="model" maxlength="100"></label>
            <label><span th:text="#{equip.serialNo}">시리얼</span><input data-field="serialNo" maxlength="100"></label>
            <label><span th:text="#{equip.col.assetNo}">자산 번호</span><input data-field="assetNo" maxlength="50"></label>
            <label><span th:text="#{equip.installDate}">설치일</span><input data-field="installDate" type="date"></label>
            <label><span th:text="#{equip.col.useYn}">사용</span>
                <select data-field="useYn"><option value="Y" th:text="#{yn.Y}">사용</option><option value="N" th:text="#{yn.N}">미사용</option></select></label>
            <label class="hb-wide"><span th:text="#{equipHier.col.remark}">비고</span><textarea data-field="remark" maxlength="1000" rows="2"></textarea></label>
        </form>
        <!-- 클래스 속성 (P1 7b, docs/22 5b): 설비 클래스의 속성 값(attrs). 클래스는 위 폼에서, 값은 여기서 따로 저장 -->
        <section class="hb-sub" id="attrSection" hidden>
            <h2 th:text="#{equip.attrs}">클래스 속성</h2>
            <p id="attrHint" class="hb-muted" hidden th:text="#{equip.attrHint}">클래스를 바꿨습니다. 새 클래스 속성을 채우고 [속성 저장]을 누르면 클래스와 값이 함께 저장됩니다.</p>
            <form id="attrForm" class="hb-form" autocomplete="off"><div id="attrBox" class="hb-form hb-wide hb-attr-box"></div></form>
            <div class="hb-toolbar" th:if="${actions.contains('SAVE')}">
                <button type="button" id="saveAttrsBtn" th:text="#{equip.saveAttrs}">속성 저장</button>
            </div>
        </section>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/common/hb.attrs.js}"></script>
<script th:src="@{/js/views/master/equip-mgt.js}"></script>
</body>
</html>
