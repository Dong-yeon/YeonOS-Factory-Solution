<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  특성 마스터 (mst-char) — P1 6단계 (docs/21). 검사·SPC·FMEA·관리계획·PPAP 가 가리킬 특성 키.
  사용성 체크(docs/11 4.3): 주 사용자 = 품질·생산기술 담당(WEB). 도면을 보며 풍선 번호 순서로 입력한다.
  직접 치는 값 = 품목·번호·이름·규격(하한·공칭·상한)·단위·특별특성(도면·고객 요구라 서버가 채울 수 없음).
  서버가 채우는 값 = 유형(비우면 제품), 데이터 유형(계량), 자릿수(2), 특별특성(일반), 출처(도면).
  예외 = 하한 ≥ 상한·공칭 범위 밖·계수에 수치·자릿수보다 긴 규격(칸 오류), 유형·품목 변경(만든 뒤 고정).
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">특성 마스터</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
    <label><span th:text="#{mstChar.col.itemCd}">품목 코드</span>
        <input name="itemCd" maxlength="40"></label>
    <label><span th:text="#{mstChar.keyword}">특성·품목명</span>
        <input name="keyword" maxlength="200"></label>
    <label><span th:text="#{mstChar.col.procCd}">공정</span>
        <select name="procCd" id="searchProc"></select></label>
    <label><span th:text="#{mstChar.col.specialCls}">특별특성</span>
        <select name="specialCls" data-hb="select" data-code="SPECIAL_CHAR" data-blank="all"></select></label>
    <label><span th:text="#{mstChar.col.charType}">유형</span>
        <select name="charType" data-hb="select" data-code="CHAR_TYPE" data-blank="all"></select></label>
    <label class="hb-check"><input type="checkbox" name="withUnused" value="true">
        <span th:text="#{mstChar.withUnused}">사용 중지 포함</span></label>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split hb-split-wide">
    <section class="hb-split-main">
        <div class="hb-toolbar" th:if="${actions.contains('SAVE')}">
            <button type="button" id="newBtnList" class="hb-btn-secondary hb-drawer-only" th:text="#{common.new}">신규</button>
        </div>
        <div id="charGrid" class="hb-grid-host"></div>
    </section>

    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{common.new}">신규</button>
            <button type="button" id="nextBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{mstChar.next}">같은 품목 다음 번호</button>
            <button type="button" id="saveBtn" th:if="${actions.contains('SAVE')}" th:text="#{common.save}">저장</button>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="formMode" class="hb-muted" th:text="#{mstChar.selectOrNew}">왼쪽에서 특성을 고르거나 신규를 누르세요.</p>

        <form id="charForm" class="hb-form" autocomplete="off">
            <label><span th:text="#{mstChar.col.charType}">유형</span>
                <select data-field="charType" data-hb="select" data-code="CHAR_TYPE" data-help-key="mst-char.charType"></select></label>
            <label><span th:text="#{mstChar.col.itemCd}">품목 코드</span>
                <input data-field="itemCd" maxlength="40"></label>
            <label><span th:text="#{mstChar.col.itemNm}">품목명</span>
                <output id="itemNm" class="hb-output"></output></label>
            <label><span th:text="#{mstChar.col.procCd}">공정</span>
                <select data-field="procCd" data-help-key="mst-char.procCd"></select></label>
            <label><span th:text="#{mstChar.col.charNo}">특성 번호</span>
                <input data-field="charNo" maxlength="20" required data-help-key="mst-char.charNo"></label>
            <label><span th:text="#{mstChar.col.charNm}">특성명</span>
                <input data-field="charNm" maxlength="200" required></label>
            <label><span th:text="#{mstChar.col.dataType}">데이터 유형</span>
                <select data-field="dataType" data-hb="select" data-code="CHAR_DATA_TYPE"></select></label>
            <label><span th:text="#{mstChar.col.unitNm}">단위</span>
                <select data-field="unitCd" data-hb="select" data-code="MEAS_UNIT" data-blank="select"></select></label>
            <label><span th:text="#{mstChar.col.scale}">측정 자릿수</span>
                <input data-field="scale" data-hb="number" data-scale="0" data-min="0" data-max="6" data-pad="false" data-help-key="mst-char.scale"></label>
            <label class="hb-spec"><span th:text="#{mstChar.col.lsl}">하한</span>
                <input data-field="lsl" data-hb="number" data-scale="6" data-pad="false" data-negative="true"
                       data-min="-999999999999.999999" data-max="999999999999.999999"></label>
            <label class="hb-spec"><span th:text="#{mstChar.col.nominal}">공칭</span>
                <input data-field="nominal" data-hb="number" data-scale="6" data-pad="false" data-negative="true"
                       data-min="-999999999999.999999" data-max="999999999999.999999"></label>
            <label class="hb-spec"><span th:text="#{mstChar.col.usl}">상한</span>
                <input data-field="usl" data-hb="number" data-scale="6" data-pad="false" data-negative="true"
                       data-min="-999999999999.999999" data-max="999999999999.999999"></label>
            <label><span th:text="#{mstChar.col.specialCls}">특별특성</span>
                <select data-field="specialCls" data-hb="select" data-code="SPECIAL_CHAR" data-help-key="mst-char.specialCls"></select></label>
            <label><span th:text="#{mstChar.col.source}">출처</span>
                <select data-field="source" data-hb="select" data-code="CHAR_SOURCE"></select></label>
            <label><span th:text="#{mstChar.col.sortNo}">순서</span>
                <input data-field="sortNo" data-hb="number" data-scale="0" data-min="0" data-max="99999" data-pad="false"></label>
            <label><span th:text="#{mstChar.col.drawingNo}">도면 번호</span>
                <input data-field="drawingNo" maxlength="50"></label>
            <label><span th:text="#{mstChar.col.drawingRev}">도면 리비전</span>
                <input data-field="drawingRev" maxlength="10"></label>
            <label><span th:text="#{mstChar.col.useYn}">사용</span>
                <select data-field="useYn">
                    <option value="Y" th:text="#{yn.Y}">사용</option>
                    <option value="N" th:text="#{yn.N}">미사용</option>
                </select></label>
            <label class="hb-wide"><span th:text="#{mstChar.col.remark}">비고</span>
                <textarea data-field="remark" maxlength="1000" rows="2"></textarea></label>
        </form>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/master/char-mgt.js}"></script>
</body>
</html>
