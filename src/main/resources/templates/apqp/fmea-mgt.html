<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  PFMEA (apqp-fmea) — P6 APQP A1 (docs/41 4장).
  목록(hb.grid) → 상세: 머리(품목 × 라우팅 리비전·프로젝트·AP 규칙표) / 구조(공정 아이템 › 공정 단계 › 작업요소 4M) /
  고른 요소의 기능·고장(종류는 구조 수준이 정한다: 아이템 = 영향, 단계 = 형태, 작업요소 = 원인) / 고른 단계의 위험 분석표
  (고장 형태 → 영향 연결·원인별 예방·검출 관리·O·D, S·AP 는 서버 계산) / 고른 위험행의 조치.
  확정(APPROVE)하면 고칠 수 없고 새 리비전으로 고친다. 확정본의 조치 진행(완료·증빙)은 계속 적는다.
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<link rel="stylesheet" th:href="@{/css/views/apqp.css}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">PFMEA</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<section id="listView" class="apqp-list">
    <form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
        <label><span th:text="#{apqp.keyword}">번호·제목·품번</span><input name="keyword" maxlength="100"></label>
        <fieldset class="hb-seg">
            <legend th:text="#{apqp.col.status}">상태</legend>
            <label><input type="radio" name="status" value="" checked><span th:text="#{apqp.status.current}">현행</span></label>
            <label><input type="radio" name="status" value="DRAFT"><span th:text="#{apqp.status.DRAFT}">작성 중</span></label>
            <label><input type="radio" name="status" value="RELEASED"><span th:text="#{apqp.status.RELEASED}">확정</span></label>
            <label><input type="radio" name="status" value="ALL"><span th:text="#{common.all}">전체</span></label>
        </fieldset>
        <div class="hb-sp-actions">
            <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
            <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
        </div>
    </form>
    <div class="hb-toolbar">
        <button type="button" id="newBtn" th:if="${actions.contains('SAVE')}" th:text="#{apqp.fmea.new}">신규 PFMEA</button>
    </div>
    <div id="fmeaGrid" class="hb-grid-host"></div>
</section>

<section id="detailView" class="apqp-detail" hidden>
    <div class="apqp-head">
        <button type="button" id="backBtn" class="hb-btn-secondary" th:text="#{apqp.backToList}">← 목록</button>
        <h2 id="title"></h2>
        <span id="statusBox"></span>
        <span id="summary" class="hb-muted"></span>
    </div>
    <div class="hb-toolbar">
        <button type="button" id="saveHeadBtn" th:if="${actions.contains('SAVE')}" th:text="#{common.save}">저장</button>
        <button type="button" id="releaseBtn" class="hb-btn-secondary" th:if="${actions.contains('APPROVE')}" th:text="#{apqp.fmea.release}"
                data-help-key="apqp-fmea.release">확정</button>
        <button type="button" id="reviseBtn" class="hb-btn-secondary" th:if="${actions.contains('SAVE')}" th:text="#{apqp.fmea.revise}"
                data-help-key="apqp-fmea.revise">새 리비전</button>
        <button type="button" id="excelBtn" class="hb-btn-secondary" th:if="${actions.contains('PRINT')}" th:text="#{apqp.form.download}"
                data-help-key="apqp.form">엑셀 양식</button>
        <button type="button" id="flowBtn" class="hb-btn-secondary" hidden aria-expanded="false" aria-controls="flowBox"
                th:text="#{apqp.flow.btn}" data-help-key="apqp-fmea.flow">공정 흐름</button>
        <button type="button" id="docBtn" class="hb-btn-secondary" hidden th:text="#{apqp.doc.publish}"
                data-help-key="apqp.doc">QMS 문서로 올리기</button>
        <span id="docInfo" class="hb-muted" hidden></span>
        <!-- 되돌릴 수 없는 동작은 저장 줄 끝, 떨어진 자리(docs/40 P1 ④) -->
        <span class="apqp-gap"></span>
        <button type="button" id="deleteBtn" class="hb-btn-danger-outline" th:if="${actions.contains('SAVE')}" hidden th:text="#{apqp.fmea.delete}">작성 중 리비전 삭제</button>
    </div>
    <p id="aprNotice" class="hb-notice" role="status" hidden></p>
    <p id="routingNotice" class="hb-notice" role="status" hidden></p>
    <!-- 공정 흐름도 PFD(docs/41 13장 A5-1) — 저장 없음: 라우팅 + 이 PFMEA 위험행 + 관리계획서에서 그때 만든다 -->
    <section class="hb-sub" id="flowBox" hidden>
        <h3 th:text="#{apqp.flow.title}">공정 흐름도</h3>
        <p id="flowInfo" class="hb-muted"></p>
        <ol id="flowList" class="apqp-flow"></ol>
    </section>
    <!-- 11.9 라우팅 바꾸기(작성 중): 확정 라우팅 고르기 → 미리보기(짝·글자) → 적용(서버가 다시 계산) -->
    <section class="hb-sub" id="relinkBox" hidden>
        <h3 th:text="#{apqp.relink.title}" data-help-key="apqp.relink">라우팅 바꾸기</h3>
        <div class="apqp-inline">
            <select id="relinkSel" th:aria-label="#{apqp.relink.routing}"></select>
            <button type="button" id="relinkPreviewBtn" class="hb-btn-secondary" th:text="#{apqp.relink.preview}">미리보기</button>
            <button type="button" id="relinkApplyBtn" hidden th:text="#{apqp.relink.apply}">바꾸기</button>
        </div>
        <ul id="relinkList" class="apqp-change-list"></ul>
    </section>
    <div id="changeNotice" class="hb-notice" role="status" hidden>
        <p id="changeHead" class="apqp-change-head"></p>
        <ul id="changeList" class="apqp-change-list"></ul>
    </div>
    <p id="ownEcoNotice" class="hb-notice" role="status" hidden></p>
    <section class="hb-sub apqp-approval" id="aprBox" hidden>
        <h3 th:text="#{apqp.apr.title}" data-help-key="apqp.apr">결재 상신</h3>
        <div class="apqp-inline">
            <select id="aprUser" th:aria-label="#{apqp.apr.user}"></select>
            <select id="aprType" th:aria-label="#{apqp.apr.type}">
                <option value="APPROVE" th:text="#{apqp.apr.type.APPROVE}">결재</option>
                <option value="AGREE" th:text="#{apqp.apr.type.AGREE}">합의</option>
                <option value="REF" th:text="#{apqp.apr.type.REF}">참조</option>
            </select>
            <button type="button" id="aprAddBtn" class="hb-btn-secondary" th:text="#{apqp.apr.add}">+ 결재선</button>
        </div>
        <ol id="aprLines" class="apqp-apr-lines"></ol>
        <div class="hb-toolbar"><button type="button" id="aprSubmitBtn" th:text="#{apqp.apr.submit}">상신</button></div>
    </section>
    <details class="apqp-headform" id="headDetails">
        <summary th:text="#{apqp.fmea.head}">머리(품목·라우팅·규칙표)</summary>
        <form id="headForm" class="hb-form" autocomplete="off">
            <label><span th:text="#{apqp.col.itemCd}">품번</span><input data-field="itemCd" list="itemList" maxlength="40" required
                    data-help-key="apqp-fmea.itemCd"></label>
            <datalist id="itemList"></datalist>
            <label><span th:text="#{apqp.col.routing}">라우팅</span><select data-field="routingId" id="routingSel" data-help-key="apqp-fmea.routing"></select></label>
            <label class="hb-check apqp-create-only"><input type="checkbox" data-field="fromRouting" checked><span th:text="#{apqp.fmea.fromRouting}">라우팅 단계로 시작</span></label>
            <label class="hb-wide"><span th:text="#{apqp.col.title}">제목</span><input data-field="title" maxlength="200" required></label>
            <label><span th:text="#{apqp.col.project}">프로젝트</span><select data-field="projId" id="projSel"></select></label>
            <label><span th:text="#{apqp.col.apSet}">AP 규칙표</span><select data-field="apSetId" id="apSetSel" data-help-key="apqp-fmea.apSet"></select></label>
            <label><span th:text="#{apqp.col.drawingRev}">도면 리비전</span><input data-field="drawingRev" maxlength="30"></label>
            <label class="hb-wide"><span th:text="#{apqp.col.team}">팀</span><input data-field="team" maxlength="500"></label>
            <label class="hb-wide"><span th:text="#{apqp.col.scope}">범위</span><textarea data-field="scope" maxlength="1000" rows="2"></textarea></label>
        </form>
    </details>

    <div class="apqp-work" id="work">
        <section class="apqp-tree">
            <h3 th:text="#{apqp.fmea.structure}">구조</h3>
            <div class="hb-toolbar apqp-edit">
                <button type="button" id="addStepBtn" class="hb-btn-secondary" th:text="#{apqp.fmea.addStep}">+ 공정 단계</button>
                <button type="button" id="addElemBtn" class="hb-btn-secondary" th:text="#{apqp.fmea.addElement}">+ 작업요소</button>
                <button type="button" class="hb-btn-ghost" data-move="UP" th:text="#{apqp.moveUp}">위로</button>
                <button type="button" class="hb-btn-ghost" data-move="DOWN" th:text="#{apqp.moveDown}">아래로</button>
                <button type="button" id="deleteNodeBtn" class="hb-btn-danger-outline" th:text="#{apqp.remove}">삭제</button>
            </div>
            <ul id="tree" class="apqp-tree-list" role="tree"></ul>
        </section>
        <section class="apqp-node">
            <h3 id="nodeTitle"></h3>
            <form id="nodeForm" class="hb-form" autocomplete="off">
                <label class="hb-wide"><span th:text="#{apqp.col.nodeNm}">이름</span><input data-field="nodeNm" maxlength="200"></label>
                <label id="stepBox"><span th:text="#{apqp.col.step}">라우팅 단계</span><select data-field="stepId" id="stepSel"></select></label>
                <label id="m4Box"><span th:text="#{apqp.col.m4}">4M</span><select data-field="m4" id="m4Sel"></select></label>
            </form>
            <div class="hb-toolbar apqp-edit"><button type="button" id="saveNodeBtn" class="hb-btn-secondary" th:text="#{common.save}">저장</button></div>
            <h4 th:text="#{apqp.fmea.funcs}">기능 · 고장</h4>
            <div id="funcs"></div>
        </section>
    </div>

    <section class="apqp-risk">
        <h3 id="riskTitle" th:text="#{apqp.fmea.risk}">위험 분석</h3>
        <p id="riskHint" class="hb-muted" th:text="#{apqp.fmea.pickStep}">구조에서 공정 단계(또는 그 작업요소)를 고르세요.</p>
        <div class="apqp-scroll">
            <table class="hb-cmp-table apqp-risk-table" id="riskTable" hidden>
                <thead><tr>
                    <th th:text="#{apqp.col.fm}">고장 형태</th>
                    <th th:text="#{apqp.col.fe}">고장 영향 (S)</th>
                    <th th:text="#{apqp.col.fc}">고장 원인</th>
                    <th th:text="#{apqp.col.prevCtrl}">예방 관리</th>
                    <th>O</th>
                    <th th:text="#{apqp.col.detCtrl}">검출 관리</th>
                    <th>D</th>
                    <th>S</th>
                    <th>AP</th>
                    <th th:text="#{apqp.col.special}">특별특성</th>
                    <th th:text="#{apqp.col.actions}">조치</th>
                </tr></thead>
                <tbody></tbody>
            </table>
        </div>
        <section class="hb-sub" id="riskBox" hidden>
            <h4 id="riskBoxTitle"></h4>
            <form id="riskForm" class="hb-form" autocomplete="off">
                <label class="hb-wide"><span th:text="#{apqp.col.prevCtrl}">예방 관리</span><input data-field="prevCtrl" maxlength="500"></label>
                <label><span th:text="#{apqp.col.occ}">발생도 O</span><input data-field="occ" inputmode="numeric" maxlength="2" class="apqp-rating"
                        data-help-key="apqp-fmea.occ"></label>
                <label class="hb-wide"><span th:text="#{apqp.col.detCtrl}">검출 관리</span><input data-field="detCtrl" maxlength="500"></label>
                <label><span th:text="#{apqp.col.det}">검출도 D</span><input data-field="det" inputmode="numeric" maxlength="2" class="apqp-rating"
                        data-help-key="apqp-fmea.det"></label>
                <label><span th:text="#{apqp.col.special}">특별특성</span><select data-field="specialCls" id="specialSel"></select></label>
            </form>
            <div class="hb-toolbar apqp-edit">
                <button type="button" id="saveRiskBtn" class="hb-btn-secondary" th:text="#{common.save}">저장</button>
                <span class="apqp-gap"></span>
                <button type="button" id="deleteRiskBtn" class="hb-btn-danger-outline" th:text="#{apqp.fmea.deleteRisk}">위험행 삭제</button>
            </div>
            <h4 th:text="#{apqp.fmea.actions}">조치(최적화)</h4>
            <div class="apqp-scroll">
                <table class="hb-cmp-table" id="actionTable">
                    <thead><tr>
                        <th th:text="#{apqp.col.actionKind}">구분</th>
                        <th th:text="#{apqp.col.actionText}">조치</th>
                        <th th:text="#{apqp.col.owner}">담당</th>
                        <th th:text="#{apqp.col.due}">기한</th>
                        <th th:text="#{apqp.col.actionStatus}">상태</th>
                        <th th:text="#{apqp.col.newOd}">조치 뒤 O·D</th>
                        <th th:text="#{apqp.col.newAp}">조치 뒤 AP</th>
                    </tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <form id="actionForm" class="hb-form" autocomplete="off">
                <label><span th:text="#{apqp.col.actionKind}">구분</span>
                    <select data-field="actionKind">
                        <option value="PREVENT" th:text="#{apqp.action.PREVENT}">예방</option>
                        <option value="DETECT" th:text="#{apqp.action.DETECT}">검출</option>
                    </select></label>
                <label class="hb-wide"><span th:text="#{apqp.col.actionText}">조치</span><input data-field="actionText" maxlength="500"></label>
                <label><span th:text="#{apqp.col.owner}">담당</span><select data-field="ownerLoginId" id="ownerSel"></select></label>
                <label><span th:text="#{apqp.col.due}">기한</span><input type="date" data-field="dueDate"></label>
                <label><span th:text="#{apqp.col.actionStatus}">상태</span><select data-field="status" id="actionStatusSel"></select></label>
                <label><span th:text="#{apqp.col.doneOn}">완료일</span><input type="date" data-field="doneOn"></label>
                <label class="hb-wide"><span th:text="#{apqp.col.evidence}">증빙</span><input data-field="evidence" maxlength="500"></label>
                <label><span th:text="#{apqp.col.newOcc}">조치 뒤 O</span><input data-field="newOcc" inputmode="numeric" maxlength="2" class="apqp-rating"></label>
                <label><span th:text="#{apqp.col.newDet}">조치 뒤 D</span><input data-field="newDet" inputmode="numeric" maxlength="2" class="apqp-rating"></label>
            </form>
            <div class="hb-toolbar" id="actionTools">
                <button type="button" id="saveActionBtn" class="hb-btn-secondary" th:text="#{apqp.fmea.saveAction}">조치 저장</button>
                <button type="button" id="newActionBtn" class="hb-btn-ghost" th:text="#{apqp.fmea.newAction}">새 조치</button>
                <span class="apqp-gap"></span>
                <button type="button" id="deleteActionBtn" class="hb-btn-danger-outline" hidden th:text="#{apqp.fmea.deleteAction}">조치 삭제</button>
            </div>
            <!-- A3-5: 조치 → PMS 이슈(한 번 복사, 그 뒤 상태는 따로) -->
            <div class="hb-toolbar" id="issueTools" hidden>
                <span id="actionIssue" class="hb-muted"></span>
                <button type="button" id="toIssueBtn" class="hb-btn-secondary" hidden th:text="#{apqp.fmea.toIssue}"
                        data-help-key="apqp.toIssue">이슈로</button>
            </div>
        </section>
    </section>
</section>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/apqp/fmea-mgt.js}"></script>
</body>
</html>
