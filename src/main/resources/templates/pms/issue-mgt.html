<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/page :: head}"></head>
<!--
  이슈 (pms-issue) — PMS 4단계 (docs/32 PM4, D10). 가벼운 할 일·위험 목록 — 품질 문제(8D)는 QMS.
  등록은 누구나(열린 프로젝트), 고치기·진행·해결은 PM·담당·등록자, 종료는 PM. 연결 객체(품목·거래처·설비·자산)는 같은 회사 것만.
  품목·설비 화면에서는 이 화면을 ?objType=ITEM&objCd=품번 으로 열어 "연결 이슈" 를 본다(P1 화면은 고치지 않음, D9).
-->
<body class="hb-page hb-page-app" th:data-prog="${prog.progCd}" th:data-actions="${#strings.setJoin(actions, ',')}">
<link rel="stylesheet" th:href="@{/css/views/pms.css}">
<header class="hb-page-head">
    <h1 th:text="${prog.name}">이슈</h1>
    <div class="hb-page-tools">
        <button type="button" id="hbHelpBtn" class="hb-btn-secondary" aria-expanded="false" th:text="#{page.help}">도움말</button>
        <button type="button" id="hbFeedbackBtn" class="hb-btn-secondary" th:text="#{page.feedback}">의견 보내기</button>
    </div>
</header>

<form id="search" class="hb-search" data-hb="searchPanel" data-autofocus="true" autocomplete="off">
    <label><span th:text="#{pms.issueKeyword}">번호·제목·프로젝트</span><input name="keyword" maxlength="100"></label>
    <label><span th:text="#{pms.col.project}">프로젝트</span><select name="projId" id="projSearch"></select></label>
    <fieldset class="hb-seg">
        <legend th:text="#{pms.col.issueStatus}">상태</legend>
        <label><input type="radio" name="status" value="" checked><span th:text="#{pms.issue.openSet}">열린 이슈</span></label>
        <label><input type="radio" name="status" value="CLOSED"><span th:text="#{pms.issue.CLOSED}">종료</span></label>
        <label><input type="radio" name="status" value="ALL"><span th:text="#{common.all}">전체</span></label>
    </fieldset>
    <label><span th:text="#{pms.col.severity}">심각도</span><select name="severity" data-hb="select" data-code="PMS_ISSUE_SEVERITY" data-blank="all"></select></label>
    <label><span th:text="#{pms.col.issueType}">유형</span><select name="issueType" data-hb="select" data-code="PMS_ISSUE_TYPE" data-blank="all"></select></label>
    <label><span th:text="#{pms.col.objType}">연결</span>
        <select name="objType" id="objTypeSearch">
            <option value="" th:text="#{common.all}">전체</option>
            <option value="ITEM" th:text="#{pms.obj.ITEM}">품목</option>
            <option value="CUST" th:text="#{pms.obj.CUST}">거래처</option>
            <option value="EQUIP" th:text="#{pms.obj.EQUIP}">설비</option>
            <option value="ASSET" th:text="#{pms.obj.ASSET}">물리 자산</option>
                    <option value="LOT" th:text="#{pms.obj.LOT}">LOT</option>
        </select></label>
    <label><span th:text="#{pms.col.objCd}">연결 코드</span><input name="objCd" maxlength="60"></label>
    <label class="hb-check"><input type="checkbox" name="mine" value="true"><span th:text="#{pms.issue.mine}">내 담당</span></label>
    <div class="hb-sp-actions">
        <button type="reset" class="hb-btn-ghost" th:text="#{common.reset}">초기화</button>
        <button type="submit" class="hb-btn-secondary hb-btn-search" th:text="#{common.search}">조회</button>
    </div>
</form>

<div class="hb-split">
    <section class="hb-split-main">
        <div class="hb-toolbar">
            <button type="button" id="newBtn" th:if="${actions.contains('SAVE')}" th:text="#{pms.newIssue}">신규 이슈</button>
            <button type="button" id="excelBtn" class="hb-btn-secondary" th:if="${actions.contains('EXCEL')}" th:text="#{pms.excel}">엑셀 내려받기</button>
        </div>
        <div id="issueGrid" class="hb-grid-host"></div>
    </section>
    <aside class="hb-split-side" id="detail">
        <div class="hb-toolbar">
            <button type="button" id="saveBtn" th:if="${actions.contains('SAVE')}" th:text="#{common.save}">저장</button>
            <button type="button" class="hb-btn-secondary hb-drawer-close" data-hb-detail-close th:text="#{common.close}">닫기</button>
        </div>
        <p id="mode" class="hb-muted" th:text="#{pms.selectIssue}">왼쪽에서 이슈를 고르거나 신규를 누르세요.</p>
        <form id="issueForm" class="hb-form" autocomplete="off">
            <label class="hb-wide"><span th:text="#{pms.col.project}">프로젝트</span><select data-field="projId" id="projSel"></select></label>
            <label class="hb-wide"><span th:text="#{pms.col.taskNm}">작업</span><select data-field="taskId" id="taskSel"></select></label>
            <label class="hb-wide"><span th:text="#{pms.col.issueTitle}">제목</span><input data-field="title" maxlength="200" required></label>
            <label class="hb-wide"><span th:text="#{pms.col.detail}">내용</span><textarea data-field="detail" maxlength="2000" rows="3"></textarea></label>
            <label><span th:text="#{pms.col.issueType}">유형</span><select data-field="issueType" id="typeSel" required
                    data-help-key="pms-issue.type"></select></label>
            <label><span th:text="#{pms.col.severity}">심각도</span><select data-field="severity" id="sevSel"></select></label>
            <label><span th:text="#{pms.col.owner}">담당</span><select data-field="ownerLoginId" id="ownerSel"></select></label>
            <label><span th:text="#{pms.col.due}">기한</span><input type="date" data-field="dueDate"></label>
            <label><span th:text="#{pms.col.objType}">연결</span>
                <select data-field="objType" data-help-key="pms-issue.obj">
                    <option value="" th:text="#{pms.obj.none}">(없음)</option>
                    <option value="ITEM" th:text="#{pms.obj.ITEM}">품목</option>
                    <option value="CUST" th:text="#{pms.obj.CUST}">거래처</option>
                    <option value="EQUIP" th:text="#{pms.obj.EQUIP}">설비</option>
                    <option value="ASSET" th:text="#{pms.obj.ASSET}">물리 자산</option>
                    <option value="LOT" th:text="#{pms.obj.LOT}">LOT</option>
                </select></label>
            <label><span th:text="#{pms.col.objCd}">연결 코드</span><input data-field="objCd" maxlength="60"></label>
        </form>
        <p id="issueNote" class="hb-muted"></p>
        <section class="hb-sub" id="statusBox" hidden>
            <h2 th:text="#{pms.issueProgress}">진행</h2>
            <form id="statusForm" class="hb-form" autocomplete="off">
                <label class="hb-wide"><span th:text="#{pms.col.resolution}">해결 내용(해결 때 필수)</span>
                    <textarea data-field="resolution" maxlength="1000" rows="2"></textarea></label>
            </form>
            <div class="hb-toolbar">
                <button type="button" class="hb-btn-secondary" data-to="IN_PROGRESS" th:text="#{pms.issue.toInProgress}">진행 중으로</button>
                <button type="button" class="hb-btn-ghost" data-to="OPEN" th:text="#{pms.issue.toOpen}">열림으로</button>
                <button type="button" class="hb-btn-secondary" data-to="RESOLVED" th:text="#{pms.issue.toResolved}">해결</button>
                <button type="button" class="hb-btn-secondary" data-to="CLOSED" th:text="#{pms.issue.toClosed}">종료</button>
                <button type="button" class="hb-btn-danger-outline" data-to="REJECTED" th:text="#{pms.issue.toRejected}"
                        data-help-key="pms-issue.reject">기각</button>
                <button type="button" id="escalateBtn" class="hb-btn-secondary" th:text="#{pms.issue.escalate}"
                        data-help-key="pms-issue.escalate" hidden>시정조치로 올리기</button>
            </div>
        </section>
        <!-- 첨부(docs/32 4.15) — 플랫폼 첨부, 대상 pms-issue · I{id}. 닫힌 이슈·진행 중이 아닌 프로젝트는 잠김(서버) -->
        <section class="hb-sub" id="fileBox" hidden>
            <h2 th:text="#{pms.issue.files}">첨부</h2>
            <ul id="files" class="hb-files"></ul>
            <label id="filePick" hidden><span th:text="#{pms.issue.addFile}">파일 추가</span>
                <input type="file" id="fileInput"></label>
        </section>
    </aside>
</div>

<p id="msg" class="hb-msg" role="status"></p>
<aside id="hbHelp" class="hb-help" hidden></aside>

<th:block th:replace="~{fragments/page :: scripts}"></th:block>
<script th:src="@{/js/common/hb.dates.js}"></script>
<script th:src="@{/js/common/hb.numbers.js}"></script>
<script th:src="@{/js/common/hb.input.js}"></script>
<script th:src="@{/js/common/hb.grid.js}"></script>
<script th:src="@{/js/common/hb.page.js}"></script>
<script th:src="@{/js/views/pms/pms-ui.js}"></script>
<script th:src="@{/js/views/pms/issue-mgt.js}"></script>
</body>
</html>
