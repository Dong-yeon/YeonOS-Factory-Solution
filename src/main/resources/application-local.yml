# 로컬 개발: docker compose 로 띄운 PostgreSQL (docker-compose.yml)
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:yeonos}
    username: ${DB_APP_USER:yeonos_app}
    password: ${DB_APP_PASSWORD:}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:yeonos}
  thymeleaf:
    cache: false
    prefix: file:src/main/resources/templates/
  # 화면 틀은 src 에서 바로 읽는데 문구는 기동 때 한 번만 읽으면, 새 키를 쓴 화면이 ??키?? 로 보인다(2026-10-16).
  # 문구는 classpath(build/resources/main)에서 읽으므로 리소스를 다시 빌드하면(IntelliJ Build 또는 gradle processResources) 1초 뒤 반영
  messages:
    cache-duration: 1s
  web:
    resources:
      static-locations: file:src/main/resources/static/
      cache:
        period: 0
  devtools:
    restart:
      enabled: false

server:
  error:
    include-message: always

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.smarthappy: DEBUG
    org.flywaydb: INFO

happyboot:
  wms:
    print-allow-loopback: true   # 데모·화면 확인용 가짜 프린터(127.0.0.1). 운영 기본 false(docs/30 D6)
  cms:
    edge-allow-loopback: true    # 가짜 엣지 DIRECT 어댑터(127.0.0.1) — 운영 기본 false(docs/65 16.1)
  dev:
    comp-cd: DEMO
    admin-login-id: admin
    login-prefill: true      # 로그인 화면에 회사·아이디 미리 채움(비밀번호 제외, local 전용)
    # 화면 JS 는 위 static-locations 로 src 에서 바로 읽는다 — JS 문구(js.*·help.*)도 같은 src 에서 읽어야
    # git 으로 받은 뒤 리소스를 다시 빌드하지 않아도 새 키가 키 글자 그대로 보이지 않는다(2026-10-22 "모두 접기" 보고)
    messages-dir: src/main/resources
    admin-password: ${DEV_ADMIN_PASSWORD:}   # .env (커밋 금지)
