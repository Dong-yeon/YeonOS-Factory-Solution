help.wms-loc-check=Results of scanning a location's items with a PDA against the book location. Handle "other location" lines with [Correct] and other mismatches with [Confirm only].
help.wms-loc-check.helpWhy=Many picking failures come from stock placed in a different location than the book says. This checks only locations, often and lightly, unlike a full count.
