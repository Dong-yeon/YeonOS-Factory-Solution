help.qms-copq=Collects the cost of poor quality (COPQ) per month in four categories: prevention, appraisal, internal failure and external failure. A management estimate, not an accounting ledger.
help.qms-copq.helpWhy=Improvement priorities need defects expressed in money. Scrap, rework and sorting quantities already live in NCR dispositions, so multiplying by the item standard price gives an estimate.
help.qms-copq.helpWhen=Open after month-end before the quality meeting. Item standard prices are entered in Item master (in ERP when ERP owns items).
help.qms-copq.helpDo=Pick the from and to months and press [Search].\nIf ledger lines show No price, enter the item's standard price in Item master (NCRs closed after that get an amount).\nFor costs not in the ledgers, enter month, category, item and amount under Manual costs and [Save].\n[Excel] downloads ledger lines and manual costs in one sheet (pivot by kind, category and month to get the monthly totals).
help.qms-copq.helpNote=Amount = disposition quantity × standard price when the NCR was closed. Changing the price later does not change past months.\nWithout a price the amount is left blank and only counted (never added as 0).\nProduction scrap, rework and repair use the standard price at month end. Corrections count negative in the month they were made. The same defect can appear in both NCR dispositions and production results.
