prog.apsMrp=Material requirements planning (MRP)
policy.APS_MRP_OUT_DAYS=MRP reschedule-out tolerance (days) — an open work order or PO earlier than its first demand by more than this gets a "push out" message
valid.APS_MRP_TOO_LARGE=The MRP run is too large (up to {0} planned items and {1} planned orders). Shorten the horizon or check the MPS and planning parameters.
valid.APS_MRP_BOM_LOOP=The BOM loops or is too deep (item {0}). Check the BOM.
help.aps-mrp=Explodes the BOM level by level from the firmed MPS, the remaining materials of open work orders and safety stock, and proposes planned orders: what to make or buy, when and how much. It does not create work orders or purchase requisitions.
help.aps-mrp.horizonDays=MRP horizon (7 to 92 days). The first day is always the plant today. Demand and supply outside the horizon are left out.
help.aps-mrp.helpWhy=The MPS plans finished goods only. When to prepare semi-finished goods and raw materials shows up only by walking down the BOM, netting stock, work orders and POs, and offsetting by lead time. Without it, shortages appear only after work orders exist.
help.aps-mrp.helpWhen=Run after firming the MPS and before creating work orders or purchase requisitions. Run again after a large order or PO change.
help.aps-mrp.helpDo=[New MRP] plant and days, then [Calculate] creates a new run (work orders and POs do not change)\nCheck late planned orders (lead time too short) in the planned order table\nReview pull-in, push-out, cancel and reduce messages and fix them in the work order or PO screens\nPick an item to see its stock/requirements list, pick a line to follow pegging (which order or work order it came from)
help.aps-mrp.helpNote=Existing stock, work orders and POs are used first; a late supply is assumed to be pulled in and reported as a "pull in" message. Planned orders appear only when that is not enough.\nLot rules, safety stock and in-house lead times come from planning parameters; purchase lead time, MOQ and multiples come from the supply source.\nTurning planned orders into work orders or purchase requisitions is the next step, chosen by a person.
