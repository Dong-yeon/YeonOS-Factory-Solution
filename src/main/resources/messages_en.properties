# ---------- Home business flow map (home-flow-map, docs/46 ch.12) ----------
prog.homeFlowMap=Business flow map
flowMap.flow=Flow
flowMap.f0=F0 Master data setup
flowMap.f0.desc=The base of every flow. Register plants, equipment hierarchy, items, BOMs, processes, routings and workers, referenced data first.
flowMap.f1=F1 Order → production → shipping
flowMap.f1.desc=The main flow. Sales order → create work order → production plan (APS) → release → POP results → production receipt → stock → shipping.
flowMap.f2=F2 Purchase request → receipt → incoming inspection
flowMap.f2.desc=Supplier → purchase request → PO, approval and release → delivery reply → ASN → receipt → incoming inspection → supplier evaluation.
flowMap.f3=F3 Nonconformance → containment → corrective action
flowMap.f3.desc=An NCR from inspection or SPC → containment → disposition → corrective action. Supplier faults continue to returns and claims.
flowMap.f4=F4 Equipment — breakdowns and prevention
flowMap.f4.desc=Breakdown report → maintenance work order, checklist → PM plan → check run, equipment state → downtime review → KPI.
flowMap.f5=F5 Engineering change
flowMap.f5.desc=ECR → ECO → 4M change → approval → apply (BOM and routing released) → first article and setup check.
flowMap.f6=F6 New product development (APQP·PPAP)
flowMap.f6.desc=Project → PFMEA → control plan → inspection plan → PPAP (ECO) → deliverables and gate review.
flowMap.f7=F7 Inventory operations
flowMap.f7.desc=Labels and locations → stock → moves and counts → ledger correction → period close.
flowMap.f8=F8 System administration
flowMap.f8.desc=Company → departments and users → auth groups → menus → policies, codes, numbering → daily work (home, approvals, inbox) → review (logs, feedback, usage).
