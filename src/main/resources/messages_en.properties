help.sys-module=Turn on or off the business modules (production, quality, warehouse, equipment, ...) this company uses. Modules that are off are hidden from menus, screens, APIs and terminals.
help.sys-module.helpWhy=Keeps unused module screens out of the menu so people see only what the company actually uses.
help.sys-module.helpWhen=Open when deciding which modules to use at rollout, or when starting or stopping a module.
help.sys-module.helpDo=[In use] Switch a module on or off. If a required module is off, a note appears below and saving is blocked.\n[Save] Save the settings. Refresh to update the menu.\n[Reload] Discard unsaved changes.
help.sys-module.helpNote=Turning off only hides; data is not deleted and shows again when turned back on.\nThe administrator group also cannot open screens of modules that are off.\nRequired modules (e.g. quality needs production and warehouse, purchasing needs warehouse) are not turned on automatically. Turn them on yourself.
