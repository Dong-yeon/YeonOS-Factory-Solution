help.home-flow-map.helpDo=[Flow] Places the screen boxes of that flow in step order — when a row is full the next row continues backwards (a snake shape), and the whole flow is fitted on screen without scrolling.\nClick a box (Enter or Space) = select — its incoming and outgoing lines are highlighted and the summary band below the map shows what, why, when, main actions and previous/next screens. [Clear selection] or Esc clears it.\n[Open screen] in the summary = open that screen in a tab. Tabs open only with this button (not by double-click).\n[Collapse summary] Leaves only the summary header and gives the map more room. [Expand summary] brings it back.\nDrag a box (or arrow keys, larger steps with Shift) to move it. The layout is remembered on this device.\n[−] [Fit] [+] Zoom out and in. [Fit] fits the screen again.\n[Lines to show] Turns skip and back lines on or off.\n[Reset layout] Puts the boxes of this flow back in their original places.
help.home-flow-map.helpNote=Grey dashed boxes are screens you cannot search. You can select them but [Open screen] is disabled.\nThe layout is remembered only in this browser — another PC starts from the original places.\nLines come from the same source as the previous and next screens in each screen help.

