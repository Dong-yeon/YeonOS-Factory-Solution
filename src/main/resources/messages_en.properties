help.qms-lot-trace.direction=Forward = LOTs and shipments this LOT went into (recall scope); backward = LOTs and suppliers this LOT was made from (finding the cause).
help.qms-lot-trace.lotNos=Paste the problem LOT numbers (raw material, semi-finished or finished). Split by line breaks or commas; duplicates count once. Up to 100.
help.qms-lot-trace.depth=How many genealogy levels to follow (0–10; down for forward, up for backward). 0 shows only the LOT itself.
help.qms-lot-trace=Follows a problem LOT down its genealogy (consume, split, merge, rework…) and shows on one screen which customers received it in which shipments, and where it is still in stock.
help.qms-lot-trace.helpWhy=During a recall or claim, piecing together who to contact from ledger queries by hand misses things. Joining genealogy and shipments shows contacts and remaining stock at once.
help.qms-lot-trace.helpWhen=Open when a customer claim, a supplier material defect or an internal NCR has identified a problem LOT.
help.qms-lot-trace.helpDo=Paste LOT numbers, choose direction and depth, and press [Search].\nForward: the customer summary is the contact list. Download the shipments with [Excel] for customer contact.\nBackward: narrow down causes with the supplier summary and origin LOTs, then use [Trace forward from origin LOTs] to find other shipments that used the same origin LOTs.\nA yellow line means the genealogy hit a limit; split the LOTs and search again.
help.qms-lot-trace.helpNote=This screen changes nothing. Block remaining stock with [Open containment] (per item, these LOTs pre-checked) and register shipped ones with [Claim NCR] on the shipment line — both on their own screens.\nShipment quantities are net of cancelled shipments (cancelled shipments do not appear). Reversed genealogy is not followed.

