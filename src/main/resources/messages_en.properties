help.sys-outbox=See whether integrations sent to ERP, label printers, mail and supplier notices went out, and retry or close the failed ones.
help.sys-outbox.helpWhy=Integrations are saved with the business change and sent separately in the background. When the other side is down they are retried a set number of times and then stop as failed — find and handle those here.
help.sys-outbox.helpWhen=Open it when the home card "Integration failures" shows a number, after ERP or a printer comes back, or when a supplier says a mail did not arrive.
help.sys-outbox.helpDo=[Retry] sends a failed message again from the start (the receiver drops duplicates by message ID).\n[Close manually] closes it with a reason when it was handled another way or is no longer needed. It leaves the failure count; the record stays.\n[Open print history] opens the label print history for label prints.
help.sys-outbox.helpNote=Personal data in the request is masked on screen only — a retry sends the original.\nTurn on the company policy "Require approval to close failed integrations manually" to route closes through approval.
help.sys-outbox.status=Failed = stopped after all tries. Closed manually = closed by a person with a reason (not the same as sent). Canceled = withdrawn by a business screen before sending.
help.sys-outbox.bizKey=Search by the start of the business number (shipment, PO, print job number, etc.).
help.sys-outbox.retry=Only failed messages can be retried. The try count is reset to 0 and it is sent right away.
help.sys-outbox.closeReason=Write why it is closed (e.g. entered in ERP by hand, not needed after order cancel). It stays in the audit record.

