help.cms-dashboard.wait=Waiting = report to start, repair = start to finish, downtime = equipment downtime recorded on the work order, labour = sum of labour lines. Averages are divided by the number of work orders that have the value.
help.cms-dashboard.mtbf=MTBF/MTTR (state) are state-ledger values from the collector (same as equipment KPI); MTBF/MTTR (WO) are calendar-based values from work orders, only for equipment without a collector. Each equipment shows only one of the two.
policy.CMS_REPEAT_FAIL_DAYS=Repeat failure interval (days): a failure of the same equipment with the same cause within this many days counts as a repeat (failure analysis of the equipment and production dashboard)
