help.cms-counter=Counts shots, cycles or run hours of equipment, molds and jigs. Enter the current gauge value and the difference from the previous value becomes the increment; the total is the sum of increments. Readings are never edited; void them from the latest. If a usage-based PM plan exists, its check is created as soon as the total reaches the due usage. Shots and cycles from production results (divided by units per cycle) and running hours from collected production intervals are added automatically every hour (only after the counter was created) and appear as "Automatic" in the history.
help.cms-counter.scale=Decimal places of the values (1 for 0.5-hour run time). Fixed after creation.
help.cms-counter.gaugeValue=The value shown on the gauge now. The first value is the baseline (increment 0); if the gauge was reset or replaced and the value went down, check reset. Enter usage from before the system as an increment.
help.cms-pm-plan.cycleType=Calendar = date interval; Usage = every time the target counter total (shots, run hours) grows by the interval. Fixed after creation.
help.cms-pm-plan.counterCd=An active counter of the target (equipment or mold). Create counters on the Usage counters screen.
help.cms-pm-plan.anchorUsage=The total at which the first check is due. Blank = current total + interval.
help.cms-pm-plan.usageLead=Create the check this much before the due usage (smaller than the interval). On time = total at completion is at most the due usage.
