cms.kpi.col.woFailures=Failures (WO)
cms.kpi.col.woMtbf=MTBF (WO, h)
cms.kpi.col.woMttr=MTTR (WO, min)
cms.kpi.col.mtta=Mean response (min)
help.cms-kpi.wo=Only for equipment without a collector, calculated from finished breakdown work orders. MTBF (WO) = (calendar time of the period - total downtime) / failures, MTTR (WO) = total downtime / failures with recorded downtime. It is calendar based because run time is unknown, so it is shown separately from the state-ledger MTBF and MTTR.
help.cms-kpi.mtta=Mean response = average time from the breakdown report to the start of work (finished breakdown work orders with a start time). All equipment, with or without a collector.
prog.cmsDashboard=Equipment and production dashboard
help.cms-dashboard=Shows equipment performance (overview) and breakdown records (failure analysis) on one screen. The overview uses the same calculation as the equipment KPI screen (state ledger); the failure analysis groups finished breakdown work orders by cause, symptom or equipment. Both tabs share the conditions.
help.cms-dashboard.helpWhy=If failure codes are only entered and never summarised, you cannot tell which cause or equipment creates the downtime. Use the Pareto to find the top causes and see repeat failures and which part of the repair time (waiting or repair) is long.
help.cms-dashboard.helpWhen=Open it before a weekly or monthly maintenance meeting, or when MTTR or availability got worse on the equipment KPI screen and you want the cause.
help.cms-dashboard.helpDo=[Search] Choose plant, period, equipment and equipment class (overview up to 31 days, failure analysis up to 92 days)\n[View] Overview = KPI tiles, OEE trend, downtime reasons, plan vs actual / Failure analysis = failure Pareto, repair time breakdown, repeat failures\nClick a Pareto bar or table row to list those breakdown work orders, then click a number to open the maintenance work order screen\n[Group] Switch the repair time breakdown between equipment and assignee
help.cms-dashboard.helpNote=A failure is a finished (done or closed) breakdown work order; failure time = downtime start (report time when no downtime was recorded). Cancelled and open ones, and improvement or preventive work orders, are excluded.\nMTBF and MTTR are shown separately for the state ledger (collector) and work orders. Work-order values are given only for equipment without a collector.\nThe repeat interval in days is the plant policy CMS_REPEAT_FAIL_DAYS.
help.cms-dashboard.keyword=Part of the equipment code or name. Applies to both tabs.
