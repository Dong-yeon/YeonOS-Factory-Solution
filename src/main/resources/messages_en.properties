js.sysIntegrity.why.DIGEST=Recomputes, from the start, the chain of daily hashes of the access and audit logs. Editing or deleting a past log breaks the chain from that day.
js.sysIntegrity.why.LEDGER=Ledgers (results, stock, lot genealogy) are never edited — corrections are reversal rows. Checks that every ledger table has its blocking trigger enabled and that the app account cannot update or delete.
js.sysIntegrity.why.ESIGN=Recomputes the content hash kept at signing from the current content. A difference means the content changed after signing (this can be normal, so it is a warning).
js.sysIntegrity.why.AUDIT=Checks that every company data table has the audit trigger that records who changed what and when. Exceptions with a documented reason (append-only ledgers, logs) are not counted.
