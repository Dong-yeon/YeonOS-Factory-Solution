help.aps-mps.lotRule=Lot-for-lot: exactly the shortage / Multiples: rounded up to multiples of the lot quantity / Minimum: at least the lot quantity even for a small shortage.
help.aps-mps.helpWhy=Decides which finished goods to make, when and how many, before work orders are created. Without it, work orders are made by feel and you cannot see in advance the days where forecast and orders pile up or stock runs out.
help.aps-mps.helpWhen=In the order-to-shipment flow, calculate after forecasts and orders arrive and before creating work orders. Usually calculate and firm weekly, and recalculate when a large order comes in.
help.aps-mps.helpDo=[New item] Register the items to plan (safety stock and lot rules are on the Planning parameters screen)\n[New MPS] [Calculate] Builds a new draft from demand and supply (work orders do not change)\nEdit the plan line and [Save] — frozen-fence cells need a reason\n[Firm] Makes it the current MPS of the plant (the previous firmed one is superseded)
help.aps-mps.helpNote=Within the frozen fence (policy APS_MPS_FENCE_DAYS, default 7 days) planned quantities carry over from the current firmed MPS even when recalculated.\nWork orders and purchase requests are created by people in the next step (MRP, planned orders).
