help.cms-kpi=Availability, performance, quality, OEE, MTBF, MTTR and PM compliance from collected equipment state intervals, production results and preventive maintenance records. Line and plant totals add time and quantity first and then divide, so they differ from the average of equipment ratios. A period that includes today counts only up to now.
help.cms-kpi.planned=Collected time minus communication loss, non-scheduled time (NST) and planned downtime (SDT). Categories changed in the downtime review are applied.
help.cms-kpi.performance=Standard cycle of the work-order process (seconds, divided by units per cycle) × produced quantity ÷ running time. Empty if any result comes from a process without a standard cycle. Corrected results are left out, and results entered without equipment are not in equipment KPIs.
help.cms-kpi.oee=Time to make the good units at standard cycle ÷ planned time (availability × performance × quality on summed figures).
help.cms-kpi.unknown=Communication loss plus time with no collected record at all. Excluded from planned time and shown separately. Equipment without a collector gets no time-based indicators.
help.cms-kpi.basis=Confirmed results = per-item standard cycle of the work order process × confirmed output (default). Collected counts = good/scrap counts sent by the equipment (net of corrections) × the ideal cycle on the equipment profile — performance/OEE stay blank if any equipment has no ideal cycle. With mixed items on one machine the count basis is an approximation. Time figures (availability, MTBF, MTTR) are the same on both bases.
