# ---------- Equipment link E0 (docs/65 16) ----------
prog.cmsEquipLink=Equipment Link
help.cms-equip-link=For each machine, set who speaks for it (collector or edge) and how it connects (direct = on-premises, edge = SaaS), and watch link status, machine state (PackML), commands, link events and received raw messages. The server judges link status from last receipt + interval × missed count (company policy).
help.cms-equip-link.helpWhy=Received messages must be stored first and processed separately so the sender is never blocked, and "nothing arrived" (a lost link) must become an event so a silently stopped machine is not missed. Commands that write to machines must record intent, write, read-back and result so every change can be explained.
help.cms-equip-link.helpWhen=Open it when connecting a new machine to an edge or adapter, when a lost-link or conflict alarm arrives, or when a setpoint must be changed remotely.
help.cms-equip-link.helpDo=[Search] See link and machine state by plant and machine\n[Save] Set connection mode, device, heartbeat interval and command writing on/off\n[Save tag] Set writable logical tags, value range and interlock (machine states that allow writing)\n[Send command] Separate permission (FN1) — the edge checks again, and only a matching read-back after the write counts as done\n[Reprocess] Put a quarantined raw message back to pending
help.cms-equip-link.helpNote=A command with no result before the timeout is "unknown" — it may already be written, so it is never resent automatically. Check on site, then press [Resolve].\nConflicts (same business key, different content) are not processed and are kept as evidence.
help.cms-equip-link.connMode=Direct (on-premises) = the server sends commands to the machine adapter on the factory LAN. Edge (SaaS) = an edge inside the factory connects out and pulls commands. Receiving works the same in both.
help.cms-equip-link.terminalCd=The collector that speaks for this machine (register it in POP terminal management as type "collector"). State sent for this machine by any other device is rejected.
help.cms-equip-link.adapterUrl=Direct mode only — the adapter address commands are sent to (private ranges only). The address is checked again on every send.
help.cms-equip-link.hbSec=How often the edge sends a heartbeat for this machine. Beyond interval × missed count (company policy) the link is judged lost.
help.cms-equip-link.writeEnabledYn=Commands can be sent only when this is on (writing is enabled separately — docs/05).
help.cms-equip-link.tagCd=The server holds no device addresses (Modbus etc.) — only logical names. The address mapping lives in the edge settings.
help.cms-equip-link.allowedStates=Writing is allowed only in these machine states (PackML, comma separated, blank = any). The server checks first; the edge and PLC have the final say.
