help.wms-asrs.helpWhy=Stock moves into storage only after the robot actually stores the container. This screen shows, as events, how far each container got and why it failed or was quarantined.
help.wms-asrs.helpWhen=The storing step of stock operations. Open it to put stock received at the infeed into containers and into storage.
help.wms-asrs.helpDo=[Containers] Pick a container and enter item, LOT and quantity per slot (within infeed stock).\n[Requests] Create an inbound request with container codes, or an outbound request with item, LOT and quantity, and press Send. Inbound posts when stored in the rack (STORED), outbound when handed over at the outfeed (HANDED_OVER).\n[Reconciliation] Pick a line that differs from the storage's full container list and adjust it now (approve permission, stock adjustment reason) or confirm ours is right.
help.wms-asrs.helpNote=Arrival at the port is not posted — only after storing in the rack.\nA sent request is not cancelled here (WES owns it).\nIf infeed stock is short the container is quarantined for a person to check (nothing is overwritten).\nAn outbound line completed with less than requested is closed as "Completed short" — request the rest again.\nOnly urgent requests (approve permission) send a priority to the storage; too many can slow everything down.
help.wms-asrs.ctrCds=Enter one container code per line (contents must be defined). A container can be in one request only.
help.wms-asrs.contents=E.g. 1,ZT-BRKT,L-001,10 — slot, item, LOT (empty if none), quantity. Missing slots are cleared (full overwrite).
