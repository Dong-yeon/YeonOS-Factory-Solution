js.help.dialogTitle={0} — Help
js.help.why=Why it exists
js.help.when=When to use it
js.help.does=Main actions
js.help.note=Watch out
js.help.flow=Before and after
js.help.prev=Before
js.help.next=Next
js.help.openTab=Open {0} tab
js.help.notInMenu={0} (not in my menu)
js.help.noLink=None
js.help.nowField=This field: {0}
js.help.fields=Fields on this screen ({0})
js.help.fieldMode=Field help on
js.help.fieldModeTip=Shows the description of each field in the corner as you move between fields. Press Help again to close it.
help.mst-cust.helpWhy=Sales orders pick a customer and purchase orders pick a supplier from these business partners. Without them you cannot start selling or buying.
help.mst-cust.helpWhen=A master data setup step done before the order-to-shipment and purchase-to-receipt flows. Open it when you start dealing with a new customer or supplier.
help.mst-cust.helpDo=[New] [Save] Saves the partner code, legal name, type and business number.\n[Add contact] [Save contacts] Manage contact persons as rows.\n[Stop using] Marks the selected partners as not in use. Nothing is deleted, so past orders stay intact.\n[Excel upload] Registers many partners at once after a preview check.
help.mst-cust.helpNote=There is no delete. You can only stop using a partner.
help.mst-item.helpWhy=BOMs, routings, work orders, stock, inspections and purchase orders all run on items. Without unit conversions, BOM release and receipt quantity conversion are blocked.
help.mst-item.helpWhen=Master data setup, before BOMs and routings. Open it when a new product or material appears or when you link ERP item codes.
help.mst-item.helpDo=[New] [Save] Saves the item code, name, type and unit. If ERP owns items in your company, creating items and changing ERP fields are blocked.\n[Add conversion] [Save conversions] Set factors from other units to the base unit, used by BOMs and receipts.\n[Save properties] Saves the property values of the item class.\n[Add external code] Links the item code used by an ERP or customer system.\n[Disable] Hides the item from new records. Past records stay.\n[Excel upload] Registers many items at once after a preview.
help.mst-item.helpNote=If ERP is set as the item owner, creating items is blocked.
help.mst-bom.helpWhy=Work order material needs, issue checks and LOT genealogy are based on the released BOM. Without a released BOM a work order gets no material requirements.
help.mst-bom.helpWhen=Master data setup right after items, and the new-revision step of the engineering change flow. Open it when you register a new product or when components or quantities change.
help.mst-bom.helpDo=[New] [Save] Create a draft BOM with parent item, base quantity and start date.\n[Add line] [Save lines] Enter components, quantities, units and alternate groups, only while draft.\n[Release] If the checks pass it becomes released and the previous release ends on the new start date. If the ECO-required policy is on, release happens only through an engineering change order.\n[New revision] Copies the selected revision into a new draft.\n[Compare] [Copy to another item] Show differences between two revisions or copy to another parent item.\n[Make obsolete] Marks the revision obsolete. It drops out of explosions and work orders.
help.mst-bom.helpNote=A released revision cannot be edited. Make a new revision instead.
help.mst-bom-tree.helpWhy=Explodes the released BOM all the way down and totals the requirement per leaf material. Use it to check materials before purchase requests and work orders.
help.mst-bom-tree.helpWhen=After releasing a BOM, and in the order-to-shipment flow before planning or work orders when you need material requirements.
help.mst-bom-tree.helpDo=[Search] Explodes the revision released on the base date for the production quantity.\n[Expand all] [Level 1 only] Open the whole tree or keep only the first level.\n[Excel] Downloads the current explosion.
help.mst-bom-tree.helpNote=Only released revisions are exploded.
help.mst-bom-where.helpWhy=Finds the parent items and finished products that use this part. It is the basis for the impact range of part discontinuation, 4M changes and recalls.
help.mst-bom-where.helpWhen=Open it in the nonconformance and engineering change flows to see impact. Check here before a bulk replace or an engineering change request.
help.mst-bom-where.helpDo=[Search] Walks up through every parent that uses the component. You can choose top level only or all revisions.\n[Expand all] [Level 1 only] Open or fold the tree.\n[Excel] Downloads the current result.
help.mst-bom-where.helpNote=By default only revisions released on the base date are searched.
help.mst-bom-replace.helpWhy=Replaces a discontinued or changed part in many BOMs at once instead of editing each. Results are draft revisions, so they go through the release checks again.
help.mst-bom-replace.helpWhen=BOM revision step of the engineering change flow. Open it after checking affected BOMs with where-used and before adding them to an engineering change order.
help.mst-bom-replace.helpDo=[Preview] Lists the BOMs that use the component and any unit differences.\n[Apply to selected BOMs] Applies the replacement to a draft revision of each selected BOM. If there is no draft, it copies the released one into a new draft.\nRelease each one in BOM management or by applying an engineering change order.
help.mst-bom-replace.helpNote=Applying does not release anything.
help.mst-plant.helpWhy=Without a plant you cannot create the equipment hierarchy, warehouses, shifts, routings or work orders. The plant time zone decides the work day and shift of each result.
help.mst-plant.helpWhen=First step of master data setup. Open it when you first set up the company or when a new site, such as an overseas plant, is added.
help.mst-plant.helpDo=[New] Opens an empty detail for a new plant.\n[Save] Saves the plant code, name and time zone. The code cannot be changed later.\nTurning off In use hides the plant from new records. It is refused while areas or warehouses under it are still in use.
help.mst-plant.helpNote=The plant code cannot be changed later.
help.mst-equip-hier.helpWhy=Results, stock and equipment states all record where they happened as a node of this tree. Without lines and cells you cannot set routing work centers or equipment locations, and without warehouses and locations you cannot set receiving or stock locations.
help.mst-equip-hier.helpWhen=Master data setup, right after the plant. Open it when you add a line or more warehouses and locations.
help.mst-equip-hier.helpDo=[Add top level] Creates an area or warehouse directly under the plant.\n[Add child] Creates a line, cell or location under the selected node.\n[Save] Saves the node. Changing its parent moves its children too.\nTurning off In use hides the node from new records. It is refused while children, routings or equipment still use it.\n[Expand all] [Level 1 only] open or fold the tree, and [Excel] downloads it.
help.mst-equip-hier.helpNote=There is no delete. You can only turn off In use.
help.mst-equip.helpWhy=Equipment states, alarms, preventive maintenance, breakdown reports and KPIs are all recorded against this equipment. Without it the equipment maintenance flow cannot start.
help.mst-equip.helpWhen=Master data setup after the equipment hierarchy, and the basis of the equipment maintenance flow. Open it when a new machine arrives or moves.
help.mst-equip.helpDo=[New] [Save] Saves the equipment code, class, plant and install location. An empty location means stored, not installed.\n[Classes] Create or edit equipment classes.\n[Save properties] Saves the property values of the equipment class.\n[Stop using] Hides it from new records. Blocked while a mold or jig is installed until it is removed.
help.mst-equip.helpNote=Equipment with a mounted mold or jig cannot be stopped until it is removed.
help.mst-asset.helpWhy=Keeps a ledger of physical molds, jigs and gauges and of which equipment they were mounted on and when. The usage counter needs this history to add shots from equipment output, and gauges become targets for calibration and GRR.
help.mst-asset.helpWhen=Master data setup after equipment, and in the equipment maintenance flow whenever a mold is changed.
help.mst-asset.helpDo=[New] [Save] Saves the asset code, type, target item and life in shots.\n[Install] Records an install on the selected equipment with the install time. One asset cannot be installed in two places at once.\nEnter a removal time to end an install, and mark a wrong entry as void instead of deleting it.\n[Stop using] Hides it from new records.
help.mst-asset.helpNote=Install history cannot be deleted. Mark a wrong entry as void.
help.mst-proc.helpWhy=Routing operations, inspection plans, SPC and control plans share the same process codes. Without processes you cannot build routings.
help.mst-proc.helpWhen=Master data setup, before routings. Open it when a new way of working or an outsourced process appears.
help.mst-proc.helpDo=[New] [Save] Saves the process code, name, category and outsourced flag. The outsourced flag cannot change once a released routing uses it.\nTurning off In use hides it from new routings, and draft routings using it cannot be released.\n[Search] Finds by part of the code or name.
help.mst-proc.helpNote=The process code cannot be changed later.
help.mst-routing.helpWhy=When a work order is released, the operations, work centers, standard cycle times and process parameters of the released routing are copied into it. Without a released routing a work order cannot be released.
help.mst-routing.helpWhen=Master data setup after processes and the equipment hierarchy, and the new-revision step of the engineering change flow. Open it when you define operations for a new product or when cycle times or parameters change.
help.mst-routing.helpDo=[New] [Save] Create a draft routing with item, plant and start date.\n[Add operation] [Save operations] Enter operation numbers, work centers, cycle times and parameters, only while draft.\n[Release] If the checks pass it becomes released and the previous release ends on the new start date. Work orders already released do not change. If the ECO-required policy is on, release happens only through an engineering change order.\n[New revision] Copies the selected revision into a new draft.\n[Make obsolete] Marks the revision obsolete. New work orders cannot pick it.
help.mst-routing.helpNote=A released revision cannot be edited. Make a new revision instead.
help.mst-char.helpWhy=Inspection plans, SPC charts, control plans and FMEA share the same characteristic keys. Without characteristics you cannot create inspection items or control charts.
help.mst-char.helpWhen=Master data setup after items and processes, and before the control plan in the new product development flow. Open it when a drawing is issued or a spec changes.
help.mst-char.helpDo=[New] [Save] Saves the characteristic type, process, balloon number, spec, decimals and special class.\n[Next no. of same item] Continues with the next balloon number for the same item.\nTurning off In use hides it from new inspection plans. Nothing is deleted, so past measurements stay.
help.mst-char.helpNote=The characteristic type cannot be changed later.
help.mst-defect.helpWhy=POP scrap and rework reasons, result views and nonconformance reports (NCR) are totaled by the same defect codes. Without codes the shop floor cannot pick a scrap reason.
help.mst-defect.helpWhen=A master data setup step done before POP goes live. Open it when you want to count a new defect symptom separately.
help.mst-defect.helpDo=[New] [Save] Saves a company defect code and name under a standard category. The code cannot be changed later.\nTurning off In use hides it from new POP and NCR entries.\n[Search] Finds by part of the code or name.
help.mst-defect.helpNote=The defect code cannot be changed later, because results keep the code.
help.mst-term.helpWhy=Collects the metric and term definitions set by the product together with the words your shop floor uses. Natural language search and translation will later use this dictionary to match words.
help.mst-term.helpWhen=Master data setup, when needed. Open it when you learn that the floor calls a metric by another name.
help.mst-term.helpDo=[Search] Finds by term code, name or alias.\n[Add alias] Attaches a company alias to the selected term. One word can point to only one term.\nThe term definitions themselves are set by the product and cannot be edited.
help.mst-term.helpNote=Term definitions are set by the product and cannot be edited.
help.mst-ext-system.helpWhy=Links the codes used by ERP, customer and supplier systems to our codes. Without it, external item codes do not appear in the ERP upload Excel or the shipment ERP file.
help.mst-ext-system.helpWhen=Master data setup, before starting ERP integration. Open it when you begin exchanging data with a new external system.
help.mst-ext-system.helpDo=[New] [Save] Saves the external system with its code, type and linked partner.\n[Add map] Links that system notation for units, item types or warehouses to our codes.\nExternal codes per item are added in item management.
help.mst-ext-system.helpNote=The system code cannot be changed later.
help.mst-class-prop.helpWhy=Keeps values that differ by item or equipment kind, such as thickness, tensile strength or max tonnage, without changing tables. Without a definition the property fields do not appear in item or equipment details.
help.mst-class-prop.helpWhen=Master data setup, before registering items and equipment. Open it when a new class or a new property to manage appears.
help.mst-class-prop.helpDo=[New item class] [Save class] Create an item class. The code cannot be changed later.\n[New property] [Save] Define a property of the selected class with type, unit, required flag and options. Code and type cannot be changed later.\nValues are entered in the property fields of item and equipment details.
help.mst-class-prop.helpNote=Property code and type cannot be changed later.
help.mst-shift.helpWhy=POP results and equipment states compute and store their work day and shift from this definition when saved. Without shifts you cannot split results by shift and planning has no available hours.
help.mst-shift.helpWhen=Master data setup after the plant and before POP goes live. Open it when the shift pattern or working hours change.
help.mst-shift.helpDo=[New] [Save] Saves the shift code, start, end and work day rule. Shifts in use cannot overlap.\nA time change applies to results recorded after it.\n[Check] Shows which work day and shift a given time falls into.
help.mst-shift.helpNote=Changing times does not recalculate the work day or shift of results already recorded.
help.mst-qual.helpWhy=When you mark which processes need a qualification such as welding or crane operation, POP warns or blocks unqualified workers from starting them. Without it anyone can start those processes.
help.mst-qual.helpWhen=Master data setup after processes and before registering workers. Open it when a new legal or in-house qualification is required.
help.mst-qual.helpDo=[New] [Save] Saves the qualification code, name and valid months.\n[Add process] Sets a process that needs this qualification and whether to warn or block.\nIf the plant policy caps the gate at warn, processes set to block also only warn.
help.mst-qual.helpNote=If the plant policy caps the gate at warn, block settings only warn.
help.mst-worker.helpWhy=Shop floor workers switch on POP with a badge and no login account. Without workers and badges you cannot record who started or reported work, and without held qualifications they hit the qualification gate.
help.mst-worker.helpWhen=Last step of master data setup, before POP goes live. Open it when someone joins or leaves, loses a badge or renews a qualification.
help.mst-worker.helpDo=[New] [Save] Saves the employee number, name, plant and linked login ID.\n[Set badge] [Clear badge] Set or remove the POP badge. It is stored encrypted and never shown again.\n[Set PIN] [Clear PIN] Set or remove the PIN checked after the badge. Setting it again unlocks a lockout.\n[Add qualification] Adds a held qualification with acquired and expiry dates. Renewals are added, not overwritten.\n[Check] Pick a process to preview the qualification gate result for this worker.
help.mst-worker.helpNote=Badges and PINs are never shown again. If lost, set a new one.
help.mst-work-cal.helpWhy=Sets date exceptions such as public holidays, summer breaks and extra working days on top of shifts. Without it, production planning and project schedules count days off as working days.
help.mst-work-cal.helpWhen=Master data setup after shifts. Open it every year to enter holidays and whenever extra work or a temporary closure is decided.
help.mst-work-cal.helpDo=Use the previous and next arrows to move between months.\n[New] [Save] Saves the date, plant, shift and whether it is off or working.\n[Disable] Turns the selected exception off. Results already recorded do not change.\n[Excel upload] Enters many days at once, such as a year of holidays, after a preview.
help.mst-work-cal.helpNote=Weekly days off are set in policy management, not here.
help.qms-sampling=Manages sampling plans that decide how many pieces to sample and how many defects to accept, plus the AQL tables your company owns. Inspection plan items pick a plan here, and inspection execution uses the lot quantity to compute the sample size and the accept and reject numbers.
help.qms-sampling.helpWhy=Without a sampling plan, inspection plan items cannot set the sample size (n) or the accept and reject numbers (Ac, Re), so inspection execution cannot tell how many pieces to measure or when a lot passes.
help.qms-sampling.helpWhen=The first step of master data preparation for inspection standards, before you create inspection plans. Use it when you need a new sampling method, load an AQL table for the first time, or check the sample size for a lot size.
help.qms-sampling.helpDo=[New] Opens an empty sampling plan form.\n[Save] Saves the plan as fixed quantity, 100 percent, percentage, or AQL table.\n[Calculate] Enter a lot quantity to preview n and Ac, Re for this plan.\n[Upload table 1] Uploads the lot size and inspection level to code letter table from the Excel template.\n[Upload table 2] Uploads the code letter and AQL to n, Ac, Re table from the Excel template.
help.qms-sampling.helpNote=AQL tables are not shipped with the product. Upload them before the AQL method can calculate.\nThere is no delete. Deactivate an unused plan so new inspection plans cannot pick it.\nChanging a plan does not change the sample size of inspections already started.
help.sal-order.helpWhy=Records what the customer wants, how many and by when. Without it you cannot tell which order a work order is for, or which order line a shipment filled.
help.sal-order.helpWhen=Step 1 of the order-to-shipment flow. Register an order when a customer PO arrives, and open it to give the customer a promise date or to check the remaining quantity after shipping.
help.sal-order.helpDo=[New] [Save] Creates the order for a customer and customer PO number (open)\n[Add line] Adds an item, quantity and due date line; a work order links to this line\n[Close] Ends a line you will not fill further; it also ends by itself once shipments cover the quantity\n[Cancel] [Cancel order] Cancels a line, or every open line, with a reason (lines already shipped cannot be cancelled)\n[Promise date] [Get answer] Only calculates when it would finish if added after current work orders (nothing is saved)\n[Excel upload] Uploads many orders at once
help.sal-order.helpNote=Saving an order does not create a work order.\nA work order must pick this order line to be linked.\nCancelling a line or the order cannot be undone.
help.qms-insp-plan=Manages revisioned inspection plans per item (or item class), inspection type, and process: what to check, with which method and gauge, and how many pieces. Only drafts can be edited, and releasing stamps the current characteristic specs onto the items so they no longer change.
help.qms-insp-plan.helpWhy=Without a released plan, inspection execution cannot start an inspection for the lot, and receipts in quality-linked plants are not held as waiting for inspection. Even if a characteristic spec changes later, this revision explains which standard was used at the time.
help.qms-insp-plan.helpWhen=Open it during master data preparation and in new product development (the step after the control plan) to set receiving, in-process, final, and first-article standards. Create a new revision when a design or 4M change alters a characteristic or method.
help.qms-insp-plan.helpDo=[New] Creates a draft plan for a target, inspection type, process, and start date.\n[Add item] Adds rows for characteristic, method, gauge class, and sampling plan, then [Save items] saves them at once.\n[Release] Moves the draft to released. Specs are copied onto the items and inspection execution uses this revision from that date.\n[New revision] Copies the plan into a draft revision. Releasing the new one ends the previous one automatically.\n[Make obsolete] Marks the plan obsolete so it no longer applies.\n[Link] Links the inspection standard document revision behind this plan.
help.qms-insp-plan.helpNote=Release and obsolete cannot be undone.\nChanging a characteristic spec does not change a released plan. Release a new revision to apply it.\nFor the same target, an item plan wins over an item class plan.
help.sal-forecast.helpWhy=Keeps every forecast a customer sends exactly as received, one version each. Without it there is no evidence of when and how the customer changed demand. Forecasts are not fed into production planning automatically.
help.sal-forecast.helpWhen=The first, reference step of the order-to-shipment flow. Upload each forecast file as it arrives, and open it before taking orders or creating work orders to see how demand changed from the last version.
help.sal-forecast.helpDo=[Excel upload] One file is saved as one new version per customer (earlier versions do not change)\n[Compare with previous] Shows what increased, decreased, appeared or disappeared against the version just before\n[Changes only] Keeps only the rows whose quantity changed\n[Lines of this revision] Shows the items, periods, quantities and firm flags of that version
help.sal-forecast.helpNote=Uploading a forecast does not feed production planning or work orders.\nReceiving the same period again does not overwrite; it creates a new version.
help.prd-wo.helpWhy=The instruction to the shop floor on what to make, how many, and with which routing and BOM. Without it nothing appears as a task on POP, and results, lots and receipts have nothing to attach to.
help.prd-wo.helpWhen=Steps 2 (create), 4 (release) and 7 (close processes, complete, close) of the order-to-shipment flow. Open it to create orders from customer orders, to release after applying the production plan, and to judge processes after POP has ended them.
help.prd-wo.helpDo=[New] [Save] Creates a work order from item, quantity, plan dates, routing, BOM and order line (planned)\n[Release] Copies the processes, parameters and material requirements as they are now and sends them to the floor (released); it now shows as a task on POP\n[Close process] Checks that input matches good, scrap, rework and repair for a process ended on POP, and finishes it (done)\n[Disposition] Splits pending rework or repair quantity into good (a new lot) and scrap\n[Complete order] Marks the order done once every process is done; sends results to ERP if the link is on\n[Close order] Closes an order whose receipts are finished (no receipts afterwards). [Cancel order] is only for orders not yet started, with a reason
help.prd-wo.helpNote=After release the item, quantity, routing and BOM cannot change.\nEnding a process on POP does not finish it. It is finished only by [Close process].\nA closed work order cannot receive goods.
help.wms-loc.helpWhy=Without usage, default status, mixing and pick sequence on warehouses and locations, receiving, moves, picking and production issue cannot tell which bin to use. Location labels for the bins are printed here too.
help.wms-loc.helpWhen=A setup step of inventory operations. Open it right after creating warehouses and locations in the equipment hierarchy, or when the use of a bin changes (receiving, inspection hold, staging, lineside).
help.wms-loc.helpDo=[Search] Loads the plant warehouse and location tree with saved attributes.\n[Save] Saves the attributes of the chosen bin. With apply to children checked, child bins get the same usage, mixing and default status.\n[Renumber child pick sequence] Sets pick sequence to 10, 20, 30 … in tree order.\n[Print labels] Queues location labels for the chosen bin (children optional). See the result in print history.\n[Check] Shows whether a scanned label reads as a location, an item or a GS1 code.
help.wms-loc.helpNote=Nodes are created and moved in the equipment hierarchy screen, not here.\nApply to children overwrites the existing values of child bins.\nA printer must exist in the label templates and printers screen before printing.
help.prd-lot.helpWhy=Links material and production lots through genealogy: what each was made from and where it went. Without it, when a defect appears you cannot find the products made from the same material or the customers affected.
help.prd-lot.helpWhen=Used across the order-to-shipment flow: register material lots before POP input, split or merge production lots, and hold or release lots in the nonconformance flow.
help.prd-lot.helpDo=[Register material lot] Creates a material lot with the supplier lot number so POP can scan it\n[Split] [Merge picked lots] [Relabel] Creates new lots and records genealogy (the original lot is not edited)\n[Rework] [Repair] Turns lot-level rework into a new lot of good units\n[Hold] [Release] Blocks a lot from input and receipt, or lifts a hold reason, with a reason (quality disposition holds are released only from quality)\nWhere it came from and Where it went follow the genealogy, and [Trace report] opens the one-page report
help.prd-lot.helpNote=A lot on hold cannot be used as input or received.\nHolds set by quality disposition cannot be released here.\nSplit, merge and relabel cannot be undone.
help.wms-label.helpWhy=Without the layout (ZPL) and a printer for location, lot, pallet and shipping labels, the receiving, shipping and location screens cannot print labels.
help.wms-label.helpWhen=A setup step of inventory operations. Open it when a new label printer arrives or a label layout changes.
help.wms-label.helpDo=[Load sample] Fills the body with the default ZPL of the chosen label type.\n[Preview] Shows the exact ZPL with values put into the placeholders.\n[Save] Saves the template or printer. Making another template the default clears the previous default.\n[Test print] Queues a test label on the chosen printer.
help.wms-label.helpNote=The label type cannot be changed after creation.\nOnly internal network addresses can be registered as printers.\nTest print is shown only with print permission.
help.sys-terminal.helpWhy=Binds shop-floor tablets, PDAs and collectors to this company, plant and work center so they work without a user login. Without it POP starts and results, and equipment state collection, cannot be received.
help.sys-terminal.helpWhen=During master data setup, and in the order-to-shipment flow before POP is first used. Open it when placing a new tablet, when one is lost or replaced, or when connecting a collector.
help.sys-terminal.helpDo=[New] [Save] Registers a terminal and shows its activation code (24 hours) or collector key only once\nEntering the company code and activation code on the tablet activation page turns that terminal on\n[Reissue activation code] Creates a new code and cuts off the current terminal at once\n[Revoke] Makes the terminal unusable for good (cannot be undone)
help.sys-terminal.helpNote=The activation code and collector key are shown only once.\n[Reissue activation code] cuts off the terminal in use at once.\n[Revoke] cannot be undone.
help.wms-print-job.helpWhy=Labels go through a queue and print later, so only this screen shows whether they really came out. This is where failed or lost labels are printed again.
help.wms-print-job.helpWhen=The label step of inventory operations. Open it when a label from the receiving, shipping or location screen did not come out or got damaged.
help.wms-print-job.helpDo=[Search] Finds print jobs by period, type and status. Status is waiting, sending, done or failed.\n[Reprint] With a reason and printer, queues a new job with the same content. The original job stays.
help.wms-print-job.helpNote=Reprinting lot, pallet and shipping labels needs approve permission.\nTwo copies of the same label can double-count stock. Remove the damaged label first.\nA print failure does not undo the receipt or shipment.
help.wms-stock.helpWhy=The only place that shows how much is on hand by item, location, status and lot right now. Shipping, moves, counts and production planning all work from this quantity.
help.wms-stock.helpWhen=The stock step of the production-to-shipping flow and the last step of receiving. Open it to see available stock before a shipment, or to run reconciliation when numbers look wrong.
help.wms-stock.helpDo=[Search] Lists matching stock cells. Choose a row to see its last 20 movements on the right.\n[Preview pick candidates] Enter a quantity and press [Calculate] to see which bins it would come from by the allocation strategy. Nothing is saved.\n[Run reconciliation] Checks that the ledger sum equals stock on hand and records the result.\n[Migrate production receipts] Moves earlier production receipts into the stock ledger once. Receipts already moved are skipped.
help.wms-stock.helpNote=Stock on hand cannot be edited directly. Use stock move and adjust or a stock count.\nPreviewing pick candidates does not reserve stock.\nReconciliation only reports mismatches. It never fixes them.
help.cms-state.helpWhy=Shows collector-reported equipment state as a daily bar so you can tell when it ran, stopped or lost contact. Without it downtime and communication loss cannot be told apart.
help.cms-state.helpWhen=During POP work in the order-to-shipment flow (equipment side) and the status check step of the equipment flow. Open it when equipment stopped for long, before reviewing downtime reasons, or to see whether collection was missed.
help.cms-state.helpDo=[Search] Loads the state of each machine for the chosen plant and date (blank means today)\nDay by equipment shows a colored bar per category; grey means unknown, not stopped\nState intervals shows category, reason and work order per interval; reasons are added afterwards in downtime review\nConnection log (offline, missed) shows collector disconnects and skipped sequence numbers
help.cms-state.helpNote=Grey intervals are not stops; the state is unknown.\nReasons cannot be added on this screen.\nAdd them in downtime review.
help.wms-trx.helpWhy=The source record of when, where and why stock moved. It is also the only way to correct a wrong receipt, move or return issue (reversal).
help.wms-trx.helpWhen=The correction step of inventory operations. Open it to trace why a quantity is off, or to undo a receipt, move or return issue confirmed by mistake.
help.wms-trx.helpDo=[Search] Finds ledger rows by period, location, item and type.\n[Reverse] Adds a new row with the opposite quantity. A move reverses its out and in rows together. A return issue reverses as a whole.\nReversing a purchase receipt row also lowers the PO received quantity.
help.wms-trx.helpNote=The original row is never deleted.\nRows in a closed month cannot be reversed. Adjust in the current month instead.\nRows from quality judgments or NCRs cannot be reversed here. Void them in the quality screens.
help.cms-equip-count.helpWhy=Shows the good and defect counts reported by collectors and fixes counts made wrong by duplicates or sensor faults. Without it POP result suggestions and equipment KPIs use the wrong numbers.
help.cms-equip-count.helpWhen=Around result confirmation on POP in the order-to-shipment flow, and before reading equipment KPIs. Open it when the counter value on POP looks wrong, or before finalizing period KPIs.
help.cms-equip-count.helpDo=[Search] Loads collector counts by plant, event-date period and equipment\nPick a row to see its quantity, collector and event time\n[Correct] Adds one row that subtracts the quantity, with a reason (the original row stays, once per row)\nThe Use counter suggestion on POP and equipment KPIs are recalculated including the correction
help.cms-equip-count.helpNote=A row can be corrected only once, and it cannot be undone.\nPOP results already confirmed do not change when a count is corrected.
help.prd-receipt.helpWhy=The production-side door that moves good lots from the last process into warehouse stock. Without it finished goods never reach stock and cannot be shipped.
help.prd-receipt.helpWhen=Step 8 of the order-to-shipment flow, after processes are closed and before the work order is closed. Open it when last-process good lots are ready to move to the warehouse, or to fix a wrong receipt.
help.prd-receipt.helpDo=Pick an in-progress or done work order on the left to see its lots and remaining quantities\n[Receive] Receives into a warehouse location with a quantity; stock is added at once and ERP is notified if the link is on\n[Correct] Records the opposite quantity with a reason (stock and ERP are reversed too, once only)\nLots on hold and closed work orders cannot be received
help.prd-receipt.helpNote=Receiving adds to stock immediately.\nA receipt can be corrected only once.\nAfter the work order is closed, receipts and corrections are not possible.
help.wms-move.helpWhy=The only screen where people move stock to another bin, change its status, or raise and lower quantities. A move not entered here is not in the books.
help.wms-move.helpWhen=The move step of inventory operations. Open it to feed materials to lineside, tidy bins, or adjust for damage or loss.
help.wms-move.helpDo=[Fill] Puts the scanned location, item or lot label into the empty fields.\nChoose move or status change, or adjust, as the task.\n[Confirm] Posts once to the ledger. A move is an out and in pair, an adjust is one row.\nThe today list shows moves and adjustments entered today at this plant.
help.wms-move.helpNote=An adjustment needs a reason.\nA lot on hold cannot move to another location. Only its status changes in place.\nIf confirmed by mistake, reverse it on the stock ledger screen.
help.prd-result.helpWhy=Brings the results entered on POP together in one place for the office. Without it you would have to check each POP terminal to see what was made and scrapped today or this week.
help.prd-result.helpWhen=Step 6 of the order-to-shipment flow, after results are confirmed on POP. Open it at the end of a shift, to check quantities before closing processes, or to see defects by worker or shift.
help.prd-result.helpDo=[Search] Loads results for a work-day period (corrected results are dimmed)\n[View] Groups by one by one, work order, operation, worker, or work day and shift (group totals are net of corrections)\n[Excel] Downloads what is shown\nResults are saved and corrected on POP under Today, not here
help.prd-result.helpNote=Results cannot be edited or deleted on this screen.\nChanging shift settings does not move the work day or shift of past results.
help.wms-rcv.helpWhy=Where arriving materials go into the books with a location and status and get an internal lot. Without receiving here there is no PO received quantity, no stock and nothing to inspect.
help.wms-rcv.helpWhen=The receiving step of the purchase-to-stock flow. Open it when supplier goods arrive and you scan the delivery note or supplier label.
help.wms-rcv.helpDo=[Find] Finds an announced delivery (ASN), and [Fill] sets the item, PO line, quantity and supplier lot.\n[Fill] Puts scanned location, item or GS1 labels into the fields.\nPick a PO line for a purchase receipt, or none for a material receipt without a PO.\n[Post receipt] Creates a new receipt lot and adds stock at that location and status. The PO received quantity rises too, and a lot label prints if a printer is chosen.
help.wms-rcv.helpNote=Items with an incoming inspection plan are fixed to awaiting inspection until judged.\nReceiving more than the PO allowance is refused.\nReverse a wrong receipt on the stock ledger screen.
help.prd-lot-report.helpWhy=Gathers the materials, workers, equipment, conditions, judgments, receipts and onward use of one lot on a single page. Without it, audits and claims mean stitching data together from many screens.
help.prd-lot-report.helpWhen=The end (tracing) of the order-to-shipment flow and the start of the nonconformance flow. Open it for a customer audit or claim, or to see the cause and reach of a defective lot.
help.prd-lot-report.helpDo=[Search] Scan or type a lot number to build the report\nWhere it came from (backward trace) goes back to the material and supplier lots used\nProduction, parameters, process close, equipment state and receipts show who made it, on which equipment and under which conditions (corrections dimmed, NG in red)\nWhere it went (forward trace) follows the lots this lot went into\n[Print] Saves it as a PDF
help.prd-lot-report.helpNote=Lot numbers are case-sensitive.\nCorrected records are not removed; they are shown dimmed.
help.wms-ship.helpWhy=Where stock is taken out of the warehouse for customer order lines. Only confirming here adds shipped quantity to the order, removes the stock and sends the shipment to ERP.
help.wms-ship.helpWhen=The last step of the order-to-shipping flow. Open it to ship orders that are due, or to reopen a shipment by scanning a pallet label.
help.wms-ship.helpDo=In [New], enter the customer, pick lines with [Load order lines] and [Save] to create a draft shipment.\nFill the bins for each line with [Suggest] or [Other bins] and [Confirm picks] to move stock to staging. The shipment becomes picking.\nBuild pallets with [New pallet], [Put selected picks] and [Close]. Closing adds an SSCC and a pallet label.\n[Confirm shipment] Removes the stock and raises the order shipped quantity (the line closes when fully shipped). The shipment becomes shipped.\n[Unpick selected] returns picks to their bins. [Cancel order] cancels a draft only.
help.wms-ship.helpNote=Only available stock can be picked. Lots awaiting inspection or on hold must be judged or released first.\nTo undo a confirmed shipment, use cancel shipment with approve permission.\nIn plants that require pallets, every pick must be on a closed pallet before confirming.
help.wms-rtn-issue=Ships out supplier returns confirmed in the purchasing return order screen. Find the order by return number, enter issue quantities per bin so the total equals the ordered quantity, and confirm once. Confirming removes the stock and marks the return as shipped.
help.wms-rtn-issue.helpWhy=A return order is only a purchasing decision. Issuing here is what removes the stock and marks the return as shipped. For a replacement return, the PO open quantity opens again.
help.wms-rtn-issue.helpWhen=The end of the nonconformance flow (supplier return) and the return issue step of inventory operations. Open it when purchasing confirms a return order and hands over the return label.
help.wms-rtn-issue.helpDo=[Search] Loads the return order and the bins it can be issued from by return number (an RTN label can be scanned).\n[Fill ordered qty] Spreads the ordered quantity over the bins in order.\n[Confirm shipment] Issues all bin quantities at once. Stock goes down and the return becomes shipped.
help.wms-rtn-issue.helpNote=Partial issue is not possible. The total must equal the ordered quantity.\nLots on hold are issued too.\nIf issued by mistake, reverse it on the stock ledger screen. The whole issue is undone and the return goes back to confirmed.
help.prd-erp-export.helpWhy=Lets a company without a direct ERP link download production results and receipts as a file to upload to ERP. Without it the same numbers must be typed into ERP by hand.
help.prd-erp-export.helpWhen=The end of the order-to-shipment flow, after work orders are completed and goods are received. Open it daily or monthly when posting results or receipts to ERP.
help.prd-erp-export.helpDo=[Search] Previews the rows to export by type (work order results by completion date, production receipts by receipt date) and period\nRows without an ERP item code mapping show a warning; fill the external ID mapping first\nEarlier exports overlapping this period shows who already exported the same period and when\n[Excel] Downloads the file and records the export (exporting again is not blocked, so make sure you do not upload twice)
help.prd-erp-export.helpNote=Exporting the same period again is not blocked.\nCheck earlier exports so nothing is uploaded to ERP twice.\nIf your company uses the automatic ERP link, uploading this file as well creates duplicates.
help.cms-fail-code.helpWhy=Without shared codes a maintenance work order cannot be finished, and failure patterns cannot be compared. The symptom buttons on the breakdown report are built from these codes.
help.cms-fail-code.helpWhen=Master data preparation. Set them once when equipment is introduced, and add codes when "other" starts to pile up in failure records.
help.cms-fail-code.helpDo=[New] Pick a type (symptom, cause, action) and create a code\n[Save] Change the name, top category, equipment class or order. Type and code cannot change\nTurning use off hides the code only from new reports and orders. Past records stay\n[Export to Excel] Download the list
help.cms-fail-code.helpNote=Type and code cannot change after creation. If wrong, turn use off and create a new one.\nCause codes need a top category.\nWith an equipment class set, the code is hidden for other classes and for molds and jigs.
help.pms-template.helpWhy=Define the company standard WBS, deliverables and gate checks once so projects do not start from scratch. Without it every project has its own schedule and required deliverables, and gate readiness cannot be compared.
help.pms-template.helpWhen=Step 1 of the new product development flow. Open it before creating projects, or when the company development procedure changes.
help.pms-template.helpDo=[New template] Creates an empty template with a base date (start date or SOP).\n[Create default APQP template] Creates a five-phase starting point with a gate per phase. If it exists, it opens.\n[Add sub-task] or [Add below] Adds tasks; the schedule is days from the base date.\n[Add] Adds deliverable slots to tasks and check items to gate tasks. They are copied when a project is created.\n[Save template] Saves the header. Projects already created do not change.
help.pms-template.helpNote=Changing a template does not update projects already created.
help.srm-supplier.helpWhy=Purchase orders, acknowledgements and evaluations are only possible for business partners registered as suppliers. Keeping certificates, supplied items and prices here makes the default order price and the certificate status come out right.
help.srm-supplier.helpWhen=Preparation step before the purchasing flow. Open it when you start trading with a new supplier, renew a certificate, change a price, or change the trade status after an evaluation.
help.srm-supplier.helpDo=[Register as supplier] Turns a purchase or dual-type business partner into a supplier (once only).\n[Save] Changes buyer, payment terms, currency and trade status. Blocked stops new orders and issuing.\n[Add certificate] Adds the certificate as a new row. Certificates close to expiry are marked as due soon.\n[Save item] Saves supplier part number, lead time, minimum order and priority.\n[Save price] Saves a price for a period. A new open-ended price closes the previous one on the day before.
help.srm-supplier.helpNote=A hold suggestion from an evaluation does not change the trade status. Change it here yourself.
help.cms-equip-profile.helpWhy=Without a criticality and a default owner per machine, a breakdown report has nobody assigned and key equipment cannot be told apart.
help.cms-equip-profile.helpWhen=Master data preparation, after equipment is registered or when the owner changes.
help.cms-equip-profile.helpDo=Pick a machine to see its profile (none means C, not key, no owner)\n[Save] Store criticality, key equipment flag and default owner. The owner becomes the default assignee when an order is accepted\n[Open history card] Go to the history card of that machine
help.cms-equip-profile.helpNote=The default owner is used only when an order is accepted with an empty assignee. Orders already accepted keep their assignee.\nA machine without a profile counts as criticality C and not key.
help.pms-project.helpWhy=Keeps the tasks, schedule, owners and progress of a project in one place so delays show up and can be compared with a baseline. The deliverable, gate, issue and work log screens all work on the projects and tasks made here.
help.pms-project.helpWhen=Steps 2 to 3 of the new product development flow. Open it to create a project from a template, and to update schedule and progress while it runs.
help.pms-project.helpDo=[New project] Creates a draft project from a template and a start date or SOP, copying tasks, deliverable slots and check items.\n[Change status] Moves draft to active, then on hold, closed or cancelled. Closed and cancelled projects cannot be changed.\n[Link ECO] Links the change order this project carries out. One order, one project.\n[Set baseline] Saves the current plan as a baseline. After that, changing planned dates needs a reason.\n[Push successors] Shows a plan that moves successors starting before their predecessor, and applies it after you confirm.
help.pms-project.approval=In companies with policy PMS_PROJ_APPROVAL on, start (draft → active) and close (active → closed) go through approval. The default approver is your department head (the first head going up from your department, skipping yourself); if there is none, the submitter picks. You can change or add lines before submitting. Close conditions (open tasks, required deliverables, issues) are checked at submit and again at approval; if they fail at approval, the approval does not go through. Project details, status and ECO link are locked during approval.
help.pms-project.copy=Creates a new project from the WBS of the open project. The task tree, types, planned hours, dependencies, deliverable definitions (required flag, blank form) and gate check items are copied; the schedule is shifted so the source first start moves to the new start date (required), keeping durations and gaps. Owners, actuals, progress, baselines, history and submissions are not copied.
help.pms-project.toTemplate=Creates a new template (anchor = start date) from this project. The task tree, types, relative schedule (days from the first start and durations), standard hours (planned hours of leaf tasks), dependencies, deliverable slots (required flag, blank form) and gate check items are carried over; owners, actuals, baselines and submissions are not. Requires template save permission and view permission on this screen.
help.pms-project.helpNote=A closed or cancelled project cannot be reopened.
help.srm-pr.helpWhy=Without an approval record of who asked to buy what and why, an order has no justification. Only lines of approved requests can be taken into a purchase order.
help.srm-pr.helpWhen=Step 1 of the purchasing flow. Request when the shop floor or production control needs an item by a date. Approvers open it when a request comes in.
help.srm-pr.helpDo=[Save] Saves the header and item lines as draft.\n[Request] Draft becomes requested. The need date must be after today.\n[Withdraw] Returns a requested request to draft.\n[Approve] / [Reject] Approves or rejects (reason required) a requested request. You cannot approve your own request.\n[Edit again] Returns a rejected request to draft.\n[Close] / [Cancel] Closes or cancels an approved request. A request already used by an order cannot be cancelled.
help.srm-pr.helpNote=A request is not closed automatically when fully ordered. Press [Close] yourself.
help.cms-equip-card.helpWhy=Breakdown, inspection, spare part and counter records of one machine live on different screens. Audits and handovers need them in one place.
help.cms-equip-card.helpWhen=The final review step of the equipment flow, when checking a machine that fails often or showing its history to a customer audit.
help.cms-equip-card.helpDo=[Search] Pick a machine and period to see the summary and history table\n[Open work order] Open the selected order on the maintenance work order screen\n[Export to Excel] Download the history table\nRead only. Change records on their own screens
help.cms-breakdown.helpWhy=Operators can report a breakdown at once and confirm the repair without having rights to process work orders.
help.cms-breakdown.helpWhen=Step 1 of the breakdown flow. Open it on the shop floor as soon as a machine stops or behaves oddly (a machine QR code can open it too).
help.cms-breakdown.helpDo=[Find] Search a machine or mold by code or name and pick it\nPress a symptom button or type the symptom, and choose Stopped if it stopped\n[Report] A breakdown work order is created in reported status for maintenance to accept\n[Confirm] When your report is finished, read the work done and confirm it (status becomes confirmed)
help.cms-breakdown.helpNote=A report alone does not start the repair. Maintenance must accept it first.\nYou see only your own reports. Reports made on POP cannot be confirmed here.\nPhotos are uploaded after the report is sent.
help.srm-po.helpWhy=The official record of what was ordered from the supplier, at what price and by when. Acknowledgements, advance shipping notices, purchase receipts and on-time delivery all start from an issued order.
help.srm-po.helpWhen=Step 2 of the purchasing flow. Create it when a request is approved or an item must be bought directly. Reopen it to revise when something changes after it was sent.
help.srm-po.helpDo=[Add from purchase requests] Adds lines with the remaining quantity of approved requests.\n[Save] Saves as draft. An empty unit price takes the price list value.\n[Submit for approval] / [Confirm] Goes through approval when required, otherwise becomes approved at once.\n[Issue] Issues an approved order. The issued copy is kept and the supplier is notified.\n[Revise] Returns an issued or acknowledged order to draft with the next revision number. A new acknowledgement is needed.\n[Close] / [Cancel] Closes an order that will receive no more, or cancels it with a reason. Cancelling an issued order notifies the supplier.
help.srm-po.helpNote=An issued order can be changed only by [Revise]. After a revision a new acknowledgement is needed.
help.srm-po-print=Shows the purchase order in a print layout. By default it is the last issued copy, exactly as sent to the supplier. Before issue or during a revision the current content is shown marked as draft. You can save it as PDF from the browser print window.
help.srm-po-print.helpWhy=Keeping or forwarding an order sent to the supplier on paper or as PDF needs a fixed layout rather than the working screen.
help.srm-po-print.helpWhen=End of step 2 of the purchasing flow, after the order is issued. Opens in a new window from [Print order] on the purchase order screen (not in the menu).
help.srm-po-print.helpDo=[Print] Hides the toolbar and opens the browser print window, where you can save as PDF.\n[Excel] Downloads the same content as a fixed-layout Excel file.\nOpened with a revision number, it shows the issued copy of that revision.
help.srm-po-print.helpNote=What you see is the last issued copy. Content being revised is marked as draft.
help.cms-mwo.helpWhy=Records who did what and when for breakdown, improvement and preventive work in a fixed order, and keeps finished records unchanged. Spare parts are issued from stock when the order is finished.
help.cms-mwo.helpWhen=Steps 2 to 6 of the breakdown flow (accept, start, finish, confirm), and the execution step of preventive plans run as work orders. Open it when a report arrives or a preventive order is generated.
help.cms-mwo.helpDo=[Accept] Move a report to accepted. An empty assignee becomes the default owner from the equipment profile\n[Start] Move to in progress\n[Add labor] and [Add part] Record labor and used parts while working\n[Finish] Check symptom, cause, action and work text, then move to done. With stock link on, spare parts are issued from the warehouse\n[Confirm] Close a done order. [Cancel order] is allowed only in reported or accepted status, with a reason\n[Return] Send unused spare parts back to the warehouse after finishing
help.cms-mwo.helpNote=After finishing, content, labor and used parts cannot be changed. There is no undo. Rework needs a new order.\nSpare parts are issued from stock only when plant policy WMS_MRO_LINK is on. When off, only the record is kept and stock does not change.\nIf stock is short or the month is closed, the whole finish is rolled back and the order stays in progress.
help.srm-notify.helpWhy=Supplier notices are sent separately from issuing, cancelling or sending a claim, so the business step looks finished even when the notice fails. Without this screen you cannot tell that a supplier never received an order or claim.
help.srm-notify.helpWhen=Open it after step 2 of the purchasing flow (issuing or cancelling an order) and after sending a supplier claim. Check here first when a supplier says no order arrived.
help.srm-notify.helpDo=[Search] Lists order and claim notices by period and status. Recipient addresses are partly masked.\n[Resend selected failure] Creates a new notice for failed ones only, using the current status and address. Use it after fixing the address.\nThe test mailbox below shows the notices kept instead of real mail.
help.srm-notify.helpNote=No real mail is sent yet. Notices are kept only in the test mailbox.
help.cms-chk-tmpl.helpWhy=Without defined items and limits, no preventive plan can be made and inspection results cannot be judged pass or fail.
help.cms-chk-tmpl.helpWhen=Master data preparation before the preventive flow, when inspection standards for a machine type appear or change.
help.cms-chk-tmpl.helpDo=[New] and [Save] Set code, name, target kind and equipment class\n[Add item] Add an inspection item row (judgement type, lower and upper limit, required)\n[Save items] Save all items at once. Inspections already generated and past records do not change
help.cms-chk-tmpl.helpNote=Changing a checklist does not change inspections already generated or past records. New items apply from the next due date.\nItems are saved as one set. If someone saved first, reload before saving.
help.cms-pm-plan.helpWhy=Without a cycle, people must remember dates and missed inspections stay hidden. Inspections and work orders are generated automatically from the cycle set here.
help.cms-pm-plan.helpWhen=Step 1 of the preventive flow. Open it when you first set or change the cycle (dates, shots or run hours) of a machine or mold.
help.cms-pm-plan.helpDo=[New] and [Save] Set target, checklist, execution mode, cycle, first due date and assignee\n[Show schedule] Preview the coming due dates\n[Create for class] Create the same plan for every machine of a class\n[Generate now] Create due inspections (and orders) now instead of waiting for the hourly job\n[Calendar view] See due dates on a monthly calendar per plant
help.cms-pm-plan.helpNote=A plan has only one open inspection. Finish or skip it before the next is generated.\nCycle type and counter cannot change after creation. Create a new plan instead.\nDue inspections are generated by an hourly job. Press Generate now to create them at once.
help.cms-chk-run.helpWhy=Without recording whether a due inspection was done and within limits, preventive compliance is unknown and failed items never turn into repairs.
help.cms-chk-run.helpWhen=The execution step of the preventive flow. Open it when today or overdue inspections appear on the home card or the list.
help.cms-chk-run.helpDo=[Save results] Save results per item. Numbers are judged against limits by the server\n[Finish] When required items are filled, finish a daily inspection and calculate the next due date\n[Skip] Skip this due inspection with a reason (the next due date is calculated)\n[Follow-up order] Create a breakdown work order directly from a failed item
help.cms-chk-run.helpNote=Inspections run as work orders cannot be finished here. They finish together with the maintenance work order.\nFinished results cannot be changed.\nSkipping cannot be undone. It counts as done for that due date and the next one is calculated.
help.cms-counter.helpWhy=Without accumulated shots or run hours, usage based inspections (for example every 50,000 shots) are never generated and mold life warnings are missing.
help.cms-counter.helpWhen=The usage flow. Open it when creating a counter for a mold or machine, and when reading gauges that are not counted automatically.
help.cms-counter.helpDo=[New] and [Save] Create a counter with target, kind, unit and decimals\n[Enter] Enter the current gauge value (or increment). The total grows, and an inspection is created at once when a usage plan is reached\n[Void] Void the latest reading with a reason, newest first\nProduction results and collected run time are added automatically every hour
help.cms-counter.helpNote=Readings cannot be edited. They can only be voided, newest first.\nVoiding does not remove preventive inspections already generated. Skip them on the inspection screen if needed.\nAutomatic counting only covers results after the counter was created. Enter earlier usage as a direct increment.
help.cms-spare.helpWhy=Without linking parts to machines it is hard to pick spare parts on a work order, and usage by machine or item cannot be seen.
help.cms-spare.helpWhen=Master data preparation when listing machine parts, and later when reviewing part usage.
help.cms-spare.helpDo=[New] and [Save] Link an item to a machine or class and set installed quantity and key spare\nLinks appear as spare part candidates on work orders. Stock quantity and issue are handled by the warehouse (WMS)\nUsage history [Search] See parts used on work orders in a period\n[Download Excel] Download the links or the usage history
help.cms-spare.helpNote=Stock does not move here. Quantity and issue are handled by the warehouse (WMS).\nTarget and item cannot change after creation. For another item, create a new link and turn the old one off.
help.cms-equip-sec.helpWhy=Without OS end of support and malware scan due dates in one place, customer security audits cannot be answered and risky machines are missed.
help.cms-equip-sec.helpWhen=The equipment register flow, when a machine is introduced or during a security check or yearly review.
help.cms-equip-sec.helpDo=[Search] See all active machines and filter by warning (unregistered, unsupported OS, scan overdue, level below target, not reviewed)\n[Save] Pick a machine and save network, OS, scan date, security level, USB, remote access and review date\n[Download Excel] Download the same filter and warnings for an audit
help.cms-equip-sec.helpNote=Warnings are not stored. They are recalculated with the current date on every search.\nMalware scan due dates apply only to networked machines.\nScan and review cycles follow company policy.
help.cms-risk.helpWhy=Korean safety law requires workplace risk assessments with worker participation and kept records. Without them and the improvement evidence, there is no proof at inspections or after accidents.
help.cms-risk.helpWhen=The safety register flow. Open it for initial, regular (yearly) and ad hoc (new or changed equipment) assessments.
help.cms-risk.helpDo=[New] and [Save] Create the assessment header (draft)\n[New hazard], [Save hazard] and [Add participant] Record hazards and worker participation\n[Request release] After the release check passes, send it for approval (in approval) or release it at once when approval is off\n[Save improvement progress] Record completion date and residual risk after release\n[Copy to new assessment] Make a draft copy of a released assessment. [Make obsolete] retires an assessment
help.cms-risk.helpNote=After release, hazards, risk levels, measures and participants cannot be changed. Only improvement progress and notification dates can be filled.\nRelease fails without worker participation, or without measure, owner and due date for medium or higher risks.\nWhether approval is needed depends on company policy. Releasing without approval needs approve permission.
help.cms-state-reason.helpWhy=Without standard reason codes, downtime cannot be split into breakdowns and planned stops, and availability in equipment KPI goes wrong.
help.cms-state-reason.helpWhen=Master data preparation before the state and KPI flow, when aligning reason codes with collectors and POP.
help.cms-state-reason.helpDo=[New] Create a reason code, category and planned flag. Code and category cannot change\n[Save] Change name, planned flag, order and use. Changing the planned flag recalculates past KPI too\n[Export to Excel] Download the list
help.cms-state-reason.helpNote=Code and category cannot change after creation.\nChanging the planned flag recalculates equipment KPI for past periods too.\nThe code must match exactly the reason code sent by the collector.
help.cms-state-review.helpWhy=Collected stop intervals may arrive with a missing or wrong reason. People must correct them afterwards and link breakdown orders so KPI failure counts and repair times are right.
help.cms-state-review.helpWhen=The review step of the equipment state flow. Open it after a day or shift, or when the home card shows intervals without a reason.
help.cms-state-review.helpDo=[Search] See intervals by plant and period, and filter those without a reason\n[Assign reason] Add a later reason and memo to a closed interval (the collected record is not changed)\n[Link] Link an unplanned stop interval to a breakdown order of the same machine\n[Void] Void a wrong reason or link with a reason, then add it again
help.cms-state-review.helpNote=Reasons can be added only to closed intervals, one valid reason per interval. Void it first to change it.\nTo move a linked interval out of breakdown, void the link first.\nReasons changed here are reflected in equipment KPI at once.
help.cms-alarm.helpWhy=Without collecting when device alarms occur and how often they repeat, early signs of failure are missed and there is no basis for which alarm to fix first.
help.cms-alarm.helpWhen=The equipment state flow, after a critical alarm notification or when reviewing top alarms in a maintenance meeting.
help.cms-alarm.helpDo=[Search] See one row per occurrence by plant and period, and filter open ones\nTop alarms ranks by count and active time\nCritical alarms with automatic breakdown report on are already sent to maintenance work orders\n[Export to Excel] Download the history
help.cms-alarm.helpNote=Alarm codes without a definition are still recorded but show no name.\nRepeat marks are calculated at search time from company policy, so changing the policy changes past marks too.\nCritical alarm notifications go to everyone allowed to view this screen.
help.qms-gauge-calib=Records calibrations for gauges registered as molds, jigs, and gauges, and judges usability from the next due date (OK, due soon, overdue, failed, no record). Calibration records cannot be edited or deleted. Void a wrong one with a reason.
help.qms-gauge-calib.helpWhy=Gauges with no record, an overdue calibration, or a failed result cannot be used for measurement in inspection execution, and job start warns that no usable gauge exists. A failed calibration is also the starting point for finding the lots measured with that gauge and containing them.
help.qms-gauge-calib.helpWhen=Open it during master data preparation for gauges and in daily operation when a calibration certificate arrives or to review due and overdue gauges. A failed calibration leads into the nonconformance flow (impact lots, then containment).
help.qms-gauge-calib.helpDo=[Save gauge info] Saves the gauge class, calibration cycle, and limited-use range.\n[Add calibration record] Records the date, result (pass, fail, limited use), agency, and certificate. The next due date becomes the calibration date plus the cycle and the status is judged again.\n[Void] Voids a wrong record with a reason. The last calibration date and status are recalculated.\n[Impact lots] On a failed record, lists the lots and inspections measured with this gauge since the previous valid calibration.\n[Open containment] Opens containment prefilled with the impact lots grouped by item.
help.qms-gauge-calib.helpNote=Calibration records cannot be edited. Void and enter again.\nA failed result does not hold any lot automatically. Review the impact lots and open containment yourself.\nIf the e-signature policy is on, adding a record requires a signature.
help.cms-alarm-def.helpWhy=Devices send alarms only as codes. Without a name and severity nobody can read them, and critical alarms cannot be turned into breakdown reports automatically.
help.cms-alarm-def.helpWhen=Master data preparation before the state flow, when the alarm list of a new machine arrives.
help.cms-alarm-def.helpDo=[New] Create a definition with alarm code and equipment class (empty means all). Both cannot change\n[Save] Change name, severity, symptom code, automatic breakdown report and use\nWith automatic breakdown report on, a critical alarm creates a breakdown report (not while one is still open)
help.cms-alarm-def.helpNote=Automatic breakdown report can be turned on only for critical severity.\nNo new report is created while a report from the same machine and alarm is still open.\nAlarm code and equipment class cannot change after creation.
help.qms-msa=Checks how much measurement variation a gauge adds through a GRR study. Enter raw data by operator, part, and trial to calculate EV, AV, GRR, PV, %GRR, and ndc, judged against the company thresholds (default 10 and 30 percent).
help.qms-msa.helpWhy=If gauge variation is large compared with the tolerance, neither inspection verdicts nor SPC charts can be trusted. This study records evidence that the measurement system for the gauge and characteristic is fit for use.
help.qms-msa.helpWhen=Open it during master data preparation for gauges or in new product development, before measuring with a new gauge or a special characteristic. Also use it to recheck after a gauge repair or calibration.
help.qms-msa.helpDo=[New] Creates a draft study with gauge, characteristic, method, and numbers of operators, parts, and trials.\n[Fill cells] Pastes raw data copied from Excel into the table.\n[Save] Saves the raw data and the basis (process variation or tolerance) and recalculates.\n[Complete] Moves the draft to completed. Results are fixed and raw data can no longer change.\n[Cancel study] Cancels a draft study created by mistake.
help.qms-msa.helpNote=Raw data cannot change after completion.\nThe GRR verdict does not change gauge usability automatically. If it is poor, decide separately whether to keep using the gauge.
help.cms-kpi.helpWhy=If availability, OEE, MTBF and MTTR are counted differently on each screen the numbers never match. Collected states, results and inspections are combined under one definition here.
help.cms-kpi.helpWhen=The last step of the equipment state flow. Open it after downtime reasons are reviewed, to see daily, weekly or monthly performance.
help.cms-kpi.helpDo=[Search] See plant total, lines and machines by plant, period and basis (confirmed results or collected counts)\nDaily trend shows values per day for the plant or one machine (up to 31 days)\n[Download Excel] Download with the same calculation as the table\nTo correct a reason, fix it in downtime reason review and search again
help.cms-kpi.helpNote=Machines without a collector show empty availability, MTBF and MTTR. They are not filled from work-order stop times; values from work orders are shown separately in the MTBF/MTTR (WO) columns.\nIf any result comes from an operation without a standard cycle, performance and OEE are empty.\nWhen today is included, only time up to now is counted.
help.qms-doc=Manages and releases controlled documents such as work instructions, inspection standards, control plans, PFMEAs, and drawings by revision. Only drafts can be edited, each document has one released revision, and releasing a new one makes the previous release obsolete.
help.qms-doc.helpWhy=Without a single current revision, the floor and inspectors may work from an obsolete one. Inspection standards referenced by inspection plans and documents from APQP, design changes, and project deliverables are also kept here as revisions.
help.qms-doc.helpWhen=Open it during master data preparation and new product development to upload a document for the first time, or when a design or 4M change requires a document revision.
help.qms-doc.helpDo=[New] Enter number, type, and title, add items and processes with [Add target], then [Save].\n[New revision] Copies the released revision (or the latest) with its files into a draft.\n[Save revision] Saves the draft contents and files.\n[Submit for approval] Moves the draft into approval. Approval releases it, and rejection or withdrawal returns it to draft.\n[Release now] Releases directly with approve permission when your company does not use approval.\n[Make obsolete] Makes a draft or released revision obsolete.
help.qms-doc.helpNote=If the approval policy is on, Release now is refused. Release only through approval.\nObsolete cannot be undone. Downloads of obsolete revisions are marked as obsolete.\nYou cannot create a new revision while a draft or in-approval revision exists.
help.qms-consistency=A read-only check that finds three kinds of gaps between quality standards: a special characteristic missing from released inspection plans, a released inspection plan without a released inspection standard, and an inspection plan pointing to an obsolete document revision.
help.qms-consistency.helpWhy=When characteristics, inspection plans, and documents are edited separately, a special characteristic check can quietly go missing or a plan can point to an obsolete standard. This finds those gaps at once before an audit.
help.qms-consistency.helpWhen=The final check of master data preparation for inspection standards. Open it after changing inspection plans or documents, or before an audit.
help.qms-consistency.helpDo=[Run] Runs the three checks as of today and lists targets and reasons.\n[Export to Excel] Downloads the results to Excel.\nUse the characteristic or inspection plan link at the end of a row to open the screen to fix.
help.qms-consistency.helpNote=It only checks and changes nothing.\nUp to 2,000 results are shown. More than that is marked as truncated.
help.qms-capa=Records corrective actions for customer claims, internal defects, suppliers, and audit findings in 8D sections (D1 to D8) and tracks due dates. It moves through received, contained, root cause analyzed, actions done, effectiveness verified, and closed, and each step needs its D sections filled in.
help.qms-capa.helpWhy=If a nonconformance is only dispositioned without a root cause and prevention, the same defect repeats. This record is the evidence for cause, actions, verification, and horizontal deployment, and shows delays against company policy or customer CSR due dates.
help.qms-capa.helpWhen=The last step of the nonconformance flow (detection, NCR, containment and lot hold, corrective action). Open it from Create 8D on an NCR, from a customer claim, or from raising a project issue as a corrective action.
help.qms-capa.helpDo=[New] Enter source, customer, item, owner, linked NCR number, and D sections, then [Save]. Due dates are fixed at creation.\n[Next step] Moves to the next step when the required D sections are filled.\n[Add deployment] Adds item, process, or customer rows that may share the cause.\n[Submit closure approval] Moves from verified to closure in approval. Approval closes it, and rejection or withdrawal returns it to actions done.\n[Close now] Closes directly from verified with approve permission when your company does not use approval.\n[Cancel] Cancels the corrective action with a reason.
help.qms-capa.helpNote=Closed or cancelled records cannot be edited, and contents are locked during closure approval.\nYou cannot move to verified while any deployment row is still open.\nDue dates are fixed at creation and are not recalculated if the occurrence date or CSR changes later.
help.qms-csr=Manages customer-specific requirement (CSR) documents and revisions, the items or item classes they apply to, and values that replace company policy (containment and closure days, and so on).
help.qms-csr.helpWhy=Each customer may require different 8D response and closure deadlines. Using only the company defaults misses late responses. When a customer claim corrective action is created, the matching CSR here sets the due dates.
help.qms-csr.helpWhen=Open it during master data preparation when a customer CSR arrives or is revised. Corrective actions for customer claims in the nonconformance flow use these values.
help.qms-csr.helpDo=[New] Enter customer, CSR number, revision, start date, and override values, then [Save]. Blank values use company policy.\n[Add target] Adds items or item classes. Leave it empty to apply to the whole customer.\nA CSR matching the item or item class wins over one without targets.
help.qms-csr.helpNote=It applies only to customer claim corrective actions created on or after the start date. Existing due dates do not change.\nThe customer cannot be changed after creation.
help.qms-change=Records the 4M change details (man, machine, material, method, measurement, environment, supplier, site) attached to an engineering change order (ECO). Keep before, after, reason, impact assessment, and affected characteristics and inspection plans. Editing is possible only while the ECO is a draft.
help.qms-change.helpWhy=Under company policy (on by default), a process 4M or temporary ECO cannot be submitted without 4M details. It shows what changes, which characteristics and inspections need review, and backs the first-article check.
help.qms-change.helpWhen=Open it in the design change flow (change request, change order, 4M change and first article) before submitting the ECO. Open it from the quality section of the ECO detail or by ECO number.
help.qms-change.helpDo=[Open] Opens the 4M details of an ECO by number, or starts new ones.\n[Save] Saves 4M types, before and after, reason, impact assessment, and revert condition for temporary changes.\n[Add row] Adds affected characteristics or inspection plans.\n[Delete 4M details] Deletes the 4M details while the ECO is a draft.\n[Open first-article check of this change] Goes to first-lot verdicts after the ECO is released.
help.qms-change.helpNote=Submitting the ECO locks the 4M details. They open again if rejection or withdrawal returns it to draft.\nListing an affected characteristic does not change any inspection plan. Create a new plan revision separately.
help.qms-insp=Runs receiving, in-process, final, first-article, last-article, and patrol inspections for one lot. Items and sample sizes come from the released inspection plan and sampling plan valid that day. Measurements are never deleted and are corrected only with void rows.
help.qms-insp.helpWhy=Only the verdict here moves receiving and final stock from waiting for inspection to available or nonconforming. Judged inspections are the basis for SPC charts, first-article verdicts, and NCRs.
help.qms-insp.helpWhen=Open it for receiving inspection in the purchasing flow (after material receipt), for in-process and final inspection in the production flow (after production receipt, before shipping), and for first-article inspection after a design change. The home card for inspections awaiting a verdict also opens it.
help.qms-insp.helpDo=[Start inspection] Opens an inspection with lot number, inspection type, process, and lot quantity. Without an applicable plan it cannot start.\n[Add] Enters sample values per item. Pasting several values fills from the next empty sample number.\n[Confirm verdict] Confirms the inspection once every item is pass or fail. In quality-linked plants, receiving and final inspections move waiting stock to available on pass or to nonconforming on fail.\n[Void inspection] Voids the inspection with a reason. Stock status changes and SPC violations are reversed too.\n[Create NCR] From a failed confirmed inspection, opens a new NCR prefilled with the lot and inspection number.
help.qms-insp.helpNote=After the verdict is confirmed, measurements cannot be added or changed. If wrong, void and start a new inspection.\nGauges that are overdue or failed cannot be selected.\nA failed verdict does not create an NCR automatically. Press Create NCR to open one.
help.qms-setup=Records a first-article verdict for each first lot made after a design or 4M change (ECO). The verdict is copied from the confirmed inspection result of that lot. To correct it, void and record again.
help.qms-setup.helpWhy=If the first lot after a change is not verified, starting other work orders for the same item shows a pending first-article warning (or a block, by policy). The pass, fail, and pending counts on the change order screen also come from these records.
help.qms-setup.helpWhen=The last step of the design change flow (change order, 4M change, first article). Open it after the ECO is released and the first lot is judged by a first-article inspection, from the 4M change or change order links or by ECO number.
help.qms-setup.helpDo=[Open] Opens the first lots of the change by ECO number.\n[Record verdict] For each first lot, picks the evidence inspection (a confirmed inspection of that lot) and records the verdict.\n[Void verdict] Voids a wrong verdict with a reason. The lot becomes pending again.\n[Create NCR] If the verdict is fail, opens a new NCR with that lot and inspection.
help.qms-setup.helpNote=You do not type the verdict. Confirm the inspection of that lot in inspection execution first.\nWhile a failed verdict has an open NCR, the start gate keeps warning.
help.qms-spc=Draws X-bar R charts and process capability (Cp, Cpk, Pp, Ppk) per item, characteristic, inspection type, and process from confirmed inspection measurements. Once limits are fixed, each later confirmed inspection records rule violations in the violation list.
help.qms-spc.helpWhy=Even when every inspection is within spec, a process drifting to one side shows only on a control chart. Violations are the starting point for NCRs and containment, and open violations warn at job start.
help.qms-spc.helpWhen=Open it regularly once in-process and final inspections accumulate in the production flow. As a start of the nonconformance flow it also opens from SPC violation notifications and the open SPC violations home card.
help.qms-spc.helpDo=[Search] Pick a chart unit, then [Redraw] draws the chart, capability, and rule alarms for recent subgroups.\n[Fix limits from this window] Saves the center and sigma from the visible subgroups (20 or more) as fixed limits. Later verdicts record violations.\n[Void limits] Voids the fixed limits with a reason.\n[Record action] Records acknowledge, action, close, or void on a violation.\n[Create NCR] or [Open containment] Opens an NCR or containment prefilled with the lot, inspection, and item of the violation.
help.qms-spc.helpNote=Violations are recorded only for units with fixed limits. Alarms before fixing are shown on screen only.\nLots are held automatically only when policy QMS_SPC_AUTO_HOLD is on (off by default). Otherwise use Create NCR or Open containment to stop it.\nAn automatic hold is released when the violation is closed or voided.\nClose and void need a note, and no further actions can be added afterwards.
help.qms-ncr=Registers one nonconformance (lot, defect type, quantity, source) and closes it with an MRB disposition (use as is, rework, scrap, return, sort). If the policy is on, the lot is held on registration, and closing or cancelling releases only the hold from this NCR.
help.qms-ncr.helpWhy=It stops a failed lot from being used or shipped without a disposition and records where each part of the nonconforming quantity went. Supplier returns, claims, supplier evaluation, and corrective actions use this record as their basis.
help.qms-ncr.helpWhen=The second step of the nonconformance flow (detection, NCR, containment and lot hold, corrective action). Open it from Create NCR on a failed inspection, a failed first article, or an SPC violation, or when a customer claim arrives.
help.qms-ncr.helpDo=[Create] Opens an NCR with lot number, source, evidence inspection, defect type, quantity, and description. The lot may be held automatically by policy.\n[Add disposition line] Adds disposition lines (type, quantity, rework result lot) while in progress, then [Save].\n[Close] Closes when the disposition total equals the nonconforming quantity and there is no use as is. The hold is released, and in quality-linked plants scrapped quantity leaves stock.\n[Submit concession for approval] With a use-as-is line, moves to concession approval. Approval closes it, releases the hold, and makes that quantity available. Rejection or withdrawal returns it to in progress.\n[Cancel NCR] Cancels with a reason and releases the hold from this NCR.\n[Contain] opens containment for suspect lots of the same item, and [Create 8D from this NCR] opens a prefilled corrective action.
help.qms-ncr.helpNote=Close and cancel cannot be undone. Editing is possible only while in progress.\nIf other reasons such as a manual hold or containment remain, the lot stays on hold after closing.\nA rework disposition is only a record. Actual rework and return orders are done in production and purchasing.
help.qms-contain=Finds other lots of the same item made or received in the same period as a nonconformance, and holds the lots you pick all at once. Each lot can be released separately, and the containment completes automatically when all are released.
help.qms-contain.helpWhy=Blocking only the failed lot lets neighboring lots made with the same cause be shipped or consumed. The system only suggests candidates, and a person decides which lots to hold.
help.qms-contain.helpWhen=The containment and lot hold step of the nonconformance flow. It opens prefilled with item and period from Contain on an NCR, Open containment on a failed calibration, or Open containment on an SPC violation.
help.qms-contain.helpDo=[Find candidates] Lists lot candidates for the item and period with the current hold reasons of each lot.\n[Contain selected lots] Holds the selected lots under this containment, with the related NCR number and reason.\n[Release selected lots] Releases only this containment reason from the selected lots, with a reason.
help.qms-contain.helpNote=Finding candidates holds nothing. Select lots and press Contain.\nA released lot stays on hold if other reasons such as an NCR or manual hold remain.\nClosing the NCR does not release the containment automatically.
help.wms-count.helpWhy=Where books and physical stock are matched by posting only the differences as count adjustments. It is also where opening stock goes in on first use.
help.wms-count.helpWhen=The count step of inventory operations. Open it for cycle counts, month-end full counts, or to load stock into an empty warehouse on first use.
help.wms-count.helpDo=In [New], enter scope, type and blind, then [Save] to create a draft count.\n[Start] Creates a line for each stock cell in scope and the count becomes counting. Use [Add line] for cells not in the books.\n[Save counts] Saves counted quantities. Pasting from Excel also works.\n[To review] Shows the differences. Count doubtful lines again with [Recount selected].\n[Post] Posts count adjustments for the differences and the count becomes posted. [Cancel] ends it with a reason.
help.wms-count.helpNote=Lines above the tolerance need approve permission to post.\nPosting cannot be undone. Reverse on the stock ledger or count again to fix it.\nA count taken in a closed month cannot be posted.
help.wms-period.helpWhy=Freezes last month stock figures. Without closing, late adjustments, moves and counts can change a month that was already reported.
help.wms-period.helpWhen=The period close step of inventory operations. Open it early in the month after finishing last month counts and reconciliation.
help.wms-period.helpDo=[Search] Shows the monthly close status by plant and year.\n[Close] Closes the chosen past month. Open counts and reconciliation mismatches are warnings only.\n[Reopen] Reopens a closed month with a reason.
help.wms-period.helpNote=The current and future months cannot be closed.\nClose and reopen are shown only with approve permission.\nClosing still works with warnings. Check them first.
help.pms-home=See phase, days to SOP, delay against baseline, deliverable readiness and open issues of many projects at once, plus your to-dos and a project report. Nothing is changed on this screen.
help.pms-home.helpWhy=Shows which projects are late and which gates are not ready without opening each project. The printable report for meetings is made here too.
help.pms-home.helpWhen=Used at any time in the new product development flow. Open it before a weekly meeting or to check your to-dos.
help.pms-home.helpDo=[Search] Shows the portfolio for the conditions and your to-dos (late tasks, missing deliverables, your issues, unconfirmed work days).\n[Select a row] Opens the report of that project below.\n[Print] Prints the open report.\n[Download Excel] Downloads the portfolio with the same conditions and order.
help.pms-home.helpNote=Nothing can be changed on this screen.
help.pms-gate=Record a checklist and a decision (go, conditional go, no-go) for each phase gate of a project. Go completes the gate task; conditions of a conditional go become issues. Depending on company policy it goes through approval or is decided at once.
help.pms-gate.helpWhy=Keeps the check results and the decision as a record so moving to the next phase is not decided without evidence. A gate cannot pass until its required deliverables are ready.
help.pms-gate.helpWhen=Step 6 of the new product development flow. Open it for the gate meeting after all deliverables of a phase are approved or waived.
help.pms-gate.helpDo=[New review] Creates a draft review for the selected gate with check items from the template. One open review per gate.\n[Add check item], [Add condition], [Save] Enter check results, the decision and conditions (owner, due date).\n[Submit] Goes into approval if approval is used, otherwise it is decided at once. Go needs all required deliverables ready.\n[Approve], [Reject], [Withdraw] The approver in turn approves or rejects; the submitter can withdraw it back to draft.\n[Cancel review] Cancels a draft or in-approval review.
help.pms-gate.helpNote=Go and conditional go can be submitted only when all required deliverables of the phase are approved or waived.
help.pms-deliverable=Submit, approve, reject or waive the deliverables each project task needs. Instead of a file, link a QMS document, PFMEA, control plan or PPAP and it is approved by that status. Readiness per phase is the condition for passing a gate.
help.pms-deliverable.helpWhy=Manages the submission and approval of required deliverables in one place so the gate shows what is ready and what is missing. Without it gate readiness cannot be calculated.
help.pms-deliverable.helpWhen=Step 4 of the new product development flow. Open it when handing in task results, and before a gate review to find missing deliverables.
help.pms-deliverable.helpDo=[Add deliverable] Adds a deliverable slot to a task. Slots copied from the template can be edited too.\n[Submit] Uploads one file and marks it submitted. Every submission keeps a new file.\n[Approve], [Reject], [Waive], [Remove waiver] Decide on a submitted deliverable. A rejected one is submitted again.\n[Link], [Link PPAP of project ECO] Point to a QMS document, PFMEA, control plan or PPAP. It is approved when released or customer-approved.\n[Apply QMS·PPAP·APQP status] Approves linked slots that have since been released or approved.
help.pms-deliverable.helpNote=Submitted files cannot be deleted.
help.pms-issue=Track project to-dos, risks and problems with an owner and due date. Issues can be linked to items, partners, equipment or LOTs, and quality problems are raised to a QMS corrective action (8D). Conditions of a conditional gate pass and PFMEA actions also arrive as issues.
help.pms-issue.helpWhy=Keeps to-dos and risks from meetings in one list with owner, due date and status. Heavy quality problems are not finished here but passed to corrective action.
help.pms-issue.helpWhen=Step 5 of the new product development flow, used at any time. Open it when you find a problem or handle a gate condition or PFMEA action.
help.pms-issue.helpDo=[New issue] Registers an open issue on an open project.\n[Start], [Back to open] Starts the work or returns it to waiting.\n[Resolve] Enter the resolution to mark it resolved. A resolved issue can be reopened to in progress.\n[Close] The PM closes a resolved issue. Closed issues cannot be changed.\n[Raise corrective action] Raises the quality problem once to a QMS corrective action and keeps its number.\n[Reject] The PM closes an open issue that will not be resolved, with a reason.\n[Add file] Attach photos or documents (locked once the issue is closed).
help.pms-issue.helpNote=A closed issue cannot be changed.
help.pms-worklog=Record and confirm how many hours you spent on which project task each day. You only ever see your own hours; the PM sees a project summary.
help.pms-worklog.helpWhy=Keeps the actual people hours spent on a project by task and category so they can be compared with the plan. Only confirmed days are counted.
help.pms-worklog.helpWhen=Used daily during step 3 (task work) of the new product development flow. Open it at the end of the day, or to fill in a whole week.
help.pms-worklog.helpDo=[Previous week], [Next week], [This week] Change the week shown.\n[Prefill] Adds rows for your tasks in progress with values from the last two weeks.\n[Add row], [Save] Enter task, hours and category and save as draft. Future dates are not allowed.\n[Confirm] Confirms the day. Zero-hour rows are removed and the rest need a category.\n[Reopen] Returns a confirmed day to draft with a reason.
help.pms-worklog.helpNote=Saving keeps the day as draft. Only confirmed days are counted.
help.apqp-fmea=Write the process FMEA of an item. Attach functions and failures (effect, mode, cause) to the structure of process steps and work elements, calculate AP from severity, occurrence and detection of each risk row, and manage actions. The released revision is the basis of the control plan.
help.apqp-fmea.helpWhy=Analyses in advance what can go wrong in the process and how risky it is, to decide actions and controls. Without a released PFMEA the control plan cannot be pulled from it.
help.apqp-fmea.helpWhen=Step 8 of the new product development flow. Open it after the routing is released and an AP rule table is ready, or to review again after a process change.
help.apqp-fmea.helpDo=[New PFMEA] Pick an item, a released routing and an AP rule table to create a draft revision. Process steps can start from the routing.\n[+ Process step], [+ Work element] Build the structure and save functions, failures and risk rows. Editing is allowed only in draft.\n[Release] Releases when risk rows are complete; the previous released revision becomes obsolete. Companies using approval [Submit] instead.\n[New revision] Copies the released revision into a new draft.\n[New action], [To issue] Register an action and copy it once to a PMS issue.\n[Excel form], [Publish to QMS document] Download the form or publish it as a QMS document.
help.apqp-fmea.helpNote=A released revision cannot be edited. Create a new revision to change it.
help.apqp-dfmea=Write the design FMEA of an item. Attach functions and failures (effect, mode, cause) to a system › subsystem › component structure (which can be pulled from released BOM levels 1-2), calculate AP from severity, occurrence and detection of each risk row, and manage actions.
help.apqp-dfmea.helpWhy=Analyses in advance what can go wrong in the design and how risky it is, to decide design actions and verification. Characteristics come from the same product characteristic master as the PFMEA.
help.apqp-dfmea.helpWhen=In the new product development flow, open it after the BOM is released and before the PFMEA. Review it again when the design (BOM or drawing) changes.
help.apqp-dfmea.helpDo=[New DFMEA] Pick an item, a released BOM, a drawing document revision and an AP rule table to create a draft revision. Subsystems and components can start from BOM levels 1-2.\n[+ Subsystem], [+ Component] Build the structure and save functions, failures and risk rows. Editing is allowed only in draft.\n[Release] Releases when risk rows are complete; the previous released revision becomes obsolete. Companies using approval [Submit] instead.\n[New revision] Copies the released revision into a new draft.\n[Excel form] Download the form.
help.apqp-dfmea.helpNote=A released revision cannot be edited. The control plan is pulled only from a PFMEA.
help.apqp-ap=Manage the company rule table that sets the action priority (AP) for each combination of severity, occurrence and detection in a PFMEA. Handbook tables are not provided; the company enters its own.
help.apqp-ap.helpWhy=Calculates the AP of PFMEA risk rows by one rule instead of individual judgement. A PFMEA cannot be released without a rule table in use.
help.apqp-ap.helpWhen=Step 7 of the new product development flow; prepare it once before the first PFMEA. When customer or company rules change, copy it into a new table.
help.apqp-ap.helpDo=[New rule table] Creates an empty rule table.\n[Add rule] Adds a line with severity, occurrence and detection ranges and an AP.\n[Save] To save as in use, the rules must cover all 1,000 combinations without gaps or overlaps. Changed rules recalculate AP in draft PFMEAs using the table.\n[Copy] Rules of a table used by a released PFMEA cannot change, so copy it and edit the new table.
help.apqp-ap.helpNote=Rules of a table used by a released PFMEA cannot be changed.
help.apqp-cp=Write the control plan that sets control method, specification, sample, frequency and reaction plan for each process step and characteristic of an item. Lines are pulled from the basis PFMEA and matched with the QMS inspection plan on release. Each phase (prototype, pre-launch, production) has its own number.
help.apqp-cp.helpWhy=Decides on one sheet how the risks found in the PFMEA are controlled on the shop floor, as the basis for inspection plans and work standards. It is also a customer PPAP submission.
help.apqp-cp.helpWhen=Step 9 of the new product development flow. Open it after the PFMEA is released, and when moving from prototype to pre-launch to production.
help.apqp-cp.helpDo=[New control plan] Pick an item, a phase and a basis PFMEA to create a draft revision.\n[Pull from PFMEA] Adds a line per basis risk row. Existing lines are not overwritten.\n[New line], [Save] Add or edit control lines by hand.\n[Release] Checks reaction plans, frequencies and special characteristics, matches the inspection plan, then releases. Companies using approval [Submit] instead.\n[New revision], [To next phase] Copy the released plan into the next revision or a next-phase number.\n[Excel form], [Publish to QMS document] Download the form or publish it as a QMS document.
help.apqp-cp.helpNote=The control plan does not create or change QMS inspection plans. Create them separately in QMS.
help.srm-ack.helpWhy=Without a record of when and how much the supplier promised, late orders cannot be seen in advance and production planning only sees the required date as expected receipt.
help.srm-ack.helpWhen=Step 3 of the purchasing flow. After the order is issued, enter the answer here when the supplier replies by mail, phone or Excel. Answers the supplier enters in the portal show as supplier portal in the history.
help.srm-ack.helpDo=[Save acknowledgement] Records promised dates and quantities per line (split over several dates) as a new acknowledgement. The order changes from issued to acknowledged.\n[Record rejection] Records a rejection with a reason. The order goes back from acknowledged to issued.\n[Excel upload] Uploads the supplier answer file and creates one acknowledgement per order.
help.srm-ack.helpNote=A saved acknowledgement cannot be edited. Saving again creates a new one, and the latest counts.
help.srm-po-status.helpWhy=With many orders you cannot open each one to find missing answers, late promises or near due dates. This screen gathers the order lines to chase in one table.
help.srm-po-status.helpWhen=After acknowledgement and before receipt in the purchasing flow. Open it every morning or before chasing suppliers.
help.srm-po-status.helpDo=[Search] Lists open order lines (issued, acknowledged, partly received) in the order date range.\n[No acknowledgement] Shows only lines past the answer deadline with no answer or a rejection.\n[Late promises] Shows only lines whose last promised date is after the required date.\n[Due soon] Shows only lines whose required date is within the due-soon days from today.
help.srm-po-status.helpNote=This screen is view only. Chasing is not recorded here.
help.srm-asn=Records a delivery the supplier announced before shipping: which order lines, how much, which supplier lot and when it arrives. Once confirmed the content is fixed, and the material receipt screen fills its fields by picking this ASN or scanning ASN:number on the delivery note. Received quantities add up automatically at receipt.
help.srm-asn.helpWhy=Without an ASN the receiving clerk must look up order line, quantity and supplier lot by hand, and purchasing cannot see what is on the way. Production planning also uses the expected arrival date as planned receipt.
help.srm-asn.helpWhen=Step 4 of the purchasing flow (after acknowledgement, before receipt). Enter it for the supplier or upload their Excel when they announce a shipment without using the portal. Also open it with late ASNs only to see delayed arrivals.
help.srm-asn.helpDo=[Add order lines] Adds open order lines of the supplier and plant with the quantity that can still be announced.\n[Save] Saves as draft. A supplier delivery note number can be used only once per supplier.\n[Confirm] Draft becomes sent. The content is fixed and it appears as expected on the receipt screen.\n[Close] Ends an ASN that arrived short and will receive no more.\n[Cancel] Cancels with a reason, only when nothing was received. To correct, cancel and create a new ASN.\n[Print delivery note] Opens the delivery note with the scan key in a new window.
help.srm-asn.helpNote=A confirmed ASN cannot be edited. Cancel it and create a new one.
help.srm-asn-print=Shows the delivery note of an advance shipping notice in a print layout. The scan key ASN:number is printed large, so scanning it at receipt opens that ASN directly. For now it is printed as text without a barcode image.
help.srm-asn-print.helpWhy=The warehouse can find the right ASN at once only when the paper that comes with the goods carries the ASN number.
help.srm-asn-print.helpWhen=Step 4 of the purchasing flow, after the ASN is confirmed. Opens in a new window from [Print delivery note] on the advance shipping notice screen (not in the menu). The supplier portal has the same print.
help.srm-asn-print.helpDo=[Print] Hides the toolbar and opens the browser print window, where you can save as PDF.\nScanning the printed key on the material receipt screen opens the ASN and fills the fields.\nThe supplier delivery note number, if any, is printed too and can be typed into the receipt search field.
help.srm-asn-print.helpNote=There is no barcode image yet. If the scanner cannot read the text, type the number into the receipt search field.
help.srm-return=Instructs returning to the supplier material whose nonconformance (NCR) disposition is return, for example after a failed receiving inspection. Load the candidates, set quantity and whether a replacement is required, and confirm. The actual shipment is done on the return issue screen. Once shipped it shows as shipped here, and for a replacement the order line gets quantity to receive again.
help.srm-return.helpWhy=Without a return instruction the warehouse does not know what, how much and to which supplier to ship, and no order quantity opens up for the replacement.
help.srm-return.helpWhen=End of the nonconformance flow, supplier return step. Open it when an NCR disposition is return and the NCR is closed.
help.srm-return.helpDo=[Load return candidates] Loads return disposition lines of closed NCRs for the supplier. Lines already instructed cannot be picked.\n[Save] Saves as draft. For a replacement, pick the order line to reverse.\n[Confirm] Draft becomes confirmed (approve permission). The return issue screen can then find this number.\n[Cancel] Cancels a draft or confirmed instruction with a reason. A shipped return cannot be cancelled.
help.srm-return.helpNote=Confirming does not reduce stock. It becomes shipped only after shipping on the return issue screen.
help.srm-claim=Requests corrective action from a supplier or states a charge amount, based on quality problems (NCR). Sending notifies the supplier, who answers cause and countermeasure in the portal, or we enter it for them. Review the answer and reject or close it. Payment deductions and vouchers are done in the ERP.
help.srm-claim.helpWhy=Without a record of what was demanded of the supplier and how they answered, recurrence prevention cannot be checked and supplier evaluation and trade status decisions lose their basis.
help.srm-claim.helpWhen=End of the nonconformance flow, supplier claim step. Open it when an NCR arises on a supplier lot, even while it is still being handled. A return instruction on the same NCR is shown as a link.
help.srm-claim.helpDo=[Load basis NCRs] Loads NCRs of supplier lots by detection date. NCRs already in another claim cannot be added.\n[Save] Saves demanded action, amount and basis NCRs as draft.\n[Send] Draft becomes sent and the supplier is notified. Demand, amount and basis are fixed.\n[Save answer] Enters cause, countermeasure and answer date for the supplier. Sent becomes answered.\n[Reject answer] / [Close] Returns an answered claim to sent to ask again, or closes it (approve permission).\n[Cancel] Cancels a draft or sent claim with a reason.
help.srm-claim.helpNote=After sending, demanded action, amount and basis NCRs cannot be changed.
help.srm-eval-tmpl.helpWhy=Scores cannot be compared across periods unless the criteria (items, maximum scores, weights, fail limits, grades) are fixed. Only released revisions are used for evaluations.
help.srm-eval-tmpl.helpWhen=Preparation step of the supplier evaluation flow. Open it before the first evaluation or when the criteria change.
help.srm-eval-tmpl.helpDo=[Add item] / [Add grade] Adds items (maximum score, weight, fail limit, automatic metric) and grade bands. Incoming PPM items also need score bands.\n[Save] Saves the draft revision.\n[Release] Draft becomes released (approve permission). Weights must total 100 and a grade with minimum score 0 is required.\n[New revision] Copies the last revision into a new draft.\n[Obsolete] Retires a revision no longer used.
help.srm-eval-tmpl.helpNote=A released revision cannot be edited. Use [New revision].
help.srm-eval.helpWhy=Without scoring suppliers, keeping or holding them is decided by feel. Answer rate, on-time delivery, incoming PPM and certificate validity are calculated from the period data and kept as evidence.
help.srm-eval.helpWhen=Last step of the purchasing flow. Open it when a monthly, quarterly or yearly evaluation period ends. If it fails or suggests hold, set the trade status in supplier information.
help.srm-eval.helpDo=[Create evaluation] Creates an evaluation for supplier, template and period and calculates the automatic items.\n[Save scores] Saves manual item scores and comments.\n[Recalculate automatic items] Recalculates automatic items when the period data changed.\n[Confirm] Draft becomes confirmed (approve permission). Total, grade and fail are fixed and cannot change.\n[Cancel evaluation] Cancels a draft evaluation with a reason.
help.srm-eval.helpNote=A confirmed evaluation can be neither edited nor cancelled.
help.sys-my-info=Change your screen language and password, and check your MFA status.
help.sys-my-info.helpWhy=Manage your own account here without asking an administrator: language, password and recovery codes.
help.sys-my-info.helpWhen=Last step of the system administration flow. Open it after your first login, when you think your password leaked, or when recovery codes run out.
help.sys-my-info.helpDo=[Save] Changes the screen language.\n[Change password] Checks the current password and sets a new one.\n[Regenerate recovery codes] Enter an authenticator code to get new recovery codes. The old codes stop working.
help.sys-my-info.helpNote=A wrong current password counts as a failed login.\nNew recovery codes are shown only once. Write them down right away.
help.sys-support=Grant the YeonOS operator a scope and period to view your company data, and review what the operator did. A grant can be revoked at any time.
help.sys-support.helpWhy=The company itself grants the operator a scope and period, so the operator cannot browse company data freely. Without a grant there is no support access.
help.sys-support.helpWhen=Step 9 of the system administration flow. Open it after contacting the operator, or when the last administrator lost MFA and needs an operator reset.
help.sys-support.helpDo=[Grant] Opens a support session with operator ID, scope, period and reason.\n[Revoke] Ends a grant immediately.\nThe operator activity list shows what the operator did.
help.sys-support.helpNote=Choose one scope at a time. Grant only what is needed, for a short period.\nThe user MFA reset scope lets the operator reset authentication of your users.
help.sys-usage=Shows daily users, logins, screen views and actions, and the most used screens. Records up to yesterday are aggregated every hour without user names.
help.sys-usage.helpWhy=Shows in numbers whether the screens you introduced are really used, so you can find unused screens or teams that need training.
help.sys-usage.helpWhen=Step 9 of the system administration flow. Open it to check adoption after go-live, or in a monthly review.
help.sys-usage.helpDo=[Search] Shows daily usage figures and the most used screens for the chosen period.
help.sys-usage.helpNote=Today is not included. Data runs up to yesterday.\nThere are no per-person figures.
help.sys-user.helpWhy=Add, lock and reset users without SQL. The server creates temporary passwords so that administrators never know a user password.
help.sys-user.helpWhen=Step 3 of the system administration flow. Open it when someone joins, leaves or moves, or reports a lost password or authenticator.
help.sys-user.helpDo=[New] and [Save] add a user. The temporary password is shown once and must be changed at first login.\n[Excel upload] adds or updates many users at once (no password column).\n[Reset password] creates a new temporary password and ends the open sessions of that user.\n[Reset MFA] clears the authenticator so the user registers again at next login.\n[Lock] and [Unlock] block or allow login and are written to the access log.
help.sys-user.helpNote=The temporary password cannot be shown again after closing. Copy it first.\nYou cannot reset or lock yourself or anyone with more rights than you.\nThe last administrator cannot be deactivated or locked.
help.sys-auth-group.helpWhy=Defines by role who may search, save or delete on each screen. Without a permission here, the screen is missing from the menu and the home cards.
help.sys-auth-group.helpWhen=Step 4 of the system administration flow. Open it when a new role appears or a new screen needs to be granted.
help.sys-auth-group.helpDo=[New] and [Save] set the group code, name, first screen after login, administrator flag and active flag.\n[Save permissions] stores the ticked cells of the screen by action table. It applies from the next action of each member.\n[Search] lists groups and their members.
help.sys-auth-group.helpNote=You cannot grant more than you hold yourself.\nA group with the administrator flag gets every right, including screens added later.\nA granted screen that is not in the menu must still be added in menu management.
help.sys-menu.helpWhy=Arranges the left-hand shell menu in your own work order. The menu shows only screens a user may search, so rights are given in auth group management.
help.sys-menu.helpWhen=Step 5 of the system administration flow. Open it when setting up the menu or after an update adds new screens.
help.sys-menu.helpDo=[Add folder] Starts a new folder.\n[Add screen] Links an active screen into the menu.\n[Save] Changes the name, parent folder, order or active flag. Inactive items are hidden.\n[Expand all] and [Level 1 only] open or fold the tree.
help.sys-menu.helpNote=New screens from an update are not added to the menu automatically.\nMenu items are hidden, not deleted.\nAn item stays invisible to people without search rights on that screen.
help.sys-dept.helpWhy=Each person and the department choices on other screens all come from this tree. Without it, departments are typed as free text.
help.sys-dept.helpWhen=Step 2 of the system administration flow. Open it before adding users and whenever the organisation changes.
help.sys-dept.helpDo=[Add top level] Starts a new top-level department.\n[Add child] Starts a new department under the selected one.\n[Save] Adds or changes the name, parent, order or active flag.\n[Expand all] and [Level 1 only] open or fold the tree.
help.sys-dept.helpNote=Departments are deactivated, not deleted.\nDeactivate active child departments first.\nA person is moved to another department in user management, not here.
help.sys-policy.helpWhy=Changes behaviour that differs per customer, such as approval use, password rules or Excel limits, without changing the program.
help.sys-policy.helpWhen=Step 6 of the system administration flow. Open it when setting company rules, or when you decide to turn approval or a security rule on or off.
help.sys-policy.helpDo=[Search] Finds policies by category, key or changed only.\n[Save] Stores a company or plant value. The feature uses it from its next action.\n[Reset to default] Removes the company or plant value and returns to the default.
help.sys-policy.helpNote=Security policies (password, login, MFA, AI, attachments, self approval) can be changed only by the administrator group.\nTurning on an approval policy replaces direct release or close with an approval request.\nA plant value overrides the company value in that plant.
help.sys-code.helpWhy=Lets the company add its own choices such as units, downtime reasons or payment terms. System codes are shown too but cannot be edited.
help.sys-code.helpWhen=Step 6 of the system administration flow. Open it when a screen choice list lacks an item your company needs.
help.sys-code.helpDo=[New] Starts a company code in the selected group.\n[Save] Adds a code or changes its name, order or active flag.
help.sys-code.helpNote=A code cannot be changed after it is added, because records store the code text.\nCodes are deactivated, not deleted. Existing records keep them.\nUnit decimal places can only be increased.
help.sys-numbering.helpWhy=Lets the company set the shape of document numbers such as orders, work orders and lots. Numbers are taken in the same transaction as the business save, so there are no gaps.
help.sys-numbering.helpWhen=Step 6 of the system administration flow. Open it during setup to continue an existing numbering scheme, or when changing the number format.
help.sys-numbering.helpDo=[New] Starts a rule code, pattern and reset cycle.\n[Save] Adds a rule or changes its pattern or cycle.\nThe next number preview shows the result before saving and does not use up a number.
help.sys-numbering.helpNote=Changing the pattern or cycle can collide with numbers already issued, and the business save then fails.\nThe rule code is the name the business logic calls, so it cannot be changed after it is added.
help.sys-comp.helpWhy=This is where the company sets its own name, default language and time zone. A wrong time zone shifts work dates and number dates by a day.
help.sys-comp.helpWhen=Step 1 of the system administration flow. Open it on day one to check company details, or when a plant moves and the time zone changes.
help.sys-comp.helpDo=[Save] Updates the company name, contacts and default language.\n[Save] Changing the time zone requires ticking the confirmation box.
help.sys-comp.helpNote=Only the administrator group can change the time zone.\nA new time zone immediately changes work dates, number dates and shift judgement.\nCompany status and active flag cannot be changed here. The operator handles them.
help.sys-inbox.helpWhy=Shows everything addressed to you in one place, such as approval turns, daily due summaries, security alerts and notices. Otherwise you would check each screen.
help.sys-inbox.helpWhen=Step 8 of the system administration flow. Open it when the bell in the header shows a number, or in the morning for the daily summary.
help.sys-inbox.helpDo=[Notifications] Clicking one marks it read and opens the related screen.\n[Mark all read] Marks all unread notifications as read.\n[More] Loads older notifications.\n[Notices] Shows posted notices and attachments.\n[Settings] Turn events on or off, then [Save].
help.sys-inbox.helpNote=Turning a notification back on does not deliver what was missed meanwhile.\nNotifications for screens you cannot see are not delivered even when on.
help.sys-notice.helpWhy=One place for company notices and shared forms or manuals. Posted notices appear on the notice tab of every inbox.
help.sys-notice.helpWhen=Step 8 of the system administration flow. Open it to announce maintenance or rule changes, or to share form files.
help.sys-notice.helpDo=[New] Enter category, title, body, posting period and pin flag.\n[Save] Posts or edits the notice. It is visible from the start date to the end date.\nAttached files can be downloaded by anyone while the notice is posted.\n[Search] Finds notices by category or state.
help.sys-notice.helpNote=Notices are taken down by deactivating, not by deleting.\nThe body is plain text without formatting.\nNo mail is sent. Users read it in their inbox.
help.sys-access-log.helpWhy=Lets company administrators see failed logins, lockouts and permission denials themselves, so account abuse or out-of-scope attempts are noticed early.
help.sys-access-log.helpWhen=Step 9 of the system administration flow. Open it after a security alert notification, or when someone reports they cannot log in.
help.sys-access-log.helpDo=[Search] Filters by period, event, severity, result, login ID or IP.\n[Permission changes only] Shows only lock, reset and denial records.\n[Reset] Restores the default search conditions.
help.sys-access-log.helpNote=This screen is read only. Unlock users in user management.\nExcel download is not available.
help.sys-audit-log.helpWhy=Shows in one place who changed what and when across screens, with before and after values side by side.
help.sys-audit-log.helpWhen=Step 9 of the system administration flow. Open it to trace how a permission or setting changed, or when data changed unexpectedly.
help.sys-audit-log.helpDo=[Search] Filters by period, screen, action or actor.\n[Permission changes only] Shows only user, group and permission table changes.\nSelect a row to see the before and after values of the changed fields.
help.sys-audit-log.helpNote=Only data of screens you can search is shown.\nMasked fields such as passwords show only that they changed.
help.sys-feedback.helpWhy=Collects and handles the comments sent with the feedback button on each screen. The sender is notified when it is done.
help.sys-feedback.helpWhen=Step 9 of the system administration flow. Open it when new feedback has piled up or when sorting improvement requests.
help.sys-feedback.helpDo=[Mark seen] Marks new feedback as seen.\n[Mark done] Closes it and notifies the sender in the inbox.\n[Back to new] Returns seen feedback to new.\n[Search] Filters by status, screen or period.
help.sys-feedback.helpNote=Mark done cannot be undone.\nThere is no reply field. Only the status and the notification remain.
help.sys-approval.helpWhy=One place to process approvals for purchase orders, NCR use-as-is, CAPA, controlled documents, risk assessments, gates, ECOs, PFMEA and control plans. Approval changes the document status in the same moment.
help.sys-approval.helpWhen=Step 7 of the system administration flow. Open it when you are notified of your turn, to track a request you submitted, or to delegate before you are away.
help.sys-approval.helpDo=[Approve] Approves your turn. If you are the last approver, the document is released or closed.\n[Reject] Ends the approval and returns the document to draft.\n[Withdraw] Takes back your own request before anyone approves it.\n[Open document] Opens the business screen of that document (for now only PFMEA and control plans — find other documents on their module screen).\n[Create delegation] Lets a delegate act on your approvals for a period.
help.sys-approval.helpNote=Approve and reject cannot be undone.\nSome document types and policies require an electronic signature to approve.\nA delegation cannot be edited. Revoke it and create a new one.
help.home-main.helpWhy=Gathers what needs action now from every module, such as work orders for today, held lots, pending inspections and approvals. Clicking a card number opens that screen with the matching filter.
help.home-main.helpWhen=The first screen after login. Open it to start the day or to check what is left after work.
help.home-main.helpDo=Click a card number to open the list screen with its filter.\nClick a card item to look it up on its screen.\n[Refresh] reloads all cards, and the reload icon on a card reloads only that card.\n[Card settings] chooses which cards you see and their order.\nChoosing a plant switches the plant cards to that plant.
help.home-main.helpNote=Card settings apply only to you.\nReset to default deletes your settings and returns to the role default set.
help.home-card-mgt.helpWhy=Sets which home cards each role sees first, so a line leader and a quality engineer do not get the same card order.
help.home-card-mgt.helpWhen=Used after the auth group step of system administration. Open it when you create a new auth group or a new card appears.
help.home-card-mgt.helpDo=Select an auth group on the left to open its card set.\n[Save] Stores the card order and default hiding.\n[Clear set] Deletes the group set and returns to the default order.
help.home-card-mgt.helpNote=A set grants no rights. Cards for screens without search rights stay hidden.\nUsers who saved their own card settings keep them first.\nClear set cannot be undone.
help.aps-plan.helpWhy=Calculates whether the plan dates of the work orders actually fit equipment and shift capacity. Without it you cannot see ahead of time which jobs collide on the same equipment or will miss their due date.
help.aps-plan.helpWhen=Step 3 of the order-to-shipment flow. Calculate and apply after work orders are created and before release, or whenever orders pile up or equipment stops and the schedule must be redone.
help.aps-plan.helpDo=[New plan] [Calculate] Builds a new plan version from planned, released and in-progress work orders (work orders are not changed)\n[Preview apply] [Apply] Writes the dates and equipment of the chosen plan into the work orders (applied); if work orders changed after the calculation it is refused and asks you to recalculate\n[Compare] Shows the per-operation differences between two plan versions\nDragging a Gantt bar pins that operation, and the next calculation keeps the pin\n[Discard] Throws away a plan version you will not use (cannot be undone)\n[Promise date] Only calculates when a new item and quantity would finish
help.aps-plan.helpNote=Calculating alone does not change any work order.\n[Apply] also needs save permission on work orders.\nIf work orders change after the calculation, that plan can no longer be applied.
help.plm-ecr.helpWhy=Keeps change ideas in one place as requests instead of scattered mails and talks, so a reviewer can accept them into a change order.
help.plm-ecr.helpWhen=Steps 1 to 2 of the design change flow. Open it to raise a request when a design problem or improvement comes up, and for the reviewer to accept or reject it.
help.plm-ecr.helpDo=[New], [Save] Raise an open request with title, reason and main item. Only the requester can edit it.\n[Cancel request] The requester cancels an open request.\n[Accept] Creates a new draft change order or adds the request to an existing draft order.\n[Reject] Closes the request with a reason.
help.plm-ecr.helpNote=Accepting does not change any BOM or routing. Changes happen only when the change order is released.
help.plm-eco.helpWhy=Bundles a design or process change into one approved order so BOM and routing revisions change from a set date, and traces the LOTs made after it, customer approval, PPAP and customer notices. Companies that forbid releasing BOMs and routings without an order release them only through this screen.
help.plm-eco.helpWhen=Steps 3 to 6 of the design change flow and the PPAP step of new product development. Open it after accepting a request to set targets, to approve, record customer approval and release, and to submit and decide a PPAP.
help.plm-eco.helpDo=[Add object], [Save objects] Set items, draft BOM and routing revisions, drawings, equipment and processes as targets. Find parents with [Impact candidates] and replace BOMs at once with [Preview] and [Replace and add as targets].\n[Submit] Fixes the targets and goes into approval. Approvers [Approve] or [Reject]; the submitter can [Withdraw].\n[Record customer approval], [Record notice] Keep the customer approval result and customer change notices.\n[Release] Releases the target revisions of an approved order from the effective date and closes the previous ones. Production LOTs made after it are marked.\n[Create PPAP], [Submit], [Record decision] Prepare and submit the customer PPAP and record the result. Approval also fills customer approval.\n[Cancel order] Cancels a draft or approved order. Target revisions stay as drafts.
help.plm-eco.helpNote=Only draft BOM and routing revisions can be targets. Create a new revision on those screens first.

policy.QMS_SPC_AUTO_HOLD=Hold the inspected lot automatically on an SPC violation (off · out-of-limit rules only · all enabled rules). The hold is released when that violation is closed or voided (production module required)
error.qmsSpcHoldUnavailable=Lot hold is not available (no production module). Turn off the policy "auto-hold on SPC violation" and try again.
js.qms.spcEvent.hold=Lot hold
js.qms.spcEvent.holdOn={0} — held by this violation
js.qms.spcEvent.releaseHold=The hold on {0} by this violation will be released (the lot stays on hold if other reasons remain).
# POP breakdown photos (docs/25 4.44, CMS C25)
pop.bdPhoto=Photos
pop.bdPhotoAdd=Take photo
