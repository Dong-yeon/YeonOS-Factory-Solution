help.mst-cust=Register and manage customers and suppliers. Select a row on the left to open its details on the right. Right-click the list for copy, Excel, column, and change-history options.
help.mst-cust.custCd=A customer code unique within your company. Use uppercase letters, digits, - and _ only; lowercase is converted to uppercase.
help.mst-cust.custNm=Enter the official business name used on tax invoices.
help.mst-cust.custType=Choose Customer (we sell to), Supplier (we buy from), or both.
help.mst-cust.bizNo=The 10-digit business registration number. Hyphens are optional. The number is checked with the official check digit.
help.mst-cust.searchCustCd=Finds codes that start with this text.
help.mst-cust.searchCustNm=Finds names containing this text. % and _ are matched literally.
help.mst-item=Register and manage items (finished, semi-finished, raw, sub material, consumable). BOMs, routings, stock and inspections all refer to items. Disabling keeps history but hides the item from new picks.
help.mst-item.itemCd=Item number, unique in your company. Upper-case letters, digits and - . / _ are allowed; lower case is converted (e.g. 84910-2S000).
help.mst-item.itemNm=Item name. Items with the same name are told apart by item code.
help.mst-item.unitCd=Base unit for stock and production. Each unit has its own decimal places (EA 0, kg 3).
help.mst-item.netMassKg=Net mass (kg) of one base unit, used for carbon allocation and export declarations. Values are not rounded; use up to 6 decimals.
mstItem.col.stdPrice=Standard price
mstItem.priceHint=Per base unit; blank = no price (not zero)
help.mst-item.stdPrice=Standard price of one base unit (company base currency), used for COPQ quality cost estimates. Leave blank for no price; no amount is produced. A change applies to events after it and is kept in history.
help.mst-item.hsCd=Customs tariff number (6-digit HS up to 10-digit national code). Dots and hyphens are removed.
help.mst-item.searchItemCd=Finds items whose system code or ERP/customer part number starts with this text (case-insensitive).
help.mst-item.searchItemNm=Finds items whose name or spec contains this text.

