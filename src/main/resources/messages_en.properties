help.pms-project=Manage the WBS and schedule of projects (launch of a new part, 4M change, equipment introduction …). Dates, progress and status of a task with sub-tasks are calculated from the sub-tasks. The PM changes the structure and plan; task owners can enter progress (actual dates, progress, status).
help.pms-project.custCd=Customer code from Customers (optional).
help.pms-project.sopDate=Customer start of production. A template based on SOP is laid out backwards from this date.
help.pms-project.itemCds=Part numbers developed or changed by this project (item codes). Separate with commas or spaces.
help.pms-project.startDate=The day the first task starts when the template is based on the start date.
help.pms-project.gantt=The Gantt chart is view only. Select a task and change it in the form on the right. Keys: up/down to move, left/right to collapse or expand, Enter to the form. The red line is today; red names are late.
help.pms-project.actEnd=An actual end date saves the task as Done (100%). Dates after today are not allowed.
help.pms-project.planHours=Enter planned effort in hours (MD is shown using the company hours-per-day policy). Tasks with sub-tasks sum their sub-tasks; actuals count confirmed hours only.
help.pms-project.workdays=Enter a number of workdays to fill the planned end, counting workdays on the company holiday calendar from the planned start (the start counts as day 1 if it is a workday). [From effort] sets the workdays as planned effort ÷ company hours per day (rounded up). Only the date is saved; other calculations (lag, push, due-soon, baseline) stay in calendar days.
help.pms-project.chgReq=An owner who needs different planned dates requests them with a reason. Depending on the company policy it is approved through approval (default approver = PM) or directly by the PM; it cannot be approved if the task changed meanwhile. With a baseline it is kept in the plan change history and the baseline stays. Successors are not pushed automatically.
help.pms-project.taskStatus=If empty, the status follows the actual dates (end → Done, start → In progress, none → Not started).
help.pms-template=Define the WBS copied when a project is created. Schedules are days from the base date (start date or SOP). Changing a template does not change projects already created.
help.pms-template.apqp=Creates a five-phase APQP template written in general terms (a gate per phase, based on SOP). Adapt it to your company. If it exists, it opens.
help.pms-template.anchor=With SOP as the base, tasks before SOP have negative days (e.g. 120 days before SOP = -120).
help.pms-template.offsetDays=Task start in days from the base date. 0 = the base date, negative = before it.
help.pms-template.previewBase=Lays out the Gantt chart with this date as the base date. Not saved.
