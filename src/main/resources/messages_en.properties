help.cms-fail-code=Manage the symptom, cause and action codes used for breakdown reports and repairs. Categories are a common standard for every company and cannot be extended. Starting with 6 to 8 codes plus "other" works best on the floor.
help.cms-fail-code.codeType=Symptom (what was seen), cause (why), action (what was done). Cannot be changed later.
help.cms-fail-code.failCd=Code unique within its type. Cannot be changed later (history keeps the code).
help.cms-fail-code.failCat=Causes need a category — it is the key for cross-company comparison and failure pattern analysis.
help.cms-fail-code.equipClassCd=If set, the code can only be used on work orders for equipment of that class. Leave blank to use it everywhere.
help.cms-equip-profile=Set maintenance criticality, key-equipment flag and default maintenance owner per equipment. The history card below shows installed molds and recent work orders.
help.cms-equip-profile.criticality=A means the line stops when this equipment stops. Plan preventive maintenance and spare parts for these first.
help.cms-equip-profile.keyEquipYn=Key process equipment under IATF 16949 8.5.1.5 — subject to maintenance objectives and spare part control.
help.cms-equip-profile.owner=When a breakdown report is accepted without an assignee, this person becomes the assignee.
help.cms-breakdown=Report a problem with equipment right away. Find the equipment, tap a symptom or describe it. The maintenance owner enters cause and action after the repair.
help.cms-breakdown.find=Type part of an equipment code or name and press Find. Scanning the QR code on the equipment opens this screen for that equipment.
help.cms-mwo=Manage breakdown repairs and improvements from acceptance to confirmation. Symptom, cause, action and work done are only required when finishing, and a finished order cannot be changed (further work = new work order).
help.cms-mwo.mwoType=Breakdown repair (stopped or abnormal equipment) or improvement (not a failure, but something to change). Preventive work orders are created by preventive maintenance plans.
help.cms-mwo.targetCd=Equipment code or mold/jig code. Gauges are handled by quality calibration.
help.cms-mwo.assignee=If left blank, the default owner from the equipment profile is used. Starting without an assignee makes the person who started it the assignee.
help.cms-mwo.downEndAt=The period the equipment was stopped. The end time is needed to finish.
help.cms-mwo.cause=Required to finish a breakdown repair. If unknown, create a cause code under the "Unknown" category.
help.cms-mwo.workText=Briefly, what was done. The next person facing the same failure will read it.
