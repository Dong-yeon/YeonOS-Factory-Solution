help.prd-serial=Records the parts actually built into each finished unit (serial), the as-built. Installing consumes the part lot (genealogy); removal and replacement keep a reversing row instead of deleting. Compare against the design BOM to see missing parts, substitutes and extras.
help.prd-serial.helpWhy=Units built to the same design still differ by substitutes, extra parts and replacements. Recording each unit lets you answer customer questions and recalls about what went into which unit.
help.prd-serial.helpWhen=Open it while assembling after the work order is released. Install as you fit parts, remove or replace when you change them, and check the BOM comparison before completion.
help.prd-serial.helpDo=[New serials] pick an order and the number of units; numbers are automatic\n[Install] part item, lot (lot-controlled items), part serial (if any), quantity\n[Remove] with a reason a reversing row is kept and the lot quantity comes back\n[Replace] removal and a new install at once\nBOM comparison shows missing, short, over, substitute and extra
help.prd-serial.helpNote=One part serial can be installed in only one unit.\nIf two people save the same serial at once, the later save is refused: reload and retry.\nMissing required parts do not block operation completion; you only get a warning.
help.prd-serial.keyword=Part of a serial number or an order number.
help.prd-serial.woNo=Start of the order number. Leave empty for recent orders.
help.prd-serial.count=Units to create at once (1 to 100), not more than the planned quantity.
help.prd-serial.itemCd=The item code of the part to install.
help.prd-serial.lotNo=Scan the label for a lot-controlled part. The installed quantity is consumed from that lot.
help.prd-serial.partSerialNo=The serial on the part nameplate, if any. With it the quantity is 1.
help.prd-serial.opSeq=The operation number where the part was fitted. Optional.
help.prd-serial.occurredAt=When it was actually fitted (plant local time, e.g. 2026-11-16T14:30). Empty means now.
help.prd-serial-trace=Find the unit serials a part lot or part serial went into, including units reached through lots linked by genealogy (sub-assemblies), showing whether the part is still installed or was removed.
help.prd-serial-trace.helpWhy=For a part defect or recall you must find every unit that contains the part. Units that once held it may also be affected, so removed parts are shown too.
help.prd-serial-trace.helpWhen=Open it for a supplier defect notice, a customer claim, or a nonconformance investigation.
help.prd-serial-trace.helpDo=[Search] part lot number (scan), or part item code + part serial\nEach row = unit serial x install record (installed or removed)\n[Open serial as-built] jump to the selected unit\n[Excel] from the grid menu downloads the recall list
help.prd-serial-trace.helpNote=An empty via lot means that lot or serial was installed directly.\nOnly the first 5,000 rows are shown.
help.prd-serial-trace.lotNo=Scan the part lot label or enter its number.
help.prd-serial-trace.partSerialNo=The serial on the part nameplate. Enter it with the part item code.

