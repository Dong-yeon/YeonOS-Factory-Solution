help.qms-preship-tpl=Create pre-shipment checklists per item or item class. Each line sets whether N/A is allowed and whether a photo is required.
help.qms-preship-tpl.helpWhy=If everyone checks different things before shipment, checks get missed. With a checklist the same item is always inspected the same way, and items with a checklist cannot ship without inspection.
help.qms-preship-tpl.helpWhen=Open it before shipping a new item or item class, or when you agree pre-shipment checks with a customer.
help.qms-preship-tpl.helpDo=[New] enter a code, name and target (item or item class) code.\n[Add line] write the check and turn on "N/A allowed" or "Photo required" when needed.\n[Save]. Set unused checklists to inactive.
help.qms-preship-tpl.helpNote=An item checklist wins over an item class checklist. One active checklist per target.\nEditing a checklist does not change inspections already started (they keep a copy).
help.qms-preship-tpl.keyword=Search by part of the checklist code, name or target code.
help.qms-preship-tpl.tplCd=Unique code in the company (letters, digits, _.-). Cannot change after creation.
help.qms-preship-tpl.tplNm=Checklist name shown on screens and Excel.
help.qms-preship-tpl.targetType=Use it for one item or for a whole item class.
help.qms-preship-tpl.targetCd=Target item code or item class code (active only).
help.qms-preship=Judge each checklist line per shipment and keep photo evidence. Shipment confirm requires a completed inspection (no open punch items or conditional approval).
help.qms-preship.helpWhy=A missed check found after shipment is hard to undo. Shipment confirm checks the inspection, so nothing leaves without it.
help.qms-preship.helpWhen=Open it after picking and before shipment confirm. When a customer witnesses, record the witness name.
help.qms-preship.helpDo=Select a shipment and [Start inspection].\nPress [Pass], [Fail] or [N/A] for each line. Upload a photo first for photo-required lines. Fail needs a remark and raises a punch item.\nEnter the inspector name and [Complete inspection] (approval permission).
help.qms-preship.helpNote=Punch items are closed on the punch list screen with an action and re-check, or an approver allows conditional shipment with a reason.\nIf a new item is added to the shipment after the inspection, shipment confirm is blocked — [Cancel inspection] and start again.
help.qms-preship.keyword=Search by part of the shipment no., customer name or inspection no.
help.qms-preship.inspStatus=Not started = shipments whose inspection has not started.
help.qms-preship.inspectorNm=Name of the person who inspected (required to complete).
help.qms-preship.witnessNm=Customer witness name for witnessed inspections (optional).
help.qms-preship-punch=Lines that failed the pre-shipment inspection. Close them with an action and re-check.
help.qms-preship-punch.helpWhy=Keeping failed lines in a list and closing them one by one shows what is left, and anything left blocks shipment.
help.qms-preship-punch.helpWhen=Open it when an inspection line fails, or to close lines deferred until after shipment.
help.qms-preship-punch.helpDo=Select a punch item, write the action and press [Close with action and re-check] (upload a photo first for photo-required lines).\nIf it must ship first, an approver writes a reason and presses [Allow conditional shipment].\nIf nonconformance handling is needed, enter the NCR number and press [Link NCR].
help.qms-preship-punch.helpNote=Closed punch items stay as history. If the same line fails again, a new punch item is raised.\nUploading photos needs save permission on the pre-shipment inspection screen.
help.qms-preship-punch.keyword=Search by part of the shipment no., inspection no., item code or check text.
help.qms-preship-punch.actionText=Write what was fixed. Closing re-judges the line as pass.
help.qms-preship-punch.reason=Why it ships with this punch item open (e.g. customer agreement). Cannot be undone.
help.qms-preship-punch.ncrNo=Nonconformance number to link. Disposition is done on the NCR screen.
