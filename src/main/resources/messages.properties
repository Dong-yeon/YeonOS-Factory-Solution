help.sys-outbox=ERP·라벨 프린터·메일·협력사 통지로 내보낸 연계가 잘 나갔는지 보고, 실패한 것을 다시 보내거나 닫는 곳입니다.
help.sys-outbox.helpWhy=연계는 업무 저장과 같이 남고 뒤에서 따로 보냅니다. 상대가 멈추면 정해진 횟수만큼 다시 보낸 뒤 실패로 멈춥니다 — 여기서 그 실패를 찾아 처리합니다.
help.sys-outbox.helpWhen=홈 카드 "연계 실패" 에 숫자가 있을 때, ERP·프린터가 멈췄다가 돌아온 뒤, 협력사가 메일을 못 받았다고 할 때 엽니다.
help.sys-outbox.helpDo=[재시도] 실패한 것을 처음부터 다시 보냅니다(받는 쪽은 같은 메시지 ID 로 중복을 거릅니다).\n[수동 종결] 다른 길로 처리했거나 보낼 필요가 없어졌을 때 사유를 남기고 닫습니다. 실패 건수에서 빠지고 기록은 남습니다.\n[인쇄 이력 열기] 라벨 인쇄면 그 인쇄 이력 화면을 엽니다.
help.sys-outbox.helpNote=요청 내용의 사람 정보(이름·연락처·주소·메일)는 화면에서만 가립니다 — 다시 보낼 때는 원문이 나갑니다.\n회사 정책 "연계 실패 수동 종결에 결재" 를 켜면 종결이 결재를 거칩니다.
help.sys-outbox.status=실패 = 다 시도하고 멈춘 것. 수동 종결 = 사람이 사유를 남기고 닫은 것(보낸 것과 다름). 취소 = 보내기 전에 업무 화면이 거둔 것.
help.sys-outbox.bizKey=업무 번호(출하 번호·발주 번호·인쇄 작업 번호 등)의 앞부분으로 찾습니다.
help.sys-outbox.retry=실패한 것만 다시 보낼 수 있습니다. 시도 수를 0 으로 돌려 곧바로 다시 보냅니다.
help.sys-outbox.closeReason=왜 닫는지(예: ERP 에 직접 입력함, 주문 취소로 필요 없음) 적습니다. 감사 기록에 남습니다.

