help.wms-labeler=오토라벨러(자동 인쇄·부착기)가 박스마다 라벨 데이터를 묻고 결과를 보고합니다. 박스를 미리 등록하면 라벨러가 SSCC 라벨을 붙이고, 뒷단 검증 스캔이 맞아야 "검증 완료"가 됩니다.
help.wms-labeler.helpWhy=라벨러는 박스가 지나가는 몇 초 안에 답을 받아야 합니다. 이 화면은 어떤 박스에 어떤 SSCC 가 붙었는지, 왜 리젝트됐는지를 박스 단위 원장으로 보여 줍니다.
help.wms-labeler.helpWhen=출하 준비 흐름의 라벨 단계입니다. 박스를 등록할 때, 라인에서 리젝트가 났을 때, 라벨러를 설치할 때 엽니다.
help.wms-labeler.helpDo=[박스] 신규로 박스 코드(앞단 스캐너가 읽는 값)·품번·수량을 등록합니다. 목록에서 상태·SSCC·마지막 사유를 보고, 상세에서 요청·답·검증 원장을 봅니다.\n[라벨러] 장치(시스템관리에서 키 발급)·템플릿(PALLET 유형)·응답 기한·연결 방식을 정합니다.
help.wms-labeler.helpNote=리젝트 뒤 다시 붙여도 같은 박스는 같은 SSCC 입니다.\n응답 기한을 넘긴 답은 그 박스에 쓰지 않습니다(리젝트).\n미리 받고 안 쓴 SSCC 는 결번으로 남고 다시 쓰지 않습니다.
help.wms-labeler.boxCd=앞단 스캐너가 박스에서 읽는 값(박스 바코드·작업 바코드)입니다. 끝나지 않은 박스끼리는 겹칠 수 없습니다.
help.wms-labeler.labelSkipYn=이미 라벨이 붙어 들어오는 박스면 "예" — 라벨러가 인쇄 없이 통과시킵니다.
help.wms-labeler.terminalId=이 라벨러를 대신 말하는 장치입니다. 키는 시스템관리 단말·장치 관리에서 "수집 장치"로 발급합니다. 한 장치는 한 라벨러만.
help.wms-labeler.connMode=DIRECT = 라벨러가 사내망으로 서버에 바로 묻습니다(설치형). EDGE = 공장 엣지가 오늘 박스를 SSCC 와 함께 미리 받아 현장에서 답하고 나중에 올립니다(SaaS — 인터넷 지연이 라인을 세우지 않게).
help.wms-labeler.deadlineMs=박스가 라벨 위치를 지나기 전까지의 시간입니다. 이보다 늦은 답은 쓰지 않고 리젝트합니다(늦게 온 정답 = 오답).
