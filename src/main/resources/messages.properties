help.pms-issue.type=결함·위험·요청·질문 중 하나(필수). 회사가 공통코드 화면에서 유형을 더할 수 있습니다. 게이트 조건부 통과와 PFMEA 조치에서 온 이슈는 "위험" 으로 들어옵니다.
