import.guide.salCust=판매 거래처 코드(거래처관리). 사용 중이고 유형이 매출 또는 매출매입이어야 합니다.
import.guide.salPoNo=고객이 준 발주 번호(필수). 거래처 + 발주 번호가 같은 행은 한 수주로 묶이고, 이미 있는 발주면 그 수주에 행을 붙이거나 고칩니다.
import.guide.salLineNo=수주 안의 행 번호(1~99999, 보통 10·20·30). 거래처 + 발주 + 행 번호가 같은 행이 있으면 "새 것 + 변경" 모드에서 수량·납기·비고만 고칩니다(끝난 행은 못 고침).
import.guide.salItem=사용 중인 품목 코드. 있는 행의 품목은 바꿀 수 없습니다(취소하고 새 행으로).
import.guide.salQty=품목 기본 단위 수량. 0보다 커야 하고 단위 자릿수를 넘으면 반올림하지 않고 오류입니다.
import.guide.date=날짜(예: 2026-11-30). 셀 서식이 날짜여도 됩니다.
import.guide.salOrderDate=새 수주에만 씁니다(비우면 오늘). 이미 있는 수주와 다르면 오류입니다.
import.guide.fcstBucket=DAY(일)·WEEK(주)·MONTH(월).
import.guide.fcstStart=기간 시작일. 주는 월요일, 월은 1일이어야 합니다.
import.guide.fcstQty=예상 수량(0 이상). 0 은 "그 기간 수요 없음" 입니다.
import.guide.fcstFirm=Y = 확정 수요(고객이 바꾸지 않기로 한 기간). 비우면 N.
help.sal-order=고객 주문(수주)을 관리합니다. 수주 번호는 자동으로 매겨지고, 고객 발주 번호는 거래처 안에서 겹칠 수 없습니다. 행은 지우지 않고 마감하거나 취소(사유)합니다. 끝난 행은 바꿀 수 없고, 모든 행이 끝나면 수주가 완료(모두 취소면 취소)로 바뀝니다.
