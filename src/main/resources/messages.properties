termEntry.pop.step1=관리자가 "POP 단말 관리" 에서 이 작업장 단말을 등록하고 등록 코드(24시간)를 받습니다.
termEntry.pda.step1=관리자가 "POP 단말 관리" 에서 유형 PDA 로 단말을 등록하고 등록 코드(24시간)를 받습니다. 앱(APK)을 쓰면 "현장 단말 앱" 에서 내려받습니다.
termEntry.step2=이 기기에서 [이 기기 등록] 을 눌러 회사 코드와 등록 코드를 넣습니다. 등록하면 이 브라우저의 사무 로그인이 끝납니다(단말 세션과 섞이지 않게) — 사무 화면은 다시 로그인합니다.
termEntry.step3=등록되면 [단말 화면 열기] 로 들어가 작업자 배지를 찍습니다(사무 로그인과 따로).
termEntry.links=관리 화면
js.termEntry.notRegistered=이 기기는 등록된 단말이 아닙니다. 단말 화면을 열면 등록 화면이 먼저 나옵니다.
