help.qms-copq=품질 문제 때문에 든 비용(COPQ)을 달마다 예방·평가·내부 실패·외부 실패 4구분으로 모아 봅니다. 회계 원장이 아니라 관리용 추정입니다.
help.qms-copq.helpWhy=불량이 얼마나 비싼지 금액으로 보여야 개선 우선순위를 정할 수 있습니다. 폐기·재작업·선별 수량은 이미 NCR 처리에 있으니 품목 표준단가만 곱해 추정합니다.
help.qms-copq.helpWhen=월 마감 뒤 품질 회의 전에 엽니다. 품목 표준단가는 품목관리에서 넣습니다(ERP 가 품목 주인이면 ERP 에서).
help.qms-copq.helpDo=시작·끝 달을 고르고 [조회]합니다.\n원장 내역에서 단가 없음 줄이 있으면 품목관리에서 그 품목의 표준단가를 넣습니다(넣은 뒤 종결되는 NCR 부터 금액이 붙습니다).\n원장에 없는 비용은 수동 비용에 달·구분·항목·금액을 넣고 [저장]합니다.\n[엑셀] 은 원장 내역·수동 비용을 한 시트로 받습니다(종류·구분·달 열로 피벗하면 월별 합계와 같습니다).
help.qms-copq.helpNote=금액 = 처리 수량 × NCR 종결 때의 표준단가입니다. 나중에 단가를 고쳐도 지난 달 금액은 바뀌지 않습니다.\n단가가 없으면 금액을 비우고 건수만 셉니다(0원으로 더하지 않음).\n생산 실적의 폐기·재작업·수리는 그 달 말 표준단가로 셉니다. 실적 정정은 정정한 달에 음수로 반영됩니다. 같은 불량이 NCR 처리와 생산 실적 두 출처에 보일 수 있습니다.
