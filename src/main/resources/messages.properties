help.wms-stock=공장의 현재고(품목 × 위치 × 재고 상태)입니다. 현재고는 수불 원장을 더한 값이라 직접 고칠 수 없고, 조정·이동은 "재고 이동·조정" 화면에서 합니다. "대사 실행"은 원장 합과 현재고가 같은지 확인만 합니다(다르면 알림, 자동으로 고치지 않음).
help.wms-trx=재고가 움직인 모든 기록입니다. 지우거나 고치지 않습니다 — 잘못 넣었으면 역분개(반대 수량의 새 행)로 되돌립니다. 이동은 출고·입고 두 행이 함께 되돌아갑니다.
help.wms-trx.reason=왜 되돌리는지 적습니다. 원래 행과 역분개 행이 모두 남습니다.
help.wms-move=재고를 옮기거나(위치·상태) 늘리고 줄입니다(조정 — 사유 필수). 스캔 칸에 위치 라벨을 찍으면 위치가, 품목 라벨을 찍으면 품번이 채워집니다. 확정은 한 번만 됩니다(같은 화면에서 다시 눌러도 두 번 들어가지 않음).
