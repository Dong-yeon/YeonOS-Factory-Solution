help.pms-home.portfolio=SOP 까지 = 고객 양산 시작까지 남은 날. 기준선 대비 = 지금 계획 끝 − 최신 기준선 끝(+ 는 늦어짐). 준비율 = 필수 산출물 중 승인·면제 비율. 행을 누르면 인쇄용 보고서가 아래에 열립니다.
help.pms-home.chart=조회 조건에 맞는 프로젝트 전체(쪽 나눔 없음)를 상태별로 셉니다. 파란 막대 = 프로젝트 수, 빨간 막대 = 계획 끝이 지난 잎 작업이 있는 프로젝트 수, 글자의 "기준선보다 늦음" = 지금 계획 끝이 최신 기준선보다 늦은 프로젝트 수(목록의 기준선 대비 + 와 같은 계산).
help.pms-home.trend=조회 조건에 맞는 프로젝트로 셉니다. 연도별: 파란 막대 = 계획 시작이 그 해인 프로젝트(작성 중 포함), 초록 막대 = 그 해에 종료된 프로젝트(종료일 기준, 취소 제외). 조건이 "진행 중" 이면 종료 프로젝트가 빠지므로 종료를 보려면 상태를 전체·종료로 바꾸세요. 유형별: 파란 막대 = 프로젝트 수, 초록 막대 = 그중 진행 중.
