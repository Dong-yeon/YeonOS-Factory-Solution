js.tip.qms-preship.judgeOK=이 항목을 합격으로 판정합니다. 사진 필수 항목은 사진이 먼저 있어야 합니다.
js.tip.qms-preship.judgeNG=이 항목을 불합격으로 판정합니다. 비고에 무엇이 잘못됐는지 적으면 미결이 하나 생깁니다.
js.tip.qms-preship.judgeNA=해당 없음 허용 항목만 — 이번 출하에 해당하지 않는 항목입니다.
js.tip.qms-preship.startBtn=출하 품목마다 양식 항목을 복사해 검수를 시작합니다. 양식을 나중에 고쳐도 이 검수는 그대로입니다.
js.tip.qms-preship.saveHeadBtn=검수자·고객 입회자·비고를 저장합니다.
js.tip.qms-preship.completeBtn=모든 항목이 판정되고 조건부 허용 없는 미결이 없을 때 검수를 끝냅니다. 그 뒤 출하 확정이 열립니다.
js.tip.qms-preship.reopenBtn=완료한 검수를 다시 엽니다(출하 확정 전만). 출하 확정이 다시 막힙니다.
js.tip.qms-preship.cancelBtn=사유와 함께 검수를 취소합니다. 출하 줄이 바뀌었을 때 다시 시작하려고 씁니다.
js.tip.qms-preship-tpl.addLineBtn=확인할 항목을 한 줄 더합니다. [저장] 해야 반영됩니다.
js.tip.qms-preship-punch.closeBtn=조치 내용을 남기고 그 항목을 합격으로 재확인해 미결을 닫습니다(사진 필수 항목은 사진).
js.tip.qms-preship-punch.allowBtn=승인자 권한 — 이 미결이 있어도 출하를 막지 않게 사유와 함께 허용합니다. 미결은 열린 채 남습니다.
js.tip.qms-preship-punch.ncrBtn=번호로 부적합(NCR)을 이어 둡니다. 비우고 누르면 연결을 풉니다.
help.qms-preship-tpl=출하 전 검수에 쓸 점검표(양식)를 품목 또는 품목군별로 만듭니다. 항목마다 "해당 없음" 허용과 사진 필수를 정합니다.
help.qms-preship-tpl.helpWhy=출하 전에 무엇을 볼지 사람마다 다르면 빠뜨립니다. 양식을 정해 두면 같은 품목은 늘 같은 항목으로 검수하고, 양식이 걸린 품목은 검수 없이 출하할 수 없습니다.
help.qms-preship-tpl.helpWhen=새 품목·품목군을 출하하기 전, 또는 고객과 출하 전 확인 항목을 합의했을 때 엽니다.
help.qms-preship-tpl.helpDo=[신규] 코드·이름·대상(품목 또는 품목군) 코드를 넣습니다.\n[항목 추가]로 확인 내용을 적고 필요하면 "해당 없음 허용"·"사진 필수"를 켭니다.\n[저장]합니다. 더 쓰지 않는 양식은 사용을 "미사용"으로 바꿉니다.
help.qms-preship-tpl.helpNote=품목 양식이 품목군 양식보다 먼저입니다. 사용 중 양식은 대상마다 하나입니다.\n양식을 고쳐도 이미 시작한 검수는 시작 때 사본 그대로입니다.
help.qms-preship-tpl.keyword=양식 코드·이름·대상 코드 일부로 찾습니다.
help.qms-preship-tpl.tplCd=회사 안에서 유일한 코드(영문·숫자·_.-). 만든 뒤에는 바꿀 수 없습니다.
help.qms-preship-tpl.tplNm=화면·엑셀에 보이는 양식 이름입니다.
help.qms-preship-tpl.targetType=품목 하나에 쓸지, 품목군(분류) 전체에 쓸지 고릅니다.
help.qms-preship-tpl.targetCd=대상 품목 코드 또는 품목군 코드입니다(사용 중인 것만).
help.qms-preship=출하마다 양식 항목을 하나씩 판정하고 사진 증빙을 남깁니다. 검수가 끝나야(미결이 없거나 조건부 허용) 출하 확정이 됩니다.
help.qms-preship.helpWhy=출하 뒤에 빠진 확인이 드러나면 되돌리기 어렵습니다. 출하 확정이 검수 완료를 확인하므로 검수 없이 나가는 일이 없습니다.
help.qms-preship.helpWhen=피킹을 마치고 출하 확정 전에 엽니다. 고객이 입회하면 입회자 이름을 남깁니다.
help.qms-preship.helpDo=출하를 고르고 [검수 시작]합니다.\n항목마다 [합격]·[불합격]·[해당 없음]을 누릅니다. 사진 필수 항목은 사진을 먼저 올립니다. 불합격은 비고가 필요하고 미결이 생깁니다.\n검수자 이름을 넣고 [검수 완료]합니다(승인 권한).
help.qms-preship.helpNote=미결은 검수 미결 화면에서 조치·재확인으로 닫거나, 승인자가 사유와 함께 조건부 출하를 허용합니다.\n검수 뒤 출하 줄에 새 품목이 들어가면 출하 확정이 막힙니다 — [검수 취소] 뒤 다시 시작합니다.
help.qms-preship.keyword=출하 번호·고객 이름·검수 번호 일부로 찾습니다.
help.qms-preship.inspStatus=검수 없음 = 아직 시작하지 않은 출하입니다.
help.qms-preship.inspectorNm=검수를 한 사람 이름(완료 때 필수).
help.qms-preship.witnessNm=고객 입회 검수일 때 입회자 이름(선택).
help.qms-preship-punch=출하 전 검수에서 불합격(NG)이 난 항목 목록입니다. 조치하고 재확인해 닫습니다.
help.qms-preship-punch.helpWhy=불합격 항목을 목록으로 두고 하나씩 닫아야 무엇이 남았는지 보이고, 남은 것이 있으면 출하가 막힙니다.
help.qms-preship-punch.helpWhen=검수에서 불합격이 났을 때, 출하 후 조치로 넘긴 항목을 닫을 때 엽니다.
help.qms-preship-punch.helpDo=미결을 고르고 조치 내용을 적은 뒤 [조치·재확인 닫기]를 누릅니다(사진 필수 항목은 사진을 먼저).\n출하를 먼저 해야 하면 승인자가 사유를 적고 [조건부 출하 허용]을 누릅니다.\n부적합 처리가 필요하면 NCR 번호를 넣고 [NCR 연결]합니다.
help.qms-preship-punch.helpNote=닫힌 미결은 이력으로 남습니다. 같은 항목이 다시 불합격이면 새 미결이 생깁니다.\n사진 올리기는 출하 전 검수 화면 저장 권한이 필요합니다.
help.qms-preship-punch.keyword=출하 번호·검수 번호·품목 코드·확인 내용 일부로 찾습니다.
help.qms-preship-punch.actionText=무엇을 고쳤는지 적습니다. 닫을 때 그 항목은 합격으로 다시 판정됩니다.
help.qms-preship-punch.reason=왜 이 미결을 남긴 채 출하하는지(고객 합의 등)를 적습니다. 되돌릴 수 없습니다.
help.qms-preship-punch.ncrNo=이어 둘 부적합 번호입니다. 처분은 부적합 화면에서 합니다.
# ---------- 회사별 사용 모듈 (docs/80) ----------
prog.sysModule=사용 모듈
error.moduleDisabled=이 회사에서 쓰지 않는 모듈입니다. 필요하면 관리자가 시스템 > 사용 모듈에서 켭니다.
error.moduleDependency=함께 켜야 하는 모듈이 꺼져 있어 저장하지 않았습니다.
module.dep.requires={0} 을(를) 쓰려면 {1} 도 켜야 합니다.
page.moduleDisabled.title=쓰지 않는 모듈
page.moduleDisabled.message=이 회사는 이 화면이 속한 모듈을 쓰지 않습니다. 필요하면 관리자가 시스템 > 사용 모듈에서 켭니다.
sysModule.intro=이 회사가 쓸 업무 모듈을 고릅니다. 끈 모듈은 메뉴·화면·현장 단말에서 숨고, 데이터는 그대로 남아 다시 켜면 보입니다.
sysModule.col.name=모듈
sysModule.col.on=사용
sysModule.col.progCount=화면 수
sysModule.col.requires=필수 짝
sysModule.col.recommends=함께 쓰면 좋음
sysModule.reload=다시 읽기
sysModule.note=시스템(사용자·권한·결재·알림·홈)은 항상 켜져 있습니다. 저장한 뒤 왼쪽 메뉴는 새로 고침하면 바뀝니다.
js.sysModule.needs={0} 을(를) 쓰려면 {1} 도 켜야 합니다.
js.sysModule.always=항상 켜짐
js.sysModule.saved=저장했습니다. 화면을 새로 고침하면 메뉴가 바뀝니다.
js.tip.sys-module.reloadBtn=저장하지 않은 스위치 변경을 버리고 회사 설정을 다시 읽습니다.
js.tip.sys-module.saveBtn=켠 모듈만 메뉴·화면·현장 단말에 보이게 저장합니다. 끈 모듈의 데이터는 지우지 않습니다.
help.sys-module=이 회사가 쓸 업무 모듈(생산·품질·창고·설비 등)을 켜고 끕니다. 끈 모듈은 메뉴·화면·API·현장 단말에서 숨습니다.
help.sys-module.helpWhy=쓰지 않는 모듈 화면이 메뉴에 섞이지 않게, 회사가 실제로 쓰는 범위만 보이게 합니다.
help.sys-module.helpWhen=도입 때 쓸 모듈을 정할 때, 새 모듈을 쓰기 시작하거나 그만 쓸 때 엽니다.
help.sys-module.helpDo=[사용] 스위치로 모듈을 켜고 끕니다. 필수 짝이 꺼져 있으면 아래에 안내가 나오고 저장이 막힙니다.\n[저장] 바꾼 설정을 저장합니다. 메뉴는 새로 고침하면 바뀝니다.\n[다시 읽기] 저장하지 않은 변경을 버립니다.
help.sys-module.helpNote=끄기는 숨김입니다 — 데이터는 지우지 않으므로 다시 켜면 그대로 보입니다.\n관리자 그룹도 꺼진 모듈 화면은 열 수 없습니다.\n필수 짝(예: 품질은 생산·창고, 구매는 창고)은 자동으로 켜지지 않습니다. 직접 켭니다.
ops.modules=사용 모듈
