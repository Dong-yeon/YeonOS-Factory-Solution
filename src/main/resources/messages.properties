help.qms-ocap.seq=고르기 목록의 순서(작은 것부터). 공통 항목이 먼저 나옵니다.
help.qms-ocap.actionText=현장이 할 일을 한 문장으로(예: 같은 LOT 재측정 5개). 고친 뒤에도 이미 고른 기록은 고르던 때 문구 그대로입니다.
help.qms-ocap=SPC 위반(관리 이탈)이 났을 때 현장이 따를 표준 조치(OCAP) 목록을 규칙별로 관리합니다. 위반 조치를 기록할 때 이 목록에서 고릅니다.
help.qms-ocap.helpWhy=위반마다 조치를 매번 새로 적으면 사람마다 다르고 빠뜨립니다. 정해 둔 조치를 고르게 하면 같은 위반에 같은 대응이 남고, 감사 때 무엇을 했는지 한눈에 보입니다.
help.qms-ocap.helpWhen=관리도 고정 한계를 정한 뒤, 또는 조치 기준이 바뀔 때 엽니다. SPC 관리도 화면의 위반 조치(ACTION)가 이 목록을 씁니다.
help.qms-ocap.helpDo=[신규] 규칙(비우면 공통)·순서·조치 문구를 넣고 [저장]합니다.\n더 쓰지 않는 항목은 사용을 "미사용"으로 바꿉니다(지우지 않습니다).\nSPC 관리도 → 위반 → 조치에서 그 규칙과 공통 항목이 체크 목록으로 나옵니다.
help.qms-ocap.helpNote=고른 기록에는 고른 순간의 문구가 사본으로 남습니다. 목록을 고치거나 사용 중지해도 옛 기록은 바뀌지 않습니다.\n같은 규칙 안에 같은 문구는 한 번만 쓸 수 있습니다.
