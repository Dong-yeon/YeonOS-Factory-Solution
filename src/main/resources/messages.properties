help.cms-fail-code.failCat=원인은 상위 분류가 필수입니다 — 회사 간 비교와 고장 패턴 분석의 기준입니다.
help.cms-fail-code.equipClassCd=고르면 그 클래스 설비의 작업지시에서만 이 코드를 고를 수 있습니다. 비우면 모든 설비·금형에서 씁니다.
help.cms-equip-profile=설비마다 보전 중요도·핵심 설비 여부·기본 보전 담당을 정합니다. 아래 이력 카드에서 지금 달린 금형과 최근 작업지시를 봅니다.
help.cms-equip-profile.criticality=A 는 멈추면 라인이 서는 설비입니다. 예방점검·예비품을 먼저 챙길 대상입니다.
help.cms-equip-profile.keyEquipYn=IATF 16949 8.5.1.5 의 핵심 공정 설비 — 보전 목표·예비품 관리 대상입니다.
help.cms-equip-profile.owner=고장 신고를 접수할 때 담당을 비우면 이 사람이 담당이 됩니다.
help.cms-breakdown=설비가 이상하면 여기서 바로 신고합니다. 설비를 찾고 현상을 누르거나 글로 쓰면 됩니다. 원인·조치는 보전 담당이 고친 뒤 넣습니다.
help.cms-breakdown.find=설비 코드나 이름 일부를 넣고 찾기. 설비에 붙은 QR 을 찍으면 바로 이 화면이 그 설비로 열립니다.
help.cms-mwo=고장 수리·개선 작업을 접수부터 확인까지 관리합니다. 완료할 때만 현상·원인·조치와 작업 내용이 필요하고, 완료한 뒤에는 고칠 수 없습니다(다시 손볼 일은 새 작업지시로).
help.cms-mwo.mwoType=고장 수리(멈췄거나 이상한 설비)와 개선(고장은 아니지만 바꿀 것). 예방 점검은 예방점검 계획이 만듭니다.
help.cms-mwo.targetCd=설비 코드 또는 금형·지그 코드. 게이지는 품질의 교정 관리에서 다룹니다.
help.cms-mwo.assignee=비우고 저장하면 설비 프로필의 기본 담당이 들어갑니다. 담당 없이 착수하면 착수한 사람이 담당이 됩니다.
help.cms-mwo.downEndAt=설비가 멈췄던 구간입니다. 완료하려면 끝 시각이 필요합니다.
help.cms-mwo.cause=고장 수리를 완료할 때 필수입니다. 모르면 상위 분류 "원인 불명" 코드를 만들어 쓰세요.
help.cms-mwo.workText=무엇을 했는지 짧게. 다음 사람이 같은 고장을 만났을 때 읽습니다.
