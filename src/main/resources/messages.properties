# ---------- 장비 연동 E0 (docs/65 16장) ----------
prog.cmsEquipLink=설비 연동
help.cms-equip-link=설비마다 누가 대신 말하는지(수집 장치·엣지)와 연결 방식(직접 = 설치형, 엣지 = SaaS)을 정하고, 연결 상태·장비 상태(PackML)·명령·연동 사건·수신 원문을 봅니다. 연결 상태는 마지막 수신 + 주기 × 놓친 횟수(회사 정책)로 서버가 판정합니다.
help.cms-equip-link.helpWhy=장비가 보낸 것을 먼저 저장하고 따로 처리해야 상대 장비가 막히지 않고, "안 온 것"(끊김)을 사건으로 만들어야 조용히 멈춘 장비를 놓치지 않습니다. 장비에 쓰는 명령은 의도·쓰기·다시 읽기·결과를 모두 남겨야 누가 무엇을 바꿨는지 설명할 수 있습니다.
help.cms-equip-link.helpWhen=새 장비를 엣지·어댑터에 붙일 때, 끊김·충돌 알람을 받았을 때, 설정값을 원격으로 바꿔야 할 때 엽니다.
help.cms-equip-link.helpDo=[조회] 공장·설비로 연결 상태와 장비 상태를 봅니다\n[저장] 연결 방식·장치·하트비트 주기·명령 쓰기 켬/끔을 정합니다\n[태그 저장] 쓸 수 있는 논리 태그와 값 범위·인터록(쓸 수 있는 장비 상태)을 정합니다\n[명령 보내기] 별도 권한(FN1) — 엣지가 다시 검사하고, 쓴 뒤 다시 읽은 값이 맞아야 완료입니다\n[다시 처리] 격리된 수신 원문을 처리 대기로 되돌립니다
help.cms-equip-link.helpNote=시간이 지나 결과가 오지 않은 명령은 "결과 불명"입니다 — 장비에 이미 썼을 수 있어 자동으로 다시 보내지 않습니다. 현장에서 확인한 뒤 [결과 확정]을 누르세요.\n충돌(같은 업무 키·다른 내용)은 처리하지 않고 증거로 남깁니다.
help.cms-equip-link.connMode=직접(설치형) = 서버가 공장 LAN 의 장비 어댑터에 명령을 보냅니다. 엣지(SaaS) = 공장 안 엣지가 바깥으로 연결해 명령을 가져갑니다. 받는 길은 둘 다 같습니다.
help.cms-equip-link.terminalCd=이 설비를 대신 말하는 수집 장치(POP 단말 관리에서 유형 "수집 장치"로 등록). 다른 장치가 이 설비 상태를 보내면 거부합니다.
help.cms-equip-link.adapterUrl=직접 연결일 때만 — 명령을 보낼 어댑터 주소(사설 대역만). 보낼 때마다 주소를 다시 확인합니다.
help.cms-equip-link.hbSec=엣지가 이 설비의 하트비트를 보내는 주기. 주기 × 놓친 횟수(회사 정책)를 넘기면 끊김으로 판정합니다.
help.cms-equip-link.writeEnabledYn=켜야만 명령을 보낼 수 있습니다(쓰기는 별도 활성화 — docs/05).
help.cms-equip-link.tagCd=서버에 장비 주소(Modbus 등)는 없습니다 — 논리 이름만. 주소 대응은 엣지 설정입니다.
help.cms-equip-link.allowedStates=이 장비 상태(PackML)일 때만 쓸 수 있습니다(쉼표, 비우면 상태 무관). 서버가 먼저, 엣지·PLC 가 최종으로 확인합니다.
