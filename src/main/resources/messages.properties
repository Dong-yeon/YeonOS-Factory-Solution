apsMrp.ruleNote=수요 = 확정 MPS + 열린 지시의 남은 자재 + 안전재고. 재고·지시·발주를 먼저 쓰고(늦은 공급은 당김 메시지) 모자라면 계획 주문. 계산은 지시·구매 요청을 만들지 않습니다.
