# ---------- APS 10단계 — MRP 자재소요계획 (docs/38 19장) ----------
prog.apsMrp=자재소요계획(MRP)
policy.APS_MRP_OUT_DAYS=MRP 밀기 예외 허용 일수 — 열린 지시·발주가 가장 이른 수요보다 이 일수를 넘게 이르면 "밀기" 제안
valid.APS_MRP_TOO_LARGE=MRP 계산이 너무 큽니다(계획 품목 {0}개·계획 주문 {1}건까지). 기간을 줄이거나 MPS·기준정보를 확인하세요.
valid.APS_MRP_BOM_LOOP=BOM 이 순환하거나 너무 깊습니다(품목 {0}). BOM 을 확인하세요.
help.aps-mrp=확정 MPS 와 열린 지시의 남은 자재·안전재고로 BOM 을 단계별로 전개해, 무엇을 언제 얼마나 만들고 사야 하는지 계획 주문으로 제안합니다. 지시·구매 요청은 만들지 않습니다.
help.aps-mrp.horizonDays=MRP 기간(7~92일). 첫날은 공장 오늘로 고정입니다. 이 기간 밖 수요·공급은 넣지 않습니다.
help.aps-mrp.helpWhy=MPS 는 완제품만 계획합니다. 반제품·원자재를 언제 얼마나 준비할지는 BOM 을 내려가며 재고·지시·발주를 빼고 리드타임만큼 당겨야 보입니다. 없으면 부족을 지시를 만든 뒤에야 압니다.
help.aps-mrp.helpWhen=MPS 를 확정한 뒤, 작업지시·구매 요청을 만들기 전에 계산합니다. 큰 수주·발주 변경이 있으면 다시 계산합니다.
help.aps-mrp.helpDo=[새 MRP] 공장·일수 → [계산] 새 실행 기록(지시·발주는 바뀌지 않습니다)\n계획 주문 표에서 늦음(리드타임 부족)을 확인합니다\n예외 표에서 당김·밀기·취소·줄임 제안을 보고 지시·발주 화면에서 고칩니다\n품목을 고르면 재고/소요 목록, 줄을 고르면 페깅(어느 수주·지시에서 왔나)을 봅니다
help.aps-mrp.helpNote=기존 재고·지시·발주를 먼저 쓰고, 날짜가 늦은 공급은 당겨 쓴다고 보고 "당김" 으로 알립니다. 모자랄 때만 계획 주문을 만듭니다.\n로트·안전재고·자체 생산 리드타임은 계획 기준정보, 구매 리드타임·MOQ·배수는 공급원에서 읽습니다.\n계획 주문 → 작업지시·구매 요청은 다음 단계에서 사람이 골라 만듭니다.
