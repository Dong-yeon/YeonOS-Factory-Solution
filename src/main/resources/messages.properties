sysPdaApp.install.1=단말 설정에서 이 앱의 설치를 허용합니다(출처를 알 수 없는 앱). MDM 이 있으면 MDM 으로 배포합니다.
sysPdaApp.install.2=내려받은 APK 를 단말에 옮겨 설치합니다. 설치 전에 파일의 SHA-256 이 위 값과 같은지 확인하면 바뀐 파일을 막을 수 있습니다.
sysPdaApp.install.3=처음 열 때 서버 주소를 넣습니다:
sysPdaApp.install.4=사내 인증서를 쓰는 서버면 단말에 그 인증서를 먼저 설치합니다.
sysPdaApp.install.5=앱이 열리면 "POP 단말 관리" 에서 받은 등록 코드로 단말을 활성화합니다. 브라우저(크롬)로 같은 주소의 /pop 을 열어도 됩니다.
js.sysPdaApp.state.OK=내려받을 수 있습니다.
js.sysPdaApp.state.MISSING=아직 배포된 앱이 없습니다. 운영자가 서버에 APK 와 release.json 을 놓으면 여기에 보입니다.
js.sysPdaApp.state.INVALID=배포 파일 설정 오류 — release.json 의 버전 형식·최소 버전·배포일·노트 길이를 운영자가 확인해야 합니다. 그동안 내려받기는 막힙니다.
help.sys-pda-app=POP 태블릿·창고 PDA 에 까는 앱(APK)을 내려받는 곳입니다. 화면은 서버의 웹 그대로라 앱은 새 버전이 나올 때만 다시 깝니다.
help.sys-pda-app.version=운영자가 서버에 놓은 앱의 버전입니다.
help.sys-pda-app.minVersion=이보다 낮은 버전의 앱은 열리지 않고 "업데이트 필요" 만 보입니다. 앱의 기능 계약이 바뀔 때만 올립니다.
help.sys-pda-app.sha256=서버가 파일에서 직접 계산한 값입니다. 내려받은 파일과 같아야 합니다.
help.sys-pda-app.helpWhy=현장 단말에 깔 앱을 회사 관리자가 직접 받는 곳입니다. 서버가 계산한 SHA-256 으로 받은 파일이 바뀌지 않았는지 확인합니다.
help.sys-pda-app.helpWhen=현장 단말 도입 흐름의 1단계입니다. 새 태블릿·PDA 를 들일 때, 앱 새 버전이 나왔거나 "업데이트 필요" 가 보일 때 엽니다.
help.sys-pda-app.helpDo=[APK 내려받기] 앱 파일을 받습니다(준비된 때만 보입니다).\n설치 안내 순서대로 단말에 깔고, POP 단말 관리에서 받은 등록 코드로 활성화합니다.
help.sys-pda-app.helpNote=보기 전용입니다. 앱 파일은 화면에서 올리지 않고 운영자가 서버에 놓습니다.\n같은 화면을 브라우저로도 쓸 수 있습니다 — 앱이 없어도 /pop 은 열립니다.

