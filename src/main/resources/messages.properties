help.cms-state-reason=설비 상태 구간에 붙는 사유(고장·금형 교체·자재 대기 등)를 관리합니다. 수집 장치·POP 가 이 코드로 사유를 보내고, 비가동 사유 검토에서 사람이 사후에 고릅니다. 코드와 분류는 만든 뒤 바꿀 수 없습니다(지난 구간 기록이 이 분류로 들어가 있어서).
help.cms-state-reason.reasonCd=영문 대문자·숫자·_- 로 30자까지. 수집 장치가 보내는 사유 코드와 같아야 합니다.
help.cms-state-reason.stateCat=SEMI E10 분류. 사유는 같은 분류의 구간에만 붙습니다. 통신 끊김(알 수 없음)에는 사유가 없습니다.
help.cms-state-reason.plannedYn=계획된 정지인지. 설비 KPI(가용률)가 계획 정지를 계획 시간에서 뺄 때 읽습니다 — 바꾸면 지난 기간 KPI 도 다시 계산됩니다.
help.cms-state-review=수집된 설비 상태 구간을 공장·기간으로 보고, 사유가 없거나 틀린 구간에 사후 사유를 달고, 비계획 정지 구간을 고장 작업지시에 연결합니다. 수집 원장은 고치지 않고 덧붙여 두며, 잘못 단 것은 무효로 한 뒤 다시 답니다.
help.cms-state-review.effCat=사후 사유가 있으면 그 사유의 분류(실효 분류), 없으면 수집된 분류로 거릅니다.
help.cms-state-review.reasonCd=끝난 구간에만, 같은 분류의 사유만 고를 수 있습니다. 비계획 정지와 계획 정지는 서로 바꿔 달 수 있습니다(예: 수집은 고장으로 왔지만 실제로는 계획 정비).
help.cms-state-review.mwoId=같은 설비의 고장 작업지시 중 구간 앞뒤 하루 안에 접수된 것. 작업지시에 적은 수기 정지 구간과 수집 구간의 시작·끝 차이를 함께 보여 줍니다.
