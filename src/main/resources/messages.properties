help.prd-pop.helpDo=[단말 화면 열기] 공정 단말 화면을 새 탭으로 엽니다.\n[이 기기 등록] 등록되지 않은 기기일 때만 보입니다 — 등록 코드로 이 기기를 단말로 등록합니다.\n관리 화면 바로가기는 그 화면 권한이 있을 때만 보입니다.
help.prd-pop.helpNote=사무 로그인으로 단말에 로그인되지 않습니다(보안상 분리). 단말 화면에서는 작업자 배지를 따로 찍습니다.
help.wms-pda=사무 메뉴에서 창고 단말(PDA) 화면으로 들어가는 곳입니다. 단말 화면은 새 탭에서 등록 단말 + 작업자 배지로 씁니다.
help.wms-pda.helpWhy=창고 단말 주소(/pop/wh)를 외우지 않고 메뉴에서 바로 들어가게 합니다. 이 기기가 창고 단말로 등록됐는지도 여기서 봅니다.
help.wms-pda.helpWhen=창고 PDA 브라우저에서 처음 단말 화면을 열 때, 또는 단말 화면이 열리지 않을 때 엽니다.
help.wms-pda.helpDo=[창고 단말 화면 열기] 창고 단말 화면을 새 탭으로 엽니다.\n[이 기기 등록] 등록되지 않은 기기일 때만 보입니다 — 등록 코드로 이 기기를 단말로 등록합니다.\n관리 화면 바로가기는 그 화면 권한이 있을 때만 보입니다.
help.wms-pda.helpNote=사무 로그인으로 단말에 로그인되지 않습니다(보안상 분리). 앱(APK)으로 쓰는 PDA 는 이 화면 없이 앱이 바로 단말 화면을 엽니다.


