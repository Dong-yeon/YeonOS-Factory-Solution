help.prd-serial=완성 장비 1대(시리얼)마다 실제로 들어간 부품(as-built)을 남깁니다. 장착하면 부품 LOT 잔량이 빠지고(계보 투입), 탈거·교체는 지우지 않고 반대 행으로 남습니다. 설계 BOM 과 비교해 빠진 부품·대체품·추가 부품을 봅니다.
help.prd-serial.helpWhy=같은 설계로 만든 장비라도 대체품·추가 부품·교체로 1대마다 구성이 달라집니다. 1대씩 기록해 두어야 고객 문의·리콜 때 어떤 장비에 무엇이 들어갔는지 답할 수 있습니다.
help.prd-serial.helpWhen=작업지시를 발행한 뒤 조립하면서 엽니다. 부품을 달 때마다 장착, 빼거나 바꿀 때 탈거·교체, 완료 전에 BOM 대비로 빠진 것을 봅니다.
help.prd-serial.helpDo=[시리얼 만들기] 지시를 고르고 대수를 넣으면 번호가 자동으로 붙습니다\n[장착] 부품 품목·LOT(LOT 관리 품목)·부품 시리얼(있으면)·수량\n[탈거] 사유를 넣으면 반대 행이 남고 LOT 잔량이 돌아옵니다\n[교체] 탈거와 새 장착을 한 번에\nBOM 대비 빠짐·부족·초과·대체품·추가를 보여 줍니다
help.prd-serial.helpNote=같은 부품 시리얼은 한 장비에만 장착할 수 있습니다.\n두 사람이 같은 시리얼을 동시에 저장하면 뒤 저장은 거부됩니다 — 다시 읽고 하세요.\n필수 부품이 덜 장착돼도 공정 완료판정은 막지 않고 경고만 합니다.
help.prd-serial.keyword=시리얼 번호나 지시 번호의 일부를 넣으세요.
help.prd-serial.woNo=지시 번호 앞부분 — 비우면 최근 지시를 보여 줍니다.
help.prd-serial.count=한 번에 만들 대수(1~100). 지시 계획 수량을 넘을 수 없습니다.
help.prd-serial.itemCd=장착할 부품의 품목 코드입니다.
help.prd-serial.lotNo=LOT 관리 부품이면 라벨을 스캔하세요. 그 LOT 잔량에서 장착 수량만큼 빠집니다.
help.prd-serial.partSerialNo=부품 명판의 시리얼 번호(있을 때). 넣으면 수량은 1 입니다.
help.prd-serial.opSeq=부품을 단 공정 순번(지시의 공정). 비워도 됩니다.
help.prd-serial.occurredAt=실제로 단 시각(공장 현지, 예 2026-11-16T14:30). 비우면 지금입니다.
help.prd-serial-trace=부품 LOT 이나 부품 시리얼로 그것이 들어갔던 장비 시리얼을 찾습니다. 계보로 이어진 하위 LOT(반제품 등)을 거쳐 들어간 장비도 찾고, 지금 장착 중인지 탈거됐는지 함께 보여 줍니다.
help.prd-serial-trace.helpWhy=부품 불량·리콜이 나면 그 부품이 들어간 장비를 빠짐없이 찾아야 합니다. 한때 들어 있다가 바뀐 장비도 영향 범위에 들 수 있어 탈거된 것도 보여 줍니다.
help.prd-serial-trace.helpWhen=공급사 부품 불량 통보, 고객 클레임, 부적합 원인 조사 때 엽니다.
help.prd-serial-trace.helpDo=[조회] 부품 LOT 번호(스캔), 또는 부품 품목 코드 + 부품 시리얼\n줄 = 장비 시리얼 × 장착 기록(장착 중·탈거됨)\n[시리얼 구성 열기] 고른 장비의 구성 화면으로\n[엑셀] 그리드 메뉴에서 리콜 대상 목록을 내려받습니다
help.prd-serial-trace.helpNote=거친 LOT 이 비어 있으면 그 LOT·시리얼을 그대로 장착한 것입니다.\n행이 많으면 5,000줄까지만 보여 줍니다.
help.prd-serial-trace.lotNo=부품 LOT 라벨을 스캔하거나 번호를 넣으세요.
help.prd-serial-trace.partSerialNo=부품 명판의 시리얼 번호 — 부품 품목 코드와 함께 넣으세요.

