help.cms-equip-card=설비 한 대의 기간 안 보전 기록을 한 화면에 모읍니다. 위는 요약(작업지시·점검·사용 예비품·카운터 리셋 건수, 지금 설치된 금형·지그, 카운터 누적), 아래는 이력 한 표입니다. 대상이 설비인 기록만 셉니다 — 금형·지그 자체의 작업지시·점검은 그 자산의 기록입니다. MTBF·MTTR 은 설비 KPI 화면에서 봅니다. 기간은 공장 현지 날짜, 최대 1년(회사 조회 기간 정책이 더 짧으면 그것).
help.cms-equip-card.equip=사용 중지된 설비도 고를 수 있습니다(보전 기록은 설비를 폐기해도 남깁니다). 위 칸에 코드·이름을 넣으면 목록이 좁혀집니다.
