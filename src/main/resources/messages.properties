help.wms-rcv=들어오는 자재를 입고합니다. 품목을 고르면 그 품목의 열린 발주 행을 보여 줍니다 — 고르면 구매 입고(발주 입고 수량이 같이 늘고 공급사는 발주 거래처), 고르지 않으면 발주 없는 자재 입고입니다. 확정하면 입고 LOT 이 새로 만들어지고(LOT 번호 자동) 그 위치·상태로 재고가 늘어납니다. 확정은 한 번만 됩니다(다시 눌러도 LOT 이 두 개 생기지 않음). 잘못 넣은 입고는 수불 원장 화면에서 역분개합니다.
help.wms-rcv.scan=위치 라벨 → 입고 위치, 품목 라벨 → 품번, 공급사 GS1 라벨 → 품목(품목 속성 GTIN)·공급사 LOT·유통기한·수량을 채웁니다.
help.wms-rcv.poLine=발주 행을 고르면 수량은 발주 단위입니다(재고는 품목 기본 단위로 환산해 늘어남). 남은 수량보다 많이 받으면(허용 초과율 밖) 거부됩니다. 역분개하면 발주 입고 수량도 되돌아갑니다.
help.wms-rcv.stockStatus=수입검사 구역(QC) 위치를 고르면 QC 로 제안합니다. 검사 없이 바로 쓸 자재만 가용으로 받습니다.
help.wms-rcv.supplierCd=구매처(구매·겸용) 거래처 코드입니다. 같은 공급사 LOT 이 나눠 들어와도 입고마다 새 내부 LOT 이 생기고, 공급사 LOT 은 그 속성으로 남습니다(리콜은 공급사 LOT 으로 찾음).
