help.cms-equip-card.down=작업지시에 기록한 설비 정지 시작~끝(둘 다 있을 때만, 분 내림)의 합. 수집 상태 원장의 정지 시간과 다를 수 있습니다.
help.cms-equip-card.chk=예정일이 기간 안인 점검 실행. 지연 = 아직 안 한 점검 중 예정일이 오늘(공장 현지) 전.
