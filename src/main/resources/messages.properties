help.cms-kpi.wo=수집 장치가 없는 설비만, 끝난 고장 수리 작업지시로 계산합니다. MTBF(작업지시) = (기간 달력 시간 − 정지 시간 합) ÷ 고장 수, MTTR(작업지시) = 정지 시간 합 ÷ 정지를 기록한 고장 수. 가동 시간을 모르는 달력 기준이라 상태 원장 MTBF·MTTR 과 다른 이름으로 따로 보입니다.
help.cms-kpi.mtta=평균 반응 = 고장 신고에서 착수까지 걸린 시간의 평균(끝난 고장 수리 작업지시, 착수 시각이 있는 것). 수집 장치와 상관없이 모든 설비.
prog.cmsDashboard=설비·생산 대시보드
help.cms-dashboard=설비 성과(개요)와 고장 기록(고장 분석)을 한 화면에서 봅니다. 개요는 설비 KPI 화면과 같은 계산(상태 원장)이고, 고장 분석은 끝난 고장 수리 작업지시를 원인·현상·설비별로 모읍니다. 조건은 두 탭이 같이 씁니다.
help.cms-dashboard.helpWhy=고장 코드를 입력만 하고 모아 보지 않으면 어느 원인·설비가 정지를 만드는지 알 수 없습니다. 파레토로 상위 원인을 찾고, 반복 고장과 수리 시간의 어느 부분(대기·수리)이 긴지 봅니다.
help.cms-dashboard.helpWhen=주·월 보전 회의 전, 또는 설비 KPI 에서 MTTR·가용률이 나빠졌을 때 원인을 찾으려고 엽니다.
help.cms-dashboard.helpDo=[조회] 공장·기간·설비·설비 클래스를 고릅니다(개요 31일, 고장 분석 92일까지)\n[보기] 개요 = KPI 타일·OEE 추이·비가동 사유·계획 대비 실적 / 고장 분석 = 고장 파레토·수리 시간 분해·반복 고장\n파레토 막대나 표 줄을 누르면 그 고장 작업지시 목록이 나오고, 번호를 누르면 보전 작업지시 화면이 열립니다\n[묶음] 수리 시간 분해를 설비별·담당별로 바꿉니다
help.cms-dashboard.helpNote=고장 = 끝난(완료·확인) 고장 수리 작업지시, 고장 시각 = 정지 시작(정지 기록이 없으면 신고 시각). 취소·진행 중인 것과 개선·예방 작업지시는 빠집니다.\nMTBF·MTTR 은 상태 원장(수집 장치) 값과 작업지시 값을 이름을 나눠 따로 보입니다. 작업지시 값은 수집 장치가 없는 설비만 냅니다.\n반복 고장 간격 일수는 공장 정책 CMS_REPEAT_FAIL_DAYS 입니다.
help.cms-dashboard.keyword=설비 코드·이름 일부. 두 탭에 같이 걸립니다.
help.cms-dashboard.classCd=설비 클래스 코드(예: PRESS). 고장 분석에만 걸립니다 — 개요(KPI)는 설비 글자 조건만 씁니다.
help.cms-dashboard.axis=파레토를 무엇으로 묶을지 — 원인·현상(ISO 14224 고장 모드)·원인 분류(전역 상위 분류)·설비.
help.cms-dashboard.wait=대기 = 신고에서 착수까지, 수리 = 착수에서 완료까지, 정지 = 작업지시에 기록한 설비 정지 시간, 공수 = 공수 줄의 합. 평균은 그 값이 있는 건수로 나눕니다.
help.cms-dashboard.mtbf=MTBF·MTTR(상태)는 수집 장치의 상태 원장 값(설비 KPI 와 같음), MTBF·MTTR(작업지시)는 수집 장치가 없는 설비만 작업지시로 낸 달력 기준 값입니다. 한 설비에는 둘 중 하나만 나옵니다.
policy.CMS_REPEAT_FAIL_DAYS=반복 고장 간격(일) — 같은 설비·같은 원인의 고장이 이 일수 안에 다시 나면 반복으로 셉니다(설비·생산 대시보드 고장 분석)
