help.apqp-cp.compare=검사 유형과 특성(키)이 있는 행을 같은 품목·공정·검사 유형의 오늘 유효한 확정 검사계획과 맞춰 봅니다. 양산 단계는 "검사계획에 없음" 이 있으면 확정할 수 없고, 나머지는 알림입니다. 검사계획은 QMS 화면에서 고칩니다.
