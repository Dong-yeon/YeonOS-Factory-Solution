help.mst-bom-tree=모품목을 만드는 데 드는 자품목을 기준일의 확정 BOM 으로 펼쳐 봅니다. 필요량 = 소요량 ÷ 기준 수량 × 상위 필요량 × (1 + 손실률) × 단위 환산 × 대체 사용 비율(고정 수량 행은 생산 수량과 무관). 합산은 말단 자재별 총 필요량(가상 조립·중간 조립은 빠지고 부산물은 따로)입니다.
