js.tip.prd-pop.openBtn=공정 단말 화면(/pop)을 새 탭으로 엽니다. 사무 로그인과 따로 작업자 배지로 들어갑니다.
js.tip.prd-pop.activateBtn=이 기기를 단말로 등록하는 화면을 새 탭으로 엽니다(등록 코드 필요). 등록하면 이 브라우저의 사무 로그인이 끝납니다.
js.tip.wms-pda.openBtn=창고 단말 화면(/pop/wh)을 새 탭으로 엽니다. 사무 로그인과 따로 작업자 배지로 들어갑니다.
js.tip.wms-pda.activateBtn=이 기기를 단말로 등록하는 화면을 새 탭으로 엽니다(등록 코드 필요). 등록하면 이 브라우저의 사무 로그인이 끝납니다.
help.prd-pop=사무 메뉴에서 공정 단말(POP) 화면으로 들어가는 곳입니다. 단말 화면은 새 탭에서 등록 단말 + 작업자 배지로 씁니다.
help.prd-pop.helpWhy=단말 주소(/pop)를 외우지 않고 메뉴에서 바로 들어가게 합니다. 이 기기가 등록 단말인지도 여기서 봅니다.
