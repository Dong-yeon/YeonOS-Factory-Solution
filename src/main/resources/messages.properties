# ---------- 홈 업무 흐름 지도 (home-flow-map, docs/46 12장) ----------
prog.homeFlowMap=업무 흐름 지도
flowMap.flow=흐름
flowMap.f0=F0 기준정보 준비
flowMap.f0.desc=모든 흐름의 바닥입니다. 공장·장비 계층·품목·BOM·공정·라우팅·작업자를 참조되는 것부터 등록합니다.
flowMap.f1=F1 수주 → 생산 → 출하
flowMap.f1.desc=중심 흐름입니다. 수주 → 작업지시 만들기 → 생산계획(APS) → 발행 → POP 실적 → 생산 입고 → 재고 → 출하.
flowMap.f2=F2 구매요청 → 입고 → 수입검사
flowMap.f2.desc=협력사 → 구매요청 → 발주·결재·발행 → 납기 회신 → ASN → 입고 → 수입검사 → 협력사 평가.
flowMap.f3=F3 부적합 → 봉쇄 → 시정조치
flowMap.f3.desc=검사·SPC 에서 부적합(NCR) → 봉쇄 → 처분 → 시정조치. 협력사 책임이면 반품·클레임으로 이어집니다.
flowMap.f4=F4 설비 — 고장과 예방
flowMap.f4.desc=고장 신고 → 보전 작업지시, 점검표 → 예방보전 계획 → 점검 실행, 설비 상태 → 비가동 검토 → KPI.
flowMap.f5=F5 설계변경
flowMap.f5.desc=ECR 접수 → ECO 작성 → 4M 변경 → 결재 → 적용(BOM·라우팅 확정) → 초품·셋업 확인.
flowMap.f6=F6 신제품 개발(APQP·PPAP)
flowMap.f6.desc=프로젝트 → PFMEA → 관리계획서 → 검사계획 → PPAP(ECO) → 산출물·게이트 심사.
flowMap.f7=F7 재고 운영
flowMap.f7.desc=라벨·로케이션 → 재고 → 이동·실사 → 원장 정정 → 기간 마감.
flowMap.f8=F8 시스템 운영
flowMap.f8.desc=회사 → 부서·사용자 → 권한그룹 → 메뉴 → 정책·코드·채번 → 일상(홈·결재·알림) → 점검(로그·의견·활용).
help.home-flow-map.lines=켜 둔 종류의 선만 그립니다. 기본은 주 흐름(다음 단계·같은 단계 아래)만입니다. 상자를 고르면 켜지 않은 종류라도 그 상자의 선은 진하게 보입니다.
js.flowMap.resetDone=이 흐름의 상자 자리를 처음대로 되돌렸습니다.
js.flowMap.open=화면 열기
js.flowMap.summary=요약
js.flowMap.pick=상자를 누르면 그 화면이 무엇을·왜·언제 하는지, 주요 동작과 앞·다음 화면이 여기 보입니다. 탭은 [화면 열기]로 엽니다.
js.flowMap.what=무엇을
js.flowMap.unselect=고르기 해제
js.flowMap.bandClose=요약 접기
js.flowMap.bandOpen=요약 펼치기
js.flowMap.nextList=다음 화면(이 흐름)
js.flowMap.prevList=앞 화면(이 흐름)
js.flowMap.does=주요 동작
js.flowMap.when=언제 쓰나
js.flowMap.why=왜 있나
flowMap.detail=고른 화면 요약
flowMap.hint=클릭 = 고르기(아래 요약의 [화면 열기]로 탭) · 끌기(방향키) = 옮기기 · 회색 점선 = 권한 없음
flowMap.reset=자리 초기화
flowMap.zoom=확대·축소
flowMap.zoomOut=축소
flowMap.zoomIn=확대
flowMap.zoomFitTip=흐름 전체가 스크롤 없이 보이게 맞춥니다
js.flowMap.zoomFit=맞춤 {0}%
flowMap.legend=보일 선
flowMap.legend.next=주 흐름
flowMap.legend.skip=단계 건너뜀
flowMap.legend.back=되돌아감
js.flowMap.step={0}단계
js.flowMap.next=다음: {0}
js.flowMap.noAuth=권한 없음
js.flowMap.noAuthMsg={0} 화면은 조회 권한이 없어 열 수 없습니다. 필요하면 회사 관리자에게 권한그룹을 요청하세요.
js.flowMap.openTab=열린 탭
js.flowMap.empty=이 흐름에 그릴 화면이 없습니다.
js.flowMap.loadFail=흐름 지도를 읽지 못했습니다. 새로 고침해 주세요.
help.home-flow-map=업무 흐름 하나를 고르면 그 흐름의 화면을 단계 순서로 상자와 화살표로 보여 줍니다. 상자를 누르면 그 화면 탭이 열립니다.
help.home-flow-map.flow=볼 업무 흐름입니다. F0 기준정보부터 F8 시스템 운영까지 9개입니다.
help.home-flow-map.helpWhy=화면이 많아 어떤 화면을 어떤 순서로 쓰는지 한눈에 보기 어렵습니다. 화면 도움말의 앞·뒤 화면을 흐름 단위로 모아 그립니다.
help.home-flow-map.helpWhen=처음 쓸 때, 업무 순서가 헷갈릴 때, 다음에 열 화면을 찾을 때 엽니다. 어느 흐름에서든 씁니다.
help.home-flow-map.helpDo=[흐름] 고르면 그 흐름의 화면 상자를 단계 순서로 놓습니다 — 한 줄이 차면 다음 줄에서 거꾸로 이어지는 ㄹ자 모양이고, 흐름 전체가 스크롤 없이 보이게 맞춥니다.\n상자 클릭(Enter·Space) = 고르기 — 그 상자의 들어오고 나가는 선이 진해지고 그림판 아래 요약 띠에 무엇을·왜·언제·주요 동작·앞/다음 화면이 보입니다. [고르기 해제]·Esc 로 풉니다.\n요약의 [화면 열기] = 그 화면 탭을 엽니다. 탭은 이 버튼으로만 엽니다(더블클릭으로 열지 않음).\n[요약 접기] 요약 띠를 머리 줄만 남기고 그림판을 키웁니다. [요약 펼치기]로 되돌립니다.\n상자를 끌거나(방향키, Shift 와 함께 크게) 옮깁니다. 자리는 이 기기에 기억합니다.\n[−] [맞춤] [+] 줄이고 키웁니다. [맞춤]은 다시 화면에 맞춥니다.\n[보일 선] 건너뜀·되돌아감 선을 켜고 끕니다.\n[자리 초기화] 이 흐름의 상자 자리를 처음대로 되돌립니다.
help.home-flow-map.helpNote=회색 점선 상자는 조회 권한이 없는 화면입니다. 고를 수는 있지만 [화면 열기]가 비활성입니다.\n상자 자리는 이 기기(브라우저)에만 기억합니다 — 다른 PC 에서는 처음 자리입니다.\n선은 각 화면 도움말의 앞·뒤 화면과 같은 원본입니다.

