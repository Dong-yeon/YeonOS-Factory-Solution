help.sys-integrity=감사 로그·원장·전자서명이 처음 기록된 그대로인지 시스템이 다시 계산해 보는 곳입니다.
help.sys-integrity.run=다이제스트 체인·원장 차단·전자서명 해시·감사 트리거를 한 번에 점검하고 결과를 이력에 남깁니다(고칠 수 없음).
help.sys-integrity.history=지난 점검 결과입니다. 줄을 누르면 그때 결과를 다시 봅니다.
help.sys-integrity.helpWhy=고객 감사·인증 심사에서 "기록이 바뀌지 않았다"를 문서가 아니라 다시 실행할 수 있는 점검으로 보이는 곳입니다(ALCOA+ — 원본성·정확성·완전성).
help.sys-integrity.helpWhen=심사·고객 감사 전, 월 1회, 백업에서 복원한 뒤, DB 작업을 한 뒤에 엽니다.
help.sys-integrity.helpDo=[점검 실행] 네 가지를 점검하고 결과를 이력에 남깁니다.\n[결과 엑셀] 보고 있는 결과를 감사 자료로 내보냅니다.\n이력의 줄을 누르면 지난 결과를 다시 봅니다.
help.sys-integrity.helpNote=점검은 이 회사 범위의 로그·서명만 봅니다(다른 회사 것은 보이지 않음). 원장 차단·감사 트리거는 제품 공통 구조라 모든 회사에서 같은 결과입니다.\n"이상" 이 나오면 화면에서 고치지 말고 운영자에게 알리세요 — 원인은 DB 직접 변경일 가능성이 큽니다.
