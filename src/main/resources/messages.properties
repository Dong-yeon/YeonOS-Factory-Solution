help.pms-deliverable.formDocNo=이 산출물을 쓸 때 쓰는 빈 서식의 QMS 관리문서 번호입니다. 서식 파일은 QMS 가 관리하고, 목록의 [서식] 이 관리문서 화면을 엽니다(받기는 관리문서 조회 권한). 제출본 연결과는 별개입니다.
help.pms-deliverable.file=파일 1개를 제출합니다. 제출할 때마다 새 파일로 남고, 제출한 파일은 지울 수 없습니다. 승인된 산출물을 바꾸려면 새로 제출하세요(다시 승인 필요).
help.pms-gate.decision=통과 = 다음 단계로. 조건부 통과 = 조건(담당·기한)을 붙여 다음 단계로 — 결정되면 조건마다 이슈가 만들어집니다. 불합격 = 게이트를 그대로 두고 다시 심사합니다.
help.pms-template.itemKind=산출물 칸은 프로젝트를 만들 때 그 작업의 산출물로 복사됩니다. 게이트 점검 문구는 게이트 작업에만 달 수 있고, 심사를 만들 때 점검표로 복사됩니다.
