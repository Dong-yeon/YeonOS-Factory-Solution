termEntry.pop.intro=작업장 태블릿에서 쓰는 공정 단말 화면(작업 시작·실적·투입·고장 신고)을 새 탭으로 엽니다.
termEntry.pda.intro=창고 PDA 에서 쓰는 창고 단말 화면(입고·이동·피킹·실사)을 새 탭으로 엽니다.
