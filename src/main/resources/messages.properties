help.qms-lot-trace.direction=정방향 = 이 LOT 이 들어간 아래 LOT·출하(리콜 범위), 역추적 = 이 LOT 을 만든 위 LOT·공급사(원인 찾기).
help.qms-lot-trace.lotNos=문제가 된 LOT 번호(원자재·반제품·완제품)를 붙여 넣습니다. 줄바꿈·쉼표로 나누고, 같은 번호는 한 번만 셉니다. 100개까지.
help.qms-lot-trace.depth=계보를 몇 단계까지 따라갈지(0~10, 정방향은 아래로·역추적은 위로). 0 이면 그 LOT 자신만 봅니다.
help.qms-lot-trace=문제 LOT 이 계보(투입·분할·병합·재작업 등)로 이어진 아래 LOT 까지 따라가, 어느 고객에게 어느 출하로 얼마나 나갔는지와 아직 창고 어디에 남았는지를 한 화면에 보입니다.
help.qms-lot-trace.helpWhy=리콜·클레임 때 "누구에게 연락해야 하나" 를 원장 조회로 손으로 이어 붙이면 빠뜨립니다. 계보와 출하를 한 번에 이어 연락 대상과 남은 재고를 바로 봅니다.
help.qms-lot-trace.helpWhen=고객 클레임·공급사 원자재 불량·사내 NCR 로 문제 LOT 이 정해졌을 때 엽니다.
help.qms-lot-trace.helpDo=LOT 번호를 붙여 넣고 방향·깊이를 정해 [조회]합니다.\n정방향: 고객별 요약이 연락 대상입니다. 출하 목록은 [엑셀] 로 받아 고객 연락에 씁니다.\n역추적: 공급사별 요약·원인 LOT 으로 원인 후보를 좁히고, [원인 LOT 으로 정방향] 으로 같은 원인 LOT 이 들어간 다른 출하를 찾습니다.\n노란 줄이 보이면 계보가 상한에 걸린 것이니 LOT 을 나눠 다시 조회합니다.
help.qms-lot-trace.helpNote=이 화면은 아무것도 바꾸지 않습니다. 남은 재고는 [봉쇄 열기](품목별, 이 LOT 만 미리 체크)로, 출하된 것은 출하 줄의 [클레임 NCR] 로 각 화면에서 등록합니다.\n출하 수량은 출하 취소분을 뺀 순 수량입니다(취소된 출하는 나오지 않음). 역분개된 계보는 따라가지 않습니다.

