help.cms-kpi=설비 상태 구간(수집)·생산 실적·예방점검 기록으로 가용률·성능·품질·OEE·MTBF·MTTR·PM 준수율을 냅니다. 라인·공장 합계는 시간과 수량을 먼저 더한 뒤 나눈 값이라 설비 비율의 평균과 다릅니다. 오늘이 들어 있으면 지금까지만 셉니다.
help.cms-kpi.planned=수집된 시간에서 통신 끊김·비가동 계획(NST)·계획 정지(SDT)를 뺀 시간. 비가동 사유 검토에서 사후로 바꾼 분류가 반영됩니다.
help.cms-kpi.performance=작업지시 공정의 표준 사이클(초, 사이클당 수량으로 나눔) × 생산 수 ÷ 가동 시간. 표준 사이클이 없는 공정의 실적이 하나라도 있으면 빈칸입니다. 정정한 실적은 빠지고, 설비를 정하지 않고 넣은 실적은 설비 KPI 에 들어가지 않습니다.
help.cms-kpi.oee=양품을 표준 사이클로 만든 시간 ÷ 계획 시간(= 가용률 × 성능 × 품질을 합산 기준으로).
help.cms-kpi.unknown=통신이 끊긴 시간 + 수집 기록이 아예 없는 시간. 계획 시간에서 빠지고 따로 보입니다. 수집 장치가 없는 설비는 시간 지표를 내지 않습니다.
help.cms-kpi.basis=확정 실적 = 작업지시 공정의 품목별 표준 사이클 × 확정 실적 수량(기본). 수집 카운트 = 설비가 보낸 양품·불량 카운트(정정 포함 순합) × 설비 프로필의 개당 이론 사이클 — 이론 사이클이 없는 설비가 있으면 성능·OEE 빈칸. 한 설비에서 품목이 섞이면 수집 기준은 근사입니다. 시간(가용률·MTBF·MTTR)은 두 기준이 같습니다.
