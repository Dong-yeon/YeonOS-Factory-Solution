help.wms-label=라벨 템플릿(ZPL)과 네트워크 라벨 프린터를 관리합니다. 템플릿은 "견본 불러오기"로 시작해 고치고, "미리보기"로 실제로 보낼 ZPL 글자를 확인한 뒤 저장하고 "시험 인쇄"로 모양을 봅니다.
help.wms-label.labelType=라벨 유형마다 쓸 수 있는 자리표시자가 다릅니다(본문 아래 목록). 만든 뒤에는 바꿀 수 없습니다.
help.wms-label.defaultYn=유형마다 기본 템플릿 하나 — 화면에서 템플릿을 고르지 않으면 이것으로 찍습니다. 다른 템플릿을 기본으로 바꾸면 이전 기본은 자동으로 내려갑니다.
help.wms-label.body=ZPL 은 ^XA 로 시작해 ^XZ 로 끝납니다. 값은 {{locCd}} 처럼 쓰고 ^FD 와 ^FS 사이에만 둡니다. 한글은 ^CI28 과 프린터의 한글 글꼴이 필요합니다. 값에 든 ^ ~ _ 는 자동으로 글자로 바뀌어 명령이 되지 않습니다.
help.wms-label.host=사내망 주소만 됩니다(10.x · 172.16~31.x · 192.168.x). 이름을 쓰면 보낼 때마다 주소를 다시 확인합니다.
help.wms-label.port=대부분의 라벨 프린터는 9100(원시 인쇄)입니다. 다른 포트는 회사 정책 "라벨 프린터 포트"에 넣어야 합니다.
help.wms-print-job=라벨 인쇄 요청과 결과입니다. "대기"는 아직 보내지 않은 것, "실패"는 재시도를 다 쓴 것입니다(마지막 오류에 이유). 다시 찍으려면 사유를 쓰고 재발행합니다.
help.wms-print-job.reason=LOT·파렛트·출하 라벨은 같은 라벨이 두 장이 되면 재고가 두 번 잡힐 수 있어 승인 권한이 있는 사람만 재발행합니다.
help.wms-loc.printer=로케이션 라벨을 찍을 프린터. 라벨 템플릿·프린터 화면에서 등록합니다. 템플릿을 비우면 로케이션 기본 템플릿으로 찍습니다.
