help.apqp-cp.pull=근거 PFMEA 위험행마다 행을 더합니다(단계 = 고장 형태의 공정 단계, 특성 = 원인 기능 → 형태 기능의 특성, 검출 관리 → 검사). 같은 근거 위험행이나 같은 단계·특성·관리 방법이 이미 있으면 건너뛰어, 고친 행을 덮지 않습니다.
help.apqp-cp.release=확정하려면 행마다 반응계획, 검사·SPC 행은 주기, 근거 위험행과 품목·공정의 특별특성마다 관리 항목, 2번째 리비전부터 개정 사유가 있어야 합니다. 확정하면 규격·특별특성을 고정합니다.
help.apqp-cp.revise=확정본을 복사해 다음 리비전을 만듭니다. 근거 PFMEA 가 새로 확정됐으면 새 근거로 바꿉니다.
help.apqp-cp.nextPhase=확정본을 복사해 다음 단계 관리계획서를 새 번호로 만듭니다(이전 단계 번호는 그대로 남습니다).
help.apqp-cp.changeReason=2번째 리비전부터 확정 때 필수입니다(무엇을 왜 바꿨는지).
help.apqp-cp.inspType=검사·SPC 행이 맞춰 볼 QMS 검사계획의 유형입니다. 검사계획 대조는 QMS 연결 뒤에 열립니다.
valid.APQP_CP_NOT_IN_PLAN=양산 관리계획서의 검사 항목인데 그 공정·검사 유형의 확정 검사계획에 없습니다(QMS 검사계획에 먼저 넣으세요).
