help.pms-project=프로젝트(신규 부품 양산 준비, 4M 변경, 설비 도입 …)의 WBS 와 일정을 관리합니다. 하위 작업이 있는 작업(요약)의 날짜·진척·상태는 하위에서 자동 계산됩니다. 구조와 계획은 PM 이, 진행(실적일·진척·상태)은 담당자도 입력할 수 있습니다.
help.pms-project.custCd=거래처 관리의 거래처 코드를 적습니다(선택).
help.pms-project.sopDate=고객 양산 시작일. SOP 기준 템플릿으로 만들면 이 날짜에서 거꾸로 일정을 펼칩니다.
help.pms-project.itemCds=이 프로젝트로 개발·변경하는 품번(품목 관리의 품목 코드). 쉼표나 띄어쓰기로 구분합니다.
help.pms-project.startDate=시작일 기준 템플릿으로 만들 때 첫 작업이 시작하는 날입니다.
help.pms-project.gantt=간트는 보기 전용입니다. 작업을 고른 뒤 오른쪽 폼에서 고칩니다. 키보드: ↑↓ 이동, ←→ 접기·펼치기, Enter 폼으로. 빨간 세로선이 오늘, 빨간 이름은 지연입니다.
help.pms-project.actEnd=실적 종료일을 넣으면 완료(100%)로 저장됩니다. 오늘보다 뒤 날짜는 넣을 수 없습니다.
help.pms-project.planHours=계획 공수는 시간으로 넣습니다(MD 는 회사 하루 시간 정책으로 함께 보입니다). 하위 작업이 있으면 하위 합으로 자동 계산되고, 실적은 확정한 공수만 셉니다.
help.pms-project.workdays=근무일 수를 넣으면 계획 시작부터 회사 휴일 달력의 근무일로 세어 계획 종료를 채웁니다(시작일이 근무일이면 그날이 1일째). [공수로]는 계획 공수 ÷ 회사 하루 시간(올림)으로 근무일 수를 정합니다. 저장되는 것은 날짜뿐이고, 지연 판정 외 계산(선후행 지연일·후행 밀기·임박·기준선 대비)은 달력일 그대로입니다.
help.pms-project.chgReq=담당자가 계획일을 바꿔야 할 때 새 날짜와 사유로 요청합니다. 회사 정책에 따라 결재(기본 결재자 = PM) 또는 PM 바로 처리로 승인되고, 승인 때 작업이 그사이 바뀌었으면 승인할 수 없습니다. 기준선이 있으면 계획 변경 이력에 남고 기준선은 그대로입니다. 뒤 작업은 자동으로 밀지 않습니다.
help.pms-project.taskStatus=비워 두면 실적일로 정합니다(종료일 → 완료, 시작일 → 진행 중, 없음 → 시작 전).
help.pms-template=프로젝트를 만들 때 복사할 WBS 를 정합니다. 일정은 기준일(시작일 또는 SOP) 대비 일수입니다. 템플릿을 고쳐도 이미 만든 프로젝트는 바뀌지 않습니다.
help.pms-template.apqp=일반 용어로 쓴 5단계 APQP 템플릿(단계마다 게이트, SOP 기준)을 만듭니다. 회사 사정에 맞게 고쳐 쓰세요. 이미 있으면 그것을 엽니다.
help.pms-template.anchor=SOP 기준이면 SOP 전 작업은 음수 일수로 적습니다(예: SOP 120일 전 = -120).
help.pms-template.offsetDays=기준일 대비 작업 시작(일). 0 = 기준일, 음수 = 기준일 전.
help.pms-template.previewBase=간트를 이 날짜를 기준일로 펼쳐 보여 줍니다. 저장되지 않습니다.
