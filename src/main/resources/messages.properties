help.wms-asrs=자동창고(로봇이 용기를 넣고 꺼내는 창고)에 입고·출고 요청을 보내고 결과와 대사 차이를 봅니다. 재고 수량·LOT 은 이 시스템 원장이, 랙 안 위치는 자동창고(WES)가 맡습니다.
help.wms-asrs.helpWhy=로봇이 실제로 랙에 넣어야 재고가 자동창고로 옮겨집니다. 이 화면은 어떤 용기가 어디까지 진행됐는지, 왜 실패·격리됐는지를 사건으로 보여 줍니다.
help.wms-asrs.helpWhen=재고 운영 흐름의 보관 단계입니다. 투입구에 받은 재고를 용기에 담아 자동창고에 넣을 때 엽니다.
help.wms-asrs.helpDo=[용기] 용기를 골라 칸별 품번·LOT·수량을 적고 저장합니다(투입구 재고 안에서).\n[요청] 입고 요청에 용기 코드를, 출고 요청에 품번·LOT·수량을 적어 만들고 보내기를 누릅니다. 입고는 랙에 넣을 때(STORED), 출고는 출구에 인계할 때(HANDED_OVER) 원장이 옮겨집니다.\n[대사] 자동창고가 보낸 전체 용기 정의와 다른 줄을 골라 바로 조정하거나(승인 권한·재고 조정 사유) 우리 쪽이 맞다고 확인합니다.
help.wms-asrs.helpNote=출입구 도착은 원장에 반영하지 않습니다 — 랙에 넣은 뒤에만.\n보낸 뒤에는 취소하지 않습니다(WES 가 주인).\n투입구 재고가 모자라면 용기를 격리하고 사람이 확인합니다(덮어쓰지 않음).\n출고를 덜 집고 완료하면 라인을 "덜 집고 완료"로 닫습니다 — 남은 수량은 새 출고 요청으로.\n긴급 표시(승인 권한)만 자동창고에 우선순위를 보냅니다. 많이 붙이면 전체가 느려질 수 있습니다.
help.wms-asrs.ctrCds=내용을 정의한 용기 코드를 줄마다 하나씩 적습니다. 한 용기는 한 요청에만 걸립니다.
help.wms-asrs.contents=예) 1,ZT-BRKT,L-001,10 — 칸 번호, 품번, LOT(없으면 비움), 수량. 빠진 칸은 비워집니다(전체 덮어쓰기).
