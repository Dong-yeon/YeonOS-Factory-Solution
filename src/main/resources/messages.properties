help.mst-item.helpWhy=BOM·라우팅·작업지시·재고·검사·발주가 모두 품목을 기준으로 움직입니다. 단위 환산이 없으면 BOM 확정과 입고 수량 환산이 막힙니다.
help.mst-item.helpWhen=기준정보 준비 흐름에서 BOM·라우팅보다 먼저 합니다. 신제품·신규 자재가 생기거나 ERP 품번을 연결할 때 엽니다.
help.mst-item.helpDo=[신규] [저장] 품번·품목명·유형·단위를 저장합니다. ERP 가 품목 주인인 회사는 신규와 ERP 필드 변경이 막힙니다.\n[환산 추가] [환산 저장] 다른 단위를 기본 단위로 바꾸는 비율을 넣습니다(BOM·입고가 씁니다).\n[속성 저장] 품목 클래스의 속성 값을 저장합니다.\n[외부 품번 추가] ERP·고객사 시스템의 품번을 연결합니다.\n[사용 중지] 새로 고를 수 없게 합니다. 과거 기록은 남습니다.\n[엑셀 올리기] 여러 품목을 미리보기 뒤 한 번에 등록합니다.
help.mst-item.helpNote=ERP 가 품목 주인으로 정해진 회사는 신규 등록이 막힙니다.
help.mst-bom.helpWhy=작업지시의 자재 소요·투입 확인·LOT 계보가 확정 BOM 을 기준으로 합니다. 확정 BOM 이 없으면 작업지시에 자재 소요가 생기지 않습니다.
help.mst-bom.helpWhen=기준정보 준비 흐름에서 품목 다음 단계이고, 설계변경 흐름에서는 새 리비전을 만드는 단계입니다. 신제품을 등록하거나 자품목·소요량이 바뀔 때 엽니다.
help.mst-bom.helpDo=[신규] [저장] 모품목·기준 수량·시작일로 작성 중 BOM 을 만듭니다.\n[행 추가] [행 저장] 자품목·소요량·단위·대체 그룹을 넣습니다(작성 중만).\n[확정] 검사를 통과하면 확정으로 바뀌고 이전 확정본은 새 시작일에 끝납니다. ECO 필수 정책이 켜진 회사는 설계 변경 지시에서만 확정됩니다.\n[새 리비전] 고른 리비전을 복사해 작성 중 BOM 을 만듭니다.\n[비교] [다른 품목으로 복사] 두 리비전의 차이를 보거나 다른 모품목으로 복사합니다.\n[폐기] 리비전을 폐기로 바꿉니다. 전개·작업지시에서 빠집니다.
help.mst-bom.helpNote=확정한 리비전은 고칠 수 없습니다. 새 리비전을 만들어 고칩니다.
help.mst-bom-tree.helpWhy=확정 BOM 을 끝까지 펼쳐 말단 자재별 총 필요량을 계산합니다. 구매요청·작업지시 전에 자재가 맞는지 이 결과로 확인합니다.
help.mst-bom-tree.helpWhen=BOM 을 확정한 뒤, 그리고 수주→출하 흐름에서 생산계획·작업지시 전에 자재 필요량을 볼 때 엽니다.
help.mst-bom-tree.helpDo=[조회] 기준일에 유효한 확정 리비전으로 생산 수량만큼 전개합니다.\n[모두 펼치기] [1레벨만] 트리를 모두 펼치거나 첫 단계만 남깁니다.\n[엑셀] 지금 전개 결과를 내려받습니다.
help.mst-bom-tree.helpNote=확정된 리비전만 전개합니다.
help.mst-bom-where.helpWhy=이 부품을 쓰는 상위 품목과 완제품을 찾습니다. 부품 단종·4M 변경·리콜 때 영향 범위를 정하는 근거가 됩니다.
help.mst-bom-where.helpWhen=부적합 흐름과 설계변경 흐름에서 영향 범위를 볼 때 엽니다. 일괄 대체나 설계 변경 요청을 하기 전에 먼저 확인합니다.
help.mst-bom-where.helpDo=[조회] 자품목을 쓰는 상위 품목을 끝까지 올라가며 찾습니다. 최상위만·전체 리비전 조건을 고를 수 있습니다.\n[모두 펼치기] [1레벨만] 트리를 펼치거나 접습니다.\n[엑셀] 지금 결과를 내려받습니다.
help.mst-bom-where.helpNote=기본은 기준일에 유효한 확정본만 찾습니다.
help.mst-bom-replace.helpWhy=단종·설계 변경된 부품을 여러 BOM 에서 하나씩 고치지 않고 한 번에 바꿉니다. 결과는 작성 중 리비전이라 확정 검사를 다시 거칩니다.
help.mst-bom-replace.helpWhen=설계변경 흐름의 BOM 리비전 단계입니다. 역전개로 영향 BOM 을 확인한 뒤, 설계 변경 지시에 올리기 전에 엽니다.
help.mst-bom-replace.helpDo=[미리보기] 바꿀 자품목을 쓰는 BOM 목록과 단위 차이를 보여 줍니다.\n[선택한 BOM 에 반영] 고른 BOM 마다 작성 중 리비전에 교체를 반영합니다. 작성 중 BOM 이 없으면 확정본을 복사해 새로 만듭니다.\n확정은 BOM 관리나 설계 변경 지시 적용에서 하나씩 합니다.
help.mst-bom-replace.helpNote=반영해도 확정되지 않습니다.
help.mst-plant.helpWhy=공장이 없으면 장비 계층·창고·근무조·라우팅·작업지시를 만들 수 없습니다. 공장 시간대는 실적의 작업일·근무조 계산 기준이 됩니다.
help.mst-plant.helpWhen=기준정보 준비 흐름의 첫 단계입니다. 회사를 처음 설정할 때나 해외 공장처럼 사업장이 늘어날 때 엽니다.
help.mst-plant.helpDo=[신규] 빈 상세를 열어 새 공장을 입력합니다.\n[저장] 공장 코드·이름·시간대를 저장합니다. 코드는 만든 뒤 바꿀 수 없습니다.\n사용 여부를 끄면 새 기록에서 고를 수 없습니다. 사용 중인 구역·창고가 있으면 끌 수 없습니다.
help.mst-plant.helpNote=공장 코드는 만든 뒤 바꿀 수 없습니다.
help.mst-equip-hier.helpWhy=실적·재고·설비 상태가 모두 이 트리의 노드로 "어디서"를 기록합니다. 라인·셀이 없으면 라우팅 작업장과 설비 위치를, 창고·로케이션이 없으면 입고·재고 위치를 정할 수 없습니다.
help.mst-equip-hier.helpWhen=기준정보 준비 흐름에서 공장 다음 단계입니다. 라인을 새로 깔거나 창고·로케이션을 늘릴 때 엽니다.
help.mst-equip-hier.helpDo=[최상위 추가] 공장 바로 아래에 구역이나 창고를 만듭니다.\n[하위 추가] 고른 노드 아래에 라인·셀·로케이션을 만듭니다.\n[저장] 노드를 저장합니다. 상위를 바꾸면 하위까지 함께 옮겨집니다.\n사용 여부를 끄면 새 기록에서 고를 수 없습니다. 사용 중인 하위·라우팅·설비가 있으면 끌 수 없습니다.\n[모두 펼치기] [1레벨만] 트리를 펼치거나 접고, [엑셀] 로 내려받습니다.
help.mst-equip-hier.helpNote=지우는 기능은 없습니다. 사용 여부를 끄는 것만 됩니다.
help.mst-equip.helpWhy=설비 상태·알람·예방보전·고장 신고·KPI가 모두 이 설비를 기준으로 기록됩니다. 설비가 없으면 설비관리 흐름을 시작할 수 없습니다.
help.mst-equip.helpWhen=기준정보 준비 흐름에서 장비 계층 다음 단계이고, 설비관리 흐름의 전제입니다. 새 기계를 들이거나 위치를 옮길 때 엽니다.
help.mst-equip.helpDo=[신규] [저장] 설비 코드·클래스·공장·설치 위치를 저장합니다. 위치를 비우면 보관(미설치)입니다.\n[클래스 관리] 설비 클래스를 만들거나 고칩니다.\n[속성 저장] 설비 클래스의 속성 값을 저장합니다.\n[사용 중지] 새로 고를 수 없게 합니다. 금형·지그가 설치돼 있으면 해체 전까지 막힙니다.
help.mst-equip.helpNote=금형·지그가 설치된 설비는 해체 전까지 사용 중지할 수 없습니다.
help.mst-asset.helpWhy=금형·지그·게이지 실물과 어느 설비에 언제 붙었는지를 원장으로 남깁니다. 설치 이력이 있어야 사용량 카운터가 설비 실적으로 타수를 쌓고, 게이지는 교정·GRR 대상이 됩니다.
help.mst-asset.helpWhen=기준정보 준비 흐름에서 설비 다음 단계이고, 설비관리 흐름에서 금형을 바꿔 달 때마다 엽니다.
help.mst-asset.helpDo=[신규] [저장] 자산 코드·유형·대상 품목·수명 타수를 저장합니다.\n[설치] 고른 설비에 설치 시각과 함께 설치 이력을 남깁니다. 한 자산은 동시에 두 곳에 설치할 수 없습니다.\n해체 시각을 넣어 설치를 끝내고, 잘못 넣은 이력은 지우지 않고 무효로 표시합니다.\n[사용 중지] 새로 고를 수 없게 합니다.
help.mst-asset.helpNote=설치 이력은 지울 수 없습니다. 잘못 넣었으면 무효로 표시합니다.
help.mst-proc.helpWhy=라우팅 단계·검사계획·SPC·관리계획서가 같은 공정 코드를 씁니다. 공정이 없으면 라우팅을 만들 수 없습니다.
help.mst-proc.helpWhen=기준정보 준비 흐름에서 라우팅보다 먼저 합니다. 새 작업 방식이나 외주 공정이 생길 때 엽니다.
help.mst-proc.helpDo=[신규] [저장] 공정 코드·이름·분류·외주 여부를 저장합니다. 외주 여부는 확정 라우팅에 쓰인 뒤 바꿀 수 없습니다.\n사용 여부를 끄면 새 라우팅에서 고를 수 없고, 그 공정을 쓰는 작성 중 라우팅은 확정이 막힙니다.\n[조회] 코드나 이름 일부로 찾습니다.
help.mst-proc.helpNote=공정 코드는 만든 뒤 바꿀 수 없습니다.
help.mst-routing.helpWhy=작업지시를 발행하면 확정 라우팅의 단계·작업장·표준 사이클타임·공정 조건이 지시에 복사됩니다. 확정 라우팅이 없으면 작업지시를 발행할 수 없습니다.
help.mst-routing.helpWhen=기준정보 준비 흐름에서 공정·장비 계층 다음 단계이고, 설계변경 흐름에서는 새 리비전을 만드는 단계입니다. 신제품 공정을 정하거나 사이클타임·공정 조건이 바뀔 때 엽니다.
help.mst-routing.helpDo=[신규] [저장] 품목·공장·시작일로 작성 중 라우팅을 만듭니다.\n[단계 추가] [단계 저장] 공정 순번·작업장·사이클타임과 공정 조건을 넣습니다(작성 중만).\n[확정] 검사를 통과하면 확정으로 바뀌고 이전 확정본은 새 시작일에 끝납니다. 이미 발행한 작업지시는 바뀌지 않습니다. ECO 필수 정책이 켜진 회사는 설계 변경 지시에서만 확정됩니다.\n[새 리비전] 고른 리비전을 복사해 작성 중 라우팅을 만듭니다.\n[폐기] 리비전을 폐기로 바꿉니다. 새 작업지시에서 고를 수 없습니다.
help.mst-routing.helpNote=확정한 리비전은 고칠 수 없습니다. 새 리비전을 만들어 고칩니다.
help.mst-char.helpWhy=검사계획·SPC 관리도·관리계획서·FMEA가 같은 특성 키를 씁니다. 특성이 없으면 검사 항목과 관리도를 만들 수 없습니다.
help.mst-char.helpWhen=기준정보 준비 흐름에서 품목·공정 다음 단계이고, 신제품 개발 흐름의 관리계획서 전에 합니다. 도면이 나오거나 규격이 바뀔 때 엽니다.
help.mst-char.helpDo=[신규] [저장] 특성 유형·공정·풍선 번호·규격·자릿수·특별특성을 저장합니다.\n[같은 품목 다음 번호] 방금 넣은 품목으로 다음 풍선 번호 입력을 이어 갑니다.\n사용 여부를 끄면 새 검사계획에서 고를 수 없습니다. 지우지 않으므로 과거 측정값은 남습니다.
help.mst-char.helpNote=특성 유형은 만든 뒤 바꿀 수 없습니다.
help.mst-defect.helpWhy=POP 폐기·재작업 사유, 실적 조회, 부적합(NCR)이 같은 불량 코드로 집계됩니다. 코드가 없으면 현장에서 폐기 사유를 고를 수 없습니다.
help.mst-defect.helpWhen=기준정보 준비 흐름의 한 단계로 POP 가동 전에 합니다. 새로운 불량 현상을 따로 집계하고 싶을 때 엽니다.
help.mst-defect.helpDo=[신규] [저장] 표준 상위 분류 아래에 회사 불량 코드·이름을 저장합니다. 코드는 만든 뒤 바꿀 수 없습니다.\n사용 여부를 끄면 POP·NCR 에서 새로 고를 수 없습니다.\n[조회] 코드나 이름 일부로 찾습니다.
help.mst-defect.helpNote=불량 코드는 만든 뒤 바꿀 수 없습니다. 실적에 코드로 남기 때문입니다.
help.mst-term.helpWhy=제품이 정한 지표·용어 정의와 우리 현장에서 부르는 말을 한곳에 모읍니다. 나중에 자연어 조회·번역이 이 사전으로 말을 맞춥니다.
help.mst-term.helpWhen=기준정보 준비 흐름에서 필요할 때 합니다. 현장에서 지표를 다른 이름으로 부르는 것을 알게 됐을 때 엽니다.
help.mst-term.helpDo=[조회] 용어 코드·이름·동의어로 찾습니다.\n[동의어 추가] 고른 용어에 우리 회사 동의어를 붙입니다. 한 말은 한 용어만 가리킬 수 있습니다.\n용어 정의 자체는 제품이 정하므로 고칠 수 없습니다.
help.mst-term.helpNote=용어 정의는 제품이 정하므로 고칠 수 없습니다.
help.mst-ext-system.helpWhy=ERP·고객사·협력사가 쓰는 코드와 우리 코드를 연결합니다. 등록하지 않으면 ERP 업로드 엑셀·출하 ERP 파일에 외부 품번이 나오지 않습니다.
help.mst-ext-system.helpWhen=기준정보 준비 흐름에서 ERP 연계를 시작하기 전에 합니다. 새 외부 시스템과 데이터를 주고받기 시작할 때 엽니다.
help.mst-ext-system.helpDo=[신규] [저장] 외부 시스템(코드·유형·연결 거래처)을 저장합니다.\n[매핑 추가] 그 시스템의 단위·품목 유형·창고 표기를 우리 코드에 연결합니다.\n품목별 외부 품번은 품목관리에서 붙입니다.
help.mst-ext-system.helpNote=시스템 코드는 만든 뒤 바꿀 수 없습니다.
help.mst-class-prop.helpWhy=두께·인장강도·최대 톤수처럼 품목·설비 종류마다 다른 값을 테이블을 바꾸지 않고 관리합니다. 정의가 없으면 품목관리·설비 관리 상세에 속성 칸이 나오지 않습니다.
help.mst-class-prop.helpWhen=기준정보 준비 흐름에서 품목·설비를 등록하기 전에 합니다. 새 분류나 관리할 속성이 생길 때 엽니다.
help.mst-class-prop.helpDo=[새 품목 클래스] [클래스 저장] 품목 분류를 만듭니다. 코드는 만든 뒤 바꿀 수 없습니다.\n[새 속성] [저장] 고른 클래스의 속성(형식·단위·필수·선택지)을 정의합니다. 코드와 형식은 만든 뒤 바꿀 수 없습니다.\n값은 품목관리·설비 관리 상세의 속성 칸에서 넣습니다.
help.mst-class-prop.helpNote=속성 코드와 형식은 만든 뒤 바꿀 수 없습니다.
help.mst-shift.helpWhy=POP 실적과 설비 상태는 저장할 때 이 정의로 작업일·근무조를 계산해 남깁니다. 근무조가 없으면 실적을 근무조별로 나눠 볼 수 없고 생산계획의 가용 시간도 잡히지 않습니다.
help.mst-shift.helpWhen=기준정보 준비 흐름에서 공장 다음, POP 가동 전에 합니다. 교대 체계나 근무 시간이 바뀔 때 엽니다.
help.mst-shift.helpDo=[신규] [저장] 조 코드·시작·끝·작업일 기준을 저장합니다. 사용 중인 조끼리 시간이 겹치면 저장되지 않습니다.\n시간을 바꾸면 그 뒤에 기록하는 실적부터 적용됩니다.\n[확인] 시각을 넣으면 그 시각이 어느 작업일·근무조로 잡히는지 미리 보여 줍니다.
help.mst-shift.helpNote=시간을 바꿔도 이미 기록한 실적의 작업일·근무조는 다시 계산하지 않습니다.
help.mst-qual.helpWhy=용접·크레인처럼 자격이 필요한 공정을 정해 두면 POP 이 자격 없는 작업자의 착수를 경고하거나 막습니다. 정하지 않으면 누구나 그 공정을 시작할 수 있습니다.
help.mst-qual.helpWhen=기준정보 준비 흐름에서 공정 다음, 작업자 등록 전에 합니다. 법정·사내 자격이 새로 필요해졌을 때 엽니다.
help.mst-qual.helpDo=[신규] [저장] 자격 코드·이름·유효 개월을 저장합니다.\n[공정 추가] 이 자격이 필요한 공정과 경고·차단 중 하나를 정합니다.\n공장 정책의 자격 게이트 상한이 경고면 차단으로 정한 공정도 경고로 동작합니다.
help.mst-qual.helpNote=공장 정책의 자격 게이트 상한이 경고면 차단으로 정해도 경고로만 동작합니다.
help.mst-worker.helpWhy=현장 작업자는 로그인 계정 없이 POP 에서 배지로 바뀝니다. 작업자와 배지가 없으면 POP 착수·실적을 누가 했는지 남길 수 없고, 보유 자격이 없으면 자격 게이트에 걸립니다.
help.mst-worker.helpWhen=기준정보 준비 흐름의 마지막 단계로 POP 가동 전에 합니다. 입사·퇴사·배지 분실·자격 갱신 때 엽니다.
help.mst-worker.helpDo=[신규] [저장] 사번·이름·공장·연결할 로그인 아이디를 저장합니다.\n[배지 지정] [배지 지우기] POP 배지를 정하거나 없앱니다. 값은 암호화해 두고 다시 보이지 않습니다.\n[PIN 지정] [PIN 지우기] 배지 뒤 PIN 확인용 숫자를 정하거나 없앱니다. 다시 지정하면 잠금이 풀립니다.\n[자격 추가] 취득일·만료일과 함께 보유 자격을 쌓습니다. 갱신도 지우지 않고 새로 추가합니다.\n[확인] 공정을 고르면 이 작업자가 착수할 때 자격 게이트 결과를 미리 보여 줍니다.
help.mst-worker.helpNote=배지와 PIN 은 다시 보이지 않습니다. 잃어버리면 새로 지정합니다.
help.mst-work-cal.helpWhy=근무조 위에 공휴일·하계 휴가·특근 같은 날짜별 예외를 정합니다. 이 달력이 없으면 생산계획과 프로젝트 일정이 쉬는 날에도 일한다고 계산합니다.
help.mst-work-cal.helpWhen=기준정보 준비 흐름에서 근무조 다음 단계입니다. 해마다 공휴일을 넣을 때와 특근·임시 휴무가 정해졌을 때 엽니다.
help.mst-work-cal.helpDo=이전·다음 달 화살표로 달을 옮겨 봅니다.\n[신규] [저장] 날짜·공장·근무조와 쉼 또는 일함을 저장합니다.\n[사용 중지] 고른 예외를 끕니다. 이미 기록한 실적은 바뀌지 않습니다.\n[엑셀 올리기] 한 해 공휴일처럼 여러 날을 미리보기 뒤 한 번에 넣습니다.
help.mst-work-cal.helpNote=주간 쉬는 날은 이 화면이 아니라 정책 관리에서 정합니다.
help.qms-sampling=검사에서 몇 개를 뽑고 불량을 몇 개까지 허용할지 정하는 샘플링 계획과, 회사가 가진 AQL 표준표를 관리합니다. 검사계획 항목이 이 계획을 고르고, 검사 실행은 로트 수량으로 시료 수와 합격 판정 개수를 계산합니다.
help.qms-sampling.helpWhy=샘플링 계획이 없으면 검사계획 항목에 시료 수(n)와 합격·불합격 판정 개수(Ac·Re)를 정할 수 없어, 검사 실행이 몇 개를 재야 하고 언제 합격인지 판단하지 못합니다.
help.qms-sampling.helpWhen=기준정보 준비(검사 기준)의 첫 단계로, 검사계획을 만들기 전에 엽니다. 새 샘플링 방식이 필요하거나 AQL 표를 처음 넣을 때, 로트 크기별 시료 수를 확인할 때 씁니다.
help.qms-sampling.helpDo=[신규] 빈 샘플링 계획 입력 칸을 엽니다.\n[저장] 고정 수량·전수·비율·AQL 표 중 한 방식으로 계획을 저장합니다.\n[계산] 로트 수량을 넣으면 이 계획의 시료 수 n 과 Ac·Re 를 미리 보여 줍니다.\n[표 1 올리기] 로트 크기·검사 수준별 시료 문자 표를 엑셀 템플릿으로 올립니다.\n[표 2 올리기] 시료 문자와 AQL 별 n·Ac·Re 표를 엑셀 템플릿으로 올립니다.
help.qms-sampling.helpNote=AQL 표는 제품에 들어 있지 않습니다. 직접 올려야 AQL 방식이 계산됩니다.\n삭제는 없습니다. 쓰지 않는 계획은 사용 중지하면 새 검사계획에서만 고를 수 없게 됩니다.\n계획을 고쳐도 이미 시작한 검사의 시료 수는 바뀌지 않습니다.
help.sal-order.helpWhy=고객이 무엇을 언제까지 얼마나 원하는지 남기는 곳입니다. 없으면 작업지시가 어느 주문 몫인지, 출하가 어느 주문 행을 채웠는지 이을 수 없습니다.
help.sal-order.helpWhen=수주→출하 흐름의 1단계입니다. 고객 발주서를 받았을 때 등록하고, 생산에 넣으면 언제 끝나는지 고객에게 답할 때와 출하 뒤 남은 수량을 확인할 때 엽니다.
help.sal-order.helpDo=[신규] [저장] 거래처·고객 발주 번호로 수주를 만듭니다(진행 상태)\n[행 추가] 품목·수량·납기 행을 붙입니다 — 작업지시에서 이 행을 골라 연결합니다\n[마감] 더 받지 않을 행을 끝냅니다. 출하로 수량을 다 채우면 저절로 끝납니다\n[취소] [수주 취소] 사유를 남기고 행 또는 진행 중인 행 전체를 취소합니다(이미 출하한 행은 취소할 수 없습니다)\n[납기 답변] [답 받기] 지금 지시 뒤에 넣으면 언제 끝나는지 계산만 합니다(저장하지 않습니다)\n[엑셀 올리기] 여러 수주를 한 번에 올립니다
help.sal-order.helpNote=수주를 저장해도 작업지시는 자동으로 생기지 않습니다.\n작업지시에서 이 수주 행을 골라야 이어집니다.\n행 취소와 수주 취소는 되돌릴 수 없습니다.
help.qms-insp-plan=품목(또는 품목 클래스)·검사 유형·공정마다 무엇을, 어떤 방법과 계측기로, 몇 개 재는지 정한 검사계획을 리비전으로 관리합니다. 작성 중만 고칠 수 있고, 확정하면 그때의 특성 규격이 항목에 찍혀 바뀌지 않습니다.
help.qms-insp-plan.helpWhy=확정 검사계획이 없으면 검사 실행에서 그 LOT 의 검사를 시작할 수 없고, 품질 상태 연동 공장의 입고 재고도 검사 대기로 묶이지 않습니다. 특성 규격이 나중에 바뀌어도 그때 어떤 기준으로 검사했는지를 이 리비전이 설명합니다.
help.qms-insp-plan.helpWhen=기준정보 준비 흐름과 신제품 개발 흐름(관리계획서 다음 단계)에서 품목의 수입·공정·출하·초품 검사 기준을 정할 때 엽니다. 설계·4M 변경으로 특성이나 검사 방법이 바뀌면 새 리비전을 만듭니다.
help.qms-insp-plan.helpDo=[신규] 대상·검사 유형·공정·시작일로 작성 중 계획을 만듭니다.\n[항목 추가] 특성·검사 방법·계측기 클래스·샘플링 계획을 행으로 넣고 [항목 저장]으로 한 번에 저장합니다.\n[확정] 작성 중에서 확정으로 바꿉니다. 특성 규격을 항목에 복사하고, 그날부터 검사 실행이 이 리비전을 씁니다.\n[새 리비전] 계획을 복사해 작성 중 리비전을 만듭니다. 새 판을 확정하면 이전 판은 자동으로 끝납니다.\n[폐기] 계획을 폐기 상태로 바꿔 더는 적용되지 않게 합니다.\n[연결] 이 계획의 근거 검사기준서(관리문서 리비전)를 잇습니다.
help.qms-insp-plan.helpNote=확정과 폐기는 되돌릴 수 없습니다.\n특성 규격을 바꿔도 확정본은 그대로입니다. 새 리비전을 확정해야 검사에 반영됩니다.\n같은 대상은 품목 계획이 품목 클래스 계획보다 먼저 쓰입니다.
help.sal-forecast.helpWhy=고객이 보낸 예상 수요를 받은 그대로 버전마다 남깁니다. 없으면 고객이 언제 어떤 수요를 바꿨는지 비교할 근거가 사라집니다. 내시는 생산 계획에 자동으로 들어가지 않습니다.
help.sal-forecast.helpWhen=수주→출하 흐름의 맨 앞, 참고 단계입니다. 고객 내시 파일을 받을 때마다 올리고, 수주·작업지시를 잡기 전에 지난 버전과 달라진 수요를 확인할 때 엽니다.
help.sal-forecast.helpDo=[엑셀 올리기] 파일 하나가 거래처별 새 버전 하나로 저장됩니다(이전 버전은 바뀌지 않습니다)\n[이전 버전과 비교] 고른 버전과 바로 앞 버전의 늘어남·줄어듦·새로 생김·사라짐을 보여 줍니다\n[바뀐 것만] 비교 결과에서 수량이 달라진 행만 남깁니다\n[이 버전 행] 그 버전의 품목·기간·수량·확정 여부를 봅니다
help.sal-forecast.helpNote=내시를 올려도 생산 계획·작업지시에 자동으로 들어가지 않습니다.\n같은 기간을 다시 받아도 덮어쓰지 않고 새 버전이 생깁니다.
help.prd-wo.helpWhy=무엇을 몇 개, 어떤 라우팅과 BOM 으로 만들지 현장에 내리는 기준입니다. 없으면 POP 에 할 일이 뜨지 않고, 실적·LOT·입고를 이을 대상이 없습니다.
help.prd-wo.helpWhen=수주→출하 흐름의 2단계(만들기)·4단계(발행)·7단계(완료판정·완료·마감)입니다. 수주를 받아 지시를 만들 때, 생산 계획을 반영한 뒤 발행할 때, POP 에서 공정이 끝난 뒤 판정할 때 엽니다.
help.prd-wo.helpDo=[신규] [저장] 품목·수량·계획일·라우팅·BOM·수주 행으로 지시를 만듭니다(계획)\n[발행] 공정·파라미터·자재 소요를 그 순간 그대로 복사해 현장에 내립니다(발행). 이제 POP 에 할 일로 뜹니다\n[완료판정] POP 에서 종료한 공정의 투입과 양품·폐기·재작업·수리가 맞는지 보고 공정을 끝냅니다(완료)\n[처리] 남은 재작업·수리 수량을 양품(새 LOT)과 폐기로 나눕니다\n[지시 완료] 모든 공정이 끝난 지시를 완료로 바꿉니다. ERP 연동이 켜져 있으면 실적을 보냅니다\n[마감] 입고까지 끝난 지시를 닫습니다(마감 뒤 입고 불가). [지시 취소]는 착수 전 지시만, 사유와 함께 합니다
help.prd-wo.helpNote=발행 뒤에는 품목·수량·라우팅·BOM 을 바꿀 수 없습니다.\nPOP 에서 종료해도 공정은 끝나지 않습니다. [완료판정]을 해야 끝납니다.\n마감한 지시는 입고할 수 없습니다.
help.wms-loc.helpWhy=창고·로케이션에 용도·기본 상태·혼적·피킹 순서를 붙여 두지 않으면 입고·이동·피킹·투입 차감이 어느 칸을 쓸지 판단할 수 없습니다. 칸에 붙일 로케이션 라벨도 여기서 찍습니다.
help.wms-loc.helpWhen=재고 운영 흐름의 준비 단계입니다. 장비 계층에서 창고·로케이션을 만든 직후, 또는 칸의 쓰임(입고 대기·검사 대기·출하 대기·라인 옆)을 바꿀 때 엽니다.
help.wms-loc.helpDo=[조회] 공장의 창고·로케이션 트리와 저장된 속성을 불러옵니다.\n[저장] 고른 칸의 속성을 저장합니다. 하위 적용을 체크하면 하위 칸의 용도·혼적·기본 상태도 같이 바뀝니다.\n[하위 피킹 순서 다시 매기기] 트리 순서대로 피킹 순서를 10, 20, 30 … 으로 다시 매깁니다.\n[라벨 인쇄] 고른 칸(하위 포함 선택)의 로케이션 라벨을 인쇄 대기열에 넣습니다. 결과는 인쇄 이력에서 봅니다.\n[확인] 찍은 라벨이 위치·품목·GS1 중 무엇으로 읽히는지 보여 줍니다.
help.wms-loc.helpNote=노드를 만들거나 옮기는 것은 이 화면이 아니라 장비 계층 화면에서 합니다.\n하위 적용은 하위 칸의 기존 값을 덮어씁니다.\n라벨을 찍으려면 라벨 템플릿·프린터 화면에 프린터가 먼저 있어야 합니다.
help.prd-lot.helpWhy=자재 LOT 과 생산 LOT 이 무엇으로 만들어져 어디로 갔는지 계보로 잇습니다. 없으면 불량이 났을 때 같은 자재로 만든 제품과 영향 받은 고객을 찾을 수 없습니다.
help.prd-lot.helpWhen=수주→출하 흐름 전체에 걸쳐 씁니다 — POP 투입 전에 자재 LOT 을 등록할 때, 생산 LOT 을 나누거나 합칠 때, 부적합 흐름에서 LOT 을 보류하거나 풀 때 엽니다.
help.prd-lot.helpDo=[자재 LOT 등록] 공급사 LOT 번호로 자재 LOT 을 만들어 POP 에서 스캔할 수 있게 합니다\n[분할] [고른 LOT 병합] [라벨 바꿈] 새 LOT 을 만들고 계보를 남깁니다(원래 LOT 은 고치지 않습니다)\n[재작업] [수리] LOT 단위로 다시 작업한 양품을 새 LOT 으로 만듭니다\n[보류] [해제] 사유를 남기고 LOT 을 투입·입고 못 하게 막거나 근거를 풉니다(품질 처분 근거는 품질 쪽에서만 풉니다)\n어디서 왔나·어디로 갔나 계보를 따라가고, [역추적 보고서]로 한 장 보고서를 엽니다
help.prd-lot.helpNote=보류한 LOT 은 투입·입고할 수 없습니다.\n품질 처분으로 건 보류는 여기서 풀 수 없습니다.\n분할·병합·라벨 바꿈은 되돌릴 수 없습니다.
help.wms-label.helpWhy=로케이션·LOT·팔레트·출하 라벨의 모양(ZPL)과 보낼 프린터가 없으면 입고·출하·로케이션 화면에서 라벨을 찍을 수 없습니다.
help.wms-label.helpWhen=재고 운영 흐름의 준비 단계입니다. 라벨 프린터를 새로 들이거나 라벨 모양을 바꿀 때 엽니다.
help.wms-label.helpDo=[견본 불러오기] 고른 라벨 유형의 기본 ZPL 을 본문에 채웁니다.\n[미리보기] 자리표시자에 값을 넣은 실제 ZPL 글자를 보여 줍니다.\n[저장] 템플릿 또는 프린터를 저장합니다. 기본 템플릿을 바꾸면 이전 기본은 자동으로 내려갑니다.\n[시험 인쇄] 고른 프린터로 시험 라벨을 인쇄 대기열에 넣습니다.
help.wms-label.helpNote=라벨 유형은 만든 뒤 바꿀 수 없습니다.\n프린터는 사내망 주소만 등록됩니다.\n시험 인쇄는 인쇄 권한이 있어야 보입니다.
help.sys-terminal.helpWhy=작업장 태블릿·PDA·수집 장치를 이 회사와 공장·작업장에 묶어 로그인 없이 쓰게 합니다. 없으면 POP 착수·실적과 설비 상태 수집을 받을 수 없습니다.
help.sys-terminal.helpWhen=기준정보 준비 단계, 그리고 수주→출하 흐름에서 POP 을 처음 쓰기 전입니다. 새 태블릿을 두거나, 잃어버리거나 바꿀 때, 수집 장치를 붙일 때 엽니다.
help.sys-terminal.helpDo=[신규] [저장] 단말을 등록하고 등록 코드(24시간) 또는 수집 장치 키를 한 번만 보여 줍니다\n태블릿의 활성화 화면에 회사 코드와 등록 코드를 넣으면 그 단말이 켜집니다\n[등록 코드 다시 발급] 새 코드를 만들고 기존 단말 연결을 바로 끊습니다\n[폐기] 단말을 영구히 쓰지 못하게 합니다(되돌릴 수 없습니다)
help.sys-terminal.helpNote=등록 코드와 수집 장치 키는 한 번만 보입니다.\n[등록 코드 다시 발급]을 누르면 쓰던 단말이 바로 끊깁니다.\n[폐기]는 되돌릴 수 없습니다.
help.wms-print-job.helpWhy=라벨은 대기열을 거쳐 나중에 인쇄되므로 실제로 나갔는지 이 화면이 아니면 알 수 없습니다. 실패하거나 잃어버린 라벨을 다시 찍는 곳입니다.
help.wms-print-job.helpWhen=재고 운영 흐름의 라벨 단계입니다. 입고·출하·로케이션 화면에서 라벨을 찍었는데 나오지 않았거나 라벨이 상했을 때 엽니다.
help.wms-print-job.helpDo=[조회] 기간·유형·상태로 인쇄 작업을 찾습니다. 대기·보내는 중·완료·실패로 보입니다.\n[재발행] 사유와 프린터를 넣으면 같은 내용으로 새 작업을 대기열에 넣습니다. 원래 작업은 그대로 남습니다.
help.wms-print-job.helpNote=LOT·팔레트·출하 라벨 재발행은 승인 권한이 필요합니다.\n같은 라벨이 두 장 붙으면 재고가 두 번 잡힐 수 있습니다. 상한 라벨은 떼고 붙입니다.\n인쇄 실패는 입고·출하를 되돌리지 않습니다.
help.wms-stock.helpWhy=품목·위치·상태·LOT 별로 지금 얼마 있는지 보는 유일한 곳입니다. 출하·이동·실사·생산계획 모두 이 수량을 기준으로 합니다.
help.wms-stock.helpWhen=생산 입고에서 출하 흐름의 재고 단계, 입고 흐름의 마지막 단계입니다. 출하 지시 전에 가용 재고를 보거나, 숫자가 이상할 때 대사를 돌려 볼 때 엽니다.
help.wms-stock.helpDo=[조회] 조건에 맞는 재고 칸을 보여 주고, 행을 고르면 오른쪽에 그 칸의 최근 수불 20건이 나옵니다.\n[출고 후보 미리보기] 수량을 넣고 [계산] 을 누르면 차감 전략대로 어느 칸에서 얼마씩 나갈지 계산만 합니다.\n[대사 실행] 원장 합과 현재고가 같은지 확인하고 결과를 남깁니다.\n[생산 입고 이관] 이전에 등록된 생산 입고를 재고 원장에 한 번 옮깁니다. 이미 옮긴 입고는 건너뜁니다.
help.wms-stock.helpNote=현재고는 직접 고칠 수 없습니다. 바꾸려면 재고 이동·조정이나 재고 실사를 씁니다.\n출고 후보 미리보기는 재고를 예약하지 않습니다.\n대사는 불일치를 알리기만 하고 고치지 않습니다.
help.cms-state.helpWhy=수집 장치가 보낸 설비 상태를 하루 막대로 보여 언제 돌았고 멈췄고 연락이 끊겼는지 가립니다. 없으면 비가동 시간과 통신 끊김을 구분할 수 없습니다.
help.cms-state.helpWhen=수주→출하 흐름의 POP 작업 중(설비 쪽)과 설비 흐름의 상태 확인 단계입니다. 설비가 오래 멈췄을 때, 비가동 사유를 검토하기 전에, 수집이 빠졌는지 볼 때 엽니다.
help.cms-state.helpDo=[조회] 공장과 날짜를 골라 그날 설비별 상태를 불러옵니다(비우면 오늘)\n설비별 하루 설비마다 분류별 색 막대를 봅니다 — 회색은 멈춤이 아니라 알 수 없는 시간입니다\n상태 구간 구간마다 분류·사유·작업지시를 봅니다. 사유는 비가동 사유 검토에서 사후에 답니다\n연결 로그(끊김·누락) 수집 장치 끊김과 건너뛴 순번을 봅니다
help.cms-state.helpNote=회색 구간은 설비가 멈춘 것이 아니라 상태를 모르는 시간입니다.\n이 화면에서는 사유를 달 수 없습니다.\n사유는 비가동 사유 검토에서 답니다.
help.wms-trx.helpWhy=재고가 언제·어디서·왜 움직였는지의 원본 기록입니다. 잘못 넣은 입고·이동·출고를 바로잡는 유일한 통로(역분개)이기도 합니다.
help.wms-trx.helpWhen=재고 운영 흐름의 정정 단계입니다. 수량이 맞지 않아 원인을 찾을 때, 또는 잘못 확정한 입고·이동·반품 출고를 되돌릴 때 엽니다.
help.wms-trx.helpDo=[조회] 기간·위치·품목·유형으로 원장 행을 찾습니다.\n[역분개] 고른 행의 반대 수량 행을 새로 넣습니다. 이동은 출고·입고 짝이 함께, 반품 출고는 그 출고 전체가 되돌아갑니다.\n구매 입고 행을 되돌리면 발주의 받은 수량도 함께 줄어듭니다.
help.wms-trx.helpNote=원래 행은 지워지지 않고 남습니다.\n마감한 달의 행은 되돌릴 수 없습니다. 이번 달 조정으로 맞춥니다.\n품질 판정·NCR 에서 생긴 행은 여기서 되돌릴 수 없습니다. 품질 화면에서 무효로 합니다.
help.cms-equip-count.helpWhy=수집 장치가 센 양품·불량 수를 보고, 중복이나 센서 오작동으로 잘못 센 것을 바로잡습니다. 없으면 POP 실적 제안과 설비 KPI 가 틀린 수를 그대로 씁니다.
help.cms-equip-count.helpWhen=수주→출하 흐름의 POP 실적 확정 전후, 그리고 설비 KPI 를 보기 전입니다. POP 의 수집 값이 이상해 보일 때, 기간 KPI 를 확정하기 전에 엽니다.
help.cms-equip-count.helpDo=[조회] 공장·발생일 기간·설비로 수집 카운트를 불러옵니다\n행을 고르면 수량·수집 장치·발생 시각을 봅니다\n[정정] 사유를 남기고 그 수량을 빼는 행을 하나 더합니다(원래 행은 그대로, 한 행에 한 번만)\nPOP 의 수집 값 쓰기와 설비 KPI 는 정정을 더한 값으로 다시 계산됩니다
help.cms-equip-count.helpNote=정정은 한 행에 한 번만 되고 되돌릴 수 없습니다.\n이미 확정한 POP 실적은 정정해도 바뀌지 않습니다.
help.prd-receipt.helpWhy=마지막 공정에서 나온 양품 LOT 을 창고 재고로 넘기는 생산 쪽 문입니다. 없으면 만든 제품이 재고에 잡히지 않아 출하할 수 없습니다.
help.prd-receipt.helpWhen=수주→출하 흐름의 8단계, 완료판정 뒤 지시 마감 전입니다. 마지막 공정 양품이 나와 창고로 옮길 때, 잘못 넣은 입고를 바로잡을 때 엽니다.
help.prd-receipt.helpDo=왼쪽에서 진행·완료 지시를 고르면 입고할 LOT 과 남은 수량이 보입니다\n[입고] 창고·로케이션과 수량을 넣어 입고합니다 — 재고 원장에 바로 더해지고, ERP 연동이 켜져 있으면 ERP 로도 보냅니다\n[정정] 사유를 남기고 반대 수량을 기록합니다(재고와 ERP 도 같이 되돌립니다, 한 번만)\n보류 LOT·마감한 지시는 입고할 수 없습니다
help.prd-receipt.helpNote=입고하면 재고가 바로 늘어납니다.\n입고 정정은 한 행에 한 번만 됩니다.\n지시를 마감하면 입고와 정정을 할 수 없습니다.
help.wms-move.helpWhy=사람이 재고를 다른 칸으로 옮기거나, 상태를 바꾸거나, 수량을 늘리고 줄이는 유일한 화면입니다. 여기를 거치지 않은 이동은 장부에 남지 않습니다.
help.wms-move.helpWhen=재고 운영 흐름의 이동 단계입니다. 자재를 라인 옆으로 보급할 때, 칸을 정리할 때, 파손·분실로 수량을 조정할 때 엽니다.
help.wms-move.helpDo=[채우기] 스캔한 위치·품목·LOT 라벨을 빈 칸에 채웁니다.\n작업에서 이동·상태 변경 또는 조정을 고릅니다.\n[확정] 원장에 한 번 넣습니다. 이동은 출발 −·도착 + 짝, 조정은 증감 한 행입니다.\n[오늘 입력] 오늘 이 공장에서 넣은 이동·조정을 봅니다.
help.wms-move.helpNote=조정은 사유가 필요합니다.\n보류 중인 LOT 은 다른 위치로 옮길 수 없고 같은 위치에서 상태만 바꿉니다.\n잘못 확정했으면 수불 원장 화면에서 역분개합니다.
help.prd-result.helpWhy=현장에서 POP 으로 남긴 실적을 사무실에서 한곳에 모아 봅니다. 없으면 오늘·이번 주에 무엇을 얼마나 만들고 버렸는지 POP 단말마다 따로 봐야 합니다.
help.prd-result.helpWhen=수주→출하 흐름의 6단계, POP 실적 확정 뒤입니다. 근무조가 끝났을 때, 완료판정 전에 수량을 확인할 때, 작업자·근무조별 불량을 볼 때 엽니다.
help.prd-result.helpDo=[조회] 작업일 기간으로 실적을 불러옵니다(정정된 실적은 흐리게)\n[보기] 실적 한 건씩·지시별·공정별·작업자별·작업일·근무조별로 묶습니다(묶음 합계는 정정을 뺀 순수량)\n[엑셀] 지금 보이는 결과를 파일로 받습니다\n실적 저장과 정정은 이 화면이 아니라 POP 의 오늘 실적에서 합니다
help.prd-result.helpNote=이 화면에서는 실적을 고치거나 지울 수 없습니다.\n근무조 설정을 바꿔도 지난 실적의 작업일·근무조는 그대로입니다.
help.wms-rcv.helpWhy=들어온 자재를 위치·상태와 함께 장부에 올리고 내부 LOT 을 만드는 곳입니다. 여기서 입고하지 않으면 발주의 받은 수량도, 재고도, 수입검사 대상도 생기지 않습니다.
help.wms-rcv.helpWhen=구매요청에서 재고 흐름의 입고 단계입니다. 협력사 물건이 도착해 납품서나 공급사 라벨을 찍을 때 엽니다.
help.wms-rcv.helpDo=[찾기] 납품 예정(ASN)을 찾고, [채우기] 로 품목·발주 행·수량·공급사 LOT 을 채웁니다.\n[채우기] 스캔한 위치·품목·GS1 라벨을 입력 칸에 채웁니다.\n발주 행을 고르면 구매 입고, 고르지 않으면 발주 없는 자재 입고입니다.\n[입고 확정] 새 입고 LOT 을 만들고 그 위치·상태로 재고를 늘립니다. 발주의 받은 수량도 함께 늘고, 프린터를 고르면 LOT 라벨이 나갑니다.
help.wms-rcv.helpNote=수입검사 계획이 있는 품목은 상태가 검사 대기로 고정되고, 판정이 나야 쓸 수 있습니다.\n발주 허용 범위보다 많이 받으면 거부됩니다.\n잘못 넣은 입고는 수불 원장 화면에서 역분개합니다.
help.prd-lot-report.helpWhy=LOT 하나의 자재·작업자·설비·조건·판정·입고·출고 이력을 한 장에 모읍니다. 없으면 고객 감사나 클레임 때 여러 화면을 돌며 자료를 맞춰야 합니다.
help.prd-lot-report.helpWhen=수주→출하 흐름의 끝(추적)과 부적합 흐름의 시작입니다. 고객 감사·클레임이 들어왔을 때, 불량 LOT 의 원인과 영향 범위를 볼 때 엽니다.
help.prd-lot-report.helpDo=[조회] LOT 번호를 스캔하거나 넣으면 보고서를 만듭니다\n어디서 왔나(역추적) 쓰인 자재 LOT·공급사 LOT 까지 거슬러 올라갑니다\n생산·파라미터·완료판정·설비 상태·입고 누가·어느 설비·어떤 조건으로 만들었는지 보여 줍니다(정정은 흐리게, NG 는 붉게)\n어디로 갔나(정추적) 이 LOT 이 들어간 다음 LOT 을 따라갑니다\n[인쇄] PDF 로 저장합니다
help.prd-lot-report.helpNote=LOT 번호는 대소문자를 구분합니다.\n정정된 기록도 지우지 않고 흐리게 보여 줍니다.
help.wms-ship.helpWhy=수주 행을 근거로 창고에서 꺼내 고객에게 내보내는 곳입니다. 여기서 출하 확정해야 수주의 출하 수량이 쌓이고 재고가 빠지며 ERP 로 출하가 갑니다.
help.wms-ship.helpWhen=수주에서 출하 흐름의 마지막 단계입니다. 납기가 된 수주를 출하할 때, 또는 팔레트 라벨을 찍어 출하 건을 다시 열 때 엽니다.
help.wms-ship.helpDo=[신규] 에서 고객을 넣고 [수주 행 불러오기] 로 남은 수량이 있는 행을 고른 뒤 [저장] 하면 작성 중 지시가 생깁니다.\n줄마다 [제안] 이나 [다른 칸] 으로 꺼낼 칸을 채우고 [피킹 확정] 하면 재고가 출하 대기 위치로 옮겨지고 피킹 중이 됩니다.\n[새 팔레트]·[고른 피킹 담기]·[닫기] 로 팔레트를 만들고 닫으면 SSCC 와 팔레트 라벨이 붙습니다.\n[출하 확정] 재고를 빼고 수주 출하 수량을 올립니다(다 나가면 수주 행이 닫힘). 출하 완료가 됩니다.\n[고른 피킹 취소] 피킹을 원래 칸으로 되돌리고, [지시 취소] 는 작성 중 지시만 취소합니다.
help.wms-ship.helpNote=가용 재고만 피킹됩니다. 검사 대기·보류 LOT 은 판정이나 해제가 먼저입니다.\n출하 확정 뒤 되돌리려면 승인 권한으로 출하 취소를 합니다.\n팔레트 필수 공장은 모든 피킹이 닫힌 팔레트에 있어야 확정됩니다.
help.wms-rtn-issue=구매 쪽 반품 지시 화면에서 확정한 협력사 반품을 창고에서 실제로 내보냅니다. 반품 번호로 지시를 찾고, 칸마다 출고 수량을 넣어 합이 지시 수량과 같게 한 뒤 한 번에 확정합니다. 확정하면 재고가 빠지고 반품 지시는 출고됨이 됩니다.
help.wms-rtn-issue.helpWhy=반품 지시는 구매 쪽 결정일 뿐이라, 이 화면에서 출고해야 실제 재고가 빠지고 반품 지시가 출고됨으로 바뀝니다. 교체 요구 반품이면 발주의 받을 수량이 다시 열립니다.
help.wms-rtn-issue.helpWhen=부적합 흐름의 끝(협력사 반품), 재고 운영 흐름의 반품 출고 단계입니다. 구매 담당이 반품 지시를 확정하고 반품 라벨을 넘겨주면 엽니다.
help.wms-rtn-issue.helpDo=[조회] 반품 번호(RTN 라벨 스캔 가능)로 지시와 출고할 수 있는 재고 칸을 불러옵니다.\n[지시 수량 채우기] 지시 수량을 재고 칸에 차례대로 나눠 채웁니다.\n[출고 확정] 칸별 수량을 한 번에 출고합니다. 재고가 빠지고 반품 지시가 출고됨이 됩니다.
help.wms-rtn-issue.helpNote=나눠 출고할 수 없습니다. 합이 지시 수량과 같아야 합니다.\n보류 중인 LOT 도 출고됩니다.\n잘못 출고했으면 수불 원장 화면에서 역분개합니다. 그 출고 전체가 되돌아가고 반품 지시는 확정으로 돌아갑니다.
help.prd-erp-export.helpWhy=ERP 와 직접 연동하지 않는 회사가 생산 실적과 입고를 ERP 에 올릴 파일로 받는 곳입니다. 없으면 ERP 에 같은 숫자를 손으로 다시 입력해야 합니다.
help.prd-erp-export.helpWhen=수주→출하 흐름의 끝, 지시 완료·생산 입고 뒤입니다. 하루·한 달 단위로 ERP 에 실적이나 입고를 올릴 때 엽니다.
help.prd-erp-export.helpDo=[조회] 종류(지시 실적은 완료일, 생산 입고는 입고일)와 기간으로 내보낼 행을 미리 봅니다\nERP 품목 코드 매핑이 없는 행은 경고로 보입니다 — 외부 ID 매핑을 먼저 채우세요\n이 기간과 겹치는 이전 내보내기 같은 기간을 누가 언제 이미 내보냈는지 보여 줍니다\n[엑셀] 파일을 받고 내보내기 기록을 남깁니다(다시 내보내기는 막지 않으니 ERP 에 두 번 올리지 않게 확인하세요)
help.prd-erp-export.helpNote=같은 기간을 다시 내보내도 막지 않습니다.\nERP 에 두 번 올리지 않게 이전 내보내기를 확인하세요.\nERP 자동 연동을 쓰는 회사가 이 파일을 또 올리면 중복됩니다.
help.cms-fail-code.helpWhy=고장을 같은 코드로 남기지 않으면 보전 작업지시를 완료할 수 없고 고장 패턴·회사 간 비교도 할 수 없습니다. 고장 신고의 현상 버튼도 여기 코드로 만들어집니다.
help.cms-fail-code.helpWhen=기준정보 준비 단계에서 설비를 들여올 때 한 번 정하고, 고장 기록에 "기타" 가 늘면 코드를 더합니다.
help.cms-fail-code.helpDo=[신규] 유형(현상·원인·조치)을 골라 새 코드를 만듭니다\n[저장] 이름·상위 분류·설비 클래스·순서를 고칩니다. 유형과 코드는 바꿀 수 없습니다\n사용을 끄면 새 신고·작업지시에서만 안 보이고 지난 기록은 그대로입니다\n[엑셀로 내보내기] 목록을 내려받습니다
help.cms-fail-code.helpNote=유형과 코드는 만든 뒤 바꿀 수 없습니다. 잘못 만들었으면 사용을 끄고 새로 만듭니다.\n원인 코드는 상위 분류가 꼭 있어야 합니다.\n설비 클래스를 걸면 다른 클래스 설비와 금형·지그에서는 그 코드가 보이지 않습니다.
help.pms-template.helpWhy=프로젝트마다 WBS·산출물·게이트 점검을 처음부터 짜지 않도록 회사 표준을 한 번 정해 두는 곳입니다. 없으면 프로젝트마다 일정과 필수 산출물이 제각각이 되어 게이트 준비율을 비교할 수 없습니다.
help.pms-template.helpWhen=신제품 개발 흐름의 1단계입니다. 프로젝트를 만들기 전, 또는 회사의 개발 절차가 바뀌었을 때 엽니다.
help.pms-template.helpDo=[신규 템플릿] 기준일(시작일 또는 SOP)을 정해 빈 템플릿을 만듭니다.\n[기본 APQP 템플릿 만들기] 단계마다 게이트가 있는 5단계 출발점을 만듭니다. 이미 있으면 그것을 엽니다.\n[하위 작업 추가]·[아래에 추가] 작업을 더하고 기준일 대비 일수로 일정을 적습니다.\n[추가] 작업에 산출물 칸, 게이트 작업에 점검 문구를 답니다. 프로젝트를 만들 때 복사됩니다.\n[템플릿 저장] 머리 정보를 저장합니다. 이미 만든 프로젝트는 바뀌지 않습니다.
help.pms-template.helpNote=템플릿을 고쳐도 이미 만든 프로젝트에는 반영되지 않습니다.
help.srm-supplier.helpWhy=협력사로 등록하지 않은 거래처에는 발주·회신·평가를 할 수 없습니다. 인증서·공급 품목·단가를 여기 두어야 발주 단가 기본값과 인증 판정이 맞게 나옵니다.
help.srm-supplier.helpWhen=구매 흐름을 시작하기 전 준비 단계입니다. 새 협력사와 거래를 시작할 때, 인증서를 갱신하거나 단가가 바뀔 때, 평가 결과로 거래 상태를 바꿀 때 엽니다.
help.srm-supplier.helpDo=[협력사로 등록] 구매·겸용 거래처를 협력사로 만듭니다(한 번만).\n[저장] 구매 담당·결제 조건·통화·거래 상태를 바꿉니다. 정지로 바꾸면 새 발주와 발행이 막힙니다.\n[인증서 추가] 인증서를 새 행으로 남깁니다. 만료가 가까우면 만료 임박으로 보입니다.\n[공급 품목 저장] 협력사 품번·리드타임·최소 발주·우선순위를 저장합니다.\n[단가 저장] 기간별 단가를 저장합니다. 끝 없는 새 단가는 이전 단가를 전날로 마감합니다.
help.srm-supplier.helpNote=평가의 보류 제안은 거래 상태를 바꾸지 않습니다. 여기서 사람이 바꿉니다.
help.cms-equip-profile.helpWhy=설비마다 중요도와 기본 보전 담당이 없으면 고장 신고를 받아도 누가 맡을지 비어 있고, 먼저 챙길 핵심 설비를 가릴 수 없습니다.
help.cms-equip-profile.helpWhen=기준정보 준비 단계에서 설비를 등록한 뒤, 또는 담당자가 바뀌었을 때 엽니다.
help.cms-equip-profile.helpDo=목록에서 설비를 고르면 지금 프로필이 보입니다(없으면 C·핵심 아님·담당 없음)\n[저장] 중요도·핵심 설비·기본 담당을 저장합니다. 담당은 작업지시 접수 때 기본값이 됩니다\n[이력 카드 열기] 그 설비의 설비 이력 카드로 갑니다
help.cms-equip-profile.helpNote=기본 담당은 작업지시를 접수할 때 담당을 비웠을 때만 들어갑니다. 이미 접수된 작업지시의 담당은 바뀌지 않습니다.\n프로필이 없는 설비는 중요도 C·핵심 아님으로 봅니다.
help.pms-project.helpWhy=프로젝트의 작업·일정·담당·진척을 한 곳에 모아 지연을 알아보고 기준선과 비교하기 위해 있습니다. 산출물·게이트·이슈·공수 화면은 모두 여기서 만든 프로젝트와 작업을 기준으로 합니다.
help.pms-project.helpWhen=신제품 개발 흐름의 2~3단계입니다. 템플릿으로 프로젝트를 만들 때, 그리고 진행 중에 일정·진척을 고칠 때 엽니다.
help.pms-project.helpDo=[신규 프로젝트] 템플릿과 시작일 또는 SOP 로 작성 중 프로젝트를 만들고 작업·산출물 칸·점검 문구를 복사합니다.\n[상태 변경] 작성 중 → 진행 중 → 보류·종료 또는 취소로 바꿉니다. 종료·취소된 프로젝트는 고칠 수 없습니다.\n[ECO 연결] 이 프로젝트가 실행하는 설계 변경 지시를 연결합니다. 지시 하나에 프로젝트 하나입니다.\n[기준선 확정] 지금 계획을 기준선으로 남깁니다. 그 뒤 계획일을 바꾸면 사유가 필요합니다.\n[의존 위반 밀기] 선행보다 먼저 시작하는 후행 작업을 미는 계획을 보여 준 뒤 확인하면 바꿉니다.
help.pms-project.approval=정책 PMS_PROJ_APPROVAL 이 켜진 회사는 착수(작성 중 → 진행)와 종료(진행 → 종료)를 결재로 합니다. 결재선 기본값은 내 부서장(소속 부서에서 위로 올라가며 첫 장, 본인은 건너뜀)이고, 없으면 상신자가 고릅니다. 상신 전에 바꾸거나 더할 수 있습니다. 종료는 열린 작업·필수 산출물·이슈 조건을 상신 때와 승인 때 두 번 확인하고, 승인 때 조건이 깨져 있으면 승인되지 않습니다. 결재 중에는 프로젝트 정보·상태·ECO 연결이 잠깁니다.
help.pms-project.copy=열어 둔 프로젝트의 WBS 로 새 프로젝트를 만듭니다. 작업 트리·종류·계획 공수·선후행·산출물 정의(필수·빈 서식)·게이트 점검 문구를 복사하고, 일정은 원본 첫 시작일을 새 시작일(필수)로 옮겨 기간·간격을 그대로 둡니다. 담당·실적·진척·기준선·이력·제출물은 가져오지 않습니다.
help.pms-project.toTemplate=이 프로젝트로 새 템플릿(기준일 = 시작일)을 만듭니다. 작업 트리·종류·상대 일정(첫 시작일부터 며칠 뒤·기간)·표준 공수(잎 작업 계획 공수)·선후행·산출물 칸(필수·빈 서식)·게이트 점검 문구를 옮기고, 담당·실적·기준선·제출물은 가져오지 않습니다. 템플릿 저장 권한과 이 화면 조회 권한이 모두 있어야 합니다.
help.pms-project.helpNote=종료·취소한 프로젝트는 다시 열 수 없습니다.
help.srm-pr.helpWhy=누가 무엇을 왜 사 달라고 했는지 승인 기록이 없으면 발주의 근거를 설명할 수 없습니다. 승인된 요청 행만 발주로 가져올 수 있습니다.
help.srm-pr.helpWhen=구매 흐름의 1단계입니다. 현장이나 생산관리에서 살 품목과 필요일이 생기면 요청하고, 승인자는 요청이 올라오면 엽니다.
help.srm-pr.helpDo=[저장] 머리와 품목 행을 작성 중으로 저장합니다.\n[요청] 작성 중에서 요청됨으로 바뀝니다. 필요일이 오늘 이후인지 확인합니다.\n[회수] 요청됨을 작성 중으로 되돌립니다.\n[승인] / [반려] 요청됨을 승인 또는 반려(사유 필수)합니다. 본인 요청은 승인할 수 없습니다.\n[다시 작성] 반려된 요청을 작성 중으로 되돌립니다.\n[마감] / [취소] 승인된 요청을 마감하거나 취소합니다. 발주가 걸린 요청은 취소할 수 없습니다.
help.srm-pr.helpNote=요청을 발주로 다 옮겨도 자동으로 마감되지 않습니다. [마감]을 따로 누릅니다.
help.cms-equip-card.helpWhy=설비 한 대의 고장·점검·예비품·카운터 기록이 여러 화면에 흩어져 있어, 감사나 인수인계 때 한 번에 보여 줄 곳이 필요합니다.
help.cms-equip-card.helpWhen=설비 흐름의 마지막 확인 단계에서, 고장이 잦은 설비를 살피거나 고객 감사에 설비 이력을 낼 때 엽니다.
help.cms-equip-card.helpDo=[조회] 설비와 기간을 골라 요약과 이력 표를 봅니다\n[작업지시 열기] 표에서 고른 작업지시를 보전 작업지시 화면에서 엽니다\n[엑셀로 내보내기] 이력 표를 내려받습니다\n읽기 전용 화면입니다. 고칠 것은 각 원래 화면에서 고칩니다
help.cms-breakdown.helpWhy=작업자에게 작업지시 처리 권한을 주지 않고도 고장을 바로 알리고, 고친 결과를 직접 확인하게 합니다.
help.cms-breakdown.helpWhen=고장 신고 흐름의 1단계입니다. 설비가 멈추거나 이상할 때 현장에서 바로 엽니다(설비 QR 로 열 수도 있습니다).
help.cms-breakdown.helpDo=[찾기] 코드·이름으로 설비나 금형을 찾아 고릅니다\n현상 버튼을 누르거나 글로 쓰고, 멈췄으면 멈춤을 고릅니다\n[신고] 고장 수리 작업지시가 신고 상태로 만들어지고 보전 담당이 접수합니다\n[확인] 내 신고가 완료되면 작업 내용을 보고 확인합니다(확인 상태로 바뀝니다)
help.cms-breakdown.helpNote=신고만으로는 수리가 시작되지 않습니다. 보전 담당이 접수해야 진행됩니다.\n내가 신고한 것만 보입니다. POP 로 한 신고는 여기서 확인할 수 없습니다.\n사진은 신고를 마친 뒤 올라갑니다.
help.srm-po.helpWhy=협력사에게 무엇을 얼마에 언제까지 달라고 했는지의 공식 기록입니다. 발행한 발주가 있어야 납기 회신·사전 납품 통지·구매 입고·납기 준수율이 이어집니다.
help.srm-po.helpWhen=구매 흐름의 2단계입니다. 구매요청이 승인됐거나 바로 살 품목이 있을 때 만들고, 협력사에 보낸 뒤 내용이 바뀌면 다시 열어 개정합니다.
help.srm-po.helpDo=[구매요청에서 가져오기] 승인된 요청의 남은 수량으로 행을 추가합니다.\n[저장] 작성 중으로 저장합니다. 단가를 비우면 단가표 값이 들어갑니다.\n[결재 상신] / [확정] 결재가 필요하면 결재 중을 거쳐 승인되고, 필요 없으면 바로 승인됩니다.\n[발행] 승인된 발주를 발행합니다. 발행본이 남고 협력사 통지가 나갑니다.\n[개정] 발행·회신된 발주를 개정 번호를 올려 작성 중으로 되돌립니다. 협력사 회신을 다시 받아야 합니다.\n[마감] / [취소] 더 받지 않을 발주를 마감하거나 사유를 적어 취소합니다. 발행된 발주를 취소하면 협력사에 통지합니다.
help.srm-po.helpNote=발행한 발주는 [개정]으로만 바꿉니다. 개정하면 협력사 회신을 다시 받아야 합니다.
help.srm-po-print=발주서를 인쇄용 서식으로 보여 줍니다. 기본은 마지막 발행본(협력사에게 간 그대로)이고, 발행 전이거나 개정 중이면 지금 내용이 초안 표시와 함께 나옵니다. 브라우저 인쇄 창에서 PDF 로 저장할 수 있습니다.
help.srm-po-print.helpWhy=협력사에 보낸 발주를 종이나 PDF 로 남기거나 전달하려면 화면이 아닌 정해진 서식이 필요합니다.
help.srm-po-print.helpWhen=구매 흐름 2단계 끝, 발주를 발행한 뒤입니다. 발주 관리의 [발주서 인쇄]를 누르면 새 창으로 열립니다(메뉴에는 없습니다).
help.srm-po-print.helpDo=[인쇄] 도구 막대를 숨기고 브라우저 인쇄 창을 엽니다. 여기서 PDF 로 저장할 수 있습니다.\n[엑셀] 같은 내용을 서식이 고정된 엑셀 파일로 받습니다.\n개정 번호를 지정해 열면 그 개정의 발행본을 보여 줍니다.
help.srm-po-print.helpNote=화면에 보이는 것은 마지막 발행본입니다. 개정 중인 내용에는 초안 표시가 붙습니다.
help.cms-mwo.helpWhy=고장 수리·개선·예방 작업을 누가 언제 무엇을 했는지 전이 순서대로 남기고, 완료한 기록이 바뀌지 않게 합니다. 사용 예비품의 재고 출고도 완료 때 함께 일어납니다.
help.cms-mwo.helpWhen=고장 신고 흐름의 2~6단계(접수→착수→완료→확인)이고, 예방점검을 작업지시로 하는 계획의 실행 단계입니다. 신고가 들어오거나 예방점검 예정이 생기면 엽니다.
help.cms-mwo.helpDo=[접수] 신고를 접수로 바꿉니다. 담당이 비면 설비 프로필의 기본 담당이 들어갑니다\n[착수] 작업 중으로 바꿉니다\n[공수 추가]·[예비품 추가] 작업 중에 공수와 쓴 부품을 남깁니다\n[완료] 현상·원인·조치와 작업 내용을 확인해 완료로 바꿉니다. 재고 연동이 켜져 있으면 예비품이 창고에서 출고됩니다\n[확인] 완료를 확인 상태로 닫습니다. [취소] 는 신고·접수 상태에서만 사유와 함께 합니다\n[반납] 완료 뒤 덜 쓴 예비품을 창고로 되돌립니다
help.cms-mwo.helpNote=완료한 뒤에는 내용·공수·사용 예비품을 고칠 수 없습니다. 되돌리기는 없고, 다시 손볼 일은 새 작업지시로 합니다.\n예비품 재고 출고는 공장 정책 WMS_MRO_LINK 가 켜져 있을 때만 일어납니다. 꺼져 있으면 기록만 남고 재고는 줄지 않습니다.\n재고가 모자라거나 마감된 달이면 완료 전체가 취소되고 작업 중 상태로 남습니다.
help.srm-notify.helpWhy=협력사 통지는 발행·취소·클레임 보내기와 따로 나가기 때문에, 실패해도 업무는 끝난 것처럼 보입니다. 이 화면이 없으면 협력사가 발주나 클레임을 받지 못한 것을 알 수 없습니다.
help.srm-notify.helpWhen=구매 흐름 2단계(발주 발행·취소) 뒤와 협력사 클레임을 보낸 뒤에 엽니다. 협력사가 발주를 받지 못했다고 하면 먼저 여기서 확인합니다.
help.srm-notify.helpDo=[조회] 기간·상태로 발주·클레임 통지를 봅니다. 받는 주소는 일부를 가려서 보입니다.\n[다시 보내기(고른 실패 통지)] 실패한 통지만, 지금 상태와 지금 주소로 새 통지를 만듭니다. 주소를 고친 뒤 누릅니다.\n아래 가짜 메일함에서 실제 메일 대신 남은 통지 내용을 확인합니다.
help.srm-notify.helpNote=지금은 실제 메일이 나가지 않습니다. 가짜 메일함에만 남습니다.
help.cms-chk-tmpl.helpWhy=무엇을 어떤 기준으로 점검할지 정해 두지 않으면 예방점검 계획을 만들 수 없고, 점검 결과를 합격·불합격으로 판정할 수 없습니다.
help.cms-chk-tmpl.helpWhen=예방점검 흐름을 시작하기 전 기준정보 준비 단계에서, 설비 종류별 점검 기준이 생기거나 바뀔 때 엽니다.
help.cms-chk-tmpl.helpDo=[신규]·[저장] 점검표 코드·이름·대상 종류·설비 클래스를 정합니다\n[항목 추가] 점검 항목 줄을 더합니다(판정 방식·하한·상한·필수)\n[항목 저장] 항목을 한 번에 저장합니다. 이미 만든 점검과 지난 기록은 바뀌지 않습니다
help.cms-chk-tmpl.helpNote=점검표를 고쳐도 이미 만들어진 점검과 지난 기록은 바뀌지 않습니다. 다음 예정부터 새 항목이 쓰입니다.\n항목은 한 번에 저장됩니다. 다른 사람이 먼저 저장했으면 다시 불러와야 합니다.
help.cms-pm-plan.helpWhy=점검 주기를 정해 두지 않으면 사람이 날짜를 기억해야 하고 놓친 점검이 드러나지 않습니다. 여기서 정한 주기대로 점검과 작업지시가 자동으로 만들어집니다.
help.cms-pm-plan.helpWhen=예방점검 흐름의 1단계입니다. 설비·금형마다 점검 주기(날짜 또는 타수·가동 시간)를 처음 정하거나 바꿀 때 엽니다.
help.cms-pm-plan.helpDo=[신규]·[저장] 대상·점검표·실행 방식·주기·첫 예정일·담당을 정합니다\n[예정 보기] 앞으로의 예정일을 미리 봅니다\n[일괄 만들기] 한 설비 클래스의 설비마다 같은 계획을 만듭니다\n[지금 생성] 매시 정기 작업을 기다리지 않고 기한이 된 점검(과 작업지시)을 지금 만듭니다\n[달력 보기] 공장별 달력으로 예정을 봅니다
help.cms-pm-plan.helpNote=한 계획에 열린 점검은 하나뿐입니다. 지난 점검을 끝내거나 건너뛰어야 다음이 만들어집니다.\n주기 종류와 카운터는 만든 뒤 바꿀 수 없습니다. 바꾸려면 새 계획을 만듭니다.\n예정은 매시 정기 작업이 만듭니다. 바로 보려면 지금 생성을 누릅니다.
help.cms-chk-run.helpWhy=예정된 점검을 실제로 했는지, 결과가 기준 안인지 남기지 않으면 예방점검 준수율을 알 수 없고 불합격 항목이 수리로 이어지지 않습니다.
help.cms-chk-run.helpWhen=예방점검 흐름의 실행 단계입니다. 예정이 생겨 홈 카드나 목록에 오늘·지연 점검이 보일 때 엽니다.
help.cms-chk-run.helpDo=[결과 저장] 항목별 결과를 저장합니다. 수치는 서버가 기준으로 판정합니다\n[완료] 필수 항목이 다 차면 일상점검을 완료로 바꾸고 다음 예정을 계산합니다\n[건너뛰기] 사유를 적고 이번 예정을 건너뜁니다(다음 예정이 계산됩니다)\n[후속 작업지시] 불합격 항목에서 고장 수리 작업지시를 바로 만듭니다
help.cms-chk-run.helpNote=작업지시 방식 점검은 여기서 완료할 수 없습니다. 보전 작업지시에서 완료하면 함께 끝납니다.\n완료한 점검 결과는 고칠 수 없습니다.\n건너뛰기는 되돌릴 수 없고, 그 예정을 한 것으로 보고 다음 예정을 계산합니다.
help.cms-counter.helpWhy=타수·가동 시간 누적이 없으면 사용량 기준 예방점검(예 5만 타마다)이 생기지 않고 금형 수명 경고도 볼 수 없습니다.
help.cms-counter.helpWhen=사용량 흐름의 단계입니다. 금형·설비에 카운터를 처음 만들 때, 그리고 자동으로 세지 않는 계기 값을 정기적으로 읽어 넣을 때 엽니다.
help.cms-counter.helpDo=[신규]·[저장] 대상·종류·단위·자릿수로 카운터를 만듭니다\n[입력] 지금 계기 값(또는 증가량)을 넣으면 누적이 늘고, 사용량 계획의 예정에 닿으면 점검이 바로 만들어집니다\n[무효] 마지막 기록부터 사유를 적고 무효로 합니다\n생산 실적·수집 가동 시간은 매시 자동으로 더해집니다
help.cms-counter.helpNote=기록은 고칠 수 없고 마지막 것부터 무효로만 합니다.\n이미 만들어진 예방점검 예정은 무효로 해도 사라지지 않습니다. 필요하면 점검 실행에서 건너뜁니다.\n자동 입력은 카운터를 만든 뒤의 실적만 셉니다. 이전 누적은 증가량 직접으로 넣습니다.
help.cms-spare.helpWhy=어느 설비에 어떤 부품이 들어가는지 연결해 두지 않으면 작업지시에서 예비품을 고르기 어렵고, 설비·품목별 사용 이력을 볼 수 없습니다.
help.cms-spare.helpWhen=기준정보 준비 단계에서 설비 부품 목록을 정할 때, 그리고 부품 사용량을 살필 때 엽니다.
help.cms-spare.helpDo=[신규]·[저장] 설비 또는 설비 클래스에 품목을 연결하고 설치 수량·핵심 예비품을 정합니다\n연결은 작업지시의 예비품 후보로 나옵니다. 재고 수량과 출고는 창고(WMS)에서 다룹니다\n사용 이력 [조회] 기간 안 작업지시에서 쓴 기록을 봅니다\n[엑셀 내려받기] 연결 표 또는 사용 이력을 내려받습니다
help.cms-spare.helpNote=여기서는 재고가 움직이지 않습니다. 수량과 출고는 창고(WMS)에서 다룹니다.\n대상과 품목은 만든 뒤 바꿀 수 없습니다. 다른 품목이면 새 연결을 만들고 이전 것은 사용을 끕니다.
help.cms-equip-sec.helpWhy=설비 PC 의 OS 지원 종료·악성코드 검사 기한을 한곳에 두지 않으면 고객 보안 감사에 답할 수 없고 위험한 설비를 놓칩니다.
help.cms-equip-sec.helpWhen=설비 대장 흐름에서, 설비를 들여오거나 보안 점검·연간 검토를 할 때 엽니다.
help.cms-equip-sec.helpDo=[조회] 사용 중 설비 전체를 보고 경고(미등록·지원 종료 OS·검사 기한 경과·등급 미달·미검토)로 거릅니다\n[저장] 설비를 골라 네트워크·OS·검사일·보안 등급·USB·원격 접속·검토일을 저장합니다\n[엑셀 내려받기] 같은 조건과 경고를 감사용으로 내려받습니다
help.cms-equip-sec.helpNote=경고는 저장되지 않고 조회할 때마다 오늘 날짜로 다시 계산됩니다.\n악성코드 검사 기한은 네트워크에 연결된 설비만 봅니다.\n검사 주기와 검토 주기는 회사 정책 값을 따릅니다.
help.cms-risk.helpWhy=산업안전보건법은 사업장 위험성평가를 근로자 참여 아래 하고 기록을 남기게 합니다. 이 기록과 개선 증빙이 없으면 점검·사고 때 근거를 낼 수 없습니다.
help.cms-risk.helpWhen=설비 안전 대장 흐름입니다. 최초·정기(해마다)·수시(설비 도입·변경) 평가 때 엽니다.
help.cms-risk.helpDo=[신규]·[저장] 평가 머리를 만듭니다(작성 중)\n[새 요인]·[요인 저장]·[참여자 추가] 유해위험요인과 근로자 참여를 기록합니다\n[확정 요청] 확정 검사를 통과하면 결재로 올리거나(결재 중) 결재 없는 설정이면 바로 확정합니다\n[개선 진행 저장] 확정 뒤 개선 완료일·개선 후 위험성을 남깁니다\n[새 평가로 복사] 확정본을 다음 평가의 작성 중 사본으로 만듭니다. [폐기] 는 더 쓰지 않는 평가를 폐기합니다
help.cms-risk.helpNote=확정한 뒤에는 요인·위험성·대책·참여 내용을 고칠 수 없습니다. 개선 진행과 주지일만 채웁니다.\n근로자 참여 기록이 없거나 중간 이상 위험에 대책·담당·기한이 없으면 확정할 수 없습니다.\n결재를 거칠지는 회사 정책에 따릅니다. 결재 없이 확정하려면 승인 권한이 있어야 합니다.
help.cms-state-reason.helpWhy=설비가 멈춘 이유를 표준 코드로 받지 않으면 비가동을 고장·계획 정지로 나눌 수 없고, 설비 KPI 의 가용률이 틀어집니다.
help.cms-state-reason.helpWhen=설비 상태·KPI 흐름을 시작하기 전 기준정보 준비 단계에서, 수집 장치·POP 의 사유 코드를 맞출 때 엽니다.
help.cms-state-reason.helpDo=[신규] 사유 코드·분류·계획 정지 여부를 만듭니다. 코드와 분류는 바꿀 수 없습니다\n[저장] 이름·계획 정지 여부·순서·사용을 고칩니다. 계획 정지 여부를 바꾸면 지난 KPI 도 다시 계산됩니다\n[엑셀로 내보내기] 목록을 내려받습니다
help.cms-state-reason.helpNote=코드와 분류는 만든 뒤 바꿀 수 없습니다.\n계획 정지 여부를 바꾸면 지난 기간의 설비 KPI 도 다시 계산됩니다.\n코드는 수집 장치가 보내는 사유 코드와 똑같아야 합니다.
help.cms-state-review.helpWhy=수집된 정지 구간은 사유가 비거나 틀린 채 들어오기도 합니다. 사람이 사후에 바로잡고 고장 작업지시와 이어야 KPI 의 고장 횟수·수리 시간이 맞습니다.
help.cms-state-review.helpWhen=설비 상태 흐름의 검토 단계입니다. 하루·교대가 끝난 뒤, 또는 홈 카드에 사유 없는 구간이 보일 때 엽니다.
help.cms-state-review.helpDo=[조회] 공장·기간의 구간을 보고 사유 없음만 거릅니다\n[사유 지정] 끝난 구간에 사후 사유와 메모를 답니다(수집 원장은 고치지 않습니다)\n[연결] 고장(비계획 정지) 구간을 같은 설비의 고장 작업지시에 잇습니다\n[무효] 잘못 단 사유·연결을 사유와 함께 무효로 한 뒤 다시 답니다
help.cms-state-review.helpNote=사유는 끝난 구간에만 달 수 있고, 한 구간에 유효한 사유는 하나입니다. 바꾸려면 먼저 무효로 합니다.\n작업지시에 연결된 구간의 분류를 고장 밖으로 바꾸려면 연결을 먼저 무효로 해야 합니다.\n여기서 바꾼 사유는 설비 KPI 에 바로 반영됩니다.
help.cms-alarm.helpWhy=장치 알람이 언제 나고 얼마나 반복되는지 모으지 않으면 고장 전조를 놓치고, 어떤 알람부터 손볼지 정할 수 없습니다.
help.cms-alarm.helpWhen=설비 상태 흐름에서, 중대 알람 알림을 받았거나 정기 점검 회의에서 상위 알람을 볼 때 엽니다.
help.cms-alarm.helpDo=[조회] 공장·기간으로 발생마다 한 줄을 보고, 열린 것만 거릅니다\n상위 알람에서 발생 수·활성 시간 순위를 봅니다\n자동 고장 신고가 켜진 중대 알람은 이미 보전 작업지시로 넘어가 있습니다\n[엑셀로 내보내기] 이력을 내려받습니다
help.cms-alarm.helpNote=정의가 없는 알람 코드도 기록되지만 이름이 비어 보입니다.\n반복 표시는 회사 정책 기준으로 조회 때 계산되므로 정책을 바꾸면 지난 표시도 바뀝니다.\n중대 알람 알림은 이 화면 조회 권한이 있는 사람에게 갑니다.
help.qms-gauge-calib=금형·지그·게이지에 등록한 계측기의 교정 기록을 쌓고, 다음 교정일로 사용 가능 상태(정상·임박·초과·불합격·기록 없음)를 판정합니다. 교정 기록은 고치거나 지울 수 없고, 잘못 넣으면 사유를 남겨 무효로 합니다.
help.qms-gauge-calib.helpWhy=교정 기록이 없거나 기한이 지난 계측기, 불합격 계측기는 검사 실행에서 측정에 쓸 수 없고, 작업 착수 때 쓸 계측기가 없다는 경고가 뜹니다. 불합격이 나면 그 계측기로 잰 LOT 을 찾아 봉쇄로 넘기는 출발점이 됩니다.
help.qms-gauge-calib.helpWhen=기준정보 준비(계측기) 단계와 일상 운영에서 교정 성적서를 받았을 때, 교정 임박·초과 목록을 볼 때 엽니다. 교정이 불합격이면 부적합 흐름(영향 LOT 에서 봉쇄)으로 이어집니다.
help.qms-gauge-calib.helpDo=[계측기 정보 저장] 계측기 클래스·교정 주기·제한 사용 범위를 저장합니다.\n[교정 기록 추가] 교정일·결과(합격·불합격·제한 사용)·기관·성적서를 남깁니다. 다음 교정일은 교정일 + 주기로 정해지고 상태가 다시 판정됩니다.\n[무효] 잘못 넣은 교정 기록을 사유와 함께 무효로 합니다. 마지막 교정일과 상태가 다시 계산됩니다.\n[영향 LOT] 불합격 기록에서, 직전 유효 교정 이후 이 계측기로 잰 LOT 과 검사를 보여 줍니다.\n[봉쇄 열기] 영향 LOT 을 품목별로 묶어 봉쇄 화면을 채운 채 엽니다.
help.qms-gauge-calib.helpNote=교정 기록은 고칠 수 없습니다. 무효로 한 뒤 다시 넣습니다.\n불합격을 넣어도 LOT 보류는 자동으로 되지 않습니다. 영향 LOT 을 보고 봉쇄를 직접 엽니다.\n전자서명 정책이 켜진 회사는 교정 기록을 넣을 때 서명이 필요합니다.
help.cms-alarm-def.helpWhy=장치는 알람을 코드로만 보내므로 이름·심각도를 붙이지 않으면 사람이 읽을 수 없고, 중대 알람을 고장 신고로 자동으로 넘길 수 없습니다.
help.cms-alarm-def.helpWhen=설비 상태 흐름을 시작하기 전 기준정보 준비 단계에서, 새 설비의 알람 목록을 받았을 때 엽니다.
help.cms-alarm-def.helpDo=[신규] 알람 코드와 설비 클래스(비우면 전체)를 정해 만듭니다. 둘은 바꿀 수 없습니다\n[저장] 이름·심각도·현상 코드·자동 고장 신고·사용을 고칩니다\n자동 고장 신고를 켜면 중대 알람이 날 때 고장 신고가 자동으로 만들어집니다(열린 신고가 있으면 만들지 않음)
help.cms-alarm-def.helpNote=자동 고장 신고는 심각도가 중대일 때만 켤 수 있습니다.\n같은 설비·같은 알람의 신고가 아직 열려 있으면 새 신고를 만들지 않습니다.\n알람 코드와 설비 클래스는 만든 뒤 바꿀 수 없습니다.
help.qms-msa=계측기가 만드는 측정 변동을 GRR 연구로 확인합니다. 측정자·부품·반복별 원자료를 넣으면 EV·AV·GRR·PV·%GRR·ndc 를 계산하고, 회사 판정 구간(기본 10%·30%)으로 판정합니다.
help.qms-msa.helpWhy=계측기 변동이 공차에 비해 크면 검사 판정과 SPC 관리도를 모두 믿을 수 없습니다. 이 연구가 그 계측기와 특성의 측정 시스템이 쓸 만하다는 근거를 남깁니다.
help.qms-msa.helpWhen=기준정보 준비(계측기) 또는 신제품 개발 단계에서 새 계측기나 특별특성 측정을 시작하기 전에 엽니다. 계측기 수리·교정 뒤 다시 확인할 때도 씁니다.
help.qms-msa.helpDo=[신규] 계측기·특성·방법·측정자 수·부품 수·반복 수로 작성 중 연구를 만듭니다.\n[칸에 채우기] 엑셀에서 복사한 원자료를 표에 붙여 넣습니다.\n[저장] 원자료와 기준(공정 변동 또는 공차)을 저장하고 결과를 다시 계산합니다.\n[확정] 작성 중에서 확정으로 바꿉니다. 결과가 고정되고 원자료를 더는 고칠 수 없습니다.\n[연구 취소] 잘못 만든 작성 중 연구를 취소합니다.
help.qms-msa.helpNote=확정 뒤에는 원자료를 고칠 수 없습니다.\nGRR 판정은 계측기 사용 가능 상태에 자동 반영되지 않습니다. 판정이 나쁘면 계측기 사용 여부를 따로 정합니다.
help.cms-kpi.helpWhy=가용률·OEE·MTBF·MTTR 을 화면마다 다르게 세면 숫자가 서로 맞지 않습니다. 수집 상태·실적·점검 기록을 한 정의로 모아 같은 숫자를 봅니다.
help.cms-kpi.helpWhen=설비 상태 흐름의 마지막 단계입니다. 비가동 사유 검토를 마친 뒤 일·주·월 단위로 설비 성과를 볼 때 엽니다.
help.cms-kpi.helpDo=[조회] 공장·기간·기준(확정 실적 또는 수집 카운트)으로 공장 합계 → 라인 → 설비 표를 봅니다\n일별 추이에서 공장 합계 또는 설비 하나의 날짜별 값을 봅니다(최대 31일)\n[엑셀 내려받기] 화면 표와 같은 계산으로 내려받습니다\n사유를 바로잡으려면 비가동 사유 검토에서 고친 뒤 다시 조회합니다
help.cms-kpi.helpNote=수집 장치가 없는 설비는 가용률·MTBF·MTTR 이 빈칸입니다. 작업지시의 정지 시간으로 대신 채우지 않고, 작업지시로 낸 값은 MTBF·MTTR(작업지시) 열에 이름을 나눠 따로 보입니다.\n표준 사이클이 없는 공정의 실적이 하나라도 있으면 성능·OEE 가 빈칸입니다.\n오늘이 들어 있으면 지금까지만 셉니다.
help.qms-doc=작업표준서·검사기준서·관리계획서·PFMEA·도면 같은 관리문서를 리비전으로 관리하고 배포합니다. 작성 중만 고칠 수 있고, 배포본은 문서마다 하나이며 새 판을 배포하면 이전 배포본은 폐기됩니다.
help.qms-doc.helpWhy=현장과 검사가 따를 판을 하나로 정해 두지 않으면 폐기된 판으로 작업·검사하게 됩니다. 검사계획이 가리키는 검사기준서와 APQP·설계 변경·프로젝트 산출물 문서도 여기 리비전으로 남습니다.
help.qms-doc.helpWhen=기준정보 준비와 신제품 개발 흐름에서 문서를 처음 올릴 때, 설계·4M 변경으로 문서를 개정할 때 엽니다.
help.qms-doc.helpDo=[신규] 문서 번호·유형·제목을 넣고 [대상 추가]로 적용 품목·공정을 더해 [저장]합니다.\n[새 리비전] 배포본(없으면 최신본)을 첨부까지 복사해 작성 중 리비전을 만듭니다.\n[리비전 저장] 작성 중 리비전의 내용과 첨부를 저장합니다.\n[결재 올리기] 작성 중에서 결재 중으로 바꿉니다. 승인되면 배포되고, 반려·회수되면 작성 중으로 돌아갑니다.\n[바로 배포] 결재를 쓰지 않는 회사에서 승인 권한으로 바로 배포합니다.\n[폐기] 작성 중 또는 배포 리비전을 폐기합니다.
help.qms-doc.helpNote=결재 정책이 켜진 회사는 바로 배포가 거부됩니다. 결재로만 배포합니다.\n폐기는 되돌릴 수 없습니다. 폐기본은 내려받을 때 폐기본으로 표시됩니다.\n작성 중이나 결재 중 리비전이 있으면 새 리비전을 만들 수 없습니다.
help.qms-consistency=품질 기준끼리 어긋난 곳을 세 가지로 찾아 보여 주는 읽기 전용 점검입니다. 특별특성이 확정 검사계획에 없는 경우, 확정 검사계획에 검사기준서 배포본이 없는 경우, 검사계획이 폐기된 문서 리비전을 가리키는 경우입니다.
help.qms-consistency.helpWhy=특성·검사계획·관리문서를 따로 고치다 보면 특별특성 검사가 빠지거나 폐기된 기준서를 가리키는 일이 조용히 생깁니다. 심사나 고객 감사 전에 이런 빈틈을 한 번에 찾습니다.
help.qms-consistency.helpWhen=기준정보 준비(검사 기준)의 마지막 확인으로, 검사계획·관리문서를 바꾼 뒤나 심사 전에 엽니다.
help.qms-consistency.helpDo=[점검] 오늘 기준으로 세 가지 점검을 돌려 대상과 이유를 보여 줍니다.\n[엑셀로 내보내기] 점검 결과를 엑셀로 내려받습니다.\n행 끝의 특성·검사계획 링크로 고칠 화면을 엽니다.
help.qms-consistency.helpNote=점검만 하고 아무것도 고치지 않습니다.\n결과는 최대 2,000건까지 보입니다. 넘으면 잘렸다고 표시됩니다.
help.qms-capa=고객 클레임·내부 불량·협력사·심사 지적의 시정조치를 8D(D1~D8) 구역으로 기록하고 기한을 관리합니다. 접수, 봉쇄 완료, 원인 분석, 대책 완료, 효과 확인, 종결 순서로 진행하며, 단계마다 필요한 D 구역이 채워져야 넘어갑니다.
help.qms-capa.helpWhy=부적합을 처분만 하고 원인과 재발 방지를 남기지 않으면 같은 불량이 반복됩니다. 이 기록이 원인·대책·효과 확인·수평전개의 근거가 되고, 회사 정책이나 고객 CSR 기한으로 지연 여부를 보여 줍니다.
help.qms-capa.helpWhen=부적합 흐름(검사·SPC·현장에서 부적합, 봉쇄·LOT 보류, 시정조치)의 마지막 단계입니다. 부적합 상세의 8D 만들기, 고객 클레임 접수, 프로젝트 이슈의 시정조치 올리기에서 엽니다.
help.qms-capa.helpDo=[신규] 출처·고객·품목·담당·연결 부적합 번호와 D 구역을 넣고 [저장]합니다. 기한은 만들 때 정해집니다.\n[다음 단계] 필요한 D 구역이 채워졌으면 다음 단계로 넘깁니다.\n[수평전개 추가] 같은 원인이 있을 수 있는 품목·공정·고객 행을 더합니다.\n[종결 결재 올리기] 효과 확인에서 종결 결재 중으로 바꿉니다. 승인되면 종결, 반려·회수되면 대책 완료로 돌아갑니다.\n[바로 종결] 결재를 쓰지 않는 회사에서 승인 권한으로 효과 확인에서 바로 종결합니다.\n[취소] 사유를 남기고 시정조치를 취소합니다.
help.qms-capa.helpNote=종결·취소 뒤에는 고칠 수 없습니다. 종결 결재 중에도 내용이 고정됩니다.\n진행 중 수평전개가 남아 있으면 효과 확인으로 넘어갈 수 없습니다.\n봉쇄·종결 기한은 만들 때 고정되고, 발생일이나 CSR 을 나중에 바꿔도 다시 계산되지 않습니다.
help.qms-csr=고객사별 요구사항(CSR) 문서와 리비전, 적용 품목·품목 클래스, 회사 정책 대신 쓸 값(봉쇄·종결 일수 등)을 관리합니다.
help.qms-csr.helpWhy=고객마다 8D 초기 대응·종결 기한이 다른데 회사 기본값만 쓰면 기한 지연을 놓칩니다. 고객 클레임 시정조치를 만들 때 여기서 맞는 CSR 을 찾아 기한을 정합니다.
help.qms-csr.helpWhen=기준정보 준비 단계에서 고객 CSR 을 받거나 개정될 때 엽니다. 부적합 흐름의 시정조치(고객 클레임)가 이 값을 씁니다.
help.qms-csr.helpDo=[신규] 고객·CSR 번호·리비전·시작일·덮어쓸 값을 넣고 [저장]합니다. 비운 값은 회사 정책을 씁니다.\n[대상 추가] 적용 품목 또는 품목 클래스를 더합니다. 비우면 그 고객 전체에 적용됩니다.\n품목·품목 클래스가 맞는 CSR 이 대상 없는 CSR 보다 먼저 쓰입니다.
help.qms-csr.helpNote=시작일 이후 만든 고객 클레임 시정조치에만 적용됩니다. 이미 만든 시정조치 기한은 바뀌지 않습니다.\n고객은 만든 뒤 바꿀 수 없습니다.
help.qms-change=설계 변경 지시(ECO)에 딸린 4M 변경 세부(사람·설비·자재·방법·측정·환경·협력사·장소)를 적습니다. 변경 전·후·사유·영향 평가와 영향받는 특성·검사계획을 남기며, ECO 가 작성 중일 때만 고칠 수 있습니다.
help.qms-change.helpWhy=공정 4M·임시 변경 ECO 는 회사 정책(기본 켜짐)에 따라 4M 세부가 없으면 결재에 올릴 수 없습니다. 무엇이 바뀌어 어떤 특성·검사를 다시 봐야 하는지와 초품 확인의 근거가 됩니다.
help.qms-change.helpWhen=설계 변경 흐름(변경 요청, 변경 지시, 4M 변경·초품)에서 ECO 를 상신하기 전에 엽니다. 설계 변경 지시 상세의 품질 칸 링크나 ECO 번호로 엽니다.
help.qms-change.helpDo=[열기] ECO 번호로 그 ECO 의 4M 세부를 엽니다. 없으면 새로 적습니다.\n[저장] 4M 유형·변경 전후·사유·영향 평가·임시 변경 복귀 조건을 저장합니다.\n[영향 행 추가] 영향받는 특성 또는 검사계획을 행으로 더합니다.\n[4M 세부 지우기] ECO 작성 중일 때 4M 세부를 지웁니다.\n[이 변경의 초품 확인 열기] ECO 가 적용된 뒤 첫 LOT 초품 판정으로 갑니다.
help.qms-change.helpNote=ECO 를 상신하면 4M 세부가 고정됩니다. 반려·회수로 작성 중이 되면 다시 고칠 수 있습니다.\n영향 특성을 적어도 검사계획은 자동으로 바뀌지 않습니다. 검사계획 새 리비전을 따로 만듭니다.
help.qms-insp=LOT 하나에 대한 수입·공정·출하·초품·종품·순회 검사를 실행합니다. 그날 유효한 확정 검사계획과 샘플링 계획으로 항목과 시료 수가 정해지고, 측정값은 지우지 않고 무효 행으로만 정정합니다.
help.qms-insp.helpWhy=수입·출하 재고를 검사 대기에서 가용 또는 부적합으로 바꾸는 판정이 여기서만 나옵니다. 판정 확정된 검사가 SPC 관리도·초품 판정·부적합 등록의 근거가 됩니다.
help.qms-insp.helpWhen=구매입고 흐름의 수입검사(자재 입고 뒤), 생산 흐름의 공정검사와 출하검사(생산 입고 뒤, 출하 전), 설계 변경 뒤 초품검사 때 엽니다. 홈 카드 판정 대기 검사에서도 열립니다.
help.qms-insp.helpDo=[검사 시작] LOT 번호·검사 유형·공정·로트 수량으로 검사를 엽니다. 적용 검사계획이 없으면 시작할 수 없습니다.\n[등록] 항목마다 샘플 값을 넣습니다. 여러 값을 붙여 넣으면 다음 빈 샘플 번호부터 채웁니다.\n[판정 확정] 모든 항목이 합격·불합격으로 정해지면 검사를 확정합니다. 품질 상태 연동 공장의 수입·출하 검사는 검사 대기 재고를 합격이면 가용, 불합격이면 부적합으로 바꿉니다.\n[검사 무효] 사유를 남기고 검사를 무효로 합니다. 재고 상태 변경과 SPC 위반도 함께 되돌립니다.\n[부적합 등록] 불합격으로 확정된 검사에서 LOT·검사 번호를 채운 부적합 등록으로 갑니다.
help.qms-insp.helpNote=판정 확정 뒤에는 측정값을 더하거나 고칠 수 없습니다. 잘못되었으면 검사 무효 뒤 새로 시작합니다.\n교정 기한이 지났거나 불합격인 계측기는 고를 수 없습니다.\n불합격으로 확정해도 부적합은 자동으로 만들어지지 않습니다. 부적합 등록을 눌러 직접 엽니다.
help.qms-setup=설계·4M 변경(ECO) 뒤 처음 만든 LOT(첫 LOT 표시)마다 초품 판정을 남깁니다. 판정 결과는 그 LOT 의 판정 확정된 검사 결과를 그대로 가져오며, 정정은 무효로 한 뒤 다시 기록합니다.
help.qms-setup.helpWhy=변경 뒤 첫 LOT 이 맞게 만들어졌는지 확인하지 않으면 같은 품목의 다른 작업지시를 착수할 때 초품 미판정 경고(정책에 따라 차단)가 뜹니다. 설계 변경 지시 화면의 초품 합격·불합격·미판정 수도 이 기록에서 나옵니다.
help.qms-setup.helpWhen=설계 변경 흐름(변경 지시, 4M 변경, 초품)의 마지막 단계입니다. ECO 가 적용되고 첫 LOT 을 초품검사로 판정한 뒤, 4M 변경·설계 변경 지시의 링크나 ECO 번호로 엽니다.
help.qms-setup.helpDo=[열기] ECO 번호로 그 변경의 첫 LOT 목록을 엽니다.\n[판정 기록] 첫 LOT 마다 근거 검사(그 LOT 의 판정 확정 검사)를 골라 판정을 남깁니다.\n[판정 무효] 잘못 남긴 판정을 사유와 함께 무효로 합니다. 그 LOT 은 다시 미판정이 됩니다.\n[부적합 등록] 판정이 불합격이면 그 LOT·검사로 부적합 등록을 엽니다.
help.qms-setup.helpNote=판정은 따로 입력하지 않습니다. 먼저 검사 실행에서 그 LOT 을 판정 확정해야 합니다.\n불합격 판정에 종결되지 않은 부적합이 있으면 착수 게이트가 계속 경고합니다.
help.qms-spc=판정 확정된 검사 측정값으로 품목·특성·검사 유형·공정마다 X̄-R 관리도와 공정능력(Cp·Cpk·Pp·Ppk)을 그립니다. 한계를 고정하면 그 뒤 판정되는 검사마다 규칙 위반을 위반 목록에 남깁니다.
help.qms-spc.helpWhy=개별 검사가 규격 안이어도 공정이 한쪽으로 흐르는 징후는 관리도로만 보입니다. 위반 기록이 부적합·봉쇄로 이어지는 출발점이고, 미처리 위반은 작업 착수 때 경고됩니다.
help.qms-spc.helpWhen=생산 흐름에서 공정·출하 검사가 쌓인 뒤 정기적으로 엽니다. 부적합 흐름의 시작점으로, SPC 위반 알림이나 홈 카드 미처리 SPC 위반에서도 열립니다.
help.qms-spc.helpDo=[조회] 관리도 단위를 고르고 [다시 그리기]로 최근 부분군으로 관리도·공정능력·규칙 경보를 그립니다.\n[이 구간으로 한계 고정] 보이는 부분군(20개 이상)에서 계산한 중심과 σ 를 고정 한계로 저장합니다. 이후 판정마다 위반을 기록합니다.\n[한계 무효] 고정 한계를 사유와 함께 무효로 합니다.\n[처리 기록] 위반에 확인·조치·종결·무효를 남깁니다.\n[부적합 등록] 또는 [봉쇄 열기] 위반의 LOT·검사·품목을 채운 채 부적합이나 봉쇄로 갑니다.
help.qms-spc.helpNote=위반은 고정 한계가 있는 단위에서만 기록됩니다. 한계를 고정하기 전 경보는 화면 표시뿐입니다.\nLOT 자동 보류는 정책 QMS_SPC_AUTO_HOLD 를 켰을 때만입니다(기본 꺼짐). 꺼져 있으면 부적합 등록이나 봉쇄 열기로 직접 막습니다.\n자동 보류는 위반을 종결하거나 무효로 할 때 풀립니다.\n종결·무효는 메모가 필요하고, 그 뒤에는 처리 기록을 더할 수 없습니다.
help.qms-ncr=부적합 한 건(LOT·불량 유형·수량·출처)을 등록하고, MRB 처분(특채·재작업·폐기·반품·선별)을 정해 종결합니다. 정책이 켜져 있으면 등록과 함께 그 LOT 을 보류하고, 종결·취소 때 이 부적합 근거의 보류만 풉니다.
help.qms-ncr.helpWhy=불합격 LOT 이 처분 없이 쓰이거나 출하되는 것을 막고, 부적합 수량이 처분별로 어디로 갔는지 남깁니다. 협력사 반품·클레임·협력사 평가와 시정조치가 이 기록을 근거로 씁니다.
help.qms-ncr.helpWhen=부적합 흐름(검사·SPC·현장에서 부적합, 봉쇄·LOT 보류, 시정조치)의 두 번째 단계입니다. 검사 불합격·초품 불합격·SPC 위반의 부적합 등록 링크나 고객 클레임 접수 때 엽니다.
help.qms-ncr.helpDo=[등록] LOT 번호·출처·근거 검사·불량 유형·수량·내용으로 부적합을 엽니다. 정책에 따라 LOT 이 자동 보류됩니다.\n[처분 행 추가] 처리 중일 때 처분 행(유형·수량·재작업 결과 LOT)을 더하고 [저장]합니다.\n[종결] 처분 수량 합이 부적합 수량과 같고 특채가 없으면 종결합니다. 보류가 풀리고, 품질 상태 연동 공장에서는 폐기 수량이 재고에서 빠집니다.\n[특채 결재 올리기] 특채가 있으면 특채 결재 중으로 올립니다. 승인되면 종결·보류 해제·특채 수량 가용, 반려·회수되면 처리 중으로 돌아갑니다.\n[취소] 사유를 남기고 취소하며 이 부적합 근거의 보류를 풉니다.\n[봉쇄] 같은 품목의 의심 LOT 봉쇄를, [이 부적합으로 8D 만들기]는 시정조치를 채운 채 엽니다.
help.qms-ncr.helpNote=종결·취소는 되돌릴 수 없습니다. 고칠 수 있는 것은 처리 중일 때뿐입니다.\n수동 보류나 봉쇄 같은 다른 근거가 남은 LOT 은 종결해도 계속 보류됩니다.\n재작업 처분은 기록만 합니다. 실제 재작업과 반품 지시는 생산·구매에서 따로 합니다.
help.qms-contain=부적합이 난 품목과 같은 기간에 만든(입고한) 다른 LOT 을 후보로 찾아, 사람이 고른 LOT 을 한꺼번에 보류합니다. LOT 마다 따로 풀 수 있고, 모두 풀리면 봉쇄가 자동으로 해제 완료됩니다.
help.qms-contain.helpWhy=부적합 LOT 하나만 막으면 같은 원인으로 만든 이웃 LOT 이 그대로 출하·투입됩니다. 시스템은 후보만 제안하고, 보류할 LOT 은 사람이 판단해 고릅니다.
help.qms-contain.helpWhen=부적합 흐름의 봉쇄·LOT 보류 단계입니다. 부적합 상세의 봉쇄, 계측기 교정 불합격의 봉쇄 열기, SPC 위반의 봉쇄 열기에서 품목·기간이 채워진 채 열립니다.
help.qms-contain.helpDo=[후보 조회] 품목·기간으로 LOT 후보와 각 LOT 의 지금 보류 근거를 보여 줍니다.\n[고른 LOT 봉쇄] 고른 LOT 을 이 봉쇄 근거로 보류합니다. 근거 부적합 번호와 사유가 함께 남습니다.\n[고른 LOT 해제] 사유를 받아 고른 LOT 의 봉쇄 근거만 풉니다.
help.qms-contain.helpNote=후보를 조회해도 아무것도 보류되지 않습니다. 고른 뒤 봉쇄를 눌러야 합니다.\n해제해도 부적합·수동 보류 같은 다른 근거가 남은 LOT 은 계속 보류됩니다.\n부적합을 종결해도 봉쇄는 자동으로 풀리지 않습니다.
help.wms-count.helpWhy=장부와 실물이 다를 때 차이만큼만 조정 원장을 남겨 맞추는 곳입니다. 시스템을 처음 쓸 때 기초 재고를 넣는 곳이기도 합니다.
help.wms-count.helpWhen=재고 운영 흐름의 실사 단계입니다. 순환 실사·월말 전수 실사 때, 또는 시스템을 처음 쓰면서 빈 창고에 재고를 넣을 때 엽니다.
help.wms-count.helpDo=[신규] 에서 범위·유형·블라인드를 넣고 [저장] 하면 작성 중 실사가 생깁니다.\n[시작] 범위 안 재고 칸마다 줄을 만들고 세는 중이 됩니다. 장부에 없던 칸은 [줄 추가] 로 넣습니다.\n[센 수량 저장] 센 수량을 저장합니다. 엑셀에서 붙여 넣을 수도 있습니다.\n[검토로] 차이를 보고, 의심 줄은 [고른 줄 재실사] 로 다시 셉니다.\n[확정] 차이만큼 실사 조정 원장이 들어가고 확정이 됩니다. [취소] 는 사유를 남기고 끝냅니다.
help.wms-count.helpNote=차이가 허용 한도를 넘는 줄이 있으면 승인 권한이 있어야 확정됩니다.\n확정은 되돌릴 수 없습니다. 고치려면 수불 원장에서 역분개하거나 다시 실사합니다.\n마감한 달에 센 실사는 확정되지 않습니다.
help.wms-period.helpWhy=지난 달 재고 숫자를 굳혀 두는 곳입니다. 마감하지 않으면 뒤늦게 넣은 조정·이동·실사가 이미 보고한 달의 재고를 바꿀 수 있습니다.
help.wms-period.helpWhen=재고 운영 흐름의 기간 마감 단계입니다. 월초에 지난 달 실사·대사를 끝낸 뒤 엽니다.
help.wms-period.helpDo=[조회] 공장·연도별 월 마감 상태를 봅니다.\n[마감] 고른 지난 달을 마감합니다. 미확정 실사·대사 불일치가 있으면 경고만 합니다.\n[재개] 사유를 넣고 마감한 달을 다시 엽니다.
help.wms-period.helpNote=이번 달과 미래 달은 마감할 수 없습니다.\n마감·재개는 승인 권한이 있어야 보입니다.\n경고가 있어도 마감은 됩니다. 확인하고 누릅니다.
help.pms-home=여러 프로젝트의 단계·SOP 까지 남은 날·기준선 대비 지연·산출물 준비율·열린 이슈를 한눈에 보고, 내 할 일과 프로젝트 보고서를 확인합니다. 이 화면에서는 아무것도 바꾸지 않습니다.
help.pms-home.helpWhy=프로젝트를 하나씩 열지 않고도 어느 프로젝트가 늦고 어느 게이트가 준비되지 않았는지 알기 위해 있습니다. 회의·보고용 인쇄 보고서도 여기서 냅니다.
help.pms-home.helpWhen=신제품 개발 흐름 전체에서 언제든 씁니다. 주간 회의 전이나 출근해서 내 할 일을 볼 때 엽니다.
help.pms-home.helpDo=[조회] 조건에 맞는 프로젝트의 포트폴리오와 내 할 일(지연 작업·미제출 산출물·내 이슈·확정 안 한 공수)을 봅니다.\n[행 선택] 그 프로젝트의 보고서가 아래에 열립니다.\n[인쇄] 열린 보고서를 인쇄합니다.\n[엑셀 내려받기] 포트폴리오를 같은 조건·순서로 내려받습니다.
help.pms-home.helpNote=이 화면에서는 아무것도 고칠 수 없습니다.
help.pms-gate=프로젝트 단계 끝의 게이트마다 점검표와 결정(통과·조건부 통과·불합격)을 남깁니다. 통과하면 게이트 작업이 완료되고, 조건부 통과의 조건은 이슈가 됩니다. 회사 정책에 따라 결재를 받거나 바로 결정합니다.
help.pms-gate.helpWhy=다음 단계로 넘어가도 되는지 근거 없이 정하지 않도록 점검 결과와 결정을 기록으로 남깁니다. 필수 산출물이 다 준비되지 않으면 통과시킬 수 없습니다.
help.pms-gate.helpWhen=신제품 개발 흐름의 6단계입니다. 한 단계의 산출물이 모두 승인·면제된 뒤 게이트 회의를 할 때 엽니다.
help.pms-gate.helpDo=[새 심사] 고른 게이트에 작성 중 심사를 만들고 템플릿의 점검 문구로 점검표를 채웁니다. 게이트마다 열린 심사는 하나입니다.\n[점검 항목 추가]·[조건 추가]·[저장] 점검 결과·결정·조건(담당·기한)을 적습니다.\n[상신] 결재를 쓰면 결재 중이 되고, 아니면 바로 결정됩니다. 통과는 필수 산출물 준비가 끝나야 합니다.\n[승인]·[반려]·[회수] 결재 차례인 사람이 승인·반려하고, 올린 사람은 회수해 다시 작성 중으로 돌립니다.\n[심사 취소] 작성 중·결재 중 심사를 취소합니다.
help.pms-gate.helpNote=통과·조건부 통과는 그 단계의 필수 산출물이 모두 승인·면제돼야 상신됩니다.
help.pms-deliverable=프로젝트 작업마다 필요한 산출물을 제출하고 승인·반려·면제합니다. 파일 대신 QMS 관리문서·PFMEA·관리계획서·PPAP 에 연결하면 그쪽 상태로 승인됩니다. 단계별 준비율이 게이트 통과 조건입니다.
help.pms-deliverable.helpWhy=게이트에서 무엇이 준비됐고 무엇이 빠졌는지 알 수 있게 필수 산출물의 제출·승인 상태를 한 곳에서 관리합니다. 없으면 게이트 준비율을 계산할 수 없습니다.
help.pms-deliverable.helpWhen=신제품 개발 흐름의 4단계입니다. 작업 결과물을 낼 때, 그리고 게이트 심사 전에 빠진 산출물을 확인할 때 엽니다.
help.pms-deliverable.helpDo=[산출물 칸 추가] 작업에 산출물 칸을 더합니다. 템플릿에서 복사된 칸도 고칠 수 있습니다.\n[제출] 파일 1개를 올려 제출 상태로 만듭니다. 제출할 때마다 새 파일로 남습니다.\n[승인]·[반려]·[면제]·[면제 풀기] 제출된 산출물을 판정합니다. 반려된 것은 다시 제출합니다.\n[연결]·[프로젝트 ECO 의 PPAP 연결] QMS 문서·PFMEA·관리계획서·PPAP 를 가리키게 합니다. 배포·확정·고객 승인되면 승인됩니다.\n[QMS·PPAP·APQP 상태 반영] 그사이 배포·확정·승인된 연결 칸을 승인으로 바꿉니다.
help.pms-deliverable.helpNote=제출한 파일은 지울 수 없습니다.
help.pms-issue=프로젝트의 할 일·위험·문제를 담당과 기한으로 추적합니다. 품목·거래처·설비·LOT 에 연결할 수 있고, 품질 문제는 QMS 시정조치(8D)로 올립니다. 게이트 조건부 통과의 조건과 PFMEA 조치도 이슈로 들어옵니다.
help.pms-issue.helpWhy=회의에서 나온 할 일과 위험이 흩어지지 않게 담당·기한·상태로 남기기 위해 있습니다. 무거운 품질 문제는 여기서 끝내지 않고 시정조치로 넘깁니다.
help.pms-issue.helpWhen=신제품 개발 흐름의 5단계로, 진행 중 언제든 씁니다. 문제를 발견했을 때, 게이트 조건이나 PFMEA 조치를 처리할 때 엽니다.
help.pms-issue.helpDo=[신규 이슈] 열린 프로젝트에 열림 상태 이슈를 등록합니다.\n[진행 중으로]·[열림으로] 작업을 시작하거나 다시 대기로 돌립니다.\n[해결] 해결 내용을 적어 해결 상태로 바꿉니다. 해결된 이슈는 다시 진행 중으로 열 수 있습니다.\n[종료] PM 이 해결된 이슈를 닫습니다. 닫힌 이슈는 고칠 수 없습니다.\n[시정조치로 올리기] 품질 문제를 QMS 시정조치로 한 번 올리고 번호를 남깁니다.\n[기각] PM 이 해결하지 않을 열린 이슈를 사유와 함께 닫습니다.\n[파일 추가] 사진·문서를 붙입니다(닫힌 이슈는 잠김).
help.pms-issue.helpNote=닫힌 이슈는 고칠 수 없습니다.
help.pms-worklog=내가 날마다 어느 프로젝트 작업에 몇 시간을 썼는지 적고 확정합니다. 늘 본인 공수만 보이고, PM 은 프로젝트별 요약만 봅니다.
help.pms-worklog.helpWhy=프로젝트에 실제로 든 사람 시간을 작업·분류별로 남겨 계획과 비교하기 위해 있습니다. 확정한 날만 집계의 근거가 됩니다.
help.pms-worklog.helpWhen=신제품 개발 흐름의 3단계(작업 진행)에서 매일 씁니다. 하루 일을 마칠 때 또는 주 단위로 몰아 적을 때 엽니다.
help.pms-worklog.helpDo=[이전 주]·[다음 주]·[이번 주] 볼 주를 바꿉니다.\n[미리 채우기] 내가 담당인 진행 중 작업으로 행을 채우고 최근 2주 값을 가져옵니다.\n[행 추가]·[저장] 작업·시간·분류를 적어 작성 중으로 저장합니다. 미래 날짜는 넣을 수 없습니다.\n[확정] 그 날을 확정합니다. 0시간 행은 지워지고 나머지는 분류가 있어야 합니다.\n[다시 열기] 사유를 적어 확정한 날을 다시 작성 중으로 돌립니다.
help.pms-worklog.helpNote=저장만 하면 작성 중입니다. 확정해야 집계됩니다.
help.apqp-fmea=품목의 공정별 PFMEA 를 작성합니다. 공정 단계·작업요소 구조에 기능과 고장(영향·형태·원인)을 달고, 위험행의 심각도·발생도·검출도로 AP 를 계산해 조치를 관리합니다. 확정본은 관리계획서의 근거가 됩니다.
help.apqp-fmea.helpWhy=공정에서 무엇이 잘못될 수 있고 얼마나 위험한지 미리 분석해 조치와 관리 방법을 정하기 위해 있습니다. 확정 PFMEA 가 없으면 관리계획서를 PFMEA 에서 끌어올 수 없습니다.
help.apqp-fmea.helpWhen=신제품 개발 흐름의 8단계입니다. 라우팅이 확정되고 AP 규칙표가 준비된 뒤, 또는 공정 변경으로 다시 검토할 때 엽니다.
help.apqp-fmea.helpDo=[신규 PFMEA] 품목·확정 라우팅·AP 규칙표를 골라 작성 중 리비전을 만듭니다. 라우팅 단계로 공정 단계를 시작할 수 있습니다.\n[+ 공정 단계]·[+ 작업요소] 구조를 만들고 기능·고장·위험행을 저장합니다. 고치는 것은 작성 중에만 됩니다.\n[확정] 위험행이 다 채워지면 확정하고 이전 확정본은 폐기됩니다. 결재를 쓰는 회사는 [상신] 합니다.\n[새 리비전] 확정본을 복사해 다음 작성 중 리비전을 만듭니다.\n[새 조치]·[이슈로] 조치를 등록하고 PMS 이슈로 한 번 복사합니다.\n[엑셀 양식]·[QMS 문서로 올리기] 제출용 엑셀을 받거나 QMS 관리문서로 올립니다.
help.apqp-fmea.helpNote=확정본은 고칠 수 없습니다. 바꾸려면 새 리비전을 만듭니다.
help.apqp-dfmea=품목의 설계 FMEA 를 작성합니다. 시스템 › 하위 시스템 › 구성품 구조(확정 BOM 1~2단계에서 끌어올 수 있음)에 기능과 고장(영향·형태·원인)을 달고, 위험행의 심각도·발생도·검출도로 AP 를 계산해 조치를 관리합니다.
help.apqp-dfmea.helpWhy=설계에서 무엇이 잘못될 수 있고 얼마나 위험한지 미리 분석해 설계 조치와 검증 방법을 정하기 위해 있습니다. 특성은 PFMEA 와 같은 제품 특성 마스터를 씁니다.
help.apqp-dfmea.helpWhen=신제품 개발 흐름에서 BOM 이 확정된 뒤, PFMEA 보다 먼저 엽니다. 설계(BOM·도면)를 바꿀 때 다시 검토합니다.
help.apqp-dfmea.helpDo=[신규 DFMEA] 품목·확정 BOM·도면 문서 리비전·AP 규칙표를 골라 작성 중 리비전을 만듭니다. BOM 1~2단계로 하위 시스템·구성품을 시작할 수 있습니다.\n[+ 하위 시스템]·[+ 구성품] 구조를 만들고 기능·고장·위험행을 저장합니다. 고치는 것은 작성 중에만 됩니다.\n[확정] 위험행이 다 채워지면 확정하고 이전 확정본은 폐기됩니다. 결재를 쓰는 회사는 [상신] 합니다.\n[새 리비전] 확정본을 복사해 다음 작성 중 리비전을 만듭니다.\n[엑셀 양식] 제출용 엑셀을 받습니다.
help.apqp-dfmea.helpNote=확정본은 고칠 수 없습니다. 관리계획서는 PFMEA 에서만 끌어옵니다.
help.apqp-ap=PFMEA 의 심각도·발생도·검출도 조합마다 조치 우선순위(AP)를 정하는 회사 규칙표를 관리합니다. 핸드북 표는 넣어 두지 않으니 회사가 직접 입력합니다.
help.apqp-ap.helpWhy=PFMEA 위험행의 AP 를 사람마다 다르게 매기지 않고 같은 규칙으로 계산하기 위해 있습니다. 사용 중인 규칙표가 없으면 PFMEA 를 확정할 수 없습니다.
help.apqp-ap.helpWhen=신제품 개발 흐름의 7단계로, PFMEA 를 처음 쓰기 전에 한 번 준비합니다. 고객 요구나 회사 기준이 바뀌면 복사해 새 표를 만듭니다.
help.apqp-ap.helpDo=[새 규칙표] 빈 규칙표를 만듭니다.\n[규칙 추가] 심각도·발생도·검출도 범위와 AP 를 한 줄씩 더합니다.\n[저장] 사용으로 저장하려면 1,000 조합을 빠짐·겹침 없이 덮어야 합니다. 규칙이 바뀌면 이 표를 쓰는 작성 중 PFMEA 의 AP 를 다시 계산합니다.\n[복사] 확정 PFMEA 가 쓴 표는 규칙을 바꿀 수 없으니 복사해 새 표로 고칩니다.
help.apqp-ap.helpNote=확정 PFMEA 가 쓴 규칙표는 규칙을 바꿀 수 없습니다.
help.apqp-cp=품목의 공정 단계·특성마다 관리 방법·규격·샘플·주기·반응계획을 정한 관리계획서를 작성합니다. 근거 PFMEA 에서 행을 끌어오고, 확정 때 QMS 검사계획과 맞춰 봅니다. 단계(시작품·양산 전·양산)마다 번호가 따로입니다.
help.apqp-cp.helpWhy=PFMEA 에서 정한 위험을 현장에서 어떻게 관리할지 한 장으로 정해 검사계획·작업표준의 기준으로 삼기 위해 있습니다. 고객 PPAP 제출물이기도 합니다.
help.apqp-cp.helpWhen=신제품 개발 흐름의 9단계입니다. PFMEA 를 확정한 뒤, 그리고 시작품 → 양산 전 → 양산으로 단계가 넘어갈 때 엽니다.
help.apqp-cp.helpDo=[신규 관리계획서] 품목·단계·근거 PFMEA 를 골라 작성 중 리비전을 만듭니다.\n[PFMEA 에서 끌어오기] 근거 위험행마다 행을 더합니다. 이미 있는 행은 덮지 않습니다.\n[새 행]·[저장] 관리 항목을 직접 더하거나 고칩니다.\n[확정] 반응계획·주기·특별특성을 확인하고 검사계획과 대조한 뒤 확정합니다. 결재를 쓰는 회사는 [상신] 합니다.\n[새 리비전]·[다음 단계로] 확정본을 복사해 다음 리비전 또는 다음 단계 번호를 만듭니다.\n[엑셀 양식]·[QMS 문서로 올리기] 제출용 엑셀을 받거나 QMS 관리문서로 올립니다.
help.apqp-cp.helpNote=관리계획서는 QMS 검사계획을 만들거나 고치지 않습니다. 검사계획은 QMS 화면에서 따로 만듭니다.
help.srm-ack.helpWhy=협력사가 언제 얼마를 보내겠다고 약속했는지 남지 않으면 늦어질 발주를 미리 알 수 없고, 생산 계획도 입고 예정을 요구 납기로만 봅니다.
help.srm-ack.helpWhen=구매 흐름의 3단계입니다. 발주를 발행한 뒤 협력사가 메일·전화·엑셀로 회신하면 대신 입력합니다. 협력사가 포털에서 직접 회신하면 이력에 협력사 포털로 보입니다.
help.srm-ack.helpDo=[회신 저장] 행마다 약속 납기·수량(여러 날로 나눔)을 새 회신으로 남깁니다. 발주는 발행에서 회신됨으로 바뀝니다.\n[거절로 기록] 사유와 함께 거절 회신을 남깁니다. 발주는 회신됨에서 발행으로 돌아갑니다.\n[엑셀 올리기] 협력사가 보낸 회신 엑셀을 올려 발주마다 회신을 만듭니다.
help.srm-ack.helpNote=저장한 회신은 고칠 수 없습니다. 다시 저장하면 새 회신이 생기고 최신 것이 유효합니다.
help.srm-po-status.helpWhy=발주가 많으면 회신이 안 온 것, 약속이 늦은 것, 납기가 다가온 것을 하나씩 열어 볼 수 없습니다. 독촉할 발주 행을 한 표로 모읍니다.
help.srm-po-status.helpWhen=구매 흐름의 회신 뒤, 입고 전 단계입니다. 매일 아침이나 협력사에 독촉하기 전에 엽니다.
help.srm-po-status.helpDo=[조회] 발주일 기간의 열린 발주 행(발행·회신됨·부분 입고)을 봅니다.\n[회신 안 옴] 회신 기한이 지났는데 회신이 없거나 거절된 행만 봅니다.\n[늦어질 발주] 약속한 마지막 날이 요구 납기보다 늦은 행만 봅니다.\n[납기 임박] 요구 납기가 오늘부터 임박 일수 안인 행만 봅니다.
help.srm-po-status.helpNote=조회만 하는 화면입니다. 독촉 기록은 남지 않습니다.
help.srm-asn=협력사가 보내기 전에 알린 납품(어느 발주 행을·얼마나·어떤 공급사 LOT 으로·언제 도착)을 기록합니다. 확정하면 내용이 고정되고, 자재 입고 화면에서 이 ASN 을 고르거나 납품서의 ASN:번호 를 스캔해 칸을 채워 받습니다. 받은 양은 입고할 때 자동으로 쌓입니다.
help.srm-asn.helpWhy=ASN 이 없으면 입고 담당이 발주 행·수량·공급사 LOT 을 손으로 찾아 넣어야 하고, 구매는 무엇이 오는 중인지 모릅니다. 생산 계획도 도착 예정일을 입고 예정으로 씁니다.
help.srm-asn.helpWhen=구매 흐름의 4단계(회신 뒤, 입고 전)입니다. 협력사가 출하를 알려 왔는데 포털을 쓰지 않을 때 대신 입력하거나 협력사 엑셀을 올립니다. 늦은 ASN 만 골라 도착 지연을 볼 때도 엽니다.
help.srm-asn.helpDo=[발주 행 가져오기] 협력사·공장의 열린 발주 행을 통지할 수 있는 양으로 추가합니다.\n[저장] 작성 중으로 저장합니다. 협력사 납품서 번호는 협력사마다 한 번만 쓸 수 있습니다.\n[확정] 작성 중에서 보냄으로 바뀝니다. 내용이 고정되고 입고 화면에 도착 예정으로 보입니다.\n[마감] 덜 왔지만 더 받지 않을 ASN 을 끝냅니다.\n[취소] 받은 것이 없을 때만 사유를 적고 취소합니다. 고칠 일은 취소한 뒤 새 ASN 으로 합니다.\n[납품서 인쇄] 스캔 키가 찍힌 납품서를 새 창에서 엽니다.
help.srm-asn.helpNote=확정한 ASN 은 고칠 수 없습니다. 취소하고 새로 만듭니다.
help.srm-asn-print=사전 납품 통지의 납품서를 인쇄용 서식으로 보여 줍니다. 스캔 키 ASN:번호 가 크게 찍혀 있어, 입고할 때 이 글자를 스캔하면 해당 ASN 이 바로 열립니다. 지금은 바코드 그림 없이 글자로만 찍힙니다.
help.srm-asn-print.helpWhy=물건과 함께 오는 종이에 ASN 번호가 있어야 창고가 어느 ASN 으로 받을지 바로 찾을 수 있습니다.
help.srm-asn-print.helpWhen=구매 흐름 4단계, ASN 을 확정한 뒤입니다. 사전 납품 통지의 [납품서 인쇄]를 누르면 새 창으로 열립니다(메뉴에는 없습니다). 협력사 포털에도 같은 인쇄가 있습니다.
help.srm-asn-print.helpDo=[인쇄] 도구 막대를 숨기고 브라우저 인쇄 창을 엽니다. 여기서 PDF 로 저장할 수 있습니다.\n찍힌 스캔 키를 자재 입고 화면에서 스캔하면 ASN 이 열리고 칸이 채워집니다.\n협력사 납품서 번호가 있으면 함께 찍혀 입고 화면 찾기 칸에 넣을 수 있습니다.
help.srm-asn-print.helpNote=바코드 그림은 아직 없습니다. 스캐너가 글자를 읽지 못하면 입고 화면 찾기 칸에 번호를 넣습니다.
help.srm-return=수입검사 불합격 등으로 NCR 처리에서 반품이 정해진 자재를 협력사에 돌려보내도록 지시합니다. 반품 대상을 불러와 수량과 교체 요구를 정해 확정하면, 실제 출고는 반품 출고 화면에서 합니다. 출고되면 여기에 출고됨으로 보이고, 교체 요구였으면 그 발주 행에 다시 받을 수량이 생깁니다.
help.srm-return.helpWhy=반품 지시가 없으면 창고는 무엇을 얼마나 어느 협력사에 내보낼지 모르고, 교체품을 다시 받을 발주 수량도 생기지 않습니다.
help.srm-return.helpWhen=부적합 흐름의 끝, 협력사 반품 단계입니다. 부적합(NCR)에서 반품 처리가 정해지고 NCR 이 종결되면 엽니다.
help.srm-return.helpDo=[반품 대상 가져오기] 협력사의 종결된 NCR 중 반품 처리 줄을 불러옵니다. 이미 지시한 줄은 고를 수 없습니다.\n[저장] 작성 중으로 저장합니다. 교체를 요구하면 되돌릴 발주 행을 고릅니다.\n[확정] 작성 중에서 확정으로 바뀝니다(승인 권한). 반품 출고 화면에서 이 번호를 찾을 수 있게 됩니다.\n[취소] 작성 중이거나 확정된 지시를 사유를 적고 취소합니다. 출고된 뒤에는 취소할 수 없습니다.
help.srm-return.helpNote=확정해도 재고는 줄지 않습니다. 반품 출고 화면에서 출고해야 출고됨이 됩니다.
help.srm-claim=협력사 품질 문제(NCR)를 근거로 시정조치를 요구하거나 청구 금액을 알립니다. 보내면 협력사에 통지가 나가고, 협력사가 포털에서 원인·대책을 회신하거나 우리가 대신 넣습니다. 회신을 보고 반려하거나 종결합니다. 대금 차감·전표는 ERP 에서 합니다.
help.srm-claim.helpWhy=불량을 낸 협력사에 무엇을 요구했고 어떻게 답했는지 남지 않으면 재발 방지를 확인할 수 없고, 협력사 평가와 거래 상태 판단의 근거도 약해집니다.
help.srm-claim.helpWhen=부적합 흐름의 끝, 협력사 클레임 단계입니다. 협력사 LOT 에서 NCR 이 생겼을 때(처리 중이어도) 엽니다. 반품 지시와 같은 NCR 이면 서로 링크가 보입니다.
help.srm-claim.helpDo=[근거 NCR 가져오기] 협력사 LOT 의 NCR 을 발견일 기간으로 불러옵니다. 다른 클레임에 든 NCR 은 넣을 수 없습니다.\n[저장] 요구 조치·금액·근거 NCR 을 작성 중으로 저장합니다.\n[보내기] 작성 중에서 보냄으로 바뀌고 협력사 통지가 나갑니다. 요구·금액·근거가 고정됩니다.\n[회신 저장] 협력사 대신 원인·대책·회신일을 넣습니다. 보냄에서 회신 받음으로 바뀝니다.\n[회신 반려] / [종결] 회신 받음을 보냄으로 되돌려 다시 회신을 요구하거나, 종결합니다(승인 권한).\n[취소] 작성 중이거나 보낸 클레임을 사유를 적고 취소합니다.
help.srm-claim.helpNote=보낸 뒤에는 요구 조치·금액·근거 NCR 을 고칠 수 없습니다.
help.srm-eval-tmpl.helpWhy=평가 기준(항목·배점·가중치·과락·등급)이 고정돼 있지 않으면 기간마다 점수를 비교할 수 없습니다. 확정한 리비전만 평가에 쓰입니다.
help.srm-eval-tmpl.helpWhen=협력사 평가 흐름의 준비 단계입니다. 처음 평가를 시작하기 전이나 평가 기준을 바꿀 때 엽니다.
help.srm-eval-tmpl.helpDo=[항목 추가] / [등급 추가] 항목(배점·가중치·과락·자동 지표)과 등급 구간을 넣습니다. 입고 PPM 항목에는 점수 구간도 넣습니다.\n[저장] 작성 중 리비전을 저장합니다.\n[확정] 작성 중에서 확정으로 바뀝니다(승인 권한). 가중치 합 100 과 최소 총점 0 인 등급이 있어야 합니다.\n[새 리비전] 마지막 리비전을 복사해 작성 중 리비전을 만듭니다.\n[폐기] 더 쓰지 않는 리비전을 폐기합니다.
help.srm-eval-tmpl.helpNote=확정한 리비전은 고칠 수 없습니다. [새 리비전]으로 바꿉니다.
help.srm-eval.helpWhy=협력사를 점수로 보지 않으면 거래 유지·보류를 감으로 정하게 됩니다. 회신율·납기 준수율·입고 PPM·인증 유효를 기간 데이터로 계산해 근거를 남깁니다.
help.srm-eval.helpWhen=구매 흐름의 마지막 단계입니다. 월·분기·연 단위 평가 기간이 끝나면 엽니다. 과락이나 보류 제안이 나오면 협력사 정보에서 거래 상태를 정합니다.
help.srm-eval.helpDo=[평가 만들기] 협력사·템플릿·기간으로 평가를 만들고 자동 항목을 계산합니다.\n[점수 저장] 수동 항목 점수와 의견을 저장합니다.\n[자동 항목 다시 계산] 기간 데이터가 바뀌었을 때 자동 항목을 다시 계산합니다.\n[확정] 작성 중에서 확정으로 바뀝니다(승인 권한). 총점·등급·과락이 정해지고 바뀌지 않습니다.\n[평가 취소] 작성 중 평가를 사유를 적고 취소합니다.
help.srm-eval.helpNote=확정한 평가는 고칠 수도 취소할 수도 없습니다.
help.sys-my-info=내 화면 언어와 비밀번호를 바꾸고 2단계 인증 상태를 확인합니다.
help.sys-my-info.helpWhy=본인 계정을 스스로 관리하는 곳입니다. 관리자에게 부탁하지 않고 언어·비밀번호·복구 코드를 바꿉니다.
help.sys-my-info.helpWhen=시스템 운영 흐름의 마지막 단계입니다. 첫 로그인 뒤, 비밀번호가 노출됐다고 느낄 때, 복구 코드를 다 썼을 때 엽니다.
help.sys-my-info.helpDo=[저장] 화면 언어를 바꿉니다.\n[비밀번호 변경] 현재 비밀번호를 확인하고 새 비밀번호로 바꿉니다.\n[복구 코드 새로 만들기] 인증 코드를 넣어 새 복구 코드를 받습니다. 이전 코드는 쓸 수 없게 됩니다.
help.sys-my-info.helpNote=현재 비밀번호를 틀리면 로그인 실패로 셉니다.\n새 복구 코드는 한 번만 보입니다. 바로 적어 둡니다.
help.sys-support=YeonOS 운영자가 우리 회사 자료를 볼 수 있는 범위와 기간을 허락하고, 운영자가 한 일을 확인합니다. 허락은 언제든 회수할 수 있습니다.
help.sys-support.helpWhy=운영자가 회사 자료를 마음대로 보지 못하게 회사가 직접 범위·기간을 허락하는 곳입니다. 허락이 없으면 운영자는 지원할 수 없습니다.
help.sys-support.helpWhen=시스템 운영 흐름의 9단계입니다. 운영자에게 문의했을 때, 마지막 관리자의 2단계 인증을 잃어 운영자 초기화가 필요할 때 엽니다.
help.sys-support.helpDo=[허락] 운영자 아이디·범위·기간·사유를 넣어 지원 세션을 엽니다.\n[회수] 기간이 남은 허락을 바로 끝냅니다.\n운영자가 한 일 목록에서 운영자의 동작을 확인합니다.
help.sys-support.helpNote=범위는 하나씩 고릅니다. 필요한 것만 짧게 허락합니다.\n사용자 2단계 인증 초기화 범위를 주면 운영자가 우리 사용자의 인증을 초기화할 수 있습니다.
help.sys-usage=일별 사용자 수·로그인·화면 열람·기능 실행과 많이 쓰는 화면을 봅니다. 전날까지의 기록을 매시간 집계하며 사용자 이름은 담지 않습니다.
help.sys-usage.helpWhy=도입한 화면이 실제로 쓰이는지 숫자로 확인하는 곳입니다. 쓰지 않는 화면이나 교육이 필요한 부서를 찾습니다.
help.sys-usage.helpWhen=시스템 운영 흐름의 9단계입니다. 도입 뒤 정착 여부를 볼 때, 월간 점검 때 엽니다.
help.sys-usage.helpDo=[조회] 고른 기간의 일별 사용 숫자와 많이 쓰는 화면을 봅니다.
help.sys-usage.helpNote=오늘 기록은 나오지 않습니다. 어제까지입니다.\n사람별 숫자는 없습니다.
help.sys-user.helpWhy=사람을 추가하고 잠그고 비밀번호를 초기화하는 일을 SQL 없이 하는 곳입니다. 관리자도 사용자 비밀번호를 알지 못하게 서버가 임시 비밀번호를 만듭니다.
help.sys-user.helpWhen=시스템 운영 흐름의 3단계입니다. 입사·퇴사·부서 이동 때, 비밀번호나 인증 앱을 잃어버렸다는 연락을 받았을 때 엽니다.
help.sys-user.helpDo=[신규]·[저장] 사용자를 추가하면 임시 비밀번호가 한 번만 보이고, 그 사람은 첫 로그인 때 비밀번호를 바꿔야 합니다.\n[엑셀 올리기] 여러 사람을 한 번에 추가하거나 고칩니다(비밀번호 칸 없음).\n[비밀번호 초기화] 새 임시 비밀번호를 만들고 그 사람의 로그인 중인 화면을 끊습니다.\n[2단계 인증 초기화] 인증 앱 등록을 지워 다음 로그인 때 다시 등록하게 합니다.\n[잠금]·[잠금 해제] 로그인을 막거나 풀며 접속 로그에 남습니다.
help.sys-user.helpNote=임시 비밀번호는 닫으면 다시 볼 수 없습니다. 복사한 뒤 닫습니다.\n나보다 권한이 큰 사람과 나 자신은 초기화·잠금할 수 없습니다.\n마지막 관리자는 사용 중지·잠금할 수 없습니다.
help.sys-auth-group.helpWhy=화면마다 누가 조회·저장·삭제할 수 있는지를 역할 단위로 정하는 곳입니다. 여기 권한이 없으면 메뉴에도 홈 카드에도 그 화면이 보이지 않습니다.
help.sys-auth-group.helpWhen=시스템 운영 흐름의 4단계입니다. 새 역할이 생기거나, 새 화면이 추가되어 권한을 나눠 줄 때 엽니다.
help.sys-auth-group.helpDo=[신규]·[저장] 그룹 코드·이름·로그인 후 첫 화면·관리자 표시·사용 여부를 정합니다.\n[권한 저장] 화면×권한 표에서 고른 칸을 저장하며, 그 그룹 사용자의 다음 동작부터 반영됩니다.\n[조회] 그룹 목록과 구성원을 봅니다.
help.sys-auth-group.helpNote=내가 가진 권한보다 큰 권한은 줄 수 없습니다.\n관리자 표시를 켠 그룹은 새로 생기는 화면까지 모든 권한을 받습니다.\n권한을 줘도 메뉴에 없는 화면은 메뉴 관리에서 따로 넣어야 보입니다.
help.sys-menu.helpWhy=셸 왼쪽 메뉴를 회사 업무 순서에 맞게 정리하는 곳입니다. 메뉴는 권한이 있는 화면만 보여 주므로 권한은 권한그룹 관리에서 줍니다.
help.sys-menu.helpWhen=시스템 운영 흐름의 5단계입니다. 도입 때 메뉴를 정리할 때, 업데이트로 새 화면이 생겼을 때 엽니다.
help.sys-menu.helpDo=[폴더 추가] 새 폴더를 입력합니다.\n[화면 추가] 사용 중인 화면을 골라 메뉴에 연결합니다.\n[저장] 이름·상위 폴더·순서·사용 여부를 바꿉니다. 사용 안 함은 메뉴에서 숨깁니다.\n[모두 펼치기]·[1레벨만] 트리를 펼치거나 접습니다.
help.sys-menu.helpNote=업데이트로 생긴 새 화면은 자동으로 메뉴에 들어가지 않습니다.\n메뉴는 지우지 않고 사용 안 함으로 숨깁니다.\n메뉴에 넣어도 조회 권한이 없는 사람에게는 보이지 않습니다.
help.sys-dept.helpWhy=사람의 소속과 다른 화면의 부서 선택지가 모두 이 부서 트리에서 나옵니다. 없으면 부서를 글자로 따로 적게 됩니다.
help.sys-dept.helpWhen=시스템 운영 흐름의 2단계입니다. 사용자를 등록하기 전, 그리고 조직이 바뀔 때 엽니다.
help.sys-dept.helpDo=[최상위 추가] 맨 위 부서를 새로 입력합니다.\n[하위 추가] 고른 부서 아래에 새 부서를 입력합니다.\n[저장] 추가하거나 이름·상위·순서·사용 여부를 바꿉니다.\n[모두 펼치기]·[1레벨만] 트리를 펼치거나 접습니다.
help.sys-dept.helpNote=부서는 지우지 않고 사용 중지합니다.\n사용 중인 하위 부서가 있으면 먼저 하위를 사용 중지해야 합니다.\n사람의 소속은 이 화면이 아니라 사용자 관리에서 바꿉니다.
help.sys-policy.helpWhy=결재를 쓸지, 비밀번호 규칙, 엑셀 상한처럼 고객마다 다른 동작을 프로그램 수정 없이 바꾸는 곳입니다.
help.sys-policy.helpWhen=시스템 운영 흐름의 6단계입니다. 도입 때 회사 규칙을 맞출 때, 결재 사용 여부나 보안 규칙을 바꾸기로 했을 때 엽니다.
help.sys-policy.helpDo=[조회] 분류·키·바꾼 것만으로 정책을 찾습니다.\n[저장] 회사 값 또는 공장 값을 저장하며 그 기능의 다음 동작부터 쓰입니다.\n[기본값으로] 회사·공장 값을 지워 기본값으로 돌아갑니다.
help.sys-policy.helpNote=보안 정책(비밀번호·로그인·2단계 인증·AI·첨부·자기 결재)은 관리자 그룹만 바꿀 수 있습니다.\n결재 사용 정책을 켜면 그 화면의 확정·종결 버튼 대신 결재 상신을 거쳐야 합니다.\n공장 값이 있으면 그 공장에서는 회사 값이 쓰이지 않습니다.
help.sys-code.helpWhy=단위·비가동 사유·지급 조건처럼 선택지를 회사가 늘려 쓰는 곳입니다. 시스템 코드는 함께 보이지만 고칠 수 없습니다.
help.sys-code.helpWhen=시스템 운영 흐름의 6단계입니다. 화면의 선택지에 우리 회사 항목이 없을 때 엽니다.
help.sys-code.helpDo=[신규] 고른 그룹에 회사 코드를 새로 입력합니다.\n[저장] 추가하거나 이름·순서·사용 여부를 바꿉니다.
help.sys-code.helpNote=코드는 추가한 뒤 바꿀 수 없습니다. 업무 기록이 코드 글자로 남기 때문입니다.\n코드는 지우지 않고 사용 중지합니다. 이미 쓴 기록은 그대로입니다.\n단위의 소수 자릿수는 늘릴 수만 있습니다.
help.sys-numbering.helpWhy=수주·작업지시·LOT 같은 업무 번호의 모양을 회사가 정하는 곳입니다. 번호는 업무 저장과 같은 트랜잭션에서 나가므로 결번이 생기지 않습니다.
help.sys-numbering.helpWhen=시스템 운영 흐름의 6단계입니다. 도입 때 기존 번호 체계를 이어 쓰려 할 때, 번호 모양을 바꿀 때 엽니다.
help.sys-numbering.helpDo=[신규] 규칙 코드·패턴·초기화 주기를 새로 입력합니다.\n[저장] 규칙을 추가하거나 패턴·주기를 바꿉니다.\n다음 번호 미리보기로 저장 전에 모양을 확인합니다(번호를 쓰지 않습니다).
help.sys-numbering.helpNote=패턴이나 주기를 바꾸면 이미 낸 번호와 겹쳐 업무 저장이 실패할 수 있습니다.\n규칙 코드는 업무가 부르는 이름이라 추가한 뒤 바꿀 수 없습니다.
help.sys-comp.helpWhy=회사 이름·기본 언어·시간대를 회사가 직접 정하는 곳입니다. 시간대가 맞지 않으면 작업일과 채번 날짜가 하루씩 어긋납니다.
help.sys-comp.helpWhen=시스템 운영 흐름의 1단계입니다. 도입 첫날 회사 정보를 확인할 때, 공장을 다른 나라로 옮겨 시간대가 바뀔 때 엽니다.
help.sys-comp.helpDo=[저장] 회사 이름·연락처·기본 언어를 고칩니다.\n[저장] 시간대를 바꾸려면 확인 칸을 체크해야 저장됩니다.
help.sys-comp.helpNote=시간대는 관리자 그룹만 바꿀 수 있습니다.\n시간대를 바꾸면 작업일·채번 날짜·근무조 판정 기준이 바로 바뀝니다.\n회사 상태와 사용 여부는 여기서 바꾸지 못합니다(운영자 몫).
help.sys-inbox.helpWhy=결재 차례·기한 요약·보안 경고·공지처럼 나에게 온 것을 한곳에서 보는 곳입니다. 없으면 각 화면을 돌며 확인해야 합니다.
help.sys-inbox.helpWhen=시스템 운영 흐름의 8단계입니다. 머리의 종 버튼에 숫자가 보일 때, 아침에 하루 요약을 볼 때 엽니다.
help.sys-inbox.helpDo=[알림] 알림을 누르면 읽음으로 바뀌고 관련 화면이 열립니다.\n[모두 읽음] 안 읽은 알림을 한 번에 읽음으로 바꿉니다.\n[더 보기] 지난 알림을 더 불러옵니다.\n[공지] 게시 중인 공지와 첨부를 봅니다.\n[알림 설정] 이벤트별로 켜고 끈 뒤 [저장] 합니다.
help.sys-inbox.helpNote=끈 알림은 다시 켜도 그동안 놓친 것이 오지 않습니다.\n볼 권한이 없는 화면의 알림은 켜도 오지 않습니다.
help.sys-notice.helpWhy=전사 공지와 양식·매뉴얼 자료를 한곳에 올리는 곳입니다. 올린 공지는 모든 사용자의 알림함 공지에 보입니다.
help.sys-notice.helpWhen=시스템 운영 흐름의 8단계입니다. 점검 일정·규정 변경을 알릴 때, 양식 파일을 나눠 줄 때 엽니다.
help.sys-notice.helpDo=[신규] 분류·제목·본문·게시 기간·고정 여부를 입력합니다.\n[저장] 공지를 올리거나 고칩니다. 시작일부터 끝일까지 보입니다.\n첨부를 올리면 게시 중인 동안 누구나 내려받을 수 있습니다.\n[조회] 분류·상태로 공지를 찾습니다.
help.sys-notice.helpNote=공지는 지우지 않고 사용 안 함으로 내립니다.\n본문은 글자만 들어가고 서식은 없습니다.\n메일로 따로 보내지 않습니다. 사용자가 알림함에서 봅니다.
help.sys-access-log.helpWhy=로그인 실패·잠금·권한 거부를 회사 관리자가 직접 확인하는 곳입니다. 계정 도용이나 권한 밖 조작 시도를 늦지 않게 알아챕니다.
help.sys-access-log.helpWhen=시스템 운영 흐름의 9단계입니다. 보안 경고 알림을 받았을 때, 로그인이 안 된다는 문의를 받았을 때 엽니다.
help.sys-access-log.helpDo=[조회] 기간·이벤트·심각도·결과·아이디·IP 로 찾습니다.\n[권한 변경만] 잠금·초기화·권한 거부 기록만 봅니다.\n[초기화] 조회 조건을 처음으로 되돌립니다.
help.sys-access-log.helpNote=보기 전용입니다. 잠금 해제는 사용자 관리에서 합니다.\n엑셀로 내려받을 수 없습니다.
help.sys-audit-log.helpWhy=여러 화면에서 누가 언제 무엇을 바꿨는지 한곳에서 보는 곳입니다. 값이 바뀐 이유를 찾을 때 전·후 값을 바로 비교합니다.
help.sys-audit-log.helpWhen=시스템 운영 흐름의 9단계입니다. 권한이나 설정이 바뀐 경위를 확인할 때, 데이터가 이상하게 바뀌었을 때 엽니다.
help.sys-audit-log.helpDo=[조회] 기간·화면·동작·행위자로 찾습니다.\n[권한 변경만] 사용자·권한그룹·권한 표 변경만 봅니다.\n행을 고르면 오른쪽에 바뀐 칸의 전·후 값이 나옵니다.
help.sys-audit-log.helpNote=내가 조회 권한을 가진 화면의 데이터만 나옵니다.\n비밀번호 같은 가린 칸은 바뀐 사실만 보입니다.
help.sys-feedback.helpWhy=각 화면의 의견 보내기로 들어온 불편·요청을 모아 처리하는 곳입니다. 처리하면 보낸 사람에게 알림이 갑니다.
help.sys-feedback.helpWhen=시스템 운영 흐름의 9단계입니다. 새 의견이 쌓였을 때, 개선 요청을 정리할 때 엽니다.
help.sys-feedback.helpDo=[확인함] 새 의견을 확인한 상태로 바꿉니다.\n[처리 완료] 처리를 끝내고 보낸 사람 알림함에 알립니다.\n[새 의견으로] 확인한 의견을 다시 새 의견으로 되돌립니다.\n[조회] 상태·화면·기간으로 찾습니다.
help.sys-feedback.helpNote=처리 완료는 되돌릴 수 없습니다.\n답글을 쓰는 칸은 없습니다. 상태와 알림만 남습니다.
help.sys-approval.helpWhy=발주·부적합 특채·시정조치·관리문서·위험성평가·게이트·설계 변경·PFMEA·관리계획서 결재를 한곳에서 처리하는 곳입니다. 승인하면 그 문서의 업무 상태가 같은 순간에 바뀝니다.
help.sys-approval.helpWhen=시스템 운영 흐름의 7단계입니다. 결재 차례 알림을 받았을 때, 올린 결재가 어디까지 왔는지 볼 때, 자리를 비우기 전 위임할 때 엽니다.
help.sys-approval.helpDo=[승인] 내 차례 결재를 승인하며 마지막 결재자면 문서가 확정·종결됩니다.\n[반려] 결재를 끝내고 문서를 작성 상태로 되돌립니다.\n[회수] 내가 올린 결재를 아무도 승인하기 전에 거둡니다.\n[문서 열기] 그 문서의 업무 화면을 엽니다(지금은 PFMEA·관리계획서만 — 다른 문서는 그 모듈 화면에서 찾습니다).\n[위임 만들기] 기간 동안 대리가 내 결재를 대신 처리하게 합니다.
help.sys-approval.helpNote=승인·반려는 되돌릴 수 없습니다.\n문서 유형과 정책에 따라 승인할 때 전자서명을 요구합니다.\n위임은 고칠 수 없고 회수한 뒤 새로 만듭니다.
help.home-main.helpWhy=모듈마다 흩어진 지금 손댈 일(오늘 작업지시·보류 LOT·판정 대기 검사·결재 대기 등)을 카드로 모아 보여 주는 곳입니다. 카드 숫자를 누르면 그 조건으로 해당 화면이 열립니다.
help.home-main.helpWhen=로그인 직후 처음 여는 화면입니다. 하루를 시작할 때, 일을 마친 뒤 남은 일을 확인할 때 엽니다.
help.home-main.helpDo=카드 숫자를 누르면 그 목록 화면이 조건과 함께 열립니다.\n카드 항목을 누르면 그 건을 해당 화면에서 조회합니다.\n[새로 고침] 모든 카드를 다시 읽고, 카드의 ↻ 는 그 카드만 다시 읽습니다.\n[카드 설정] 내 홈에 보일 카드와 순서를 정합니다.\n공장을 고르면 공장 카드가 그 공장 기준으로 바뀝니다.
help.home-main.helpNote=카드 설정은 나에게만 적용됩니다.\n기본값으로를 누르면 내 설정이 지워지고 역할 기본 세트로 돌아갑니다.
help.home-card-mgt.helpWhy=역할마다 홈에 먼저 보일 카드를 정하는 곳입니다. 현장 반장과 품질 담당이 같은 순서의 카드를 보지 않게 합니다.
help.home-card-mgt.helpWhen=시스템 운영 흐름의 권한그룹 단계 뒤에 씁니다. 새 권한그룹을 만들었을 때, 새 카드가 생겼을 때 엽니다.
help.home-card-mgt.helpDo=왼쪽에서 권한그룹을 고르면 그 그룹의 카드 세트가 열립니다.\n[저장] 카드 순서와 기본 숨김을 저장합니다.\n[세트 지우기] 그룹 세트를 지워 기본 순서로 돌아갑니다.
help.home-card-mgt.helpNote=세트는 권한을 주지 않습니다. 조회 권한이 없는 카드는 넣어도 보이지 않습니다.\n카드 설정을 저장한 사용자에게는 개인 설정이 먼저입니다.\n세트 지우기는 되돌릴 수 없습니다.
help.aps-plan.helpWhy=작업지시마다 정한 계획일이 설비·근무조 용량 안에서 실제로 가능한지 계산합니다. 없으면 같은 설비에 일이 겹치거나 납기에 늦는 지시를 미리 볼 수 없습니다.
help.aps-plan.helpWhen=수주→출하 흐름의 3단계입니다. 작업지시를 만든 뒤 발행 전에, 또는 지시가 늘거나 설비가 멈춰 일정을 다시 짜야 할 때 계산하고 반영합니다.
help.aps-plan.helpDo=[새 계획] [계산] 계획·발행·진행 중 지시로 새 계획 버전을 만듭니다(지시는 바뀌지 않습니다)\n[반영 미리보기] [반영] 고른 계획의 일정과 설비를 작업지시에 적습니다(반영됨). 계산 뒤 지시가 바뀌었으면 막고 다시 계산하라고 알립니다\n[비교] 두 계획 버전의 공정별 차이를 봅니다\n간트 막대 끌어 놓기 그 공정을 고정하고, 다음 [계산]이 고정을 지킵니다\n[폐기] 쓰지 않을 계획 버전을 버립니다(되돌릴 수 없습니다)\n[납기 답변] 새 품목·수량을 넣으면 언제 끝나는지 계산만 합니다
help.aps-plan.helpNote=계산만으로는 작업지시가 바뀌지 않습니다.\n[반영]에는 작업지시 저장 권한도 필요합니다.\n계산 뒤 지시가 바뀌면 그 계획은 반영할 수 없습니다.
help.plm-ecr.helpWhy=설계를 바꾸자는 의견이 메일·구두로 흩어지지 않게 한 곳에 요청으로 남기고, 검토 담당이 받아들여 설계 변경 지시로 넘기기 위해 있습니다.
help.plm-ecr.helpWhen=설계변경 흐름의 1~2단계입니다. 현장·품질·고객에서 설계 문제나 개선이 나왔을 때 요청을 올리고, 검토 담당이 접수·반려할 때 엽니다.
help.plm-ecr.helpDo=[신규]·[저장] 제목·사유·주 품목으로 열린 요청을 올립니다. 올린 사람만 고칠 수 있습니다.\n[요청 취소] 올린 사람이 열린 요청을 취소합니다.\n[접수] 새 작성 중 설계 변경 지시를 만들거나 기존 작성 중 지시에 묶습니다.\n[반려] 사유를 적어 요청을 닫습니다.
help.plm-ecr.helpNote=접수해도 BOM·라우팅은 바뀌지 않습니다. 변경은 설계 변경 지시에서 적용해야 일어납니다.
help.plm-eco.helpWhy=설계·공정 변경을 결재받은 지시 하나로 묶어 BOM·라우팅 리비전이 정해진 날부터 바뀌게 하고, 바뀐 뒤 만든 LOT·고객 승인·PPAP·고객 통지까지 추적하기 위해 있습니다. BOM·라우팅을 지시 없이 확정하지 못하게 정한 회사는 이 화면의 적용으로만 확정합니다.
help.plm-eco.helpWhen=설계변경 흐름의 3~6단계이자 신제품 개발 흐름의 PPAP 단계입니다. 요청을 접수한 뒤 대상을 정할 때, 결재·고객 승인·적용할 때, PPAP 를 제출·판정할 때 엽니다.
help.plm-eco.helpDo=[대상 추가]·[대상 저장] 품목·BOM·라우팅 작성 중 리비전·도면·설비·공정을 대상으로 정합니다. [영향 후보]로 상위 품목을 찾고 일괄 대체 [미리보기]·[대체해 대상에 추가]로 BOM 을 한꺼번에 바꿉니다.\n[상신] 대상을 고정하고 결재 중이 됩니다. 결재자는 [승인]·[반려], 올린 사람은 [회수]합니다.\n[고객 승인 기록]·[통지 기록] 고객 승인 결과와 고객 변경 통지를 남깁니다.\n[적용] 승인된 지시의 대상 리비전을 유효일부터 확정하고 이전 확정본을 마감합니다. 이후 생산 LOT 에 변경 표시가 붙습니다.\n[PPAP 만들기]·[제출]·[판정 기록] 고객 PPAP 를 작성·제출하고 결과를 남깁니다. 승인이면 고객 승인도 채워집니다.\n[지시 취소] 작성 중·승인된 지시를 취소합니다. 대상 리비전은 작성 중으로 남습니다.
help.plm-eco.helpNote=BOM·라우팅은 작성 중 리비전만 대상이 됩니다. 먼저 해당 화면에서 새 리비전을 만듭니다.

policy.QMS_SPC_AUTO_HOLD=SPC 위반이 나면 그 검사 LOT 을 자동 보류(끔 · 한계 밖 규칙만 · 켜 둔 규칙 전부). 보류는 그 위반을 종결·무효로 할 때 풀립니다(생산 모듈 필요)
error.qmsSpcHoldUnavailable=LOT 보류를 쓸 수 없습니다(생산 모듈 없음). 정책 "SPC 위반 자동 보류"를 끄고 다시 하세요.
js.qms.spcEvent.hold=LOT 보류
js.qms.spcEvent.holdOn={0} — 이 위반 근거로 보류 중
js.qms.spcEvent.releaseHold=이 위반 근거의 {0} 보류가 풀립니다(다른 근거가 남아 있으면 LOT 은 계속 보류).
# POP 고장 신고 사진(docs/25 4.44, CMS C25)
pop.bdPhoto=사진
pop.bdPhotoAdd=사진 찍기
pop.bdPhotoDone=끝내기
js.pop.bd.photoInfo=요청 번호 {0} · 사진 {1} / {2}장
js.pop.bd.photoInfoMax=요청 번호 {0} · 사진은 {1}장까지 붙일 수 있습니다
js.pop.bd.photoSending=보내는 중
js.pop.bd.photoOk=붙음
js.pop.bd.photoDup=이미 붙어 있음
js.pop.bd.photoFailed=보내지 못함
js.pop.bd.photoRetry=다시 보내기
js.pop.bd.photoTooBig=사진이 너무 큽니다(최대 {0} MB).
js.pop.bd.photoBad=사진을 읽을 수 없습니다. 다시 찍어 주세요.
js.pop.bd.photoFull=사진은 {0}장까지 붙일 수 있습니다.
js.pop.bd.photoClosed=보전 담당이 이미 처리를 시작해 사진을 더 붙일 수 없습니다.
js.pop.bd.photoSent=사진을 붙였습니다({0} / {1}장).
