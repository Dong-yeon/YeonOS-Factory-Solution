help.wms-loc-check=PDA 로 한 칸의 물건을 스캔해 장부 위치와 맞는지 본 결과입니다. "다른 위치"는 [보정 이동], 그 밖의 불일치는 [확인만]으로 처리합니다.
help.wms-loc-check.helpWhy=피킹 실패의 많은 원인이 "장부와 다른 칸에 둔 재고"입니다. 수량을 세는 실사보다 가볍게 위치만 자주 확인해 위치 정확도를 봅니다.
help.wms-loc-check.helpWhen=재고 운영 흐름의 점검 단계입니다. PDA 로 칸을 점검한 뒤, 홈 카드 "위치 정확도"에 미처리가 보일 때 엽니다.
help.wms-loc-check.helpDo=[조회] 공장·기간·상태·미처리만으로 점검을 찾습니다.\n[보정 이동] 다른 위치 줄의 장부 칸에서 점검한 칸으로 옮기는 이동 원장을 남깁니다(사유: 정위치 보정).\n[확인만] 재고는 그대로 두고 사유만 남깁니다.
help.wms-loc-check.helpNote=같은 칸은 하루 한 번 점검합니다(정확도 분모).\n수량은 비교하지 않습니다 — 수량 차이는 실사로 맞춥니다.\n출하 대기 칸은 보정하지 않습니다(피킹 취소는 출하 화면).\n점검 기록과 보정 이력은 지울 수 없습니다.

