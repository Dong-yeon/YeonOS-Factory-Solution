import.guide.qmsInspMeasuredAt=잰 시각(yyyy-MM-dd HH:mm[:ss], 회사 시간대 — 초는 생략 가능). 비우면 반영한 시각. 검사 시작 전(초 단위)·미래 시각은 거부되고, 계측기는 그 시각의 교정 상태로 판정합니다.
error.qmsInspImportStale=검사 {0} 행 {1} 샘플 {2} 의 대상이 검증 뒤에 바뀌었습니다(판정·무효·같은 샘플 입력·계측기 상태). 아무것도 반영하지 않았습니다 — 다시 올려 검증해 주세요.

