help.mst-bom-where=이 품목을 쓰는 상위 품목을 끝까지 올라가며 봅니다. 최상위만 = 더 위에서 쓰지 않는 품목(완제품 쪽 끝) — 4M 변경·리콜 영향 범위. 전체 리비전 = 날짜와 상관없이 작성 중·확정 리비전 모두.
