# 로컬 개발용 PostgreSQL. 값은 프로젝트 루트 .env 에서 읽는다 (.env.example 참고)
#   docker compose up -d       기동
#   docker compose down        중지 (데이터 유지)
#   docker compose down -v     중지 + 데이터 삭제 (init 스크립트가 다시 실행됨)
name: yeonos

services:
  db:
    image: postgres:16-alpine
    container_name: yeonos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-yeonos}
      POSTGRES_USER: ${DB_OWNER_USER:-yeonos_owner}
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?DB_OWNER_PASSWORD 를 .env 에 설정하세요}
      APP_DB_USER: ${DB_APP_USER:-yeonos_app}
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD 를 .env 에 설정하세요}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      # 이 PC 에서만 접속 (사내망·공용 Wi-Fi 에 DB 를 노출하지 않음, docs/05 G12)
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - yeonos-db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  yeonos-db-data:
