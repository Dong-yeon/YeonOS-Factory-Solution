# Prometheus 수집 설정 예시 (docs/52 Y2) — 운영자가 자기 Prometheus 에 맞게 고친다.
# 토큰은 파일로(설정 파일에 값을 쓰지 않는다). 앱 쪽 METRICS_TOKEN 과 같은 값, 권한 600.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: yeonos
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/yeonos-metrics.token
    static_configs:
      # 관리 포트(MANAGEMENT_SERVER_PORT) · 내부 주소(MANAGEMENT_SERVER_ADDRESS). 이 Prometheus 주소가 METRICS_ALLOWED_IPS 안에 있어야 한다
      - targets: ['10.0.0.5:9464']
        labels:
          site: example
